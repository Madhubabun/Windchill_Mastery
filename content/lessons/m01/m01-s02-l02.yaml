id: m01-s02-l02
subtitle: Open the "Windchill server" box and meet the crew inside.
version: 1.1.0
updated: "2026-10-13"
tags: [architecture, method-server, tomcat, server-manager]
sources:
  - id: ac
    where: "Module 11: Describe the Windchill architecture; Describe the Windchill client; Describe the web server; Describe the Windchill server (server manager, method server with an embedded Tomcat servlet engine, background method server); Identify optional servers (Solr indexing); Describe the clustered configuration"
  - id: ac
    where: "Module 12: Identify Windchill services (PTC HTTP Windchill service = Apache web server; Server Manager and Method Servers)"
  - id: ac
    where: "Module 15: Tune servers (method server and Tomcat share one heap)"
