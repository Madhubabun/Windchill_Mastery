blocks:
  - type: text
    md: |
      Last lesson, the Windchill server was one box. Time to open it.

      Picture a busy restaurant on a Friday night:

      - The **host at the front door** greets every guest and checks the reservation.
      - Each **cook's station** has its own order hatch, where tickets come in and plates go out.
      - The **cooks** actually make the food.
      - The **kitchen manager** keeps the cooks working, replaces anyone who collapses and keeps
        everyone's notes in sync.
      - The **prep cooks in the back** chop vegetables for later, so the line cooks don't have to.

      Windchill's server works the same way. Each role has an official name.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "host at the front door" → *[[web-server]]* (an **Apache** web server; on Windows its service is called *PTC HTTP Windchill*)
      - "order hatch at each station" → *[[servlet-engine]]* (**Tomcat**, bundled with Windchill and embedded in each method server)
      - "cooks" → *[[method-server|method servers]]* (Java processes running the business logic)
      - "kitchen manager" → *[[server-manager]]*
      - "prep cooks in the back" → *background method servers* working through [[background-queue|queues]]

  - type: diagram
    title: Inside the Windchill server
    caption: Click each part. Requests flow left to right; Tomcat runs inside each method server, and the server manager supervises them.
    diagram:
      width: 820
      height: 420
      groups:
        - { label: Windchill server, x: 180, y: 20, w: 460, h: 390, tone: primary }
      nodes:
        - id: browser
          label: Browser / Creo
          x: 20
          y: 150
          w: 140
          h: 56
          tone: accent
          detail: Sends requests to the web server. A Creo session or a Workgroup Manager goes through the same front door.
        - id: web
          label: Web server
          sublabel: Apache
          x: 200
          y: 120
          w: 180
          h: 60
          tone: info
          detail: |
            **The front door.** An Apache web server. It receives client requests, hosts static content
            (HTML, images, JavaScript, stylesheets) itself, and passes requests for dynamic content to
            the servlet engine inside a method server. Big sites can put it behind a reverse proxy or
            run several web servers behind a load balancer.
        - id: sm
          label: Server manager
          sublabel: the supervisor
          x: 200
          y: 320
          w: 180
          h: 60
          tone: warning
          detail: |
            **The kitchen manager.** A Java application by PTC that manages the method servers and user
            session credentials, restarts a method server automatically if it dies, and keeps caches in
            sync between method servers. In a *cluster*, sister server managers on other hosts sync too.
        - id: ms1
          label: Method server 1
          sublabel: foreground + Tomcat
          x: 420
          y: 60
          w: 200
          h: 60
          tone: primary
          detail: |
            **A cook.** A Java process (written by PTC) that processes all client transactions and talks
            to the database and LDAP - searching, checking in, changing states, applying access rules.
            Its embedded **Tomcat servlet engine** takes requests from the web server and sends the
            response back. Foreground method servers handle what users are waiting for right now.
        - id: ms2
          label: Method server 2
          sublabel: foreground
          x: 420
          y: 150
          w: 200
          h: 60
          tone: primary
          detail: |
            **Another cook.** You can run several method servers per host, and several hosts in a
            cluster, so many users can work at once.
        - id: bgms
          label: Background MS
          sublabel: works the queues
          x: 420
          y: 300
          w: 200
          h: 60
          tone: neutral
          detail: |
            **A prep cook.** A background method server is dedicated to back-end jobs nobody needs to
            wait for, such as propagating workflow tasks, sending and receiving data with message queues,
            and generating visualization data.
        - id: db
          label: Database
          sublabel: Oracle / SQL Server
          x: 665
          y: 150
          w: 140
          h: 76
          tone: success
          shape: cylinder
          detail: The order book. Method servers read and write all metadata here.
      edges:
        - { from: browser, to: web, label: HTTPS, bidirectional: true }
        - { from: web, to: ms1, bidirectional: true }
        - { from: web, to: ms2, bidirectional: true }
        - { from: sm, to: ms2, dashed: true, label: manages }
        - { from: sm, to: bgms, dashed: true }
        - { from: ms1, to: db, bidirectional: true }
        - { from: ms2, to: db, bidirectional: true }
        - { from: bgms, to: db, bidirectional: true }

  - type: animation
    title: What happens when you click Search
    diagram:
      width: 820
      height: 380
      nodes:
        - { id: browser, label: Browser, sublabel: you, x: 20, y: 170, w: 130, h: 56, tone: accent }
        - { id: web, label: Web server, sublabel: front door, x: 190, y: 170, w: 150, h: 56, tone: info }
        - { id: sm, label: Server manager, sublabel: supervisor, x: 400, y: 40, w: 150, h: 56, tone: warning }
        - { id: ms, label: Method server, sublabel: Tomcat + business logic, x: 390, y: 170, w: 170, h: 56, tone: primary }
        - { id: index, label: Search index, sublabel: Solr, x: 650, y: 60, w: 150, h: 60, tone: neutral }
        - { id: db, label: Database, sublabel: metadata, x: 650, y: 280, w: 150, h: 70, tone: success, shape: cylinder }
      edges:
        - { from: browser, to: web, bidirectional: true }
        - { from: web, to: ms, bidirectional: true }
        - { from: sm, to: ms, label: manages, dashed: true }
        - { from: ms, to: index, bidirectional: true }
        - { from: ms, to: db, bidirectional: true }
    chapters:
      - title: You search for "hinge"
        caption: An Acme Mobility engineer types **hinge** into search and hits Enter.
        show: [browser]
        highlight: [browser]
        seconds: 4
      - title: The front door
        caption: The **web server** receives the request. Static files it serves itself; a search needs dynamic content, so it passes the request on.
        show: [browser, web]
        highlight: [web]
        flow: [browser>web]
      - title: Into a method server
        caption: The **Tomcat servlet engine** embedded in a **method server** takes the request. The method server runs the real search logic - this is where Windchill's rules live.
        show: [browser, web, ms]
        highlight: [ms]
        flow: [web>ms]
      - title: The supervisor in the background
        caption: The **server manager** keeps the method servers running, holds user session credentials and keeps caches in sync. If a method server dies, it restarts it.
        show: [browser, web, ms, sm]
        highlight: [sm]
        flow: [sm>ms]
      - title: Look up the keyword
        caption: Where Solr indexing is set up, the keyword search uses the **Solr search index**, which covers object metadata and file content.
        show: [browser, web, ms, sm, index]
        highlight: [index]
        flow: [ms>index, index>ms]
      - title: Fetch facts and check access
        caption: It reads details from the **database** and only lists objects you have Read permission for. Two users can get different results for the same search.
        highlight: [db]
        flow: [ms>db, db>ms]
        seconds: 7
      - title: Back to your screen
        caption: Results travel back the way they came - method server → web server → browser.
        highlight: [browser]
        flow: [ms>web, web>browser]
        seconds: 7

  - type: callout
    variant: why-it-matters
    md: |
      Method servers are where Windchill "thinks", so they're where performance lives. Admins add
      more method servers (or more machines) when a company grows, tune their memory, and read their
      **method server logs** first when something fails. If you ever hear "the MS crashed" or "restart
      the method server", now you know what that means.

  - type: example
    variant: real-world
    title: Monday morning at Acme
    industry: Micromobility
    md: |
      Every Monday at 9:00, 300 Acme Mobility engineers log in at once and Windchill crawled. The
      admin team found that **all users shared too few method servers**, while the same machines were
      also publishing hundreds of CAD viewables.

      The fix: add foreground method servers for users, and keep publishing jobs on a **background
      method server** working its queue. Monday searches went back to feeling instant.
    takeaway: Separate "users waiting now" work from "can happen later" work.

  - type: scenario
    variant: troubleshooting
    title: Just one user is stuck
    start: s1
    nodes:
      - id: s1
        md: |
          Priya at Acme says: "Windchill gives me an error when I check in my drawing." Everyone else
          is working normally. What's the most useful first step?
        choices:
          - label: "Restart all method servers now"
            next: "f1"
            feedback: "Restarting interrupts every user's work - and everyone else is fine."
          - label: "Ask Priya for the exact time and the error text"
            next: "s2"
            good: true
            feedback: "Yes. With the time, an admin can find the matching entry in the method server log."
      - id: s2
        md: |
          The method server log at that time says Priya doesn't have **Modify** permission in that
          folder. Which part of Windchill made that decision?
        choices:
          - label: "The method server's business logic"
            next: "ok"
            good: true
            feedback: "Correct - access rules are enforced by the method server."
          - label: "The web browser"
            next: "p1"
            feedback: "The browser only shows what the server decides."
      - id: ok
        md: The admin (or the context manager) reviews Priya's team role, fixes her access, and she checks in. No restart needed.
        outcome: success
      - id: p1
        md: Close, but browsers don't decide permissions - the method server enforces them on every request. Look at access rights, not the browser.
        outcome: partial
      - id: f1
        md: Two hundred people lose a few minutes of work and Priya's error comes back anyway - it was a permission problem.
        outcome: fail

  - type: callout
    variant: pitfall
    md: |
      Don't assume "Windchill is slow" means "buy a bigger database". Often the bottleneck is too few
      method servers, too little memory for them, or heavy background jobs competing with users.
      Measure first.

  - type: callout
    variant: pro-tip
    md: |
      Admins can check which server processes are running on the **Server Status** page
      (**Site > Utilities > Server Status**), which also links to the **Monitoring Tools**. Ask your admin to show you once - it makes the architecture click.

  - type: flashcards
    cards:
      - front: "Web server (Apache)"
        back: "The front door: receives requests, serves static content and passes dynamic requests to the servlet engine."
      - front: "Servlet engine (Tomcat)"
        back: "Bundled with Windchill and embedded in each method server: takes requests from the web server and returns the response."
      - front: "Method server"
        back: "The cooks: Java processes that run Windchill's business logic and enforce access rules."
      - front: "Server manager"
        back: "The kitchen manager: manages method servers and session credentials, restarts a failed method server and syncs caches."
      - front: "Background method server"
        back: "The prep cooks: back-end jobs such as workflow task propagation, message queues and visualization data."
      - front: "Search index (Solr)"
        back: "Makes keyword searches fast by looking up a pre-built index."

  - type: summary
    points:
      - The web server (Apache) is the front door for every request.
      - Each method server has an embedded Tomcat servlet engine that takes requests from the web server.
      - Method servers run the business logic, including access checks; the server manager supervises them and restarts any that fail.
      - Background method servers process queues so users don't wait for long jobs.
