id: m01-s04-l01
subtitle: A part is the "thing" in your product. Everything else in Windchill hangs off it.
version: 1.0.0
updated: "2026-10-05"
tags: [parts, wtpart, bom, structure]

blocks:
  - type: text
    md: |
      Picture an Acme Mobility scooter in pieces on the floor: a frame, two wheels, a battery, a
      handlebar, a bag of screws. Each of those pieces is a real, physical *thing* that someone has to
      design, buy or make, count and ship.

      In Windchill, every one of those things is a **[[part]]**. A part isn't a file. It's the record
      that says "this item exists, here's its number, here's how many we use, and here's what it is
      made of". The CAD model, the drawing and the spec sheet all *describe* the part, but the part
      itself is the backbone everything hangs on.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a thing in the product" → *part* (the Windchill type is called **WTPart**)
      - "a part made of other parts" → *assembly* (still a part, it just has children)
      - "this assembly is made of 2 of those" → *[[uses-link|uses relationship]]* with a quantity and unit
      - "the full shopping list, level by level" → *product structure* or *[[bom]]*

  - type: diagram
    title: The Acme Scooter S2 as parts
    caption: Each box is a part. Each arrow is a "uses" link carrying a quantity. Click a box to learn more.
    diagram:
      width: 800
      height: 380
      nodes:
        - id: scooter
          label: Scooter S2
          sublabel: top-level assembly
          x: 300
          y: 20
          w: 200
          h: 60
          tone: primary
          detail: |
            The **end item** - the thing Acme actually sells. It's a part like any other, but its
            structure (its "uses" links) pulls in every other part below it.
        - id: frame
          label: Frame assembly
          sublabel: "SC-2000"
          x: 20
          y: 150
          w: 170
          tone: info
          detail: A sub-assembly. It's a part that uses other parts, so it has its own structure. Engineers often work on one sub-assembly at a time.
        - id: wheel
          label: Wheel 10 in
          sublabel: "SC-3100"
          x: 220
          y: 150
          w: 170
          tone: info
          detail: |
            One part, used **twice**. Windchill doesn't store two wheels - it stores one part and a
            uses link with **quantity 2**. Change the wheel once, and both positions get the change.
        - id: battery
          label: Battery pack
          sublabel: bought from supplier
          x: 420
          y: 150
          w: 170
          tone: warning
          detail: A purchased part. Acme doesn't design the cells, but it still needs a part number to order it, stock it and service it. Parts can be *make* or *buy*.
        - id: handlebar
          label: Handlebar
          sublabel: "SC-4000"
          x: 620
          y: 150
          w: 160
          tone: info
          detail: Another child of the scooter. In the Structure tab you'd see it on the first level below the top assembly.
        - id: tube
          label: Main tube
          sublabel: "SC-2010"
          x: 20
          y: 290
          w: 170
          tone: neutral
          detail: A simple part with no children - a "leaf" of the structure.
        - id: hinge
          label: Folding hinge
          sublabel: "SC-1042"
          x: 220
          y: 290
          w: 170
          tone: neutral
          detail: The hinge that folds the scooter. Remember it - it'll crack in cold weather later in this course, and a change will fix it.
        - id: cable
          label: Brake cable
          sublabel: measured in metres
          x: 620
          y: 290
          w: 160
          tone: neutral
          detail: |
            Not everything is counted in pieces. A uses link carries a **unit** too: "1.2 m of brake cable"
            is a quantity of 1.2 with the unit *metres*.
      edges:
        - { from: scooter, to: frame, label: "uses ×1" }
        - { from: scooter, to: wheel, label: "uses ×2" }
        - { from: scooter, to: battery, label: "uses ×1" }
        - { from: scooter, to: handlebar, label: "uses ×1" }
        - { from: frame, to: tube, label: "×1" }
        - { from: frame, to: hinge, label: "×1" }
        - { from: handlebar, to: cable, label: "1.2 m" }

  - type: text
    md: |
      ### What a part carries

      Open any part and you'll find the same core story:

      | What | Example | Why |
      | --- | --- | --- |
      | **Number** | SC-1042 | Its unique ID. No two parts share one. |
      | **Name** | Folding hinge | Human-friendly, but not unique. |
      | **Version** | A.3 | Which edition you're looking at. |
      | **State** | Released | Where it is in its life cycle. |
      | **Attributes** | material, weight, source (make/buy) | The facts other teams need. |
      | **Structure** | uses links to child parts | What it's made of. |

  - type: comparison
    title: Part vs the CAD model that describes it
    columns: [Part (WTPart), CAD document (EPMDocument)]
    rows:
      - { label: What it is, cells: [The physical item itself, A CAD file that models the item] }
      - { label: Who uses it, cells: ["Everyone: engineering, purchasing, factory, service", Mostly CAD designers] }
      - { label: Has a file?, cells: [Not necessarily - it's mainly data, "Yes, the model or drawing file"] }
      - { label: Exists without CAD?, cells: ["Yes - screws, glue, software, packaging", "No, it's the CAD file"] }
      - { label: Forms the BOM, cells: ["Yes, through uses links", No - CAD has its own dependencies] }
    takeaway: The CAD model describes the part. The part is what you buy, build, count and service.

  - type: callout
    variant: why-it-matters
    md: |
      Purchasing, the factory and service teams usually don't open CAD. They live on the **part** and
      its **BOM**, often fed into the company's ERP system. If the part data is wrong, the wrong thing
      gets ordered, built or shipped - even if the CAD model is perfect.

  - type: example
    variant: case-study
    title: The screw that wasn't in the BOM
    industry: Micromobility
    md: |
      Acme's e-bike team modelled every bracket in CAD but left the screws out of the CAD assembly
      "because they're standard". The BOM was generated from CAD, so the screws never became parts
      in the structure.

      **Result:** the first production run stopped on day one - the factory had brackets but no
      screws ordered.

      **Fix:** the team added the screws as **parts** directly in the Windchill structure (no CAD
      needed) with the right quantity on each uses link. ERP then ordered them automatically.
    takeaway: A part can exist without CAD. If you need to buy it, build it or count it, it needs to be a part.

  - type: walkthrough
    title: Look at a part and its structure
    who: Any user who can read the product
    steps:
      - title: Find the part
        where: [Search box at the top of the page]
        md: Type the part number (for example `SC-2000`) and run the search. Make sure the type filter includes **Parts**.
      - title: Open its information page
        where: [Search results, part number link]
        md: Click the number or name to open the part's **[[information-page]]**. The header shows number, name, version and state.
      - title: Explore the structure
        where: [Part information page, Structure tab]
        md: Open the **Structure** tab. Expand the levels to see child parts with their quantity and unit. This is the BOM.
      - title: Find what describes it
        where: [Part information page, related objects area]
        md: Look at the related documents and CAD documents. The exact tab or table name varies by release - look for "Related", "Documents" or "CAD" in the tab list.
    result: You can name the part, its version and state, and list what it is made of.

  - type: callout
    variant: note
    title: One part, more than one view
    md: |
      Parts can carry a **[[part-view|view]]**, typically *Design* and *Manufacturing*. Engineering
      builds the [[ebom]] in the Design view; manufacturing engineers transform it into an
      [[mbom]] in a Manufacturing view. Same part number, different perspective. You'll meet this
      properly in later modules.

  - type: callout
    variant: pitfall
    md: |
      **Creating a new part number for every tiny variation.** Teams end up with five "M5 screw"
      parts that are actually identical. Search before you create, and ask whether your company
      reuses standard parts from a **library**.

  - type: callout
    variant: pro-tip
    md: When you open an assembly, check the **unit** column, not just the quantity. "2" means very different things in *each* versus *metres* versus *litres*.

  - type: flashcards
    cards:
      - { front: WTPart, back: "The Windchill object for a part: a physical item or assembly in the product." }
      - { front: Assembly, back: A part that uses other parts. It has its own structure. }
      - { front: Uses link, back: The parent-child link between parts. It carries quantity and unit. }
      - { front: BOM, back: "The structured list of parts and quantities, formed by uses links." }
      - { front: Can a part exist without CAD?, back: "Yes. Screws, glue, labels and software are often parts with no CAD model." }
      - { front: Part view, back: "A perspective on a part, such as Design or Manufacturing, used to transform an EBOM into an MBOM." }

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: The Scooter S2 has two identical wheels. How does Windchill usually record this?
        options:
          - Two separate wheel parts with different numbers
          - One wheel part, used by the scooter with quantity 2
          - The wheel CAD model is copied twice
          - It doesn't - quantities live only in ERP
        answer: 1
        explanation: One part, one uses link, quantity 2. That way a change to the wheel automatically applies to both positions.
      - kind: truefalse
        prompt: Every part in Windchill must have a CAD model.
        answer: false
        explanation: Many parts have no CAD at all - purchased items, screws, labels, software, glue. If you need to buy, build or count it, it should be a part, CAD or not.
      - kind: multi
        prompt: Which of these does a uses link carry? (Choose all that apply.)
        options:
          - Quantity
          - Unit, such as each or metres
          - The CAD file
          - The parent and child parts it connects
        answers: [0, 1, 3]
        explanation: A uses link connects a parent part to a child part and says how much is used (quantity plus unit). CAD files belong to CAD documents, not to the link.
      - kind: single
        prompt: Which team relies most on the part and its BOM rather than the CAD model?
        options:
          - Only the CAD designers
          - Purchasing, manufacturing and service
          - Nobody - the BOM is optional
          - Only IT administrators
        answer: 1
        explanation: Downstream teams order, build and service from the part structure, often through ERP. That's why parts are the backbone.

  - type: summary
    points:
      - A part (WTPart) is the record of a physical thing - the backbone of your product data.
      - Parts form the BOM through uses links that carry quantity and unit.
      - The CAD model describes the part, but a part can exist without any CAD.
      - Parts can have views, such as Design and Manufacturing, for EBOM-to-MBOM work.
