id: m01-s03-l06
subtitle: Bookmark what you use, get pinged when things change - without drowning in email.
version: 1.1.0
updated: "2026-10-13"
tags: [favorites, subscriptions, notifications]
sources:
  - id: te
    where: "Module 2: Customize the Home page (Subscriptions table), Activity: Explore the Windchill user interface (Recently Visited), Subscribe to Windchill objects; Module 6: Change management process capabilities (task notification)"
  - id: help-center
    label: PTC Help Center supplement
    title: "Product Actions"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/contexts/ContextsProductActionsRef.html"
    covers: "Add to Favorites / Remove from Favorites for a product, and the Favorites view of the Products table; Subscribe sends e-mail when events occur"
  - id: help-center
    label: PTC Help Center supplement
    title: "Library Actions"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/contexts/ContextsLibActionsRef.html"
    covers: "Add to Favorites for a library and the Favorites view of the Libraries table"
  - id: help-center
    label: PTC Help Center supplement
    title: "Creating a Subscription"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/subscriptions/Subscribe.html"
    covers: "Subscribe from the Actions or right-click menu of an object, folder or context; event check boxes; To/Cc/Bcc subscribers; Immediately or digest delivery; Expiration Date deletes the subscription; notifications only for objects you can access"
  - id: help-center
    label: PTC Help Center supplement
    title: "Subscription Events"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/subscriptions/SubscribeEventsRef.html"
