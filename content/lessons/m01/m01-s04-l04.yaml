id: m01-s04-l04
subtitle: Objects on their own are just records. The links between them are where the product story lives.
version: 1.1.0
updated: "2026-10-13"
tags: [relationships, uses, described-by, references, associations]
sources:
  - id: te
    where: "Module 2: Activity: Browse for objects (part usage relationship), Activity: View information pages (Structure, Documents tab: Described By Documents, Reference Documents, CAD/Dynamic Documents; Related Objects; Where Used); Module 3: Associate Windchill parts with documents; Module 4: Activity: Update a CAD part and associated WTPart (owner association); Module 5: View part usage details (Quantity, Unit)"
  - id: help-center
    label: PTC Help Center supplement
    title: "Configuring Part and Document Relationships (Products and Libraries)"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/pdm_admin_chp/PDMAdminChp_ConfigPartDocRelation.html"
    covers: "Describe link targets the latest iteration of a document version; reference link targets the document master and shows the latest Released version (or latest working if none released); default document-type rules; links carry forward when the part is revised"
  - id: help-center
    label: PTC Help Center supplement
    title: "Association Usage Examples"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/ManagingCADandPartRelationships/MCPR_AssociationUsageExamples.html"
    covers: "Owner association drives structure creation; Content association adds descriptive CAD"
  - id: help-center
    label: PTC Help Center supplement
    title: "CAD and Part Association Overview"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/ManagingCADandPartRelationships/MCPR_AssociationOview.html"
    covers: "Definitions of Owner, Contributing Image, Image, Contributing Content and Content; a drawing of an Owner-associated model gets a Calculated association automatically"

blocks:
  - type: text
    md: |
      You've met parts, documents and CAD documents. Alone, each is just a record. What makes
      Windchill powerful is how they **link up**: this scooter is made of these parts, this hinge is
      explained by that test report, this CAD model defines that part.

      There are four links you'll meet every day. The tricky part: two of them look almost
      identical but show you different versions of a document.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "is made of" (part → part) → *[[uses-link|uses]]*
      - "is explained by *this version* of" (part → document) → *[[described-by|described by]]*
      - "points at *the latest released* of" (part → document) → *[[references-link|references]]*
      - "this CAD model defines this part" (CAD → part) → *[[build-link|CAD-part association]]*, such as Owner

  - type: diagram
    title: The four everyday links
    caption: Click each object to see which links it has.
    diagram:
      width: 800
      height: 400
      nodes:
        - id: frame
          label: Frame assembly
          sublabel: "part SC-2000 · B.1"
          x: 300
          y: 20
          w: 200
          tone: primary
          detail: The parent part. Its **uses** links make up its structure (BOM).
        - id: hinge
          label: Folding hinge
          sublabel: "part SC-1042 · B.2"
          x: 300
          y: 170
          w: 200
          tone: primary
          detail: |
            The hub of this example. It is **used by** the frame, **described by** a specific version
            of the test report, **references** the latest corrosion standard and is **built from** its
            CAD model.
        - id: report
          label: Hinge test report
          sublabel: "doc · version A"
          x: 20
          y: 170
          w: 200
          tone: info
          shape: doc
          detail: |
            **Described by** links the hinge to a specific *version* of the report, and shows that
            version's latest iteration (A.1 → A.2 follows along). Good for evidence: "this design was
            tested by this report".
        - id: standard
          label: Corrosion standard
          sublabel: "doc · latest released"
          x: 20
          y: 310
          w: 200
          tone: info
          shape: doc
          detail: |
            **References** links the hinge to the document's *master*, so it resolves to the **latest
            Released** version (or the latest working one if nothing is released yet). Good for general
            guidance that should stay current.
        - id: cad
          label: hinge.prt
          sublabel: CAD document
          x: 580
          y: 170
          w: 200
          tone: accent
          detail: The CAD model, associated to the part - typically as **Owner**, meaning the CAD data drives the part's structure and attributes.
        - id: drawing
          label: hinge.drw
          sublabel: CAD drawing
          x: 580
          y: 310
          w: 200
          tone: accent
          detail: The drawing depends on the model (a CAD dependency). Because it draws the part's Owner model, Windchill links it to the part automatically with a **Calculated** association.
      edges:
        - { from: frame, to: hinge, label: "uses ×1" }
        - { from: hinge, to: report, label: described by }
        - { from: hinge, to: standard, label: references, dashed: true }
        - { from: cad, to: hinge, label: Owner }
        - { from: drawing, to: cad, label: depends on }

  - type: comparison
    title: Described by vs references
    columns: [Described by, References]
    rows:
      - { label: Links part to, cells: [A specific version of the document, The document master] }
      - { label: Version you see, cells: [The latest iteration of that version, "The latest Released version (or latest working, if none is released)"] }
      - { label: Default document types, cells: [Any type except Reference document, The Reference document type] }
      - { label: Acme example, cells: [Hinge tested by test report A, Hinge follows the released corrosion standard] }
    takeaway: "Described by = this version of the document. References = the latest released one."

  - type: simulation
    title: Watch the links when a document is revised
    intro: |
      The hinge part points at a standards document with a *references* link, and at its test report
      with a *described by* link. Work on both documents and watch what each link shows.
    headline: "Standard: {standard} ({standardState}) · references shows {refShows} · test report: {report}"
    initial: { standard: "A.1", standardState: In Work, refShows: "A.1", report: "A.1" }
    actions:
      - id: iterate-report
        label: Check the test report out and in
        when: { report: "A.1" }
        do: [{ set: { report: "A.2" } }]
        log: The test report is now A.2. The described-by link shows A.2 - it follows the latest iteration of that version.
        blockedHint: One more iteration is enough for this demo.
      - id: release-a
        label: Release standard A.1
        when: { standard: "A.1", standardState: In Work }
        do: [{ set: { standardState: Released } }]
        log: Standard A.1 is Released. References still shows A.1 - now as the latest Released version.
        blockedHint: Standard A is already released.
      - id: revise-standard
        label: Revise the standard to B.1
        when: { standard: "A.1", standardState: Released }
        do: [{ set: { standard: "B.1", standardState: In Work } }]
        log: Standard B.1 is In Work. References keeps showing A.1, because B isn't released yet.
        blockedHint: Release revision A first.
      - id: release-b
        label: Release standard B.1
        when: { standard: "B.1", standardState: In Work }
        do: [{ set: { standardState: Released, refShows: "B.1" } }]
        log: B.1 is Released. References now shows B.1 - no edit to the part needed.
        blockedHint: Revise the standard to B.1 first.
    goals:
      - label: See described by follow a new iteration
        when: { report: "A.2" }
        message: Described by sticks to a version of the document and shows its latest iteration.
      - label: See references wait for a release
        when: { standard: "B.1", standardState: In Work }
        message: Work in progress doesn't leak into a references link - it shows the latest Released version.
      - label: See references move on by itself
        when: { refShows: "B.1" }
        message: References resolves to the master, so a new release shows up without touching the part.

  - type: callout
    variant: why-it-matters
    md: |
      When an auditor asks "which test proved this hinge design was safe?", a **described-by** link
      to a specific report version answers it. Use a **references** link there and the evidence
      silently moves on to whatever report revision was released last.

  - type: example
    variant: real-world
    title: Where-used saves a weekend
    industry: Micromobility
    md: |
      Acme's supplier discontinues a battery connector. Because every product structure uses
      the connector part through **uses** links, one *where used* lookup lists every e-bike and
      scooter assembly affected - in seconds, not a weekend of spreadsheet digging.
    takeaway: Links work in both directions. "What's in this?" and "where is this used?" are the same data.

  - type: walkthrough
    title: Follow links from an information page
    who: Any user who can read the product
    steps:
      - title: Open the part
        where: [Search box, part number]
        md: Search for the part (for example `SC-1042`) and open its information page.
      - title: Go down the structure
        where: [Part information page, Structure tab]
        md: Expand to see the child parts this part **uses**, with quantities.
      - title: Go up - where used
        where: [Part information page, Where Used]
        md: Open the **Where Used** tab to see every parent assembly that uses this part, up to the top-level end items.
      - title: See documents and CAD
        where: [Part information page, Structure, Documents]
        md: In the Structure tab's right pane, open **Documents** for the Described By Documents, Reference Documents and CAD/Dynamic Documents tables (the **Related Objects** tab shows linked objects too). Click any of them to jump to its own information page - and keep following the chain.
    result: You can travel from any object to everything linked to it.

  - type: callout
    variant: pitfall
    md: |
      **Using references for test evidence.** It looks tidy because it always shows the newest
      released report, but it breaks traceability: you can no longer prove which report went with
      which design.

  - type: callout
    variant: pro-tip
    md: Before changing a part, check **where used** first. A "small" change to a part used in twelve assemblies is not small.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: The hinge is linked to test report version A by **described by**. Someone checks the report out and in, so it goes from A.1 to A.2. What does the hinge show?
        options: [A.1, A.2, No report - the link breaks, B.1]
        answer: 1
        explanation: A described-by link points at a version of the document and shows that version's latest iteration, so it follows A.1 → A.2.
      - kind: single
        prompt: Which link shows a part the latest Released version of a company-wide design standard?
        options: [Uses, Described by, References, Owner association]
        answer: 2
        explanation: References links to the document master and shows the latest Released version (or the latest working one if nothing is released yet).
      - kind: multi
        prompt: Which statements about the uses link are true? (Choose all that apply.)
        options:
          - It connects a parent part to a child part
          - It carries quantity and unit
          - It connects a part to a CAD drawing
          - It lets you find where a part is used
        answers: [0, 1, 3]
        explanation: Uses links build the BOM between parts, carry quantities, and can be read upwards for where-used. CAD documents connect through associations, not uses links.
      - kind: truefalse
        prompt: A references link keeps pointing at one fixed document version forever.
        answer: false
        explanation: It points at the document master, so the version it shows moves on each time a newer version is released.

  - type: summary
    points:
      - Uses links connect parts into a BOM, with quantity and unit, and work for where-used too.
      - Described by ties a part to a specific document version (and its latest iteration) - ideal for evidence.
      - References ties a part to a document master - it shows the latest Released version.
      - CAD documents connect to parts through associations, such as Owner.
