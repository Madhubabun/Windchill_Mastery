id: m01-s01-l05
subtitle: Nobody builds a house without a floor plan. Pacesetters are PTC's floor plan for a first Windchill go-live.
version: 1.0.0
updated: "2026-10-13"
tags: [pacesetter, implementation, best-practices, plm-foundation, basics]
sources:
  - id: pf
    where: "About this course; Implementation strategy; Module 1: What is a PTC Pacesetter?; Why do Pacesetters exist today?; Identify the scope and design of the Windchill PLM Foundation Pacesetter; What is included in the Windchill PLM Foundation Pacesetter?; Activity: Explore the contents of the Windchill PLM Foundation Pacesetter; Module 2: Deploy the Windchill PLM Foundation Pacesetter: overview; Module 3: Identify the foundational configurations; Activity: Explore the preferences set by Pacesetter deployment (navigation); Module 4: Identify the business configurations; The change process"
  - id: te
    where: "Module 1: What is a PTC value ready deployment (VRD)?; Why do VRDs exist today?; Identify the scope and design of the PLM Foundation VRD (including the renaming notes)"

blocks:
  - type: text
    md: |
      Picture a company that just bought [[windchill]]. A totally empty system is waiting. Somebody
      has to decide which folders products get, what kinds of documents exist, who can edit what,
      and how a change gets approved. Start from zero and you could spend months just arguing.

      PTC's answer is a **Pacesetter**: a ready-made starting point, packed with PTC's experience
      from many earlier projects. You don't start from a blank page. You start from something that
      already works, then tune it to fit.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "PTC's ready-made starting point for a project" → *[[pacesetter|Pacesetter]]* (older name: *value ready deployment*, or VRD)
      - "the Pacesetter for a company's first Windchill PLM system" → *Windchill PLM Foundation Pacesetter*
      - "a brand-new system, no old setup to carry" → *[[greenfield-implementation|greenfield]]*
      - "what Windchill does as shipped, no custom code" → *[[out-of-the-box|out-of-the-box (OOTB)]]*
      - "the paper that says what the project will deliver" → *statement of work (SOW)*

  - type: callout
    variant: note
    title: Same thing, new name
    md: |
      PTC renamed *value ready deployments (VRDs)* to **Pacesetters** in June 2025. Older course
      material and colleagues may still say "VRD" or "PLM Foundation VRD". It's the same idea.

