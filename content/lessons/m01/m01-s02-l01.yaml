    where: "Module 11: Describe the Windchill architecture (client, application and database layers); Describe the Windchill client; Describe the web server; Describe the Windchill server; Describe the database server; Describe LDAP integration; Identify optional servers (Solr indexing, visualization workers, file servers and replication)"
  - id: ac
