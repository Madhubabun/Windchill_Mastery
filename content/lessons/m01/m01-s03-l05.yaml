blocks:
  - type: text
    md: |
      Almost everything in Windchill shows up as a **table**: folder contents, search results, your tasks,
      a product's changes, an assembly's structure. The default columns are rarely the ones *you* need.

      Good news: you can choose the columns, sort and filter, and **save** that setup under a name. Next
      time, one click and the table looks exactly how you like it.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "my saved way of looking at a table" → [[table-view]] (or just *view*)
      - "quickly narrow what's on screen" → the *Search in table* box
      - "order the rows" → *sort*
      - "the list of views next to a table's name" → the *view drop-down list*

  - type: diagram
    title: Anatomy of a Windchill table
    caption: A schematic of the parts of any table. Click each part.
    diagram:
      width: 800
      height: 330
      nodes:
        - id: toolbar
          label: Table actions
          sublabel: icons + Actions menu
          x: 20
          y: 20
          w: 250
          h: 56
          tone: accent
          detail: Select rows with their check boxes, then use the Actions menu (or right-click) to act on all of them at once. Actions that don't fit every selected object are hidden or skipped.
        - id: views
          label: View list
          sublabel: "All ▾"
          x: 290
          y: 20
          w: 230
          h: 56
          tone: primary
          detail: |
            Switch between views, or choose **Customize** to open the view list manager and create a
            **New View**. A view stores the object types, filters, columns and sort order.
        - id: find
          label: Search in table
          sublabel: quick text filter
          x: 540
          y: 20
          w: 240
          h: 56
          tone: info
          detail: Type a few characters and only matching rows stay. Click the cancel X to see all rows again. Fast, but not part of any view (and it clears rows you had selected).
        - id: headers
          label: Column headers
          sublabel: click to sort
          x: 20
          y: 100
          w: 760
          h: 50
          tone: warning
          detail: Click a column title to sort by it; arrows show the direction. Shift+click another title to add a second sort. You can also resize columns and change their order.
        - id: rows
          label: Rows
          sublabel: one object per row
          x: 20
          y: 170
          w: 760
          h: 80
          tone: success
          detail: Click an object's name or *View information* icon to open its information page. Icons in the row show its type and status (for example, checked out).
        - id: paging
          label: Long tables
          sublabel: hundreds of rows
          x: 20
          y: 270
          w: 300
          h: 50
          tone: neutral
          detail: A busy folder can hold hundreds of rows. Rather than scrolling, pick a view that filters them or search in the table.
      edges: []

  - type: comparison
    title: Sort, find, view filter or search?
    columns: [Sort, Search in table, View filter, Search]
    rows:
      - { label: What it does, cells: [Reorders rows, Hides rows not matching some text, Shows only rows meeting criteria, Finds objects across contexts] }
      - { label: "Saved?", cells: [In a view, No - temporary, Yes - in the view, Yes - as a saved search] }
      - { label: Scope, cells: [This table, This table, This table, Everything you can access] }
      - { label: Best for, cells: [Newest first, "Quick 'where is it?'", Your daily work list, Finding things anywhere] }
    takeaway: Search in table for right now; a view for every day; a search for anywhere.

  - type: walkthrough
    title: Create your own table view
    who: Any user (a view stays yours unless you share it, which depends on your access rights)
    steps:
      - title: Go to the table
        where: [Products, "Scooter S2", Folders, Frame]
        md: Open any table - here, the Folder Contents of the Frame folder in Scooter S2.
      - title: Open Customize
        where: [Folder Contents, view drop-down list, Customize]
        md: |
          Open the view drop-down list next to the table name and choose **Customize**. In the window
          that opens, click **New View** to start the wizard.
      - title: Name it
        where: [New View, Name]
        md: Give it a name you'll recognise, e.g. `My in-work parts`. Keep *Show in current view list* selected.
      - title: Pick types and filters
        where: [New View, "Object types / Filters"]
        md: Select the object type (**Part**), then add filter criteria such as **State** equal to **In Work**.
      - title: Choose columns
        where: [New View, Columns]
        md: |
          Move the columns you need (e.g. *State*, *Last Modified*) into Selected Columns and put the
          most important first.
      - title: Set sorting
        where: [New View, Sorting]
        md: Sort by **Last Modified**, newest first, then click **Finish**.
      - title: Use it
        where: [Folder Contents, view drop-down list, "My in-work parts"]
        md: Close the Customize window and pick your new view from the view drop-down list. It's there next time too.
    result: A table that shows only in-work parts, with the columns you care about, newest first.

  - type: simulation
    title: Build the change manager's view
    intro: |
      Lin, Acme's change manager, wants a view of the Frame folder that shows **only In Work parts**,
      with **State** and **Last Modified By** columns, sorted **newest first**. Build it, then save it.
    headline: "Columns: {columns} · Filter: {filter} · Sort: {sort} · Rows: {rows}"
    initial: { columns: Number + Name, filter: none, sort: Name A-Z, rows: 820, saved: false }
    actions:
      - id: add-state
        label: Add column State
        when: { columns: Number + Name, saved: false }
        do: [{ set: { columns: Number + Name + State } }]
        log: State column added. Now you can see In Work vs Released at a glance.
        blockedHint: State is already shown (or the view is already saved).
      - id: add-modby
        label: Add column Last Modified By
        when: { columns: Number + Name + State, saved: false }
        do: [{ set: { columns: Number + Name + State + Modified By } }]
        log: Last Modified By added. You see who touched each part last.
        blockedHint: Add State first (keep important columns first), or it's already there.
      - id: filter
        label: "Filter: State = In Work"
        when: { filter: none, saved: false }
        do: [{ set: { filter: In Work, rows: 37 } }]
        log: "Filter applied in the view: 820 rows → 37. Only the work in progress is left."
        blockedHint: The filter is already set.
      - id: sort
        label: Sort by Last Modified, newest first
        when: { sort: Name A-Z, saved: false }
        do: [{ set: { sort: Newest first } }]
        log: The most recently changed parts float to the top.
        blockedHint: Already sorted newest first.
      - id: find
        label: Search in table for "hinge"
        when: { rows: 37 }
        do: [{ set: { rows: 3 } }]
        log: "Search in table shows 3 matching rows - handy, but it's temporary and won't be saved in the view."
        blockedHint: Apply the In Work filter first, or clear the current find text.
      - id: clear-find
        label: Clear the table search
        when: { rows: 3 }
        do: [{ set: { rows: 37 } }]
        log: Search text cleared - all 37 in-work rows are back.
        blockedHint: There's no find text to clear.
      - id: save
        label: Save view as "In work - newest"
        when: { columns: Number + Name + State + Modified By, filter: In Work, sort: Newest first, saved: false }
        do: [{ set: { saved: true, rows: 37 } }]
        log: Saved! Next time it's one click from the view picker - and it always shows today's data.
        blockedHint: "Not ready yet: Lin needs the State and Modified By columns, the In Work filter and newest-first sorting."
    goals:
      - label: Filter the table down to In Work parts
        when: { filter: In Work }
      - label: Save the finished view
        when: { saved: true }
        message: Views store columns, filters and sorting - not the rows - so the data is always current.

  - type: example
    variant: real-world
    title: The Friday release check
    industry: Micromobility
    md: |
      Before every production release, Acme's manufacturing engineer opens the S2 top assembly's
      structure and switches to a view she made with the columns **State** and **Version**, filtered to
      anything not *Released*. If the table is empty, the build is clean. If not, she knows exactly which
      parts to chase - in seconds, not after scrolling through 400 lines.
    takeaway: A good view turns a big table into a yes/no answer.

  - type: callout
    variant: why-it-matters
    md: |
      Engineers and change managers live in tables. A view that hides the noise saves minutes every time
      you open a folder, a structure or a task list - that's hours a month, and fewer mistakes, because
      the thing you need to notice is no longer buried on page 7.

  - type: callout
    variant: pitfall
    md: |
      **Forgetting a view is active.** You filtered to *In Work* last week, and today you think half the
      folder is missing. If a table looks wrong, check which view is selected and clear any
      search-in-table text before you panic.

  - type: callout
    variant: pro-tip
    md: |
      Ask whether shared views exist for your team. Depending on access rights, a view can be shared
      with all users, an organization or a context, so the whole change board looks at the same
      columns in a meeting.

  - type: quiz
    questions:
      - kind: single
        prompt: You want a table to show only Released parts every time you open it. What do you do?
        options:
          - Type "Released" in the Search in table box each time
          - Create a view with the filter State = Released
          - Sort by state
          - Run a quick search
        answer: 1
        explanation: A view saves the filter so it applies every time. Search in table is temporary, and sorting only reorders rows.
      - kind: multi
        prompt: What does a table view store? (Choose all that apply.)
        options: [Which columns are shown, Sort order, Filter criteria, A frozen copy of the rows]
        answers: [0, 1, 2]
        explanation: A view stores how to show the table - columns, sorting and filters. The rows are always read fresh.
      - kind: truefalse
        prompt: A personal view you create changes the table for all your teammates.
        answer: false
        explanation: A view you create is yours unless you share it - and sharing with all users, an organization or a context depends on your access rights.
      - kind: order
        prompt: Put the steps for creating a view in order.
        items: [Open Customize from the view list, Name the view, Set filters and columns, Set sorting, Finish and select it]
        explanation: The New View wizard asks for a name, then what rows (types and filters) and what columns, then the order. Finish, then pick it from the view list.

  - type: summary
    points:
      - Most Windchill pages are tables, and tables are customisable.
      - Sort by clicking column titles; Search in table for quick, temporary filtering.
      - A view saves types, filters, columns and sorting under a name - yours unless you share it.
      - If a table looks "wrong", check the active view first.
