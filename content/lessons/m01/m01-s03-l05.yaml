id: m01-s03-l05
subtitle: Hundreds of rows, zero scrolling. Columns, sorts, filters and views that work for you.
version: 1.1.0
updated: "2026-10-13"
tags: [tables, table-views, filters, sorting]
sources:
  - id: te
    where: "Module 2: Use the Windchill Home page (Tables), Build custom Windchill table views, Activity: Build a custom table view (view drop-down list, Customize, New View wizard), Browse for objects (Folder Contents), Activity: View information pages (Search in table); Module 3: Modify documents: workflow (checked-out icon); Module 5: View part usage details (structure views)"
  - id: help-center
