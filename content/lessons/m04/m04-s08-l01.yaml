id: m04-s08-l01
subtitle: Stop exporting ten searches into a spreadsheet. Ask Windchill the real question once, and save it.
version: 1.0.0
updated: "2026-10-05"
tags: [reporting, query-builder, report-template, business-admin]

blocks:
  - type: text
    md: |
      Maya, Acme's change manager, pings Jordan on a Monday:

      > "Which E-bike parts are still In Work, and which spec document describes each one? I need it every week."

      A normal search can list parts *or* documents. It can't list parts **next to** their documents.
      That needs a question that crosses a relationship - and Jordan wants to save that question so
      Maya can rerun it herself every Monday.

      That's what this lesson is about: building a reusable report with Windchill's report builder.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the click-together question builder" → [[query-builder|Query Builder]]
      - "a saved question anyone allowed can rerun" → [[report-template]]
      - "the admin page that lists them" → [[report-management|Report Management]]
      - "connecting two kinds of objects in one question" → *join*
      - "a blank the user fills in when running it" → *parameter* (run-time criterion)
      - "the columns you want back" → *select* (or *select/group*)

  - type: diagram
    title: The five ingredients of a report template
    caption: Every report template answers five questions. Click each box.
    diagram:
      width: 820
      height: 340
      nodes:
        - id: types
          label: Types
          sublabel: what to read
          x: 20
          y: 40
          w: 140
          tone: primary
          detail: |
            The object types the query reads, for example **Part**, **Document** or a change object.
            Add a type once per role it plays - a parent part and a child part are two entries
            with different aliases.
          real: Most real reports use two to four types. Ten types usually means the question should be split.
        - id: joins
          label: Joins
          sublabel: how they connect
          x: 180
          y: 40
          w: 140
          tone: accent
          detail: |
            Joins say *which* part goes with *which* document. In Windchill, relationships are usually
            stored as **link objects** (a [[described-by]] link, a [[uses-link]] and so on), so you join
            Part → link → Document.
          real: Missing joins are the number one cause of reports that return millions of rows.
        - id: select
          label: Select
          sublabel: which columns
          x: 340
          y: 40
          w: 140
          tone: info
          detail: |
            The attributes shown as columns: part number, name, state, document number, modified date.
            You can rename column headings and group or count rows (for example "parts per state").
        - id: criteria
          label: Criteria
          sublabel: which rows
          x: 500
          y: 40
          w: 140
          tone: warning
          detail: |
            Filters such as *context = E-Bike E1* and *state = In Work*. A criterion can be fixed, or
            turned into a **parameter** so the person running the report types or picks the value.
        - id: sort
          label: Sort & output
          sublabel: how it looks
          x: 660
          y: 40
          w: 140
          tone: success
          detail: |
            Sort order (newest first, by number...) and how results come out: an on-screen table
            or an export such as CSV/Excel, depending on your release and setup.
        - id: template
          label: Report template
          sublabel: saved in a context
          x: 300
          y: 200
          w: 220
          h: 64
          tone: primary
          shape: doc
          detail: |
            The saved [[report-template]] lives in a context. A template saved at **organization** level
            can be offered to every product; one saved in **E-Bike E1** stays with that product.
          real: "Results always respect access rights: two people running the same template can see different rows."
      edges:
        - { from: types, to: template }
        - { from: joins, to: template }
        - { from: select, to: template }
        - { from: criteria, to: template }
        - { from: sort, to: template }

  - type: animation
    title: What a join actually does
    diagram:
      width: 820
      height: 330
      nodes:
        - { id: parts, label: Parts, sublabel: EB-10021 · EB-10040 · EB-10102, x: 20, y: 40, w: 220, h: 64, tone: primary, shape: cylinder }
        - { id: links, label: Described-by links, sublabel: part ↔ document pairs, x: 300, y: 40, w: 220, h: 64, tone: accent, shape: cylinder }
        - { id: docs, label: Documents, sublabel: DOC-BAT-01 · DOC-MOT-03, x: 580, y: 40, w: 220, h: 64, tone: info, shape: cylinder }
        - { id: mess, label: No join = every pair, sublabel: 3 parts × 2 docs = 6 rows (mostly wrong), x: 60, y: 200, w: 300, h: 70, tone: danger }
        - { id: result, label: With joins = true pairs, sublabel: "EB-10021 → DOC-BAT-01 ...", x: 460, y: 200, w: 300, h: 70, tone: success, shape: doc }
      edges:
        - { from: parts, to: links, label: part side }
        - { from: links, to: docs, label: document side }
        - { from: parts, to: mess, dashed: true }
        - { from: docs, to: mess, dashed: true }
        - { from: links, to: result, label: only linked pairs }
    chapters:
      - title: Two lists, no connection
        caption: You add **Part** and **Document** to the report. On their own they are just two lists.
        show: [parts, docs]
        highlight: [parts, docs]
      - title: Forget the join...
        caption: Without a join, the database pairs **every** part with **every** document. 3 × 2 is small; 2,000 parts × 900 documents is 1.8 million rows and a very slow server.
        show: [parts, docs, mess]
        highlight: [mess]
        flow: [parts>mess, docs>mess]
        seconds: 8
      - title: Add the link object
        caption: Relationships live in **link objects**. Add the described-by link type to the report as a third type.
        show: [parts, docs, links]
        highlight: [links]
      - title: Join both sides
        caption: Join Part to the link's part side, and the link's document side to Document. Now only pairs that really exist come back.
        show: [parts, docs, links, result]
        highlight: [result]
        flow: [parts>links, links>docs, links>result]
        seconds: 8

  - type: callout
    variant: why-it-matters
    md: |
      Without report templates, every manager's question becomes a support ticket, or someone spends
      Friday afternoon gluing CSV exports together in a spreadsheet - with data that is stale by Monday.
      A good template answers the question **live**, for anyone allowed to ask it, with the same
      definition every time. That last part matters: if two teams count "open parts" differently,
      their numbers will never agree in a meeting.

  - type: comparison
    title: Saved search or report template?
    columns: [Saved search, Report template]
    rows:
      - label: Who builds it
        cells: [Any user, Business administrator (or someone with Report Management rights)]
      - label: Object types
        cells: [One type (or a few) per search, Several types joined through their relationships]
      - label: Columns
        cells: [The table view's columns, Any attribute of any joined type - plus counts and groups]
      - label: Run-time input
        cells: [Edit the criteria yourself, Parameters prompt the user for values]
      - label: Best for
        cells: ["Finding objects to open and act on", "Answering a question with a table or export"]
    takeaway: "If the answer needs two kinds of objects side by side, it's a report template. If you just need to find things, a [[saved-search]] is lighter."

  - type: walkthrough
    title: Build a report template with Query Builder
    who: Business administrator (Jordan) with Report Management rights in the context
    where: ["<context>", Utilities, Report Management]
    steps:
      - title: Choose the right context
        where: [Navigator, Browse, "Organizations or Products", "<context>"]
        md: |
          Decide where the template should live **before** you build it. Jordan wants Maya and the
          E-bike team to use it, and nobody else needs it yet, so he opens the **E-Bike E1** product.
          A template for every product would be built at organization level instead.
      - title: Open Report Management
        where: ["E-Bike E1", Utilities, Report Management]
        md: |
          Open the context's **Utilities** page and choose **Report Management**. You see the report
          templates already stored in this context.
      - title: Start a new report template
        where: [Report Management, "New Report Template"]
        md: |
          Use the **New** report template action. Query Builder opens. Its pages (often shown as tabs)
          follow the five ingredients: types, joins/relationships, select, criteria, sort.
      - title: Add the types
        where: [Query Builder, Types]
        md: |
          Add **Part** (or the *E-Bike Part* subtype if you only want e-bike parts), the
          **described-by link** type, and **Document**. Give each an alias you'll recognise, like
          *P*, *L* and *D*.
      - title: Join them
        where: [Query Builder, "Joins / Relationships"]
        md: |
          Join **P** to the part side of **L**, and the document side of **L** to **D**. Query Builder
          offers the valid relationships between the types you added; pick from that list rather than
          joining on look-alike attributes such as names.
      - title: Pick the columns
        where: [Query Builder, Select]
        md: |
          Select P.Number, P.Name, P.State, D.Number, D.Name. Rename headings to plain words like
          *Part* and *Spec document* - managers read headings, not attribute names.
      - title: Add criteria and a parameter
        where: [Query Builder, Criteria]
        md: |
          Add *context name = E-Bike E1*. For the life cycle state, make the criterion a
          **parameter** so whoever runs it can choose *In Work*, *Under Review* or *Released*. One
          template now replaces three.
      - title: Sort, save and test
        where: [Query Builder, Sort, Save]
        md: |
          Sort by part number. Save with a clear name and description, for example
          *"E1 - parts and their spec documents (by state)"*. Run it once yourself and check a few rows
          against the parts' information pages.
    result: |
      The template appears in Report Management for E-Bike E1. Running it prompts for a state and
      returns one row per part-document pair, filtered by what the person running it is allowed to see.

  - type: callout
    variant: version-note
    versions: ["Older releases", "Newer releases"]
    md: |
      In older releases Query Builder ran as a separate Java-based window; newer releases provide it in
      the browser. Tab names and the exact place of the joins page vary, but the five ingredients are the
      same. On **Windchill+**, check which contexts let you create report templates - site-level utilities
      are often reserved for the service provider, so build at organization or product level.

  - type: simulation
    title: Build Maya's report
    intro: |
      Build the template *"E-bike parts and their spec documents"*. Try running it **before** you join
      the types, just to see what happens, then finish it properly and save a version with a parameter.
      Use **Start over** whenever you want a clean page.
    headline: "Types: {typesAdded} · joined: {joined} · filter: {criteria} · last run: {lastRun}"
    initial:
      typesAdded: 0
      partAdded: false
      linkAdded: false
      docAdded: false
      joined: false
      columnsChosen: false
      criteria: none
      saved: false
      lastRun: not run
    actions:
      - id: add-part
        label: Add type - Part
        when: { partAdded: false }
        do: [{ set: { partAdded: true } }, { inc: typesAdded }]
        log: Added Part with alias P.
        blockedHint: Part is already in the query.
      - id: add-doc
        label: Add type - Document
        when: { docAdded: false }
        do: [{ set: { docAdded: true } }, { inc: typesAdded }]
        log: Added Document with alias D.
        blockedHint: Document is already in the query.
      - id: add-link
        label: Add type - Described-by link
        when: { linkAdded: false, partAdded: true }
        do: [{ set: { linkAdded: true } }, { inc: typesAdded }]
        log: Added the described-by link with alias L. It holds the real part-document pairs.
        blockedHint: Add Part first, so you can see what the link connects. (Already added? It's in the query.)
      - id: run-unjoined
        label: Run preview (no joins yet)
        when: { partAdded: true, docAdded: true, joined: false }
        do: [{ set: { lastRun: "1.8 million rows" } }]
        log: "Ouch: every part paired with every document - 2,000 × 900 = 1.8 million rows. The server sweats, and the answer is wrong."
        blockedHint: Needs Part and Document in the query and no joins yet.
      - id: join
        label: Join P → L → D
        when: { partAdded: true, linkAdded: true, docAdded: true, joined: false }
        do: [{ set: { joined: true } }]
        log: Joined Part to the link's part side and the link's document side to Document.
        blockedHint: Add all three types first (Part, link, Document).
      - id: columns
        label: "Select columns (part no., name, state, doc no.)"
        when: { joined: true, columnsChosen: false }
        do: [{ set: { columnsChosen: true } }]
        log: Columns chosen and renamed to Part, Name, State, Spec document.
        blockedHint: Join the types first so the columns make sense together.
      - id: run-all
        label: Run (no criteria)
        when: { columnsChosen: true, criteria: none }
        do: [{ set: { lastRun: "1,240 rows" } }]
        log: Correct pairs, but from every context you can see - Scooter S2 included. Too much for Maya.
        blockedHint: Pick columns first. (This run is for a template without criteria.)
      - id: add-criteria
        label: "Add criteria: context = E-Bike E1, state = In Work"
        when: { columnsChosen: true, criteria: none }
        do: [{ set: { criteria: fixed } }]
        log: Fixed criteria added.
        blockedHint: Pick columns first. If criteria already exist, start over to try again.
      - id: run-fixed
        label: Run (fixed criteria)
        when: { criteria: fixed }
        do: [{ set: { lastRun: "42 rows" } }]
        log: 42 In Work e-bike parts with their spec documents. Exactly Maya's question - but only for In Work.
        blockedHint: Add the fixed criteria first.
      - id: make-param
        label: Turn State into a parameter
        when: { criteria: fixed }
        do: [{ set: { criteria: parameter } }]
        log: State is now asked at run time. One template covers In Work, Under Review and Released.
        blockedHint: Add the fixed criteria first, then turn State into a parameter.
      - id: run-param
        label: Run (prompted for State)
        when: { criteria: parameter }
        do: [{ set: { lastRun: "prompted" } }]
        log: The report asks "State?" - Maya picks Under Review and gets 17 rows.
        blockedHint: Turn State into a parameter first.
      - id: save
        label: Save as "E1 - parts and spec documents"
        when: { criteria: parameter, saved: false }
        do: [{ set: { saved: true } }]
        log: Saved in E-Bike E1 Report Management. Maya can run it every Monday.
        blockedHint: Save the version with a parameter (already saved? Start over to build another).
      - id: reset
        label: Start over
        when: { typesAdded: [1, 2, 3] }
        do:
          - set: { typesAdded: 0, partAdded: false, linkAdded: false, docAdded: false, joined: false, columnsChosen: false, criteria: none, saved: false, lastRun: not run }
        log: Blank Query Builder again.
        blockedHint: Nothing to clear yet.
    goals:
      - label: See what a missing join does
        when: { lastRun: "1.8 million rows" }
        message: No join = every combination. Always join through the link object.
      - label: Get exactly Maya's 42 rows
        when: { lastRun: "42 rows" }
        message: Joins give correct pairs; criteria give the right slice.
      - label: Save a template with a parameter
        when: { saved: true }
        message: One template, many questions. Parameters beat copies.

  - type: callout
    variant: pitfall
    title: The report that slowed down everyone
    md: |
      Reports run against the **live production database**. A template with a missing join, or one
      that reads every iteration of every part across the whole site, can make Windchill sluggish for
      everyone while it runs. Before publishing a template: check the joins, filter by context early,
      and (where your types allow it) limit to the latest iteration. Test it on a test system first.

  - type: callout
    variant: pro-tip
    md: |
      Name templates as **audience - question**: *"CCB - open change requests by age"*,
      *"E1 - parts and spec documents"*. Put the definition in the description ("open = any state except
      Resolved and Cancelled"). When numbers are argued over in a meeting, the description settles it.
      Many releases let you **export** a template from Report Management and **import** it on another
      system, so you can build on test and move it to production.

  - type: quiz
    questions:
      - kind: single
        prompt: Maya wants each E-bike part listed next to the document that describes it. Why can't a normal saved search do this?
        options:
          - Saved searches can't filter by context
          - It needs two object types joined through their relationship
          - Saved searches only work for administrators
          - Documents can't be searched
        answer: 1
        explanation: Searches find objects of a type. Showing parts next to their documents means joining Part, the described-by link and Document - a report template's job.
      - kind: single
        prompt: Jordan runs a new template and gets 1.8 million rows. What's the most likely cause?
        options: [A missing join between the types, Too many columns selected, The sort order, The template is in the wrong context]
        answer: 0
        explanation: Without a join the database pairs every row of one type with every row of the other. Join through the link object.
      - kind: truefalse
        prompt: Two people running the same report template always see exactly the same rows.
        answer: false
        explanation: Results respect each user's access rights, so someone who can't read Scooter S2 data won't see Scooter S2 rows.
      - kind: order
        prompt: Put Jordan's build steps in a sensible order.
        items: [Choose the context, Add the types, Join them, Select columns, Add criteria and parameters, Save and test]
        explanation: Decide where it lives, then build types → joins → columns → criteria, and test before telling anyone.
      - kind: single
        prompt: Maya needs the same report for In Work, Under Review and Released parts. Best approach?
        options: [Three templates, One template with State as a parameter, One template with no state filter, Ask Rosa for a database script]
        answer: 1
        explanation: A parameter asks for the value at run time. One definition is easier to maintain and impossible to get out of sync.

  - type: summary
    points:
      - A report template is a saved question built with Query Builder in Report Management.
      - Five ingredients - types, joins, select, criteria, sort/output.
      - Join through link objects; a missing join returns every combination.
      - Parameters let one template answer many variations of a question.
      - Results respect access rights, and heavy reports hit the live database - test first.
