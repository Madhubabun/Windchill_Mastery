blocks:
  - type: text
    md: |
      E-Bike E1 is growing up. Two new kinds of data arrive, and domain rules alone can't protect them:

      1. **Voltra's proprietary cell data.** Voltra shares its cell chemistry spec (EB-10025 cell
         module) under an NDA. Only Acme's named battery engineers may see it, *including* in folders
         where other E1 members normally read everything.
      2. **Export-controlled firmware design.** The EB-10030 motor controller uses encryption that
         Acme's (fictional) compliance team classifies as export controlled. Only cleared people may
         access it, wherever it's stored.

      Policy rules grant by **zone**. These need a control that travels **with the object** and says
      *"not you, whatever else you've been given."* That's a **security label**.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a clearance marking on an object" → [[security-label|security label]]
      - "who is cleared for one label value" → *authorized participants*
      - "a time-limited, approved exception for named people" → [[agreement]]
      - "export rules for technology" → *export control*

  - type: diagram
    title: How a label sits on top of normal access
    caption: The label is a gate in front of the rules. Click each box.
    diagram:
      width: 820
      height: 420
      groups:
        - { label: Label gate, x: 20, y: 140, w: 780, h: 110, tone: danger }
      nodes:
        - id: obj
          label: EB-10025 cell spec
          sublabel: "Proprietary: Voltra"
          x: 310
          y: 20
          w: 200
          h: 60
          tone: warning
          shape: doc
          detail: |
            The document carries the label value *Third-Party Proprietary = Voltra* (Acme's own label
            design). Values are set **per object**: in the create window's Set Security Labels step, by an
            object initialization rule default, or later with **Edit Security Labels**.
        - id: authorized
          label: Authorized list
          sublabel: ACME-Battery-Core
          x: 40
          y: 170
          w: 200
          h: 56
          tone: success
          detail: |
            Each label has authorized participants: specific users, groups or whole organizations. Here only
            `ACME-Battery-Core` (Kai and two engineers) is authorized for *Proprietary: Voltra*.
        - id: agreement
          label: Agreement
          sublabel: CertLab · 60 days
          x: 310
          y: 170
          w: 200
          h: 56
          tone: info
          detail: |
            An [[agreement]] is the only exception to a label. It authorizes extra participants for the
            label values and objects it covers, while it's in the right life cycle state and between its
            start and end dates.
        - id: blocked
          label: Everyone else
          sublabel: e.g. Ana, Sam
          x: 580
          y: 170
          w: 200
          h: 56
          tone: danger
          detail: |
            Ana is an E1 member with a policy Read grant on all E1 documents. She is **not** authorized,
            so she gets nothing on EB-10025. No policy rule or ad hoc grant changes that.
        - id: rules
          label: Normal rules
          sublabel: policy + ad hoc
          x: 170
          y: 300
          w: 200
          h: 56
          tone: primary
          detail: |
            Passing the label gate grants **nothing**. Kai still needs a policy or ad hoc grant to read the
            document. Labels only take access away.
        - id: result
          label: Effective permissions
          sublabel: cleared AND granted
          x: 450
          y: 300
          w: 200
          h: 56
          tone: accent
          shape: pill
          detail: You need **both** clearance for the label **and** a grant from the rules.
      edges:
        - { from: obj, to: authorized }
        - { from: obj, to: agreement }
        - { from: obj, to: blocked }
        - { from: authorized, to: rules, label: cleared }
        - { from: agreement, to: rules, label: cleared while active }
        - { from: rules, to: result }

  - type: callout
    variant: why-it-matters
    md: |
      Export-control and NDA violations are legal problems, not IT problems. Companies get fined, lose
      export privileges or lose supplier trust. Labels give compliance teams a control they can explain:
      the label is the highest rule in Windchill, so if it denies you and no agreement covers you, no other
      rule is even worth checking. Agreements add the paper trail: who was cleared, for what, and until when.

  - type: comparison
    title: Domains, labels and agreements, side by side
    columns: [Domain policy rules, Security labels, Agreements]
    rows:
      - label: Question it answers
        cells: ["What may this role do in this zone?", "Who is cleared to touch this object at all?", "Who gets an approved, time-limited exception?"]
      - label: Attached to
        cells: [A domain, Each object (its label values), "Label values, participants and objects (or a whole context)"]
      - label: Grants access
        cells: [Yes, "No - only restricts", "No - only clears; rules must still grant"]
      - label: Follows the object if moved
        cells: ["No - a new domain means new rules", "Yes - the values stay on the object", "Depends on the agreement's objects or context"]
      - label: Ends
        cells: [When the rule is changed, When the value is changed, "When it expires, becomes inactive or is removed"]
      - label: Set up by
        cells: [Business admin in Policy Administration, "System admins configure labels (server files); users set values", Members of an agreement managers group]
    takeaway: Domains draw the everyday picture, labels fence off sensitive objects, and agreements open a gate in that fence for a time.

  - type: example
    variant: case-study
    title: The certification lab and the 60-day key
    industry: Micromobility
    md: |
      **Situation.** E-Bike E1's battery must pass a (fictional) safety certification at an external lab,
      **CertLab**. The lab needs the EB-10025 cell spec, which carries *Proprietary: Voltra*. Voltra agrees,
      but only for the certification window.

      **First idea (rejected).** Add CertLab's group to `ACME-Battery-Core`. That authorizes them for
      *every* Voltra-proprietary object, forever, and nobody would remember to remove it.

      **What Acme did.**
      1. Jordan created a `SUP-CertLab` group and gave it a narrow *Reviewer* role in E1. Policy grants
         that role Read on Released documents in Battery.
      2. Maya, a member of Acme's agreement managers group, created an **agreement** covering the label
         value *Proprietary: Voltra*, the participant `SUP-CertLab`, the objects EB-10025 and its test
         plan, and an end date 60 days out.
      3. The agreement went through its life cycle to its active state, with Voltra's contact signing off.

      **Outcome.** Certification passed in 41 days. On day 60 the agreement's end date passed and the
      lab lost access without anyone touching a rule or a group.
    takeaway: When access has a reason and an end date, use an agreement, not a group membership.

  - type: walkthrough
    title: Set a security label on an existing object
    who: A user with the Modify Security Labels permission on the object who is also authorized for the label
    where: ["<object> information page", Actions, Edit Security Labels]
    steps:
      - title: Open the object
        where: [Search, "EB-10025", "<information page>"]
        md: Open the cell spec's information page.
      - title: Edit the labels
        where: ["<information page>", Actions, Edit Security Labels]
        md: |
          Choose **Edit Security Labels** and pick the value, such as *Third-Party Proprietary → Voltra*.
          You only see the labels your site has configured.
      - title: Verify with a test user
        where: ["<information page>", Actions, Edit Access Control, View Access Information]
        md: Check an unauthorized test user on the Access Information page. It should show the security label denial.
    result: The object is fenced. Only authorized participants (or those covered by an active agreement) can reach it, and still only if rules grant them access.

  - type: walkthrough
    title: Create an agreement
    who: Members of an agreement managers group (only they see the Agreements page)
    where: ["E-Bike E1", Agreements, New Agreement]
    steps:
      - title: Open the Agreements page
        where: ["E-Bike E1", Agreements]
        md: |
          Agreement managers find an **Agreements** page in site, organization, product, library,
          project and program contexts. Where you create it sets its scope: a standard agreement covers
          its objects in that context and the contexts below it.
      - title: Start the wizard
        where: [Agreements, New Agreement]
        md: Click **New Agreement**. Give it a clear name, such as *CertLab cell spec certification*, and its start and end dates.
      - title: Choose what it authorizes
        where: [New Agreement, "Select Authorized Security Label Values"]
        md: "Pick the label values it covers, here *Proprietary: Voltra*."
      - title: Add participants and objects
        where: [New Agreement, "Select Authorized Participants", "Select Authorized Objects"]
        md: |
          Add `SUP-CertLab` as an authorized participant and add EB-10025 and its test plan as authorized
          objects. Later steps can limit it to objects in certain life cycle states, and you can attach the
          signed contract as an authorization document.
      - title: Make it active
        where: [Agreement, "<life cycle>"]
        md: The agreement is life-cycle managed. It only authorizes while it's in the right state and today falls between its start and end dates.
    result: Once active, CertLab is cleared for that label value on those objects until the end date. They still need a policy or ad hoc grant to read them.

  - type: callout
    variant: version-note
    versions: ["All releases", "Windchill+"]
    md: |
      Security labels are configured per site. Setting them up needs knowledge of the object model and
      edits to files on the Windchill server, so system administrators and developers usually do it, not
      business admins. Custom labels need further customization. Our sources don't describe how this
      set-up is handled on Windchill+, so check with PTC if you're on it.

  - type: callout
    variant: pitfall
    md: |
      **Labels sit on each object.** Labelling the EB-10030 controller part doesn't, by itself, give a
      label to its CAD model, drawing or firmware document. Set defaults with object initialization rules
      for the types and contexts involved, and review related objects together, or your fence has holes.

  - type: callout
    variant: pro-tip
    md: |
      Start with **few labels and few values**, such as one export-control label and one third-party
      proprietary label. Create one test user per clearance level and keep them. Every label value
      multiplies the test cases, and compliance teams prefer a model they can explain.

  - type: exercise
    title: Design label-based access for the E1 Fleet program
    environment: paper
    goal: |
      Acme wins a fleet contract. The E1 **Fleet** variant adds a GPS tracking module whose design is export
      controlled, and an external machining supplier, **Hexa Tooling**, makes its housing. Design the access model.
    steps:
      - "Decide which objects get the *Export Control* label value, and how you'll make sure CAD, drawings and documents get it too."
      - "Name the group authorized for that value. Who is in it, and who approves joining it?"
      - "Hexa needs the housing drawing (not the electronics) for 90 days. Label, agreement, policy, or a mix?"
      - "Write the policy rule Hexa still needs to actually read the drawing once cleared."
      - "List the test users you'll create to prove the model works."
    expected: |
      A good design labels the GPS module part, CAD and documents, using object initialization rule
      defaults. The housing drawing is labelled only if it really contains controlled data; if not, keep it
      unlabelled and use a domain rule. An `ACME-ExportCleared` group is authorized, with joining approved by
      compliance. If the housing drawing is labelled, Hexa gets an **agreement** for that drawing only, with
      a 90-day end date. A policy grant to Hexa's role (Read on Released CAD in its own folder domain) still
      supplies the actual permission. Test users: cleared employee, uncleared employee, Hexa with and without
      an active agreement.

  - type: quiz
    questions:
      - kind: truefalse
        prompt: If Kai is authorized for the label value "Proprietary - Voltra", he can read every object with that label.
        answer: false
        explanation: Authorization only gets him past the label. A policy or ad hoc rule must still grant Read.
      - kind: single
        prompt: CertLab needs one labelled document for 60 days. Best tool?
        options: [Add CertLab to the authorized group, An agreement with an end date, Remove the label for 60 days, An ad hoc Read grant]
        answer: 1
        explanation: An agreement is the exception mechanism for labels and stops authorizing after its end date. An ad hoc grant can't give access to someone a label denies.
      - kind: single
        prompt: Ana has a policy grant on all E1 documents but isn't authorized for the Export Controlled value on EB-10030's firmware spec. What can she do with it?
        options: [Read only, Read and Download, Nothing, Whatever the policy grants]
        answer: 2
        explanation: A security label denial is the highest rule in Windchill. Without authorization or an agreement, nothing else applies.

  - type: summary
    points:
      - A security label travels with the object and denies everyone not authorized for it, above every other rule.
      - Labels only restrict. Cleared users still need a policy or ad hoc grant.
      - Agreements are the only exception; they're life-cycle managed and limited by start and end dates.
      - Labels are configured per site by system admins; values are set per object, so default them for related objects together.
      - Keep the label model small and keep test users for each clearance level.
