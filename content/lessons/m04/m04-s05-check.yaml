    where: "Module 8: Identify domain and cabinet administrative objects; Describe the Windchill data, private and folder domain architecture; Identify components of a domain access control rule; Identify access control list resolution principles; Create user-specific rules; Inversely deny access to data; Absolutely deny access to data; Review access control priorities; Implement ad hoc access control; Troubleshoot access control issues; Describe security labeled objects; Define a notification policy; Define an indexing policy"
  - id: help-center
