    chapters:
      - title: Searching by name
        caption: Priya types "screw M6". Names depend on who typed them and when.
        show: [priya, names, messy]
        highlight: [messy]
        flow: [priya>names, names>messy]
      - title: The duplicate is born
        caption: Can't tell which hit is right? People create a new part - and the company pays to qualify, stock and buy one more screw.
        show: [priya, names, messy]
        highlight: [priya]
      - title: Searching by kind
        caption: Instead, Priya opens **Machine screws** and filters Thread = M6, Length = 20, Drive = hex.
        show: [priya, names, messy, tree, one]
        highlight: [tree, one]
        flow: [priya>tree, tree>one]
      - title: Reuse wins
        caption: One exact, released part. She adds it to the battery tray. Zero new part numbers.
        show: [priya, names, messy, tree, one, reuse]
        highlight: [reuse]
        flow: [one>reuse]

  - type: callout
    variant: why-it-matters
    md: |
      Each new part number has hidden costs: someone qualifies the supplier, purchasing negotiates a
      price, the warehouse stocks another bin, and service keeps a spare for years. Industry rules of
      thumb put that at hundreds to thousands per part over its life. Classification is the cheapest
      way to make **[[part-reuse|reuse]]** easier than reinventing.

  - type: comparison
    title: Part type or classification?
    columns: [Part type / subtype, Classification node]
    rows:
      - label: Answers
        cells: ["What business object is this, and which rules apply?", "What physical kind of thing is this?"]
      - label: Acme example
        cells: ["E-Bike Part (Battery Voltage, Motor Power, IP Rating)", "Machine screws (Thread, Length, Drive)"]
      - label: Drives
        cells: ["Numbering, life cycle, access, layouts", "Finding, comparing and reusing parts"]
      - label: How many
        cells: ["A handful of types", "Dozens to hundreds of nodes"]
      - label: Changes
        cells: ["Rarely - affects business rules", "Grows as the catalogue grows"]
    takeaway: Types decide how a part behaves. Classification decides how it's found. Don't build a type for every kind of screw.

  - type: example
    variant: case-study
    title: The 14 screws
    industry: Micromobility
    md: |
      When the E-bike division started, Jordan ran a quick report on the **Acme Standard Parts** library
      and both products: 14 parts described an M6 machine screw of some length - 5 of them were
      genuinely identical M6 × 20 hex screws with different names. Ana (manufacturing) confirmed the
      factory stocked four separate bins for them.

      **What Jordan did**
      1. Workshop with Priya, Ana and Kai: list the 30 part kinds Acme buys most.
      2. Drew a tree **three levels deep** (group → family → leaf) - nothing deeper for now.
      3. For each leaf, picked **3-6 attributes** people actually search on, with units and
         enumerated lists.
      4. Classified the top 300 library parts first, not all 9,000 parts.
      5. Marked the duplicates for replacement through the normal change process, keeping one.

      **Result.** In the E1's first quarter, 61% of fasteners and bearings in its structure were reused
      library parts, against 34% on the Scooter S2 at the same stage.
    takeaway: Start small - the parts you buy most, a shallow tree, a few searchable attributes - and grow it.

  - type: walkthrough
    title: Where the classification tree is maintained
    who: Business administrator (often with the site or organization administrator)
    where: ["Site or Organization", Utilities, Type and Attribute Management]
    steps:
      - title: Open Type and Attribute Management
        where: ["Organization", Utilities, Type and Attribute Management]
        md: |
          Classification structures are company-wide, so they live at organization (or site) level -
          not in a product. Open the context's **Utilities** page and choose **Type and Attribute
          Management**.
      - title: Find the classification structure
        where: [Type and Attribute Management, Classification]
        md: |
          Look for the classification area (named *Classification* or similar, depending on release).
          It shows the tree of classification nodes. Select a node to see its own and inherited
          attributes.
      - title: Add a node and its attributes
        where: [Classification, "<parent node>", New Node]
        md: |
          Create the node under the right parent, give it a clear name and description, set whether
          parts may be classified directly into it, then add its attributes - with units and
          constraints (lists, ranges).
    result: The new node appears in the tree, inherits its parent's attributes, and becomes available when users classify parts.

  - type: callout
    variant: version-note
    versions: ["All releases", "Windchill+"]
    md: |
      Classification is part of Windchill's PartsLink capability, which may need its own license and
      setup; menu names for the classification area differ between releases, and many companies load
      large trees from a spreadsheet using an import tool. On **Windchill+**, organization-level type
      and classification administration is usually available, but check site-level options with your
      provider. A later module covers PartsLink in depth.

  - type: callout
    variant: pitfall
    title: The tree that mirrors the org chart
    md: |
      Don't build nodes like "Kai's team parts" or "Supplier Voltra" or "Scooter S2 parts". Teams,
      suppliers and products change; what a part **is** doesn't. Also avoid trees 8 levels deep - users
      get lost and classify into the wrong leaf. Three or four levels is plenty for most companies.

  - type: callout
    variant: pro-tip
    md: |
      For every attribute you're tempted to add, ask: "Would someone **search** or **compare** on this?"
      If not, it belongs in a document or a description, not a classification attribute. Fewer,
      well-constrained attributes beat 25 optional free-text fields nobody fills in.

  - type: flashcards
    cards:
      - front: Classification
        back: Putting a part into a node of a shared tree of part kinds, so it gets standard attributes and becomes findable.
      - front: Classification structure
        back: The company-wide tree of classification nodes, general at the top and specific at the leaves.
      - front: Classification node
        back: One branch or leaf of the tree, such as Machine screws. Has its own and inherited attributes.
      - front: Inheritance in the tree
        back: An attribute defined on a node applies to every node below it.
      - front: Classification attribute
        back: A property for one kind of part (Thread size for screws), usually constrained by a list, range or unit.
      - front: Type vs classification
        back: Type decides rules (numbering, life cycle, access). Classification decides how a part is found and compared.
      - front: Why classify?
        back: To make reuse easy and stop duplicate parts, which cost money to qualify, buy, stock and service.
      - front: A good first tree
        back: Shallow (3-4 levels), based on what parts are, with 3-6 searchable attributes per leaf.

  - type: summary
    points:
      - Classification sorts parts by what they are, so they're found by properties, not by spelling.
      - The tree goes general → specific; attributes are inherited downward.
      - Types drive business rules; classification drives findability and reuse.
      - Start shallow with the parts you buy most and 3-6 searchable attributes per leaf.
