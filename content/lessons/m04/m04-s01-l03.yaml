id: m04-s01-l03
subtitle: Where people really come from - and which half of the job is yours.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, participants, ldap, directory-server, governance]
versionNotes:
  - versions: ["12.0+"]
    md: From Windchill 12.x the Windchill Directory Server is no longer bundled or installed with Windchill. Customers choose any LDAPv3-compliant directory server, and owning and maintaining it is the customer's responsibility.
sources:
  - id: ac
    where: "Module 2, Describe the participants architecture; Identify best practices for organizations, users, and groups; Create a user account; Delete a user account: methods (read-only directories, participant cache)"
  - id: ac
    where: "Module 1, Enterprise systems; Module 11, Identify LDAP requirements and optional features (enterprise directory servers); Module 19 and appendix notes on the Windchill Directory Server no longer being bundled from 12.x"
  - id: ac
    where: "Module 15, Clean the caches (Purge Participant Cache)"

blocks:
  - type: text
    md: |
      In the last lesson Nina "appeared" in Windchill. But where does a person *actually* live?

      Mostly not in Windchill. People are shared with other company systems - email, ERP, the HR tools - so
      the facts every system needs live in an **address book**: a [[directory-server]], read through the standard
      protocol [[ldap]]. Windchill keeps only what is special to Windchill, plus a pointer to the directory entry.

      As a business admin you don't configure the directory. You **do** need to know what lives where, what
      Windchill can and can't change there, and who to call when it breaks.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the address book of people and groups" → [[directory-server]]
      - "the language for reading that address book" → [[ldap]] (Windchill needs an *LDAPv3-compliant* server)
      - "the company-wide address book IT runs" → *enterprise / corporate directory* (often Microsoft Active Directory)
      - "Windchill's short-term memory of people" → *participant cache*

  - type: diagram
    title: What lives where
    caption: One person, split across two stores and a cache. Click each box.
    diagram:
      width: 820
      height: 380
      groups:
        - { label: Directory server (LDAP), x: 20, y: 20, w: 330, h: 340, tone: neutral }
        - { label: Windchill, x: 470, y: 20, w: 330, h: 340, tone: neutral }
      nodes:
        - id: apps
          label: Other company apps
          sublabel: email · ERP · HR
          x: 60
          y: 50
          w: 250
          tone: info
          detail: |
            Participants are usually **shared** with other enterprise applications. A corporate directory lets people keep
            one username and password across all of them - which is why the directory, not Windchill, is the master.
        - id: dir
          label: Directory entry
          sublabel: name · email · phone · org
          x: 60
          y: 160
          w: 250
          tone: primary
          shape: cylinder
          detail: |
            The shared facts: the participant's **name**, **phone number**, **email address**, **group membership** and
            **organization affiliation**. Every user should have a valid email here - without one, Windchill notifications
            fail and some tools can't find the user.
          real: Since Windchill 12.x no directory server ships with Windchill. The company picks any LDAPv3-compliant server, often Microsoft Active Directory, and owns it.
        - id: groups
          label: Groups
          sublabel: directory or database
          x: 60
          y: 270
          w: 250
          tone: accent
          detail: |
            Groups are stored either in a directory server or in the Windchill database. Which one is decided when
            Windchill is installed - so ask your system admin how *your* installation does it.
        - id: obj
          label: Participant object
          sublabel: access · teams · contexts
          x: 510
          y: 110
          w: 250
          tone: warning
          shape: cylinder
          detail: |
            Windchill-only facts live in the Windchill database: access control, the teams the participant belongs to, the
            contexts they work in - plus a **pointer** to the directory entry. One query brings back both halves.
        - id: cache
          label: Participant cache
          sublabel: for speed
          x: 510
          y: 250
          w: 250
          tone: success
          detail: |
            Windchill caches participants for performance. If a directory entry is changed by another tool, Windchill may not
            show the change straight away. Removing the user from the cache - or a site admin's **Purge Participant Cache**
            action in Participant Administration - fixes that.
      edges:
        - { from: apps, to: dir, label: shared }
        - { from: obj, to: dir, label: pointer, dashed: true }
        - { from: obj, to: cache }
        - { from: groups, to: obj, dashed: true }

  - type: callout
    variant: why-it-matters
    md: |
      When someone "can't sign in", the problem is usually on the directory side (IT). When someone "signs in but
      can't see the product", it's usually the Windchill side - groups, teams, access (Jordan). Knowing the split cuts
      the time a ticket bounces between teams from days to minutes.

  - type: comparison
    title: Who owns what
    columns: [Business admin (Jordan), System admin / IT (Rosa)]
    rows:
      - label: The directory server
        cells: [Uses it; reports problems, "Chooses, configures and maintains it - the customer owns it"]
      - label: People in a corporate directory
        cells: ["Checks organization, groups and license groups in Windchill", "Creates, changes and removes the entries"]
      - label: Groups and team roles
        cells: [Creates groups and maintains membership; fills roles, "Not usually involved"]
      - label: Disconnected participants
        cells: [Finds and reconnects or removes them, Explains what changed in the directory]
      - label: Directory reorganisation
        cells: [Gets notified and checks for disconnections, Plans it and tells the Windchill admins first]
    takeaway: "IT owns 'who exists and how they sign in'. The business admin owns 'what they can see and do in Windchill'."

  - type: comparison
    title: What Windchill can do, by directory access
    columns: [Read-only directory (e.g. Active Directory), Directory Windchill can write to]
    rows:
      - label: Does Windchill need it to run?
        cells: ["Yes - read access is enough to operate", Yes]
      - label: Create or edit people there from Windchill
        cells: [No - IT does it in the directory, Possible]
      - label: Delete options in Participant Administration
        cells: [Delete from Windchill only, "Delete from Windchill, or from Windchill and Directory Server"]
      - label: Where joiners and leavers start
        cells: [IT's directory process, "Can start in Windchill's Participant Administration"]
    takeaway: Ask Rosa which column your installation is in before promising anyone "I'll create that user".

  - type: example
    variant: real-world
    title: Voltra's engineers need logins
    industry: Micromobility
    md: |
      Voltra Cells' battery engineers must review cell specs for **EB-10021** (the E-Bike E1 battery pack). They are
      not Acme employees, and Acme's corporate directory is read-only for Windchill.

      Rosa and IT agree where Voltra's entries will live and who removes them when the contract ends. Once the entries
      exist, Jordan makes sure each Voltra user has **Voltra Cells** as their organization and a valid email, adds them
      to `SUP-Voltra` and to the right license group, and puts `SUP-Voltra` in the e-bike team's supplier role.
    takeaway: For every kind of user, write down who creates the entry, who gives Windchill access, and who removes both.

  - type: callout
    variant: pitfall
    md: |
      **Two classic mistakes.** (1) Users with no email address: notifications to them silently fail and some tools
      can't find them. (2) "Fixing" a sign-in problem by creating a second user such as `nina.ortiz2`: now there are two
      Ninas and her work is split between them. Find out from IT why the real account fails.

  - type: callout
    variant: pro-tip
    md: |
      **Agree the split in writing.** One page: who creates users, who removes leavers, where groups are stored, who
      manages license groups, and the rule "directory changes are announced to Windchill admins". It's the cheapest
      governance you'll ever do.

  - type: quiz
    questions:
      - kind: single
        prompt: Kai can sign in but can't see the E-Bike E1 product. Whose half of the picture is this most likely in?
        options: [IT - the corporate directory, The business admin - groups, teams and access, The database administrator, The CAD administrator]
        answer: 1
        explanation: Signing in works, so the directory side is fine. Visibility of a product comes from teams and access - Jordan's area.
      - kind: multi
        prompt: Which facts about a participant are typically stored in the directory server rather than the Windchill database? (Choose all that apply.)
        options: [Email address, Phone number, Organization affiliation, The teams the user belongs to in Windchill]
        answers: [0, 1, 2]
        explanation: Shared facts such as name, phone, email, group membership and organization live in the directory. Windchill-only facts such as team membership and access control live in the Windchill database.
      - kind: truefalse
        prompt: IT changed Priya's phone number with a third-party tool, but Windchill still shows the old one. Purging the participant cache can fix this.
        answer: true
        explanation: Windchill caches participants for performance, so outside changes may not show at once. Removing the user from the cache, or purging the participant cache, refreshes it.

  - type: flashcards
    title: Directory deck
    cards:
      - front: LDAP
        back: "The standard protocol for directory entries. Windchill needs an LDAPv3-compliant directory server."
      - front: What lives in the directory?
        back: "Shared facts: name, phone, email, group membership, organization affiliation."
      - front: What lives in the Windchill database?
        back: "Windchill-only facts (access control, teams, contexts) plus a pointer to the directory entry."
      - front: Where are groups stored?
        back: "In a directory server or the Windchill database - decided at installation."
      - front: Read-only directory
        back: "Windchill can run with it, but can't create, edit or delete people there. Typical for Active Directory."
      - front: Windchill Directory Server since 12.x
        back: "No longer bundled. The customer picks and owns an LDAPv3 directory."
      - front: Participant cache
        back: "Windchill's in-memory copy of participants. Purge it when outside directory changes don't show."
      - front: "\"Can't sign in\" vs \"can't see it\""
        back: "Sign-in problems: usually IT. Visibility problems: usually the business admin."

  - type: summary
    points:
      - Shared participant facts live in an LDAPv3 directory; Windchill keeps its own facts plus a pointer.
      - Corporate directories are often read-only for Windchill, which limits what you can create or delete from Windchill.
      - Groups live in the directory or the Windchill database, depending on the installation; participants are cached.
      - "IT owns who exists and how they sign in; the business admin owns what they can see and do. Write the split down."
