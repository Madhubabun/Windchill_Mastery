id: m04-s07-l03
subtitle: Hundreds of switches, four levels, one padlock. Know which level wins and you'll never hear "but I changed it!" again.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, preferences, preference-management, locking]

blocks:
  - type: text
    md: |
      Windchill has hundreds of **preferences**: switches that change behaviour, from how tables
      display to which change process steps are allowed. The interesting part isn't any single
      switch. It's **where** you flip it.

      Maya (change manager) has a rule for Acme: every change notice must start from a change request -
      no shortcuts. There is a change management preference that allows a [[change-notice]] without a
      [[change-request]]. Kai, in E-Bike E1, would love that shortcut "just for the pilot".

      Who wins? It depends on the level each of them sets it at - and on one little padlock.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a switch that changes behaviour" → [[preference]]
      - "the screen where admins flip them" → *Preference Management* (on each context's Utilities page)
      - "the padlock that stops lower levels changing it" → [[preference-lock]]
      - "the value that really applies here" → the *effective* value
      - "remove my override and inherit again" → delete or reset the preference at that level

  - type: diagram
    title: Four levels - closest wins, unless locked
    caption: Values flow down. A lower level overrides a higher one - until someone above locks it. Click each level.
    diagram:
      width: 820
      height: 420
      nodes:
        - id: site
          label: Site
          sublabel: "Yes · default"
          x: 300
          y: 20
          w: 220
          tone: neutral
          detail: The value for the whole server. Usually left at the shipped default or set by Rosa. On Windchill+ many site values are managed by PTC.
        - id: org
          label: Acme Mobility
          sublabel: "No · locked by Maya's request"
          x: 300
          y: 120
          w: 220
          tone: primary
          detail: |
            Jordan sets **No** here and **locks** it. Every product and library in Acme now gets No,
            and their admins can't override it.
          real: Lock the few settings that are company policy. Leave the rest open so products can adapt.
        - id: e1
          label: E-Bike E1
          sublabel: "tried Yes · ignored"
          x: 130
          y: 230
          w: 220
          tone: warning
          detail: Kai's product admin tried to set Yes. Because the organization value is locked, the product value cannot take effect.
        - id: s2
          label: Scooter S2
          sublabel: inherits No
          x: 470
          y: 230
          w: 220
          tone: accent
          detail: No value set here, so it simply inherits from Acme Mobility.
        - id: user
          label: User level
          sublabel: only some preferences
          x: 300
          y: 340
          w: 220
          tone: info
          detail: |
            Some preferences (mostly display things like table sizes or default views) can also be set
            by each user for themselves. Policy-type preferences like this one usually can't.
      edges:
        - { from: site, to: org, label: inherits }
        - { from: org, to: e1, label: locked }
        - { from: org, to: s2, label: inherits }
        - { from: e1, to: user, dashed: true }
        - { from: s2, to: user, dashed: true }

  - type: callout
    variant: why-it-matters
    md: |
      Preferences are where company policy quietly lives. If Maya's rule is only a slide in a
      training deck, someone in a hurry will skip it. As a locked preference, the shortcut simply
      isn't offered - and nobody needs to remember the rule.

  - type: walkthrough
    title: Set and lock a preference for all of Acme
    who: An organization administrator
    where: [Organization, "Acme Mobility", Utilities, Preference Management]
    steps:
      - title: Open Preference Management at the right level
        where: [Organization, "Acme Mobility", Utilities, Preference Management]
        md: |
          The level you open it from is the level you change. For a company policy, that's the
          **organization**. For one product only, open it from that product's Utilities.
      - title: Find the preference
        where: [Preference Management, Change Management]
        md: |
          Preferences are grouped in categories. Expand **Change Management** (or search by name) and
          find the preference that allows a change notice without a change request. Read its description
          to confirm what it does.
      - title: Set the value
        where: [Preference Management, "<preference>", Set Preference]
        md: Choose the set or edit action and pick **No**. The table now shows the value at this level.
      - title: Lock it
        where: [Preference Management, "<preference>", Lock]
        md: |
          Use the **Lock** action. A lock icon appears. From now on, products, libraries and projects in
          Acme Mobility cannot override it.
      - title: Check the effect lower down
        where: [Products, "E-Bike E1", Utilities, Preference Management]
        md: |
          Open the same preference in E-Bike E1. It shows the inherited **No** and cannot be changed
          there. Then create a test change notice to confirm the shortcut is gone.
    result: Every context in Acme Mobility now uses No, and only an organization (or site) admin can unlock it.

  - type: callout
    variant: version-note
    versions: ["All releases", "Windchill+"]
    md: |
      Category names, the exact name of each preference and which levels a preference can be set at
      vary by release - always read the preference's description in Preference Management. Users reach
      their own preferences from their user menu (often called Preferences or My Settings). On
      Windchill+, many site-level preferences are managed by PTC.

  - type: simulation
    title: Who wins? Play the levels
    intro: |
      The preference: *allow a change notice without a change request*. The site says **Yes**. Play
      Jordan (organization), Kai's product admin (E-Bike E1) and the padlock - and watch the effective
      value in E-Bike E1.
    headline: "Effective in E-Bike E1: {effective}"
    initial: { site: "Yes", organization: not set, eBikeE1: not set, locked: false, effective: "Yes (site default)" }
    actions:
      - id: set-org
        label: "Jordan: set No at Acme Mobility"
        when: { organization: not set }
        do: [{ set: { organization: "No", effective: "No (from Acme Mobility)" } }]
        log: Acme Mobility now says No. E-Bike E1 has no value of its own, so it inherits No.
        blockedHint: The organization value is already set. Use Start over to replay.
      - id: set-product
        label: "E-Bike E1 admin: set Yes for the pilot"
        when: { organization: "No", locked: false, eBikeE1: not set }
        do: [{ set: { eBikeE1: "Yes", effective: "Yes (E-Bike E1 overrides)" } }]
        log: E-Bike E1 overrides with Yes. Closest level wins - for now.
        blockedHint: Set the organization value first. If it's locked, E-Bike E1 can't override it.
      - id: lock
        label: "Jordan: lock it at Acme Mobility"
        when: { organization: "No", locked: false, eBikeE1: "Yes" }
        do: [{ set: { locked: true, eBikeE1: "Yes (ignored)", effective: "No (locked at Acme Mobility)" } }]
        log: Padlock on. E-Bike E1's Yes is ignored - every Acme context now gets No.
        blockedHint: Let E-Bike E1 override first, so you can see what the lock does to it.
      - id: unlock
        label: "Jordan: unlock"
        when: { locked: true }
        do: [{ set: { locked: false, eBikeE1: "Yes", effective: "Yes (E-Bike E1 overrides)" } }]
        log: Unlocked. E-Bike E1's own value applies again - unlocking brings old overrides back to life.
        blockedHint: Nothing is locked.
      - id: clear-product
        label: "E-Bike E1 admin: delete the override"
        when: { eBikeE1: "Yes", locked: false }
        do: [{ set: { eBikeE1: not set, effective: "No (from Acme Mobility)" } }]
        log: Override removed. E-Bike E1 inherits No from Acme Mobility again.
        blockedHint: There is no active product override to delete.
      - id: reset
        label: Start over
        do: [{ set: { organization: not set, eBikeE1: not set, locked: false, effective: "Yes (site default)" } }]
        log: Back to the site default.
    goals:
      - label: See a product override beat the organization
        when: { effective: "Yes (E-Bike E1 overrides)" }
        message: Without a lock, the level closest to the work wins.
      - label: Lock the policy so the override is ignored
        when: { locked: true }
        message: A lock makes the higher value apply everywhere below it.
      - label: Unlock and notice the old override comes back
        when: { locked: false, eBikeE1: "Yes", organization: "No" }
        message: Before unlocking, check for old overrides lower down - or delete them first.

  - type: scenario
    variant: what-if
    title: What if "I changed it, but nothing changed"?
    start: s1
    nodes:
      - id: s1
        md: |
          Kai's product admin sets a display preference in E-Bike E1 so tables show 100 rows. Priya
          says her tables still show 25. What's the most likely reason?
        choices:
          - label: "Priya has set her own user-level value"
            next: s2
            good: true
            feedback: "Yes - a user value is closer to the work than the product value."
          - label: "Preferences need a server restart"
            next: s1-restart
            feedback: "Most preference changes apply without a restart."
      - id: s1-restart
        md: |
          Rosa checks: no restart needed. Priya opens her own preferences and finds she set 25 rows
          months ago. What's the lesson?
        choices:
          - label: "Check lower levels - user values win over context values"
            next: s2
            good: true
      - id: s2
        md: |
          Next, Kai's admin tries to set a preference in E-Bike E1, but the edit action is not
          available. Everything else in Preference Management works. What's going on?
        choices:
          - label: "It is locked at the organization or site"
            next: s3
            good: true
            feedback: "The lock icon gives it away."
          - label: "The admin lacks rights to the whole product"
            next: s2-rights
            feedback: "Then the other preferences wouldn't be editable either."
      - id: s2-rights
        md: |
          Other preferences are editable, so the rights are fine. Look for the lock icon on this one.
        choices:
          - label: "It's locked higher up"
            next: s3
            good: true
      - id: s3
        md: |
          Kai asks Jordan to unlock the change notice preference "for one week" for the pilot. What does
          Jordan do?
        choices:
          - label: "Say no to unlocking org-wide. Discuss a proper exception with Maya instead"
            next: win
            good: true
            feedback: "An org-wide unlock affects every product, and old overrides wake up."
          - label: "Unlock it at Acme Mobility for a week"
            next: partial
            feedback: "Let's see who else notices."
      - id: win
        md: |
          Maya agrees to a lighter change request template for the pilot instead. The policy stays
          locked, and nothing changes for Scooter S2.
        outcome: success
      - id: partial
        md: |
          During that week, an old override in Scooter S2 springs back to life and two scooter change
          notices skip the request. Jordan re-locks it and cleans up. Unlocking is never just local.
        outcome: partial

  - type: example
    variant: real-world
    title: The preference set at the wrong level
    industry: Micromobility
    md: |
      A new admin at a company like Acme changed a part-structure display preference at **site**
      level to fix one product's complaint. It changed the default for every organization on the server,
      including a separate business unit with its own training material. The fix was a product-level
      value - and a rule: start at the lowest level that solves the problem.
    takeaway: Set preferences at the lowest level that solves the problem. Lock only real policy.

  - type: callout
    variant: pitfall
    md: |
      **Locking everything "to be safe".** Every lock is a support ticket waiting to happen when a
      product has a legitimate need. Lock policy (change rules, numbering, security-related switches).
      Leave convenience settings open.

  - type: callout
    variant: pro-tip
    md: |
      Keep a short **preference register**: name, level, value, locked or not, why, who asked and when.
      When something behaves oddly after an upgrade, the register tells you in minutes which settings
      Acme changed on purpose.

  - type: quiz
    questions:
      - kind: single
        prompt: The site says Yes, Acme Mobility says No (not locked), E-Bike E1 says Yes. What applies in E-Bike E1?
        options: ["Yes - the product's value", "No - the organization's value", "Yes - the site default"]
        answer: 0
        explanation: Without a lock, the level closest to the work wins. E-Bike E1's own value applies.
      - kind: single
        prompt: Same values, but Jordan locks the organization's No. What applies in E-Bike E1 now?
        options: ["Yes - the product's value", "No - the locked organization value", "It depends on the user"]
        answer: 1
        explanation: A lock makes the higher value apply to every level below it. The product's Yes is ignored.
      - kind: truefalse
        prompt: Unlocking a preference can make old lower-level overrides take effect again.
        answer: true
        explanation: Overrides set before the lock may still be stored. Check for them, or delete them, before you unlock.
      - kind: multi
        prompt: Which belong to good preference practice at Acme? (Choose all that apply.)
        options:
          - Set at the lowest level that solves the problem
          - Lock real company policy
          - Lock every preference at site level
          - Keep a register of changed preferences
        answers: [0, 1, 3]
        explanation: Low level by default, locks for policy only, and a register. Locking everything creates endless exceptions.

  - type: summary
    points:
      - Preferences live at site, organization, context and sometimes user level.
      - The closest level wins - unless a higher level has locked the preference.
      - Set at the lowest level that solves the problem. Lock only real policy.
      - Unlocking can wake up old overrides. Check lower levels first.
      - Keep a preference register so upgrades and audits are painless.
