blocks:
  - type: text
    md: |
      A tree is only useful if parts are **in** it. This lesson does both halves:

      1. **Classify** a part - Kai creates EB-10130, a new 48 V pack from Voltra Cells, and puts it
         into the *Li-ion packs* node with its attribute values.
      2. **Find** a part by classification - Priya, designing a cargo variant, looks for an existing
         36 V pack before asking Voltra for a new one.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "put a part in a node of the tree" → *classify* ([[classification]])
      - "the node's properties you fill in" → [[classification-attribute|classification attributes]]
      - "browse the tree, then narrow by values" → [[classification-search]], done in the *Classification Explorer*
      - "show me parts like this one, but a bit different" → *Find Similar Objects*
      - "use what exists instead of making a new one" → [[part-reuse]]

  - type: animation
    title: Classify once, found forever
    diagram:
      width: 820
      height: 300
      nodes:
        - { id: part, label: EB-10021, sublabel: Battery pack 36V, x: 20, y: 110, w: 150, tone: primary, shape: doc }
        - { id: node, label: Li-ion packs, sublabel: classification node, x: 230, y: 110, w: 170, tone: success }
        - { id: attrs, label: Attributes filled, sublabel: "36 V · 14 Ah · NMC", x: 460, y: 30, w: 170, tone: accent }
        - { id: index, label: Searchable, sublabel: by node + values, x: 460, y: 190, w: 170, tone: info, shape: cylinder }
        - { id: priya, label: Priya finds it, sublabel: cargo variant, x: 680, y: 110, w: 130, tone: accent, shape: pill }
      edges:
        - { from: part, to: node, label: classify }
        - { from: node, to: attrs, label: inherits fields }
        - { from: attrs, to: index }
        - { from: index, to: priya, label: filter match }
    chapters:
      - title: Pick the node
        caption: When EB-10021 was created, it was classified into **Electrical → Battery packs → Li-ion packs** - an end node, not a grouping node.
        show: [part, node]
        highlight: [node]
        flow: [part>node]
      - title: Fill the attributes
        caption: The node brings its own and inherited fields - Nominal voltage, Capacity, Chemistry. Values come from lists, with units.
        show: [part, node, attrs]
        highlight: [attrs]
        flow: [node>attrs]
      - title: Now it's findable
        caption: The part can now be matched by node **and** by each value - no guessing names. (PartsLink relies on Windchill's search index for this.)
        show: [part, node, attrs, index]
        highlight: [index]
        flow: [attrs>index]
      - title: Months later...
        caption: Priya narrows Li-ion packs to 36 V and at least 14 Ah. EB-10021 comes up. Reused - not re-bought.
        show: [part, node, attrs, index, priya]
        highlight: [priya]
        flow: [index>priya]

  - type: callout
    variant: why-it-matters
    md: |
      Classification only pays off when two people do their part: whoever **creates** the part classifies
      it properly, and whoever **needs** a part searches the tree before creating one. PTC's own
      implementation advice is blunt: every object that should be classified must be classified **when
      it is created**. Business admins make that easy - clear node names, short attribute lists, and the
      important attributes set as *Required*.

  - type: walkthrough
    title: Create and classify a new part
    who: Part creator with create rights in the library or product (Kai)
    where: ["<library or product>", Folders, New Part]
    steps:
      - title: Start a new part
        where: [Acme Standard Parts, Folders, "<folder>", New Part]
        md: |
          Open the folder where the part belongs and click **New Part**. Choose the type and fill in the
          usual fields - number EB-10130, name, and so on.
      - title: Choose the classification node
        where: [New Part, Part Classification, Find]
        md: |
          Next to the **Part Classification** field, click the find icon. In the classification tree,
          open *Electrical → Battery packs* and select **Li-ion packs**. Only nodes set as instantiable
          can be chosen.
      - title: Fill the classification attributes
        where: [New Part, Next, Set Classification Attributes]
        md: |
          Choosing a node adds a **Set Classification Attributes** step. Enter Nominal voltage **48 V**,
          Capacity **12 Ah**, Chemistry **NMC**. Attributes marked *Required* must have a value.
      - title: Finish
        where: [New Part, Finish]
        md: Click **Finish**. The part's information page shows its classification and the values.
    result: EB-10130 is classified in Li-ion packs and can be found by classification search - on Li-ion packs, and on Battery packs above it.

  - type: callout
    variant: note
    title: What about parts that already exist?
    md: |
      PTC's documentation describes classifying many existing parts in bulk: export them with **Export
      Importable Spreadsheet**, fill in the classification, and bring the changes back with **Import from
      Spreadsheet**. The sources used for this course don't spell out the single-part action for
      reclassifying an existing part, so check your system's part Actions menu rather than guessing.

  - type: walkthrough
    title: Find a reusable part by classification
    who: Any user who can read the parts (Priya)
    where: [Navigator, Search, Classification Explorer]
    steps:
      - title: Open the Classification Explorer
        where: [Navigator, Search, Classification Explorer]
        md: |
          In the **Classification** drop-down, make sure the part classification structure is shown.
          Each node shows the number of objects under it in brackets - a quick sense of where the parts are.
      - title: Walk the tree
        where: [Classification Explorer, Electrical, Battery packs]
        md: |
          Open nodes from general to specific. Stop at *Battery packs* if you'd also accept other
          chemistries; go down to *Li-ion packs* if you wouldn't.
      - title: Narrow by attributes
        where: [Search Results, Refine Results]
        md: |
          When search facets are enabled, the **Refine Results** pane lets you filter by attribute values,
          including a minimum and maximum for numbers. Set Nominal voltage = 36 V and Capacity from 14 Ah
          upwards.
      - title: Check before you reuse
        where: [Results, "<part>", Information page]
        md: |
          Prefer **Released** parts. Check [[where-used]] to see who already relies on it, and the
          context - a part in the **Acme Standard Parts** library is meant for reuse. If it's close but
          not quite right, use **Find Similar Objects** from its Actions menu to look for siblings in the
          same node with different values.
      - title: Reuse it
        where: [Your structure, "<insert existing part>"]
        md: Add the found part to your structure instead of creating a new one.
    result: Priya reuses EB-10021 in the cargo variant. No new part number, no new supplier qualification.

  - type: callout
    variant: version-note
    versions: ["All releases"]
    md: |
      You can also search by classification from **advanced search**: pick a node in the Classification
      section (the search then covers that node **and its child nodes**) and add classification
      attributes as criteria. Those searches can be saved. The Refine Results pane and Find Similar
      Objects depend on configuration - search facets need Windchill index search (Solr) and the
      *Enable Search Facets* preference, and text attributes only appear as facets when they have a
      list of allowed values.

  - type: simulation
    title: Priya's battery hunt
    intro: |
      Priya needs a **36 V Li-ion pack with at least 14 Ah** for the cargo variant. Find a part she can
      reuse in the Classification Explorer. Try a wrong branch or the "create new" shortcut too, just to
      see what happens.
    headline: "Node: {node} · filters: {filters} · results: {results} · picked: {picked}"
    initial:
      node: Acme Parts
      filters: none
      results: "9,000+"
      picked: none
    actions:
      - id: open-elec
        label: Open Electrical
        when: { node: Acme Parts }
        do: [{ set: { node: Electrical, results: "1,140" } }]
        log: Electrical holds batteries, motors, connectors and harnesses.
        blockedHint: Go back to the top of the tree first.
      - id: open-mech
        label: Open Mechanical
        when: { node: Acme Parts }
        do: [{ set: { node: Mechanical, results: "6,300" } }]
        log: Screws, nuts, bearings, frames... no batteries here. Wrong branch.
        blockedHint: Go back to the top of the tree first.
      - id: open-batt
        label: Open Battery packs
        when: { node: Electrical }
        do: [{ set: { node: Battery packs, results: "38" } }]
        log: 38 battery packs across all chemistries, including the Li-ion packs below.
        blockedHint: Battery packs is under Electrical.
      - id: open-lion
        label: Open Li-ion packs
        when: { node: Battery packs, filters: none }
        do: [{ set: { node: Li-ion packs, results: "31" } }]
        log: 31 Li-ion packs.
        blockedHint: Li-ion packs is under Battery packs (clear filters before moving down).
      - id: filter-volt
        label: "Refine: Nominal voltage = 36 V"
        when: { node: [Battery packs, Li-ion packs], filters: none }
        do: [{ set: { filters: "36 V", results: "6" } }]
        log: 6 packs at 36 V.
        blockedHint: Open Battery packs or Li-ion packs - only those nodes have a voltage attribute.
      - id: filter-ah
        label: "Refine: Capacity min 14 Ah"
        when: { filters: "36 V" }
        do: [{ set: { filters: "36 V and ≥ 14 Ah", results: "2" } }]
        log: "2 results: EB-10021 (Released, Voltra Cells) and EB-10088 (In Work prototype)."
        blockedHint: Filter by voltage first.
      - id: clear
        label: Clear filters
        when: { filters: ["36 V", "36 V and ≥ 14 Ah"] }
        do: [{ set: { filters: none, results: "unfiltered", picked: none } }]
        log: Filters cleared.
        blockedHint: No filters to clear.
      - id: pick-proto
        label: Pick EB-10088 (In Work)
        when: { filters: "36 V and ≥ 14 Ah", picked: none }
        do: [{ set: { picked: "EB-10088 (In Work)" } }]
        log: "Careful: EB-10088 is an unreleased prototype. It may change or never be released. Is there a released one?"
        blockedHint: Filter down to the 2 results first (or you already picked one - clear filters to start again).
      - id: pick-released
        label: Pick EB-10021 (Released)
        when: { filters: "36 V and ≥ 14 Ah", picked: [none, "EB-10088 (In Work)"] }
        do: [{ set: { picked: "EB-10021 (Released)" } }]
        log: Released, from Voltra Cells, already used in E-Bike E1. Priya adds it to the cargo variant.
        blockedHint: Filter down to the 2 results first.
      - id: create-new
        label: Give up and create a new part
        when: { picked: none }
        do: [{ set: { picked: "new duplicate part" } }]
        log: "A new pack number means a new supplier quote, qualification and stock bin - and EB-10021 already fits. Go back and search."
        blockedHint: You already picked something - go back to the top to start again.
      - id: top
        label: Back to the top of the tree
        when: { node: [Electrical, Mechanical, Battery packs, Li-ion packs] }
        do: [{ set: { node: Acme Parts, filters: none, results: "9,000+", picked: none } }]
        log: Back at Acme Parts.
        blockedHint: You're already at the top.
    goals:
      - label: Reuse a released 36 V, 14 Ah pack
        when: { picked: "EB-10021 (Released)" }
        message: Node + attribute filters + a released state = a safe reuse.
      - label: Spot the risky pick
        when: { picked: "EB-10088 (In Work)" }
        message: Matching values aren't enough. Check the state before you reuse.

  - type: example
    variant: real-world
    title: The pack that wasn't in the tree
    industry: Micromobility
    md: |
      Sam (field service) needed a replacement pack for an early E1 prototype and couldn't find it by
      filtering on capacity - because the engineer who created it had classified it without entering
      Capacity, and a part with no value can't match a capacity filter. Jordan added the **Required**
      constraint to Capacity on that node. From then on, every new pack had it.
    takeaway: An empty attribute is invisible to a filtered search. Make the important ones required.

  - type: callout
    variant: pitfall
    title: The same fact in two places
    md: |
      The *E-Bike Part* subtype already has a **Battery Voltage** attribute, and the Li-ion packs node
      has **Nominal voltage**. If people fill one and not the other, searches disagree. PTC's guidance is
      to use attributes that are unique to classification and not put the same attribute on both a
      classification node and an object type. Decide which one is the master for searching and document it.

  - type: callout
    variant: pro-tip
    md: |
      When you search, start one level **higher** than you think (e.g. *Battery packs*, not *Li-ion
      packs*) and let the attribute filters do the narrowing. You'll catch parts someone classified into
      a sibling node by mistake.

  - type: quiz
    questions:
      - kind: single
        prompt: Kai classifies the new pack EB-10130. Which node should he pick?
        options: [Electrical, Battery packs, Li-ion packs, Acme Parts]
        answer: 2
        explanation: Classify into the most specific instantiable node that fits. It inherits all the attributes above, and grouping nodes usually can't be picked at all.
      - kind: truefalse
        prompt: In advanced search, choosing the Battery packs node as classification criteria also finds parts classified in Li-ion packs.
        answer: true
        explanation: Picking a node covers that node and its child nodes. That's why starting one level higher is a useful trick.
      - kind: single
        prompt: Priya's filtered search returns two matching packs - one Released, one In Work. Which should she reuse?
        options: [The In Work one - it's newer, The Released one, Either - they match the same values, Neither - create a new part]
        answer: 1
        explanation: Released parts are approved and stable. An In Work prototype can still change or be dropped.
      - kind: single
        prompt: Priya found a pack that's almost right but too heavy. Which action looks for parts in the same node with different values?
        options: [Find Similar Objects, Insert Node, Export Importable Spreadsheet, New Part]
        answer: 0
        explanation: Find Similar Objects searches the same classification node, starting from the selected part's values, which you then adjust.
      - kind: order
        prompt: Order Priya's reuse steps.
        items: [Open the Classification Explorer, Walk to the right node, Refine by attribute values, Check state and where-used, Add the part to her structure]
        explanation: Tree first, filters second, sanity checks third - then reuse.

  - type: summary
    points:
      - Classify when you create - pick an instantiable node in the Part Classification field, then fill the Set Classification Attributes step.
      - Existing parts can be classified in bulk through spreadsheet export and import.
      - Search in the Classification Explorer (tree + Refine Results), in advanced search (node includes child nodes), or with Find Similar Objects.
      - Prefer released parts, check where-used, and make key attributes required.
