id: m04-s09-l02
subtitle: Put a part in the tree once, fill in four values - and it can be found and reused for years.
version: 1.0.0
updated: "2026-10-05"
tags: [classification, search, reuse, parts]
sources:
  - id: pl
    where: "PartsLink capabilities; Running a classification search; Faceted search results; Classification search and advanced search; Find Similar Objects; Classification structure; Classification attributes; Implementation strategy"
  - id: ac
