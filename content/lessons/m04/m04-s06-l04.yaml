id: m04-s06-l04
subtitle: Number, folder, life cycle, team - filled in before the user even sees the form. Here's the rule behind the magic, and how to fix it when the magic stops.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, oir, object-initialization-rules, defaults, numbering]
sources:
  - id: ac
    where: "Module 7: Describe object initialization rules (OIRs); Manage OIRs; Describe the format of an OIR; Identify components of an OIR; Identify best practices for creating OIRs; Activity: Create an object initialization rule (OIR) for requirements documents; Activity: Create an object to test the attributes applied by its OIR. Module 5: Describe object life cycle resolution"
