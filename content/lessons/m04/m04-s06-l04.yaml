id: m04-s06-l04
subtitle: Number, folder, life cycle, team - filled in before the user even sees the form. Here's the rule behind the magic, and how to fix it when the magic stops.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, oir, object-initialization-rules, defaults, numbering]

blocks:
  - type: text
    md: |
      Picture Priya creating her tenth E-Bike Part of the day. Without help she would have to type a
      number (which one is free?), pick a folder, choose the right life cycle and the right team.
      Ten parts, forty chances to get something wrong.

      With an **object initialization rule** (OIR), she picks the type **E-Bike Part**, types a name
      and a voltage, and clicks Finish. Windchill fills in the rest:

      | Field | Filled with |
      | --- | --- |
      | Number | `EB-10050` - next value from the e-bike sequence |
      | Folder | `/Default/E-Bike Parts` |
      | Life cycle | `E-Bike Part Life Cycle` (lesson 1) |
      | Team template | the E-Bike part team template |

      You've built the life cycle and the workflow. The OIR is the glue that hands them to every new
      object - automatically and identically.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the auto-fill rule for a type in a context" → [[object-initialization-rule]] (OIR)
      - "where the next number comes from" → number generator + database sequence (see [[numbering-scheme]])
      - "the default home of new objects" → default [[folder]]
      - "which map of states it follows" → the [[life-cycle]] template

  - type: animation
    title: What happens when Priya clicks New Part
    diagram:
      width: 840
      height: 380
      groups:
        - { label: Where Windchill looks for a rule, x: 300, y: 10, w: 250, h: 360, tone: neutral }
      nodes:
        - { id: priya, label: Priya, sublabel: New Part in E-Bike E1, x: 20, y: 160, w: 180, tone: accent, shape: pill }
        - { id: prod, label: E-Bike E1, sublabel: product rules, x: 330, y: 40, w: 190, tone: primary }
        - { id: org, label: Acme Mobility, sublabel: organization rules, x: 330, y: 160, w: 190, tone: info }
        - { id: site, label: Site, sublabel: out-of-the-box rules, x: 330, y: 280, w: 190, tone: neutral }
        - { id: form, label: Create form, sublabel: pre-filled, x: 620, y: 100, w: 190, tone: success, shape: doc }
        - { id: part, label: EB-10050, sublabel: In Work · /Default/E-Bike Parts, x: 620, y: 240, w: 190, tone: success, shape: doc }
      edges:
        - { from: priya, to: prod, label: type E-Bike Part }
        - { from: prod, to: org, label: "none here?", dashed: true }
        - { from: org, to: site, label: "none here?", dashed: true }
        - { from: prod, to: form, label: rule found }
        - { from: form, to: part, label: Finish }
    chapters:
      - title: Priya picks a type
        caption: Priya is inside **E-Bike E1** and chooses the type **E-Bike Part**. The context and the type are the two keys of the lookup.
        show: [priya, prod, org, site]
        highlight: [priya]
        flow: [priya>prod]
      - title: Nearest context first
        caption: Windchill looks for a rule for that type in the **current context**. Jordan put the E-Bike Part rule in E-Bike E1, so it is found right here.
        show: [priya, prod, org, site]
        highlight: [prod]
      - title: Otherwise, go up
        caption: If the product had no rule, Windchill would try the **organization**, then the **site**. A rule in a lower context overrides one higher up.
        show: [priya, prod, org, site]
        highlight: [org, site]
        flow: [prod>org, org>site]
      - title: The form arrives pre-filled
        caption: Number, folder, life cycle and team come from the rule. Fields the rule marks as server-assigned are not editable.
        show: [priya, prod, org, site, form]
        highlight: [form]
        flow: [prod>form]
      - title: The part is created
        caption: "On Finish the sequence hands out the next value: **EB-10050**, In Work, in `/Default/E-Bike Parts`."
        highlight: [part]
        flow: [form>part]
        seconds: 7

