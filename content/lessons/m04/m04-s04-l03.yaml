id: m04-s04-l03
subtitle: Pick-lists that never drift, and fields that fill themselves in.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, attributes, enumeration, calculated-attribute]

blocks:
  - type: text
    md: |
      Look at what people typed for **IP Rating** during the pilot, before there was a list:

      > IP65 · ip65 · IP-65 · IP 65 · 65 · "splash proof" · IP56 (typo)

      Seven spellings of two facts. A report on "how many IP65 parts?" is now a guessing game.

      Two tools fix this kind of mess:
      - An **enumeration** - a managed pick-list. Users choose IP54, IP65 or IP67. Nothing else.
      - A **calculated attribute** - a field Windchill fills in from other fields, like a
        spreadsheet formula. Nobody can type it wrong because nobody types it.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a managed pick-list" → *[[enumeration]]* (entries: internal name, display name, selectable)
      - "only allow values from the list" → an *enumerated value list* [[attribute-constraint|constraint]]
      - "a field computed by a formula" → *[[calculated-attribute]]*

  - type: diagram
    title: Anatomy of the IP Rating enumeration
    caption: An enumeration is a list of entries. The attribute uses it through a constraint. Click to explore.
    diagram:
      width: 800
      height: 380
      nodes:
        - id: enum
          label: IP Rating list
          sublabel: global enumeration
          x: 20
          y: 150
          w: 180
          h: 64
          tone: primary
          detail: |
            Defined once in Type and Attribute Management. Any attribute on any type can use it,
            so motors, chargers and displays all share the same IP values.
        - id: e54
          label: IP54
          sublabel: "internal: IP54 · selectable"
          x: 260
          y: 40
          w: 220
          tone: info
          shape: pill
          detail: |
            Each **entry** has an *internal name* (stored on the object, never changes), a *display
            name* (what users see, can be translated) and a *selectable* flag.
        - id: e65
          label: IP65
          sublabel: "internal: IP65 · selectable"
          x: 260
          y: 150
          w: 220
          tone: info
          shape: pill
          detail: Dust-tight and protected against water jets. The most common rating at Acme.
        - id: e67
          label: IP67
          sublabel: "internal: IP67 · selectable"
          x: 260
          y: 260
          w: 220
          tone: info
          shape: pill
          detail: Dust-tight and survives temporary immersion. Used for the EB-10021 battery pack.
        - id: attr
          label: "IP Rating attribute"
          sublabel: on E-Bike Part
          x: 560
          y: 150
          w: 210
          h: 64
          tone: accent
          detail: |
            The attribute gets an **enumerated value list** constraint pointing at the IP Rating
            list. The create form shows a drop-down; free text is impossible.
      edges:
        - { from: enum, to: e54 }
        - { from: enum, to: e65 }
        - { from: enum, to: e67 }
        - { from: e65, to: attr, label: constraint, dashed: true }

  - type: callout
    variant: why-it-matters
    md: |
      Certification bodies, customers and ERP all want IP ratings as **exact** values. A managed
      list makes every report, filter and interface trivial - and adding IP68 later is one admin
      change, not a data clean-up.

  - type: walkthrough
    title: Build the IP Rating enumeration and attach it
    who: Business admin (Jordan)
    where: [Site, Utilities, Type and Attribute Management]
    steps:
      - title: Open global enumerations
        where: [Type and Attribute Management, Manage Global Enumerations]
        md: Open the area for **global enumerations** and create a new one called **IP Rating**.
      - title: Add the entries
        where: [IP Rating, Entries, New Entry]
        md: |
          Add three entries. For each, set an **internal name** (`IP54`, `IP65`, `IP67`), a **display
          name** and keep **Selectable** ticked. Put them in a logical order - lowest protection first.
      - title: Attach it to the attribute
        where: [Manage Types, E-Bike Part, Attributes, IP Rating, Constraints]
        md: Select **IP Rating** on E-Bike Part and add an **enumerated value list** constraint that uses the IP Rating enumeration.
      - title: Check the form
        where: [Products, E-Bike E1, New Part]
        md: In a test context, create an E-Bike Part. IP Rating should now be a drop-down with three choices.
    result: IP Rating shows a drop-down of IP54, IP65 and IP67 on e-bike parts. Typed variations are no longer possible.

  - type: simulation
    title: Manage the IP Rating list without breaking old parts
    intro: |
      **EB-10007** (an old motor) is rated **IP54**. Product management wants new parts to be at
      least IP65, and a new display needs **IP68**. Change the list, then rate a new part, **EB-10022**.
      Notice what happens to EB-10007 each time.
    headline: "IP54 entry: {ip54} · IP68 entry: {ip68} · EB-10007 = {oldPart} · EB-10022 = {newPart}"
    initial: { ip54: Selectable, ip68: Not in list, oldPart: IP54, newPart: "(empty)", freeText: never tried }
    actions:
      - id: retire54
        label: Mark IP54 as not selectable
        when: { ip54: Selectable }
        do: [{ set: { ip54: Not selectable } }]
        log: IP54 is hidden from new choices. EB-10007 still shows {oldPart} - existing data is untouched.
        blockedHint: IP54 is already not selectable.
      - id: restore54
        label: Make IP54 selectable again
        when: { ip54: Not selectable }
        do: [{ set: { ip54: Selectable } }]
        log: IP54 is back in the drop-down for new parts.
        blockedHint: IP54 is already selectable.
      - id: add68
        label: Add an IP68 entry
        when: { ip68: Not in list }
        do: [{ set: { ip68: Selectable } }]
        log: IP68 added. Every type using the IP Rating list gets it at once - no change to the types themselves.
        blockedHint: IP68 is already in the list.
      - id: hide68
        label: Mark IP68 as not selectable
        when: { ip68: Selectable }
        do: [{ set: { ip68: Not selectable } }]
        log: IP68 is hidden from new choices. Parts already rated IP68 keep their value.
        blockedHint: IP68 isn't selectable right now.
      - id: show68
        label: Make IP68 selectable again
        when: { ip68: Not selectable }
        do: [{ set: { ip68: Selectable } }]
        log: IP68 is back in the drop-down.
        blockedHint: IP68 is already selectable (or not added yet).
      - id: pick54
        label: Rate EB-10022 as IP54
        when: { ip54: Selectable }
        do: [{ set: { newPart: IP54 } }]
        log: EB-10022 = IP54. Allowed, because IP54 is still selectable.
        blockedHint: IP54 isn't in the drop-down any more - not selectable entries can't be chosen for new values.
      - id: pick67
        label: Rate EB-10022 as IP67
        when: {}
        do: [{ set: { newPart: IP67 } }]
        log: EB-10022 = IP67.
      - id: pick68
        label: Rate EB-10022 as IP68
        when: { ip68: Selectable }
        do: [{ set: { newPart: IP68 } }]
        log: EB-10022 = IP68.
        blockedHint: IP68 isn't a selectable entry yet. Add it (or make it selectable) first.
      - id: typeit
        label: "Type \"ip 68\" by hand"
        when: {}
        do: [{ set: { freeText: rejected } }]
        log: "No free text: an enumerated value list only offers its entries. EB-10022 stays {newPart}."
    goals:
      - label: Stop new IP54 parts while EB-10007 keeps IP54
        when: { ip54: Not selectable, oldPart: IP54 }
        message: Not selectable hides an entry from new choices without touching existing data.
      - label: Rate EB-10022 as IP68
        when: { newPart: IP68 }
        message: One new entry, available everywhere the list is used.

  - type: text
    md: |
      ### Calculated attributes: let Windchill do the maths

      Ana needs the **maximum motor current** for every e-bike part to size cables and connectors.
      It's simply power divided by voltage. Typing it by hand invites mistakes and goes stale the
      moment someone changes the motor. So Jordan adds a **calculated attribute**:

      > **Max Current (A)** = Motor Power ÷ Battery Voltage

      | Part | Motor Power | Battery Voltage | Max Current (calculated) |
      | --- | --- | --- | --- |
      | EB-10031 hub motor, city | 250 W | 36 V | 6.9 A |
      | EB-10032 hub motor, cargo | 500 W | 48 V | 10.4 A |
      | EB-10033 mid-drive, trail | 750 W | 52 V | 14.4 A |

      Change EB-10032's motor to 750 W and its Max Current becomes 15.6 A - nobody has to remember.

  - type: walkthrough
    title: Create the Max Current calculated attribute
    who: Business admin (Jordan)
    where: [Type and Attribute Management, Manage Types, E-Bike Part]
    steps:
      - title: Start a new attribute
        where: [E-Bike Part, Attributes, New Attribute, Calculated]
        md: On E-Bike Part, create a **new attribute** and choose **Calculated**. Name it **Max Current (A)** and choose a number data type.
      - title: Write the formula
        where: [Max Current, Formula]
        md: |
          In the formula field, refer to the other attributes by their **internal names**, for example
          `motorPower / batteryVoltage`. Use the formula editor's function list if your release offers
          rounding or text functions.
      - title: Protect the inputs
        where: [Battery Voltage, Constraints]
        md: Make sure the inputs can't be empty or zero - the Value Required and Range constraints from the last lesson do exactly that.
      - title: Test it
        where: [Products, E-Bike E1, "<test part>", Attributes]
        md: Create or edit a test E-Bike Part with 500 W and 48 V and check Max Current shows about 10.4.
    result: E-Bike Parts show Max Current as a read-only value that follows Motor Power and Battery Voltage.

  - type: callout
    variant: version-note
    versions: ["all"]
    md: |
      Formula syntax, the available functions, and **when** a calculated value is computed and
      whether you can search on it vary by release. Test search and reporting on your release before
      promising Ana a "Max Current over 12 A" report.

  - type: callout
    variant: pitfall
    title: Deleting an enumeration entry that's in use
    md: |
      Removing **IP54** from the list while hundreds of parts still use it leaves values that no
      longer match any entry, which confuses forms, reports and integrations. Mark retired entries
      **not selectable** instead. And never change an entry's **internal name** - that's what is
      stored on the parts.

  - type: callout
    variant: pro-tip
    md: |
      Use a calculated attribute only for values that are **truly derived**. If the number comes from
      a test (measured current) it's a real attribute with its own owner, not a formula.

  - type: flashcards
    cards:
      - front: "Enumeration"
        back: "A managed pick-list of entries, defined once and used by attributes through a constraint."
      - front: "Enumeration entry: three parts"
        back: "Internal name (stored, permanent), display name (shown, translatable), selectable flag."
      - front: "Retire a value safely"
        back: "Mark the entry not selectable. Existing objects keep it; new ones can't choose it."
      - front: "How an attribute uses an enumeration"
        back: "Through an enumerated value list constraint on the attribute."
      - front: "Calculated attribute"
        back: "A read-only field computed by a formula from other attributes of the same object."
      - front: "Max Current formula"
        back: "Motor Power ÷ Battery Voltage (500 W ÷ 48 V ≈ 10.4 A)."
      - front: "Why protect formula inputs?"
        back: "Empty or zero inputs break the formula. Value Required and Range keep them valid."
      - front: "Measured vs derived"
        back: "Derived values can be calculated. Measured values are real attributes with an owner."

  - type: summary
    points:
      - Enumerations turn free text into a managed pick-list, defined once and reused.
      - Each entry has a permanent internal name, a display name and a selectable flag.
      - Retire entries by making them not selectable - never delete values that are in use.
      - Calculated attributes fill themselves from a formula, like Max Current = power ÷ voltage.
      - Protect formula inputs with constraints, and test search and reports on your release.
