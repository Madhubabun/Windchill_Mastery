id: m04-s07-l01
subtitle: E-Bike E1 took Jordan three weeks to set up. E-Bike E2 should take ten minutes. That's what context templates are for.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, templates, context-templates, products, libraries]
sources:
  - id: ac
    where: "Module 9: Describe Windchill templates; Describe context templates; Describe product, library, and organization templates; Activity: Create a product context template. Module 3: Create products and libraries"
  - id: help-center
    label: PTC Help Center supplement
    title: "Using Current Library Context as a Template"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/pdm_admin/PDMAdminLibToTemplate.html"
    covers: "Save as Template for site and organization administrators; selectable components; access policy rules and team roles always included; result in the organization's Templates table"
  - id: help-center
    label: PTC Help Center supplement
    title: "Methods of Creating Additional Context Templates"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/templates_chp/TemplatesChp_MethodCreateAdditContextTemp.html"
    covers: "Save as Template, Export as Template (ZIP file), import, new template from an input file; no DTD validation on import"

blocks:
  - type: text
    md: |
      Over the last few sections Jordan set up **E-Bike E1** properly: a tidy folder tree, team roles,
      access rules for Voltra Cells, a couple of preferences. Now Kai announces **E-Bike E2**, a cargo model, launching next quarter.

      Jordan could repeat three weeks of clicks - and get half of them slightly different. Or Jordan can
      capture E-Bike E1's **setup** (not its parts!) as a **context template**, and create E2 from it in
      minutes. Same structure, same rules, zero drift.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a starter kit for a new product or library" → [[context-template]]
      - "the product we copy the setup from" → the source [[context]]
      - "the shelf where templates live" → the organization's (or site's) **Templates** page
      - "business data" → [[part|parts]], [[document|documents]], [[cad-document|CAD documents]] and changes

  - type: diagram
    title: What travels in the starter kit
    caption: The setup goes into the template. The business data stays home. Click each box.
    diagram:
      width: 820
      height: 400
      groups:
        - { label: "E-Bike E1 (live product)", x: 20, y: 20, w: 300, h: 360, tone: neutral }
        - { label: "Acme E-Bike Product template", x: 360, y: 20, w: 200, h: 360, tone: accent }
        - { label: E-Bike E2 (new), x: 600, y: 20, w: 200, h: 360, tone: success }
      nodes:
        - id: setup
          label: Setup
          sublabel: folders · roles · rules
          x: 40
          y: 70
          w: 260
          tone: primary
          detail: Folder tree, team roles, access policies, object initialization rules, preferences, document templates. This is what Jordan spent three weeks on - and what the template captures.
        - id: data
          label: Business data
          sublabel: EB-10021 and friends
          x: 40
          y: 250
          w: 260
          tone: warning
          shape: doc
          detail: Parts, CAD, documents, change objects, their history. They belong to E-Bike E1 and do **not** appear in products created from the template.
        - id: tpl
          label: Product template
          sublabel: on the org's Templates page
          x: 380
          y: 160
          w: 160
          tone: accent
          shape: doc
          detail: |
            A [[context-template]] is an XML description of the setup. **Save as Template** puts it on
            Acme Mobility's Templates page; **Export as Template** writes it to a ZIP file you can
            import elsewhere - even into another Windchill installation.
        - id: e2
          label: E-Bike E2
          sublabel: same setup · empty
          x: 620
          y: 160
          w: 160
          tone: success
          detail: Created from the template - same folders, roles and rules as E1, but no parts. The team gets its own members.
      edges:
        - { from: setup, to: tpl, label: export }
        - { from: tpl, to: e2, label: create from }
        - { from: data, to: tpl, label: stays behind, dashed: true }

  - type: callout
    variant: why-it-matters
    md: |
      Every product created by hand is a snowflake: slightly different folders, a forgotten access
      rule, an OIR that never got copied. Snowflakes make reports wrong, access problems weird and
      upgrades risky. Templates make **"how Acme sets up a product"** a repeatable, reviewable thing.

  - type: comparison
    title: What Save as Template can carry
    columns: ["In the template?", Notes]
    rows:
      - label: Team roles and access policy rules
        cells: ["Always", "Included automatically - review supplier rules before reusing them"]
      - label: Folder structure
        cells: ["You choose", "The folders, without their contents"]
      - label: Team members
        cells: ["You choose", "Usually left out, so each product gets its own people"]
      - label: Document templates
        cells: ["You choose", "Templates stored in the source context"]
      - label: Object initialization rules
        cells: ["You choose", "Context-level rules only - Jordan's E-Bike Part rule lives at the organization and applies anyway"]
      - label: Preferences
        cells: ["You choose", "Values set in the source context"]
      - label: "Parts, CAD and documents"
        cells: ["No", "Business data stays in the source context"]
    takeaway: A template is the empty, fully-furnished house - not the family that lives in it.

  - type: walkthrough
    title: Turn E-Bike E1's setup into a template
    who: A site or organization administrator
    where: [Browse, Products, "E-Bike E1", Details, Actions, Save as Template]
    steps:
      - title: Clean up the source first
        where: [Browse, Products, "E-Bike E1", Team]
        md: |
          Remove one-off experiments: test folders, roles nobody needs, a temporary access rule for an
          auditor. Whatever is in E1's setup today will be in every future product.
      - title: Save it as a template
        where: [Browse, Products, "E-Bike E1", Details, Actions, Save as Template]
        md: |
          On the product's details page open **Actions → Save as Template**. Name it
          `Acme E-Bike Product`, add a description, and choose which parts of the setup to include
          (folders, team members, document templates, rules, preferences).
      - title: Find it on the Templates page
        where: [Browse, Organizations, "Acme Mobility", Templates, Product Templates]
        md: |
          Open the organization's **Templates** page and choose **Product Templates** in the view list.
          The new template is there, associated with Acme Mobility.
      - title: Create the new product from it
        where: [Browse, Products, View All, New Product]
        md: |
          Choose **New Product**, name it **E-Bike E2**, and pick `Acme E-Bike Product` from the
          **Template** list. Then add real people to its team roles.
    result: |
      E-Bike E2 opens with E1's folder tree, roles and rules already in place, and no parts. Jordan
      creates one test E-Bike Part in E2 to confirm access rules and defaults work.

  - type: callout
    variant: note
    title: Moving a template between systems
    md: |
      **Export as Template** writes the product's setup to a ZIP file on your computer, and the import
      icon on the Templates table brings it back as a template with the same name. To review or tweak
      the setup you can edit the XML inside - but import doesn't validate the XML against its DTD, so
      check it yourself first. Organization templates are the exception: they can only be created from
      an input file (next lessons).

  - type: example
    variant: real-world
    title: The supplier rule that travelled
    industry: Micromobility
    md: |
      A company like Acme once built a template from a live product without reviewing it. Hidden
      inside was an access rule giving its battery supplier read access to released CAD. Every new
      product created from that template quietly gave the same supplier the same access - including
      a motor program the supplier had nothing to do with. It was found during an audit, a year later.
    takeaway: Review a template's access rules as carefully as the product's - they are copied blindly.

  - type: callout
    variant: pitfall
    md: |
      **Expecting existing products to update when the template changes.** A template is a starting
      point. Products created from it are independent copies of the setup - changing the template later
      only affects products created afterwards.

  - type: callout
    variant: pro-tip
    md: |
      Keep a **"golden" template product** - an empty product used only to build and test the setup -
      instead of exporting from a busy live product. It never collects one-off rules, and it is the
      safe place to try changes before exporting the next template version.

  - type: flashcards
    title: Context templates deck
    cards:
      - front: Context template
        back: "A starter kit (XML) for a new product, library or project: folders, roles, access rules and chosen extras - no business data."
      - front: Where templates live
        back: "On the Templates page of the context, for example Acme Mobility → Templates → Product Templates."
      - front: Does a template carry parts and CAD?
        back: "No. Business data stays in the source context."
      - front: Change a template - do existing products change?
        back: "No. Only products created afterwards get the new setup."
      - front: Golden template product
        back: "An empty product used only to build and test the setup before exporting a template."
      - front: Save as Template vs Export as Template
        back: "Save as Template stores it on the organization's Templates page. Export as Template writes a ZIP file you can import elsewhere."
      - front: Before saving a template from a live product
        back: "Clean up one-off rules, test folders and draft OIRs - they would travel too."

  - type: quiz
    questions:
      - kind: multi
        prompt: Jordan creates E-Bike E2 from the Acme E-Bike Product template. What will E2 have on day one? (Choose all that apply.)
        options: [E1's folder tree (if Jordan included it), E1's team roles, E1's access policy rules, A copy of EB-10021 Battery pack]
        answers: [0, 1, 2]
        explanation: Team roles and access policy rules are always included; folders are an option Jordan ticked. Parts like EB-10021 stay in E1.
      - kind: truefalse
        prompt: After Jordan adds a new folder to the template, E-Bike E1 and E2 get that folder automatically.
        answer: false
        explanation: Templates are used only at creation time. Existing products must be changed separately.

  - type: summary
    points:
      - A context template captures a product's or library's setup so new contexts start identical.
      - Roles and access policy rules always travel; folders, team members, document templates, rules and preferences are your choice - never business data.
      - Save as Template stores it on the organization's Templates page; Export as Template writes a ZIP.
      - Clean up and review a template before reuse. Its rules are copied blindly.
      - Changing a template affects only contexts created afterwards.
