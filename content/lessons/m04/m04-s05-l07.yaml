id: m04-s05-l07
subtitle: Domains don't only guard access. They also decide who hears about changes and what search can find.
version: 1.0.0
updated: "2026-10-05"
tags: [domains, notification-policy, indexing-policy, policy-administration, search]
sources:
  - id: ac
    where: "Module 8: Identify domain and cabinet administrative objects (what a domain controls); Describe the Windchill domain architecture (single indexing rule at /(Root)); Work with the Policy Administrator; Define a notification policy; Define an indexing policy"
  - id: help-center
