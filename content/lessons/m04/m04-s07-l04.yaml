id: m04-s07-l04
subtitle: Start parts that open in Creo already set up, and whole organizations that start life already furnished.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, templates, cad-document-templates, organization-templates]
sources:
  - id: ac
    where: "Module 9: Describe Windchill templates; Describe CAD document templates; Describe context templates; Describe product, library, and organization templates. Module 1: Create a Windchill organization (template pick list, Subscriber). Module 3: Identify context creators"
  - id: help-center
    label: PTC Help Center supplement
    title: "Creating a CAD Document Template"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/objtemplates/TemplatesCADDocCreate.html"
    covers: "Templates page, CAD Document Templates view, new CAD document template icon, CAD Source, required File Name, contexts where templates can be created"
  - id: help-center
