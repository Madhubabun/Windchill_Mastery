blocks:
  - type: text
    md: |
      Ten questions on **templates, numbering and preferences**: what a context template carries,
      CAD document and organization templates, how auto-numbering works with OIRs and sequences, smart
      versus dumb numbers, and how preference levels and locks behave. Score 80% to pass.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: multi
        prompt: Jordan uses Save as Template on E-Bike E1 and ticks the folder structure. What will a product created from the template have? (Choose all that apply.)
        options: [The folder tree, E1's team roles, E1's access policy rules, The EB-10021 Battery pack part]
        answers: [0, 1, 2]
        explanation: Team roles and access policy rules are always included; folders were ticked. Parts, CAD and documents stay in the source product.
      - kind: single
        prompt: Hidden in E1 is an access rule giving Voltra Cells read access to released CAD. E2 will use a different battery supplier. What should Jordan do before saving the template?
        options:
          - Nothing - E2's team decides access
          - Remove or review the Voltra-specific rule in E1 first
          - Delete Voltra Cells from Windchill
        answer: 1
        explanation: Access policy rules are always included in the template and copied into every new product. Clean up the source first.
      - kind: single
        prompt: Jordan creates the e-bike start part as a CAD document template inside E-Bike E1. Who can use it?
        options: [Every organization, Every Acme context, Only E-Bike E1]
        answer: 2
        explanation: A CAD document template created in a product or library is available only in that context. Organization level would cover all Acme contexts.
      - kind: truefalse
        prompt: Organization templates can only be created from a context template input file.
        answer: true
        explanation: Save as Template and Export as Template work for products, libraries, programs and projects. An organization template comes from an input file via the new template icon.
      - kind: single
        prompt: Kai proposes BAT-48V-13AH as a part number. What is the strongest argument against it?
        options:
          - Windchill cannot store such numbers
          - If the capacity changes, the number becomes wrong or must change everywhere it is used
          - It is too short
        answer: 1
        explanation: Smart numbers encode facts that change. Put Battery Voltage and capacity in attributes and keep the number stable.
      - kind: single
        prompt: In `{GEN:wt.enterprise.SequenceGenerator:EBPART_seq:5:0}`, what does EBPART_seq name?
        options: [The OIR, The database sequence, The folder, The life cycle]
        answer: 1
        explanation: The generator takes the next value from the sequence EBPART_seq, makes it 5 characters long padded with 0, and the rule's constant Arg adds the EB- prefix.
      - kind: single
        prompt: Why does Jordan put the E-Bike Part numbering rule at Acme Mobility rather than in E-Bike E1?
        options:
          - Product-level rules can restrict moving objects between products
          - OIRs can't be created in products
          - Organization rules run faster
        answer: 0
        explanation: The course recommends defining OIRs at organization or site level because rules in individual products can restrict moves between contexts.
      - kind: truefalse
        prompt: If all numbering rules are removed, objects created in a product are numbered by hand.
        answer: true
        explanation: Without numbering rules, built-in defaults apply - manual numbering in product-level (sub-organization) contexts, single-digit autonumbering at site or organization.
      - kind: single
        prompt: Acme Mobility has locked Affected End Items Display at Yes. What does Kai's admin see in E-Bike E1?
        options:
          - The preference is hidden
          - The preference is visible with a lock icon, but can't be changed
          - The preference can be changed for E-Bike E1 only
        answer: 1
        explanation: A locked preference shows the lock icon at every level and its value can't be changed at lower levels.
      - kind: multi
        prompt: Which are good preference habits? (Choose all that apply.)
        options:
          - Set at the lowest level that solves the problem
          - Lock only real company policy
          - Delete child instances before locking at site or organization level
          - Change site-level values to fix one product
        answers: [0, 1, 2]
        explanation: Low level, few locks, and clean child instances before locking. Site-level changes affect every organization on the server.

  - type: flashcards
    title: Templates, numbering and preferences deck
    cards:
      - front: Context template
        back: "A starter kit for a new product, library or organization: roles, access rules and chosen extras - no business data."
      - front: Always included by Save as Template
        back: "Access policy rules and team roles. Folders, team members, document templates, rules and preferences are optional."
      - front: Export as Template
        back: "Writes a product's or library's setup to a ZIP file that can be imported elsewhere."
      - front: CAD document template
        back: "A starter CAD file created from a source CAD document. Its context level decides who can use it."
      - front: Organization template
        back: "Picked when a new organization is created; created only from a context template input file."
      - front: Smart number
        back: "A number that encodes properties (BAT-48V-13AH). Readable, but breaks when the property changes."
      - front: Auto-numbering in Windchill
        back: "An OIR number generator taking the next value of a database sequence, plus constants such as a prefix."
      - front: Out-of-the-box number lengths
        back: "Ten digits for parts, documents, CAD documents and end items; five for change objects."
      - front: Where to start a new sequence
        back: "Above the highest number already used by hand."
      - front: Preference lock
        back: "Tick Locked in Set Preference. The value can't be changed at lower levels until unlocked."
