id: m04-s05-l02
subtitle: Three kinds of rules, one answer. Learn to predict it before Windchill does.
version: 1.0.0
updated: "2026-10-05"
tags: [access-control, ad-hoc, deny, security-labels, effective-permissions]

blocks:
  - type: text
    md: |
      Last lesson Jordan wrote **policy rules**: zone-wide rules stored in domains. They're not
      the only thing that decides access. Windchill weighs three kinds of control, plus a couple of
      "hard no" settings:

      - **Policy rules**: per domain, type, state and participant. The backbone.
      - **Ad hoc rules**: extra grants stuck to *one object*.
      - **Security labels**: stickers like *Export Controlled* that lock out anyone not cleared.

      Your job as an admin is to predict the final answer, the **effective permissions**, before a
      supplier phones to say they can't open a drawing.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "rule for a whole zone" → [[access-control-rule|policy rule]]
      - "one-off permission on one object" → [[ad-hoc-access|ad hoc access control]]
      - "a 'no' that beats policy 'yes'" → [[deny-rule|deny]]
      - "a 'no' that nothing beats" → [[absolute-deny|absolute deny]]
      - "a clearance sticker on an object" → [[security-label|security label]]
      - "what someone can really do in the end" → [[effective-permissions|effective permissions]]

  - type: comparison
    title: The three kinds of access control
    columns: [Policy rule, Ad hoc rule, Security label]
    rows:
      - label: Lives on
        cells: [A domain, One object, One object (label value set on it)]
      - label: Reaches
        cells: ["Every object of that type and state in the domain and its children", Only that object, Only that object]
      - label: Can grant
        cells: [Yes, Yes, "No - it only restricts"]
      - label: Can deny
        cells: ["Yes - Deny or Absolute Deny", "No - grants only", "Yes - everyone not authorized for the value"]
      - label: Changes with life cycle state
        cells: ["Yes - rules are per state", "No - stays until removed (unless a workflow or team manages it)", "No - stays until the label value changes"]
      - label: Typical owner
        cells: [Business admin, Object owner or a workflow or team, Security officer or business admin]
      - label: Acme example
        cells: ["Supplier role may read Released CAD in Battery", "Leo gets Read on one In Work drawing for a review", "EB-10030 controller firmware marked Export Controlled"]
    takeaway: Policy builds the default picture. Ad hoc adds exceptions on single objects. Labels draw a fence that only cleared people can cross.

  - type: diagram
    title: How Windchill reaches one answer
    caption: Follow the gates top to bottom for one user, one object and one permission. Click each gate.
    diagram:
      width: 820
      height: 470
      nodes:
        - id: ask
          label: "Can Ana read EB-10021?"
          sublabel: one user · one object · one right
          x: 290
          y: 10
          w: 240
          h: 52
          tone: neutral
          shape: pill
          detail: Every access check is this small. One participant, one object, one permission. Windchill answers it on the server each time.
        - id: admin
          label: Administrator?
          sublabel: bypass
          x: 40
          y: 95
          w: 180
          h: 52
          tone: info
          detail: |
            Members of the site **Administrators** group bypass access checks entirely. That's why
            admin accounts are useless for testing access.
        - id: label
          label: Security labels
          sublabel: cleared for every value?
          x: 290
          y: 95
          w: 240
          h: 52
          tone: danger
          detail: |
            If the object carries a restricted label value and the user isn't authorized for it (directly,
            through a group, or through an active [[agreement]]), the answer is **no**. Nothing below can
            change that.
        - id: policy
          label: Policy grants
          sublabel: domain + all parents
          x: 290
          y: 180
          w: 240
          h: 52
          tone: primary
          detail: |
            Collect every policy rule that matches the object's **type** (or a parent type), **state** (or
            *All*) and **any participant the user belongs to**, from the object's domain and every parent
            domain. Grants add up.
        - id: deny
          label: Policy denies
          sublabel: deny beats grant
          x: 290
          y: 265
          w: 240
          h: 52
          tone: warning
          detail: |
            A matching **deny** anywhere in the domain chain removes the permission, even if another rule,
            group or a lower domain grants it.
        - id: adhoc
          label: Ad hoc grants
          sublabel: on this object
          x: 290
          y: 350
          w: 240
          h: 52
          tone: success
          detail: |
            Grants stuck on the object itself are added. They can win back a permission that a regular
            policy deny removed.
        - id: absolute
          label: Absolute denies
          sublabel: final word
          x: 570
          y: 350
          w: 220
          h: 52
          tone: danger
          detail: An **absolute deny** removes the permission no matter what, including ad hoc grants. Only the admin bypass is stronger.
        - id: result
          label: Effective permissions
          sublabel: the real answer
          x: 570
          y: 425
          w: 220
          h: 40
          tone: accent
          shape: pill
          detail: What the access information tools report, and what the user experiences.
      edges:
        - { from: ask, to: admin }
        - { from: ask, to: label }
        - { from: label, to: policy, label: cleared }
        - { from: policy, to: deny }
        - { from: deny, to: adhoc }
        - { from: adhoc, to: absolute }
        - { from: absolute, to: result }
        - { from: admin, to: result, label: everything, dashed: true }

  - type: callout
    variant: note
    title: A mental model, not source code
    md: |
      The gates show the **precedence** Windchill applies: label restriction, then policy grants, then
      denies, then ad hoc grants, then absolute denies. The real code is optimised differently, but if
      you reason in this order you'll predict the right answer.

  - type: callout
    variant: why-it-matters
    md: |
      Most access tickets aren't bugs. They're two rules meeting in a way nobody predicted. A deny
      inherited from the organization, a forgotten label, a workflow that added an ad hoc grant years
      ago. Admins who can trace the gates fix tickets in minutes and don't "fix" them by giving out
      Full Control.

  - type: text
    md: |
      ### Grants add up, denies cut, and the user is every group they're in
      Ana (manufacturing) is in `ACME-Manufacturing` and holds the *Members* role in E-Bike E1.
      Windchill counts the rules for **all** of these participants together:

      | Rule (all match EB-10021 drawing, Released) | Effect for Ana |
      | --- | --- |
      | Org Default · CAD Document · Released · `ACME-All` · Grant Read | + Read |
      | E1 Default · CAD Document · All · Members role · Grant Read, Download | + Download |
      | E1 Default · CAD Document · All · `ACME-Manufacturing` · Deny Download | − Download |
      | **Effective** | **Read only** |

      One deny from one of her groups was enough, even though the grant came from a different participant.

  - type: scenario
    variant: what-if
    title: Predict the effective permissions
    start: q1
    nodes:
      - id: q1
        md: |
          **EB-10021 battery drawing, state Released, in the Battery domain.** Rules: Battery grants the
          Supplier role Read + Download on Released CAD Documents. Voltra's engineer Lin is in
          `SUP-Voltra`, which holds the Supplier role in E1. **What can Lin do?**
        choices:
          - label: Read and Download
            next: q2
            good: true
            feedback: Yes. Type, state, domain and participant all match. Nothing denies.
          - label: Nothing - suppliers are external
            next: q1-wrong
            feedback: Being external doesn't block anything by itself. Rules decide.
      - id: q1-wrong
        md: Windchill doesn't treat external organizations differently unless rules or labels do. Here a rule grants the Supplier role exactly this. Try the next one with that in mind.
        choices:
          - { label: Next case, next: q2 }
      - id: q2
        md: |
          **Same drawing, but Priya has started revision B. B is In Work.** Lin opens the drawing's
          history. **Can Lin read B?**
        choices:
          - label: "No - the rule only matches Released"
            next: q3
            good: true
            feedback: Right. Rules are per state. Revision A stays visible because it's still Released; B is In Work and nothing grants Lin access to it.
          - label: "Yes - Lin could read revision A"
            next: q2-wrong
            feedback: Each version is checked on its own state.
      - id: q2-wrong
        md: Access is checked per version and its current state. A is Released (visible); B is In Work (no matching grant). Lin sees A and not B.
        choices:
          - { label: Next case, next: q3 }
      - id: q3
        md: |
          **Kai wants Lin to comment on In Work revision B now.** Jordan adds an **ad hoc** Read grant on
          revision B for `SUP-Voltra`. But the organization has a regular **Deny Read** for the Supplier
          role on In Work CAD Documents. **Can Lin read B?**
        choices:
          - label: "Yes - the ad hoc grant overrides a regular deny"
            next: q4
            good: true
            feedback: Correct. Ad hoc grants on an object can override a regular policy deny.
          - label: "No - deny always wins"
            next: q3-wrong
            feedback: Deny beats policy grants, not ad hoc grants.
      - id: q3-wrong
        md: A regular deny beats **policy** grants. An **ad hoc** grant on the specific object is stronger and wins it back. Only an absolute deny would stop it.
        choices:
          - { label: Next case, next: q4 }
      - id: q4
        md: |
          **Now the org's rule is changed to Absolute Deny Read** for the Supplier role on In Work CAD
          Documents. The ad hoc grant is still on revision B. **Can Lin read B?**
        choices:
          - label: "No - absolute deny beats ad hoc"
            next: q5
            good: true
            feedback: Exactly. That's the whole point of absolute deny.
          - label: "Yes - ad hoc is object-specific so it wins"
            next: q4-wrong
            feedback: Not against an absolute deny.
      - id: q4-wrong
        md: Absolute deny is the one rule that ad hoc grants can't override. Lin is locked out of B.
        choices:
          - { label: Next case, next: q5 }
      - id: q5
        md: |
          **Revision A (Released) gets the security label value _Export Controlled_.** Only
          `ACME-ExportCleared` is authorized. Lin still has the Supplier policy grant. **Can Lin read A?**
        choices:
          - label: "No - not authorized for the label"
            next: done
            good: true
            feedback: Correct. Labels restrict regardless of grants.
          - label: "Yes - the policy rule grants Read"
            next: q5-wrong
            feedback: The label gate comes first.
      - id: q5-wrong
        md: An unauthorized user is blocked by the label whatever policy or ad hoc rules grant. Lin would need to be authorized, for example through an agreement.
        choices:
          - { label: See my result, next: done }
      - id: done
        md: |
          You traced all five gates: policy match, state, ad hoc vs deny, absolute deny and labels. That's
          the full mental model for every access ticket you'll ever handle.
        outcome: success

  - type: walkthrough
    title: Add an ad hoc grant on one object
    who: Someone with Change Permissions on the object (often its owner or a context admin)
    where: ["<object> information page", Actions, Edit Access Control]
    steps:
      - title: Open the object
        where: [Search, "EB-10021", "<drawing information page>"]
        md: Open the information page of the exact version you want to share.
      - title: Edit its access
        where: ["<information page>", Actions, Edit Access Control]
        md: |
          Choose the access control action (named **Edit Access Control** in many releases). You'll see
          the participants that already have ad hoc rights on this object.
      - title: Add the participant and permissions
        where: [Edit Access Control, Add participant]
        md: |
          Add the user or group, tick only the permissions needed (usually **Read**), and save.
    result: The participant now has those rights on this one object, on top of what policy gives, unless an absolute deny or a security label blocks it.

  - type: callout
    variant: pitfall
    md: |
      **Ad hoc sprawl.** Every ad hoc grant is invisible from Policy Administration. After a few years
      nobody knows why `SUP-Voltra` can read 400 random In Work drawings. Use ad hoc grants for short,
      documented exceptions, and remove them when the reason ends. Workflows and teams also add ad hoc
      grants automatically, so check those before blaming a person.

  - type: callout
    variant: pro-tip
    md: |
      Reach for **absolute deny** only for true red lines, such as "external organizations never get
      Delete or Change Permissions". It stops *every* future exception, including ones you'll want
      during an emergency.

  - type: summary
    points:
      - Three controls work together. Policy rules for zones, ad hoc rules on single objects, security labels as fences.
      - Policy grants from every matching participant and parent domain add up; any matching deny cuts them.
      - Ad hoc grants can override a regular deny; absolute deny overrides everything except the admin bypass.
      - Security labels block unauthorized users no matter what any rule grants.
      - Effective permissions are the result of all of this for one user and one object.
