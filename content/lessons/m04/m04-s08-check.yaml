id: m04-s08-check
subtitle: Can you turn a manager's question into a report people actually use?
version: 1.0.0
updated: "2026-10-05"
tags: [reporting, query-builder, checkpoint]

blocks:
  - type: text
    md: |
      Ten questions on **business reporting**: building report templates with Query Builder, joining
      object types, parameters, sharing reports, and choosing metrics a manager will use. Score 80% to
      pass. Every answer explains itself.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: single
        prompt: Where does Jordan normally create a new report template for the E-Bike E1 product?
        options:
          - "E-Bike E1 → Utilities → Report Management"
          - "E-Bike E1 → Folders → New Document"
          - "His own Home page → Saved searches"
          - "Site → Utilities → Server Status"
        answer: 0
        explanation: Report templates are created from Report Management on the context's Utilities page. The context decides who is offered the template.
      - kind: order
        prompt: Order the ingredients as you would build them in Query Builder.
        items: [Types, Joins, Select (columns), Criteria, Sort and save]
        explanation: You can only join types you've added, columns make sense once types are joined, and criteria and sort shape the final rows.
      - kind: single
        prompt: To list each part next to its describing document, which types does the query need?
        options: [Part and Document only, "Part, the described-by link and Document", Document and Folder, Part and its life cycle]
        answer: 1
        explanation: Relationships are stored as link objects. Join Part to the link and the link to Document so only real pairs are returned.
      - kind: truefalse
        prompt: Leaving out the join between two types in a report can return every combination of their rows and slow down the server.
        answer: true
        explanation: That's a cartesian product - 2,000 parts × 900 documents is 1.8 million rows, almost all wrong.
      - kind: single
        prompt: Maya wants the same report for each of five products. What does Jordan build?
        options: [Five templates, One template with product as a parameter, One template with no product filter, A saved search per product]
        answer: 1
        explanation: Parameters prompt for the value at run time, so one definition serves every product and never drifts.
      - kind: multi
        prompt: Ana gets an empty result from a report that works for Jordan. Which could explain it? (Choose all that apply.)
        options:
          - Ana can't read the data in that context
          - Ana picked a different parameter value
          - Reports always hide data from non-administrators
          - Ana's access rules filter out the rows Jordan sees
        answers: [0, 1, 3]
        explanation: Reports respect each user's access and depend on the parameters chosen. They don't hide everything from non-admins - that's why the template is useful.
      - kind: single
        prompt: Which is the best dashboard metric for Maya's change control board?
        options: [Total parts ever created, Open changes older than 30 days, Number of report templates, Number of Windchill users]
        answer: 1
        explanation: The CCB can act on aging changes. The others only go up or have nothing to do with the CCB's decisions.
      - kind: single
        prompt: Why use the median rather than the average for change cycle time?
        options: [It's faster to calculate, One very long change distorts an average, Windchill only supports medians, Averages hide the number of changes]
        answer: 1
        explanation: A single 300-day change drags an average up. The median shows how long a typical change takes.
      - kind: truefalse
        prompt: A report that returns the right data has done its job, even if nobody can easily find it.
        answer: false
        explanation: Delivery is half the work - the right context, read access for the audience, and a path or bookmark they can use.
      - kind: multi
        prompt: Which habits make reports trustworthy over time? (Choose all that apply.)
        options:
          - Write each metric's definition in the template description
          - Name templates as audience - question
          - Build on a test system and move the template to production
          - Copy the template whenever someone wants a small variation
        answers: [0, 1, 2]
        explanation: Definitions and clear names stop arguments; testing protects production. Copies drift apart - use parameters instead.

  - type: flashcards
    title: Business reporting deck
    cards:
      - front: Query Builder
        back: The point-and-click tool for defining report templates - types, joins, select, criteria, sort.
      - front: Report template
        back: A saved, reusable query stored in a context. Users run it and get fresh results.
      - front: Report Management
        back: "The Utilities page that lists a context's report templates: create, edit, delete, export, import."
      - front: Join
        back: Connects two types in a query, usually through a link object such as the described-by link.
      - front: Missing join
        back: Returns every combination of rows - huge, slow and wrong.
      - front: Parameter
        back: A criterion the user fills in when running the report. One template, many questions.
      - front: Access and reports
        back: Results are filtered by each user's access rights. Test as the user, not as an admin.
      - front: Saved search vs report template
        back: Saved search finds objects to act on; report template answers a question across joined types.
      - front: A good manager metric
        back: Tied to a decision, defined in writing, tracked as a trend. Pick 3-5.
      - front: Vanity metric
        back: A number that only goes up or changes no decision, e.g. total parts ever created.
