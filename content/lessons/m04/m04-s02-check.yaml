id: m04-s02-check
subtitle: Prove you can place settings on the right floor, build contexts from templates and pick the right team model.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, contexts, checkpoint]

blocks:
  - type: text
    md: |
      Ten questions on **contexts**: the site → organization → application context tree, how settings inherit,
      creating products and libraries from templates, and shared vs context teams. Score 80% to pass.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: order
        prompt: Order these from the top of the context tree down.
        items: [Site, Acme Mobility organization, Acme Standard Parts library]
        explanation: The site holds organizations; organizations hold products, libraries and projects.
      - kind: single
        prompt: Acme Mobility numbers parts SC-. E-Bike E1 has its own EB- rule. Scooter S2 has no rule. What number does a new Scooter S2 part get?
        options: [An EB- number, An SC- number, The site default, No number until a rule is added]
        answer: 1
        explanation: Scooter S2 has no rule, so the lookup moves up to Acme Mobility and its SC- rule applies. E-Bike E1's rule only covers E-Bike E1.
      - kind: truefalse
        prompt: Access rules defined at organization level apply to products created later, too.
        answer: true
        explanation: New contexts inherit from their organization from the moment they are created.
      - kind: single
        prompt: Jordan wants every Acme product to use the same preference value, with no product allowed to change it. What does Jordan do?
        options: [Set it in every product, Set it at organization level and lock it, Set it in the product template only, Put it in the shared team]
        answer: 1
        explanation: Setting it at organization level makes it inherited; locking stops products from overriding it.
      - kind: single
        prompt: Kai can't find the New Product action. What is the most likely reason?
        options: [He isn't in the organization's product creators group, The vault is full, The product template is locked, His directory entry is in the wrong branch]
        answer: 0
        explanation: Creating products is limited to the product creators group (and organization admins).
      - kind: single
        prompt: Which template should Jordan use for the real E-Bike E1 product?
        options: [The out-of-the-box general template, Acme's reviewed product template, A copy of whatever product was created last, No template]
        answer: 1
        explanation: A reviewed company template gives every product the same folders, roles and rules. The general template is for trials.
      - kind: truefalse
        prompt: Improving Acme Product Template automatically updates Scooter S2, which was created from an older version of it.
        answer: false
        explanation: Templates are applied once, at creation. Existing contexts keep their setup until someone updates them.
      - kind: multi
        prompt: What can a context template typically give a new product? (Choose all that apply.)
        options: [A folder structure, Team roles, Context-level access rules, The parts and CAD of another product]
        answers: [0, 1, 2]
        explanation: Templates carry configuration, not product data. Parts and CAD are never copied in by a template.
      - kind: single
        prompt: E-Bike E1, E1 Cargo and E1 Kids share the same engineers and reviewers. What team model fits best?
        options: [A shared team defined in the organization, Three separate context teams, One context team in E-Bike E1 only, No teams]
        answer: 0
        explanation: Same people across a product family is the textbook case for a shared team.
      - kind: single
        prompt: A consultant must see E1 Kids only. E1 Kids uses the shared E-Bike Core Team, which allows local extension. What should Jordan do?
        options: [Add her to the shared team, Add her locally to E1 Kids, Create a copy of E1 Kids for her, Add her to the Acme Mobility organization]
        answer: 1
        explanation: Local additions affect only that context. Adding her to the shared team would expose every product that uses it.

  - type: flashcards
    title: Contexts checkpoint deck
    cards:
      - front: The context tree
        back: "Site → organization → products, libraries and projects."
      - front: Site
        back: "Top context; its settings reach every organization and context on the server."
      - front: Organization context
        back: "Company layer holding policies, numbering rules, templates and shared teams."
      - front: "\"Nearest wins\""
        back: "For rules like numbering and for preferences, the closest context with a value wins."
      - front: Locked preference
        back: "A value set higher up that lower contexts cannot override."
      - front: Access rules and inheritance
        back: "Rules add up from every level above the context."
      - front: Context template
        back: "A recipe of folders, roles and rules used once when a product or library is created."
      - front: Product creators group
        back: "Organization group whose members may create new products."
      - front: Shared team
        back: "Defined once in the organization; used by several contexts chosen at creation."
      - front: Context team
        back: "The team that belongs to a single product, library or project."

  - type: summary
    points:
      - Settings live on a floor of the context tree and flow down.
      - Put each setting at the lowest level that covers everyone who needs it.
      - Real contexts come from reviewed company templates.
      - Shared teams for product families; context teams for unique or confidential groups.
