blocks:
  - type: text
    md: |
      Ten questions on **contexts**: the site → organization → application context tree, how settings inherit,
      creating products and libraries from templates, shared vs context teams, and context strategy and moves.
      Score 80% to pass.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: order
        prompt: Order these from the top of the context tree down.
        items: [Site, Acme Mobility organization, Acme Standard Parts library]
        explanation: The site holds organizations; organizations hold products, libraries, projects and programs.
      - kind: single
        prompt: Acme has an organization rule numbering Part as SC- and a site rule giving plain sequential numbers. Scooter S2 has no rules of its own. What does a new Scooter S2 part get?
        options: [A plain sequential number from the site, An SC- number, No number until Scooter S2 gets a rule, An EB- number]
        answer: 1
        explanation: Rules from all levels are merged, and the organization's rule overrides the site's for the same type. Scooter S2 inherits the result.
      - kind: single
        prompt: Jordan wants every Acme product to use the same preference value, with no product allowed to change it. What does Jordan do?
        options: [Set it in every product, Set it at organization level and make it non-overridable, Set it in the product template only, Put it in the shared team]
        answer: 1
        explanation: Preferences set at a level apply to all lower contexts, and a higher level can forbid lower levels from overriding them.
      - kind: single
        prompt: Kai can't find the New Product action. What is the most likely reason?
        options: [He isn't in the organization's Product Creators group, The vault is full, The product template is locked, His directory entry is in the wrong branch]
        answer: 0
        explanation: Creating products is for members of the Product Creators group. The creator then becomes the product's manager.
      - kind: multi
        prompt: What can a context template give a new product? (Choose all that apply.)
        options: [A folder structure, Context roles, Access control policies, The documents of the product it was saved from]
        answers: [0, 1, 2]
        explanation: Templates carry configuration - folders, roles, policies, initialization rules, defaults. Documents of the original product are not copied.
      - kind: truefalse
        prompt: A product created with Private Access set to Yes inherits Acme's organization-level access rules as usual.
        answer: false
        explanation: A private context hangs under a more restrictive Private domain instead of the usual organization domains, so its access rules must be defined for it.
      - kind: single
        prompt: E-Bike E1, E1 Cargo and E1 Kids share the same engineers and reviewers. What team model fits best?
        options: [A shared team defined in the organization, Three separate context teams, One context team in E-Bike E1 only, No teams]
        answer: 0
        explanation: Same people across a product family is the textbook case for a shared team.
      - kind: single
        prompt: Before adding a reviewer to the shared E-Bike Core Team, Jordan wants to know which contexts will be affected. What does Jordan use?
        options: [Show Team Uses on the shared team's details page, Search Disconnected Participants, The products list sorted by date, Object Initialization Rules Administration]
        answer: 0
        explanation: Show Team Uses, at the top of the shared team's Members table, lists the contexts that use it - all of them get the change.
      - kind: single
        prompt: Acme's planned rental business will share most parts with the scooters. How many organization contexts does PTC's guidance suggest?
        options: [One for the whole company, One per business, One per product line, One per supplier]
        answer: 0
        explanation: Several organizations suit large, separate divisions that share little data. With significant sharing, one organization is generally better.
      - kind: multi
        prompt: Jordan wants to move SC-1042 from Scooter S2 to Acme Standard Parts. Which are true? (Choose all that apply.)
        options: [It must be checked in first, All versions must be moved to change product or library, Its number and history stay the same, It keeps Scooter S2's access policies]
        answers: [0, 1, 2]
        explanation: Checked-out objects can't move, crossing contexts needs all versions, and identity and history are kept. Access follows the new location's policies.

  - type: flashcards
    title: Contexts checkpoint deck
    cards:
      - front: The context tree
        back: "Site → organization → products, libraries, projects and programs."
      - front: Site
        back: "Root context; its policies, templates and preferences are defaults for everything below."
      - front: Organization context
        back: "Company layer holding groups, policies, initialization rules, templates and shared teams. Can't be deleted."
      - front: Object initialization rules and levels
        back: "Merged from all levels; a lower context's or a subtype's rule wins. Best kept at organization or site level."
      - front: Locked preference
        back: "A value set higher up that lower contexts can see but not override."
      - front: Access rules and inheritance
        back: "An object inherits the rules of its domain and all parent domains - except private contexts."
      - front: Context template
        back: "Initial configuration for a new product or library: folders, roles, policies, rules, defaults - no data."
      - front: Product Creators group
        back: "Its members may create products; the creator becomes the Product Manager."
      - front: Shared team
        back: "Defined at organization level, chosen when a context is created; changes reach every user context."
      - front: Move action
        back: "Actions → Move. Products and libraries only; all versions to cross contexts; check in first."

  - type: summary
    points:
      - Settings live on a level of the context tree and become defaults below.
      - Keep rules high and specific; lock preferences that must not change.
      - Real contexts come from reviewed company templates; creators become managers.
      - Shared teams for product families; plan the context strategy before data exists - moves have consequences.
