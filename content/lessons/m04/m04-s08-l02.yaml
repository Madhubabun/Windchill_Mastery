    chapters:
      - title: The template exists
        caption: Jordan saved *"CCB - open changes by age"* in the E-Bike E1 product.
        show: [tpl]
        highlight: [tpl]
      - title: Who may run it
        caption: Only people who can read the template **and** the data see results. Rows are filtered by each user's own access.
        show: [tpl, access]
        highlight: [access]
        flow: [tpl>access]
      - title: Maya runs it
        caption: She picks the product as a parameter and gets a live table - good for drilling into individual changes.
        show: [tpl, access, run, table]
        highlight: [run, table]
        flow: [access>run, run>table]
      - title: Numbers over time
        caption: For trends, the weekly result is exported and charted. Three to five numbers, same definition every week.
        show: [tpl, access, run, table, export, dash]
        highlight: [dash]
        flow: [run>export, export>dash]
        seconds: 7
      - title: A decision, not a printout
        caption: The CCB looks at the trend, then drills into the oldest changes in the live table. That's a report doing its job.
        show: [tpl, access, run, table, export, dash, ccb]
        highlight: [ccb]
        flow: [dash>ccb, table>ccb]
        seconds: 7

  - type: callout
    variant: why-it-matters
    md: |
      Managers don't log in to Windchill to browse. If the answer isn't one click away, they ask someone
      to paste numbers into a slide - and now the company runs on a copy of a copy. Delivering reports
      well keeps decisions tied to **live PLM data**, and it saves the business admin from becoming a
      human report generator.

  - type: walkthrough
    title: Publish a report to the people who need it
    who: Business administrator (Jordan), with the context's admin rights
    where: ["<context>", Utilities, Report Management]
    steps:
      - title: Put the template in the right context
        where: ["E-Bike E1", Utilities, Report Management]
        md: |
          A template is offered to users of the context it lives in. Keep product-specific reports in
          the product; build company-wide ones at organization level. If a template is in the wrong
          place, it's often simpler to recreate or import it into the right context than to explain
          a workaround.
      - title: Give the audience read access to the template
        where: ["<context>", Utilities, Policy Administration]
        md: |
          Report templates are governed by access rules like other objects. Make sure the audience's
          group - for example a CCB group or `ACME-Engineering` - can **read** report templates in
          that context. Remember they also need read access to the **data**, or their report comes back
          empty.
      - title: Check as the user would
        where: ["<context>", Utilities, "View Access Rights / Access Information"]
        md: |
          Check Maya's rights on the template with the context's access-information tool, or ask her to
          run it once while you watch. "It works for me" proves nothing - administrators see everything.
      - title: Tell people where to run it
        where: ["<context>", Reports]
        md: |
          Users run templates from the context's reports page (the exact entry point differs by release).
          Send the path, plus a one-line description of what the report answers and which parameter to
          pick. Running a report usually gives a page you can bookmark.
      - title: Set up the export for trends
        where: [Report results, Export]
        md: |
          For a dashboard, run the report with the agreed parameters and export the results (for example
          CSV or Excel). Load the file into the team's spreadsheet or BI tool, add this week's numbers,
          and chart the trend.
    result: |
      Maya opens the report from her bookmark on Monday, sees only data she is allowed to see, and
      the CCB trend chart updates from the same definition every week.

  - type: callout
    variant: version-note
    versions: ["Older releases", "Newer releases", "Windchill+"]
    md: |
      Older Windchill releases shipped an optional business-reporting add-on for charts and dashboards;
      later releases retired it. Today most companies export report results into a spreadsheet or
      BI tool, or use ThingWorx-based apps for live dashboards. On **Windchill+** check which export
      and integration options your service includes before promising a live dashboard.

  - type: example
    variant: case-study
    title: Maya's three-number CCB dashboard
    industry: Micromobility
    md: |
      **Before.** Jordan's first report listed every open change request in E-Bike E1 - 400 rows, 14
      columns. Maya skimmed it, gave up and asked Kai for "a rough number" before each CCB.

      **What Jordan changed.**
      1. He asked Maya which **decision** the CCB makes each week: "Which changes do we push, and are we
         keeping up?"
      2. He built two templates instead of one big one:
         - *"CCB - open change requests by age"*: count per age band (0-7, 8-30, over 30 days), with
           product as a parameter.
         - *"CCB - changes closed this week"*: count of change notices resolved in the last 7 days.
      3. Every Monday the results are exported to a spreadsheet that charts **three numbers**: open
         over 30 days, opened this week, closed this week.
      4. The live table stays one click away for drilling into the oldest changes.

      **After.** Within six weeks the CCB noticed that changes over 30 days were rising whenever Leo
      (quality) was on the road - reviews were waiting on him. They added a delegate. The over-30-day
      count dropped from 19 to 6.
    takeaway: Start from the decision a manager makes, then pick the smallest set of numbers that informs it.

  - type: comparison
    title: "Cheat sheet: metrics a manager will actually use"
    columns: [Question it answers, Built from, Watch out for]
    rows:
      - label: Open changes by age
        cells: ["Are changes getting stuck?", "Change requests or notices + state + created date, grouped into age bands", "Define 'open' once (which states count) and write it in the description"]
      - label: Opened vs closed per week
        cells: ["Are we keeping up?", "Count of changes created and resolved per week", "Compare trends, not single weeks - one big release distorts a week"]
      - label: Change cycle time
        cells: ["How long from request to implemented?", "Created date of the request + resolution date of the change notice (joined)", "Use the median, not the average - one 300-day change ruins an average"]
      - label: Overdue tasks by person or role
        cells: ["Where is the bottleneck?", "Workflow tasks + assignee + due date", "Show roles or teams in shared dashboards; naming individuals publicly backfires"]
      - label: Parts released per week
        cells: ["Is the design maturing on plan?", "Parts + state Released + state change date, per product", "Count each part once, not each iteration"]
      - label: Parts still In Work near launch
        cells: ["What could block the launch?", "Parts in a product + state In Work, with owner", "Filter to the product's top-level structure, or library parts inflate it"]
      - label: Reuse ratio
        cells: ["Are designers reusing or reinventing?", "New parts created vs existing library parts used in a product", "Agree what counts as 'reused' (library only, or any existing part)"]
    takeaway: "Pick 3 to 5. Each one must answer a question somebody acts on. If nobody would change a decision when the number moves, drop it."

  - type: callout
    variant: pitfall
    title: The vanity dashboard
    md: |
      "Total parts in Windchill: 48,213" looks impressive and changes nothing. Neither does a dashboard
      with 22 charts. Big totals and long lists feel like reporting but don't support a decision. If a
      number only ever goes up, it's probably a vanity metric.

  - type: callout
    variant: pro-tip
    md: |
      Write each metric's **definition** in the report template's description and in the dashboard's
      footer - which states count as "open", which dates are used, which contexts are included. When the
      CCB and the finance team disagree about a number, a written definition ends the argument in
      one minute.

  - type: quiz
    questions:
      - kind: single
        prompt: Maya runs Jordan's report and gets zero rows. Jordan gets 42. What should Jordan check first?
        options:
          - Whether Maya has read access to the data in E-Bike E1
          - Whether the template has enough columns
          - Whether the sort order is correct
          - Whether Maya's browser is out of date
        answer: 0
        explanation: Results respect each user's access. Administrators see everything, so "it works for me" proves little.
      - kind: multi
        prompt: Which of these are good dashboard metrics for a CCB? (Choose all that apply.)
        options: [Open changes over 30 days, Total number of documents ever created, Changes opened vs closed per week, Median change cycle time]
        answers: [0, 2, 3]
        explanation: Each of these answers a question the CCB acts on. A grand total only goes up and doesn't change a decision.
      - kind: truefalse
        prompt: For a cycle-time metric, the median is usually more honest than the average.
        answer: true
        explanation: A single change that sat for 300 days pulls the average up sharply. The median shows the typical change.

  - type: summary
    points:
      - Delivery matters as much as the query - context, access, an easy path to run it.
      - Results are filtered by each user's access; test as the user, not as an admin.
      - Trends come from exporting the same report on a schedule and charting it.
      - Pick 3-5 metrics tied to a decision; write down each definition.
