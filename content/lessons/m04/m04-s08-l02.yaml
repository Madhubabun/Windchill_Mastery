id: m04-s08-l02
subtitle: A report nobody opens is just a query. Get it to the right people, and pick numbers that change decisions.
version: 1.0.0
updated: "2026-10-05"
tags: [reporting, dashboards, metrics, business-admin]

blocks:
  - type: text
    md: |
      Jordan's first report for Maya worked perfectly - and she opened it twice. Why? It returned
      400 rows, she had to find it herself, and it didn't answer the question her CCB actually asks:
      **"Are we getting faster or slower at closing changes?"**

      Building a [[report-template]] is half the job. The other half is **delivery**: who can run it,
      where they find it, and which handful of numbers they look at every week.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "who's allowed to run it" → *access to the report template* (set by context and access policy)
      - "the blank the user fills in" → *parameter*
      - "a number you watch over time" → *metric* or *KPI* (key performance indicator)
      - "a few metrics on one page" → *dashboard*
      - "a file you open in a spreadsheet or BI tool" → *export* (CSV / Excel)

  - type: animation
    title: From template to the Monday meeting
    diagram:
      width: 820
      height: 330
      nodes:
        - { id: tpl, label: Report template, sublabel: in E-Bike E1, x: 20, y: 40, w: 170, tone: primary, shape: doc }
        - { id: access, label: Access check, sublabel: who may run it, x: 230, y: 40, w: 160, tone: warning }
        - { id: run, label: Run, sublabel: user picks parameters, x: 430, y: 40, w: 160, tone: accent, shape: pill }
        - { id: table, label: On-screen table, sublabel: live rows, x: 640, y: 40, w: 160, tone: info }
        - { id: export, label: Export, sublabel: CSV / Excel, x: 430, y: 200, w: 160, tone: info, shape: doc }
        - { id: dash, label: Dashboard, sublabel: 3-5 numbers + trend, x: 640, y: 200, w: 160, h: 70, tone: success }
        - { id: ccb, label: CCB meeting, sublabel: Maya decides, x: 230, y: 200, w: 160, tone: primary, shape: pill }
      edges:
        - { from: tpl, to: access }
        - { from: access, to: run }
