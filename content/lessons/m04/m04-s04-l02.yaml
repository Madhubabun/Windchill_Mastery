id: m04-s04-l02
subtitle: One definition, many types. Then fence the values so bad data can't get in.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, attributes, global-attribute, local-attribute, constraints]

blocks:
  - type: text
    md: |
      E-Bike Part exists. Now it needs fields. Jordan has to make two choices for each one:

      1. **Where does the field live?** In a shared library so other types can reuse it
         (**global**), or only on this one type (**local**)?
      2. **What values are allowed?** "48", "48V", "forty-eight" and "480" (a typo) should not all be
         possible. Rules on a field are called **constraints**.

      Get these right on day one and the data stays clean for years. Get them wrong and someone
      spends next summer cleaning spreadsheets.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a field defined once, reused on many types" → *[[global-attribute]]* (built on a reusable attribute)
      - "a field that belongs to one type" → *[[local-attribute]]*
      - "a rule on a field" → *[[attribute-constraint]]* (Value Required, Range, String Length...)
      - "what kind of value" → *data type* (String, Integer, Real Number, Real Number with Units, Boolean, Date and Time, URL)

  - type: diagram
    title: Global vs local, at Acme
    caption: Global attributes live in a shared library and get attached to many types. Local ones belong to one type. Click to explore.
    diagram:
      width: 800
      height: 420
      groups:
        - { label: Reusable attribute library, x: 20, y: 20, w: 240, h: 380, tone: neutral }
        - { label: Types, x: 300, y: 20, w: 480, h: 380, tone: info }
      nodes:
        - id: lib-voltage
          label: Battery Voltage
          sublabel: real number · V
          x: 40
          y: 70
          w: 200
          tone: primary
          shape: cylinder
          detail: |
            Defined **once**: name, data type, units. Jordan adds it to E-Bike Part *and* to the scooter
            battery parts. A search for "Battery Voltage = 48 V" finds both.
        - id: lib-power
          label: Motor Power
          sublabel: real number · W
          x: 40
          y: 180
          w: 200
          tone: primary
          shape: cylinder
          detail: Scooter S2 has motors too, so Motor Power is defined globally and reused.
        - id: lib-ip
          label: IP Rating
          sublabel: "string · IP54/65/67"
          x: 40
          y: 290
          w: 200
          tone: primary
          shape: cylinder
          detail: Chargers, displays and motors all have IP ratings. One definition keeps reports consistent. Its pick-list comes in the next lesson.
        - id: t-ebike
          label: E-Bike Part
          sublabel: uses 3 global + 1 local
          x: 340
          y: 120
          w: 200
          h: 64
          tone: accent
          detail: Gets all three global attributes, plus one **local** attribute that only makes sense for e-bikes.
        - id: t-scooter
          label: Scooter battery part
          sublabel: uses Battery Voltage
          x: 340
          y: 280
          w: 200
          tone: info
          detail: A Scooter S2 part type reuses the same Battery Voltage definition. Same name, same unit, same search.
        - id: local
          label: Pedal Assist Levels
          sublabel: local integer
          x: 580
          y: 120
          w: 180
          tone: warning
          detail: |
            A **local** attribute on E-Bike Part. Scooters have no pedals, so nothing else will ever
            need it. It's inherited by E-Bike Part's own subtypes, but you can't attach it to
            unrelated types.
      edges:
        - { from: lib-voltage, to: t-ebike }
        - { from: lib-power, to: t-ebike }
