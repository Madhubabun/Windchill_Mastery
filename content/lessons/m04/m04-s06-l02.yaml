blocks:
  - type: text
    md: |
      In Module 3 you received review tasks, picked an answer and clicked **Complete Task**, and
      watched the work move on. Each of those tasks was a box on a drawing that an admin made in the
      **workflow template editor**.

      Jordan's assignment this week comes from Leo in Quality. Battery **test reports** for E-Bike E1
      need a short, reliable review:

      1. A **Quality Reviewer** approves or rejects the report - and must say why if he rejects.
      2. Rejected? The report's author fixes it, then it goes back for review.
      3. Approved? Release it and tell the author. No humans needed for that last bit.

      Three lines of English. Let's turn them into a [[workflow]].

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a box a person has to work on" → *assigned activity* (it shows up as a [[task]])
      - "a box the system does by itself" → [[workflow-robot|robot]]
      - "a junction where paths wait or merge" → *connector* (And, Or, Threshold, Conditional)
      - "where a path stops" → *terminal* (End stops everything, Ground stops one branch)
      - "the arrows between boxes" → *links*; "the answer a person picks" → *routing event*
      - "a named value the workflow remembers" → [[workflow-variable]]
      - "the object the workflow is about" → *primary business object*

  - type: diagram
    title: Test Report Review, as Jordan draws it
    caption: Blue boxes are people, green pills are robots, grey circles are connectors and terminals. Click any box.
    diagram:
      width: 840
      height: 430
      groups:
        - { label: Happy path, x: 10, y: 20, w: 820, h: 130, tone: success }
        - { label: Rework loop, x: 150, y: 250, w: 420, h: 160, tone: warning }
      nodes:
        - id: start
          label: Start
          x: 20
          y: 60
          w: 75
          tone: neutral
          shape: circle
          detail: Every process has exactly one Start connector. You can't remove or duplicate it.
        - id: or
          label: Or
          x: 120
          y: 60
          w: 70
          tone: neutral
          shape: circle
          detail: |
            An **Or** connector continues as soon as **any** incoming link fires - either the first
            pass from Start or a fixed report coming back from the rework loop.
        - id: review
          label: Review report
          sublabel: role Quality Reviewer
          x: 220
          y: 60
          w: 170
          tone: primary
          detail: |
            An **assigned activity**. Participants: the **Quality Reviewer** role, resolved through the
            team, so Leo gets the task. Routing type **Manual Exclusive** with two routing events,
            *Approve* and *Reject* - the reviewer may pick exactly one. The variable `reviewComments` is
            visible and **required**.
          real: Use roles here, never named users. Teams change; templates shouldn't have to.
        - id: release
          label: Set State
          sublabel: Released
          x: 420
          y: 60
          w: 120
          tone: success
          shape: pill
          detail: A method robot with Robot Type **Set State** and the specific state Released. It starts only when the review emits *Approve*.
        - id: notify
          label: Notification
          sublabel: tell the author
          x: 570
          y: 60
          w: 130
          tone: success
          shape: pill
          detail: A Notification robot tells the report's creator it has been released.
        - id: end
          label: End
          x: 735
          y: 60
          w: 75
          tone: neutral
          shape: circle
          detail: The End terminal stops the whole process. Any still-active tasks are removed from task lists. Every workflow must eventually reach End.
        - id: fix
          label: Fix report
          sublabel: Creator actor
          x: 250
          y: 300
          w: 170
          tone: primary
          detail: |
            Another assigned activity, assigned to the **Creator** actor - whoever created the report.
            It shows `reviewComments` read-only, so the author sees exactly what Leo asked for.
      edges:
        - { from: start, to: or }
        - { from: or, to: review }
        - { from: review, to: release, label: Approve }
        - { from: release, to: notify }
        - { from: notify, to: end }
        - { from: review, to: fix, label: "Reject (loop link)" }
        - { from: fix, to: or, label: Fire, dashed: true }

  - type: callout
    variant: why-it-matters
    md: |
      Workflows turn "we usually email Leo" into a process that **always** happens the same way,
      records who decided what and when, and never forgets to tell the author. That record is exactly
      what an ISO auditor or a customer asks to see.

  - type: comparison
    title: The editor's toolbox
    columns: [What it is, Who does the work, In Jordan's workflow]
    rows:
      - label: Assigned activity
        cells: ["A task for people", "The users, groups, roles or actors on its Participants tab", "Review report, Fix report"]
      - label: Robot
        cells: ["An automatic step", "The system", "Set State (Released), Notification"]
      - label: Connector
        cells: ["Waits for or merges paths: And waits for all, Or for any, Threshold for a set number", "The system", "One Or, merging the first pass and the rework loop"]
      - label: Terminal
        cells: ["Ends a path: End stops the process, Ground stops one branch", "The system", "End"]
      - label: Link
        cells: ["An arrow that fires when the source node emits an event", "-", "Six links, one marked as a loop link"]
      - label: Variable
        cells: ["A named value stored with each running process", "Set by tasks or expressions", "reviewComments (text)"]
    takeaway: People-boxes, robot-boxes, junctions, end points, arrows and memory. Every workflow is built from these.

  - type: walkthrough
    title: Build the Test Report Review workflow
    who: An organization administrator (the course builds workflows at organization level)
    where: [Browse, Organizations, "Acme Mobility", Utilities, Workflow Template Administration]
    steps:
      - title: Create the template
        where: [Browse, Organizations, "Acme Mobility", Utilities, Workflow Template Administration, New template]
        md: |
          Click **New template**. The workflow editor opens with a Start node. Open **Properties**
          (next to the Location menu) and on the **General** tab set the name `Test Report Review`, a
          category, a description and a **Responsible Role** - the backup used when role resolution
          fails and the recipient of error and deadline notices. If you leave it empty, the process
          initiator plays that part.
      - title: Add the global variable
        where: [Workflow editor, Properties, Variables]
        md: |
          On the template's **Variables** tab add `reviewComments`, a text variable used by the whole
          process.
      - title: Draw and configure the people steps
        where: [Workflow editor, Assigned Activity]
        md: |
          Drop two assigned activities and click each one's link to open its properties. **Review
          report**: on **Participants** pick the role *Quality Reviewer*; on **Routing** choose
          *Manual Exclusive* and enter the events *Approve* and *Reject*; on **Variables** make
          `reviewComments` visible and required. **Fix report**: participant *Creator* (an actor);
          `reviewComments` visible and read-only. Write clear **Instructions** on each Activity tab.
      - title: Add robots, connector and End
        where: [Workflow editor, Method Robot]
        md: |
          Add a **Method Robot**, set Robot Type to **Set State** with the specific state *Released*.
          Add a **Notification** robot for the creator, an **Or Connector** and an **End** node.
      - title: Link and set link properties
        where: [Workflow editor, Action]
        md: |
          Use the **Action** link tool: Start → Or → Review → Set State → Notification → End, Review →
          Fix → Or. Click each link's question mark: on Review → Set State, map *Approve* to **Start**;
          on Review → Fix, map *Reject* to **Start** and tick **Loop Link**; on Fix → Or, map
          *Complete* to **Fire**.
      - title: Validate, check in, attach
        where: [Workflow Template Administration, "Test Report Review", Check In]
        md: |
          Use **Process → Validate All** and save. Close the editor, then right-click the template in
          the table and **Check In**. Finally attach it to the *In Work* phase of the test reports'
          advanced life cycle (the life cycle's **Workflow** tab, **Phase Process**), and clear the
          Gate Process.
    result: |
      When a test report enters In Work, its phase workflow starts automatically and Leo gets a
      **Review report** task. Running processes can be inspected in the **Workflow Process
      Administration** utility.

  - type: callout
    variant: note
    title: Which iteration runs?
    md: |
      Workflow templates are iterated. When you attach one to a life cycle state, **Use Latest
      Iteration** is ticked by default: new processes start from the latest checked-in iteration (while
      you have it checked out, they keep using the last checked-in one). Untick it to pin the current
      iteration. Either way, processes **already running** are not affected by newer iterations.

  - type: simulation
    title: Run the review
    intro: |
      You are the process engine. Launch the workflow on the test report **TR-0042 Battery pack drop
      test** and play Leo and the author. Try to reject without a comment - the required variable will
      stop you.
    headline: "Step: {step} · TR-0042 is {state} · rework rounds: {rounds}"
    initial: { step: Not started, state: In Work, rounds: 0, comment: empty }
    actions:
      - id: launch
        label: Report enters In Work (process starts)
        when: { step: [Not started, Completed] }
        do: [{ set: { step: Review report, state: In Work, comment: empty, rounds: 0 } }]
        log: "Start fired, the Or connector passed it on. Leo (Quality Reviewer) gets a task: Review report."
        blockedHint: The process is already running.
      - id: comment
        label: "Leo: type review comments"
        when: { step: Review report, comment: empty }
        do: [{ set: { comment: "drop height missing" } }]
        log: "reviewComments = \"{comment}\""
        blockedHint: Only the reviewer, during the review, edits the comments.
      - id: reject
        label: "Leo: Reject"
        when: { step: Review report, comment: "drop height missing", rounds: [0, 1, 2, 3, 4] }
        do: [{ set: { step: Fix report } }, { inc: rounds }]
        log: "Reject emitted. The loop link starts Fix report for the author, with the comment: {comment}."
        blockedHint: reviewComments is required on this task - type a comment before rejecting. (This sandbox allows five rework rounds; then approve or relaunch.)
      - id: fix
        label: "Author: complete Fix report"
        when: { step: Fix report }
        do: [{ set: { step: Review report, comment: empty } }]
        log: Fix report completed and fired the Or connector. Thanks to the loop link, Review report runs again.
        blockedHint: There is no fix task right now.
      - id: approve
        label: "Leo: Approve"
        when: { step: Review report }
        do: [{ set: { step: Completed, state: Released } }]
        log: "Approve emitted. Robots ran: Set State → Released, then Notification → author. End reached - process complete."
        blockedHint: Approve is only possible during the review.
    goals:
      - label: Send the report back for rework with a reason
        when: { step: Fix report }
        message: The Reject routing event chose the rework path, and the required variable made sure the author knows why.
      - label: Release TR-0042 after at least one rework round
        when: { state: Released, rounds: 1 }
        message: One loop, then approval. Robots did the state change and the notification with no human clicks.

  - type: example
    variant: real-world
    title: The workflow that waited for Bob
    industry: Micromobility
    md: |
      Acme's first-ever workflow assigned reviews to a **named user**, Bob. Bob went on parental
      leave; forty processes sat in his task list for three weeks. Jordan's rebuild uses the
      **Quality Reviewer** role. Rosa added that role to Windchill's role list, and each product's team
      says who plays it - when someone is away, the product manager swaps the team member.
    takeaway: Roles in templates, names in teams.

  - type: callout
    variant: pitfall
    md: |
      **Forgetting the loop link or the End.** A node disables itself when it finishes, so an ordinary
      link pointing back into an earlier step does nothing - mark the **first link of the return loop**
      as a loop link so the loop's nodes are re-enabled. And every path must eventually reach an **End**
      terminal, or the process never stops without an administrator stepping in.

  - type: callout
    variant: pro-tip
    md: |
      Don't reuse the out-of-the-box **Reviewer** and **Approver** roles in your own workflows - the
      course warns they are used by the promotion transition, and duplicating them invites conflicts.
      Create purpose-named roles such as *Quality Reviewer* instead, and name routing events as verbs
      people understand: *Approve*, *Reject*, *Need info*.

  - type: quiz
    questions:
      - kind: single
        prompt: In Jordan's workflow, which element moves TR-0042 to Released without anyone clicking anything?
        options: [An assigned activity, A method robot of type Set State, The Or connector, The reviewComments variable]
        answer: 1
        explanation: Robots are automatic steps. The Set State method robot changes the life cycle state of the primary business object the moment the Approve link starts it.
      - kind: multi
        prompt: Which settings belong on the **Review report** activity? (Choose all that apply.)
        options: [Participants - the Quality Reviewer role, Routing type Manual Exclusive with Approve and Reject, reviewComments visible and required, The list of life cycle states]
        answers: [0, 1, 2]
        explanation: An activity has participants, routing and variables. Life cycle states are defined elsewhere and used by the life cycle template.
      - kind: truefalse
        prompt: An And connector continues as soon as any one of its incoming links fires.
        answer: false
        explanation: And waits for every incoming link. Or continues on the first one. Threshold continues after a set number.
      - kind: single
        prompt: Jordan checks in iteration 2 of the workflow while 12 reports are mid-review. With Use Latest Iteration ticked, what happens?
        options:
          - All 12 running processes switch to iteration 2
          - Running processes are unaffected; reports entering In Work from now on start iteration 2
          - Nothing uses iteration 2 until the life cycle is edited
        answer: 1
        explanation: Latest iteration applies to processes started after check-in. Processes already running stay on the iteration they started with.

  - type: summary
    points:
      - Workflows are built from assigned activities, robots, connectors, terminals, links and variables.
      - Activities assign work to roles or actors. Routing events such as Approve and Reject decide which link fires.
      - Variables carry information between steps - make the important ones required.
      - Loops need a loop link; every path must reach End.
      - Attach the workflow to a state of an advanced life cycle. New iterations never affect running processes.
