id: m04-s06-l02
subtitle: The life cycle says where an object can go. A workflow says who does what to get it there - in what order.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, workflow, workflow-editor, activities, connectors, variables]
sources:
  - id: ac
    where: "Module 5: Identify process management objects; Describe workflow templates; Create a workflow template; Define workflow template properties; Assign activities in a workflow; Define assigned activities; Add connectors and terminals to a workflow; Link nodes in a workflow; Set link properties; Associate workflow templates to advanced life cycles; Identify life cycle best practices; Activity: Create a workflow template"
  - id: trn-wf-itc
    where: "Module 2: Best practices for defining participants (roles over named users). Module 4: Using loop links. Windchill 9.0 slides, used only where the 13.x course agrees"
  - id: help-center
