id: m04-s03-l03
subtitle: Every workflow-driven object gets its own team. Learn exactly how Windchill builds it.
version: 1.0.0
updated: "2026-10-05"
tags: [business-admin, roles, teams, team-instance, role-resolution, workflow]
sources:
  - id: ac
    where: "Module 6, Identify team terminology (team instance); Describe role resolution for objects not managed by workflows; Describe role resolution for workflow-driven objects; Describe team instances; Define a team instance upon object creation; Create team templates; Identify team role resolution best practices. Module 5, Define role participation in advanced life cycles; Define workflow template properties (Responsible Role). Module 7, Identify components of an OIR (team template association); Activity: Create an object to test the attributes applied by its OIR. Module 2, Delete a user account (responsible role)"

blocks:
  - type: text
    md: |
      Jordan has fixed empty roles, added groups and created a team template. Now Kai asks the
      expert question: *"When I create an e-bike document, who exactly ends up on its team - and
      why didn't the context team's Battery Safety Engineer get a task?"*

      To answer, you need to know that Windchill manages an object's life with roles in **two
      different ways**, and that in one of them it builds a private team for each object, step by
      step, from four sources. That private team is the **team instance**. The way it turns roles
      into people is **role resolution**.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the private team built for one object" → *[[team-instance]]*
      - "working out who fills each role" → *[[role-resolution]]*
      - "the person who created this object" → the *creator actor*
      - "one role standing in for another" → *role-to-role mapping* (rare)
      - "the fallback role of a workflow" → the workflow template's *responsible role*

  - type: comparison
    title: Two ways roles manage an object's life
    columns: [Through a process object, Through the object's own workflow]
    rows:
      - label: How it works
        cells: ["The object is attached to a promotion request, change task or design review, and that process does the work", "The object's life cycle starts a workflow for the object itself, at creation or on a state change"]
      - label: Batch or one by one
        cells: ["One process can mature many objects at once", "One process per object"]
      - label: Team instance for the object
        cells: ["None", "Yes - generated by Windchill"]
      - label: How roles are used
        cells: ["The context team's roles drive access control on the object", "The team instance resolves the workflow's roles to people"]
      - label: Acme example
        cells: ["Promoting 40 E-Bike E1 parts with one promotion request", "Each e-bike battery specification runs its own review workflow"]
    takeaway: No object workflow, no team instance. Most of this lesson is about the right-hand column.

  - type: animation
    title: How Windchill builds a team instance
    diagram:
      width: 800
      height: 400
      nodes:
        - { id: oir, label: 1 · Rule, sublabel: names the team template, x: 20, y: 30, w: 170, tone: neutral }
        - { id: tpl, label: 2 · Team template, sublabel: adds its roles + people, x: 20, y: 160, w: 170, tone: primary, shape: doc }
        - { id: lc, label: 3 · Life cycle state, sublabel: adds missing roles, x: 20, y: 290, w: 170, tone: primary }
        - { id: inst, label: Team instance, sublabel: EB-10024 only, x: 320, y: 150, w: 180, h: 80, tone: success }
        - { id: ctx, label: 4 · Context team, sublabel: adds people only, x: 600, y: 60, w: 180, tone: info }
        - { id: wf, label: 5 · Workflow process, sublabel: adds missing roles, x: 600, y: 250, w: 180, tone: accent }
      edges:
        - { from: oir, to: tpl, label: finds }
        - { from: tpl, to: inst, label: roles }
        - { from: lc, to: inst, label: roles }
        - { from: ctx, to: inst, label: participants, dashed: true }
        - { from: wf, to: inst, label: "roles → responsible role" }
    chapters:
      - title: The rule finds a team template
        caption: Priya creates **EB-10024**, a battery specification. Windchill reads the **object initialization rules** for its type to find a valid team template.
        show: [oir]
        highlight: [oir]
        seconds: 6
      - title: Template roles go in first
        caption: Every role in the team template is added to the new team instance. Roles the template maps to people (say *Submitter* → the **creator**) are resolved right away.
        show: [oir, tpl, inst]
        highlight: [tpl, inst]
        flow: [oir>tpl, tpl>inst]
        seconds: 7
      - title: The life cycle adds what's missing
        caption: Windchill checks the roles of the **current life cycle state**. Any role not yet in the instance is added, with the people the life cycle names for it.
        show: [oir, tpl, inst, lc]
        highlight: [lc]
        flow: [lc>inst]
        seconds: 7
      - title: The context team adds people - never roles
        caption: For each role **already** in the instance, E-Bike E1's team can add more participants. A role that only exists in the context team stays out.
        show: [oir, tpl, inst, lc, ctx]
        highlight: [ctx]
        flow: [ctx>inst]
        seconds: 8
      - title: The workflow fills the last gaps
        caption: If a workflow process has started, any process role still missing is added and resolved to the workflow template's **responsible role**.
        show: [oir, tpl, inst, lc, ctx, wf]
        highlight: [wf]
        flow: [wf>inst]
        seconds: 7
      - title: Then it's frozen
        caption: From now on, changes to the template, life cycle or context team **don't** change this instance. It's updated on the object's details page or by a Setup Participants task.
        highlight: [inst]
        seconds: 7

  - type: callout
    variant: why-it-matters
    md: |
      This is the single most common reason for "the right person never got the task". The person is
      in the product's team, the role looks fine - but the role never made it into the object's team
      instance, so the context team had nothing to add the person to. Knowing the build order turns a
      day of guessing into one check.

  - type: diagram
    title: Who can add what to a team instance
    caption: Only some sources can add roles. Click each box.
    diagram:
      width: 800
      height: 300
      groups:
        - { label: Can add roles, x: 20, y: 20, w: 470, h: 260, tone: success }
        - { label: Adds people only, x: 520, y: 20, w: 260, h: 260, tone: warning }
      nodes:
        - id: d-tpl
          label: Team template
          sublabel: roles + optional people
          x: 40
          y: 60
          w: 200
          tone: primary
          detail: |
            The first and main source. Roles can be resolved to users, the creator actor, groups or
            an organization. Best practice: map only **organization-level** positions here, and leave
            product-specific people to the context team.
        - id: d-lc
          label: Life cycle state
          sublabel: roles of the current state
          x: 270
          y: 60
          w: 200
          tone: primary
          detail: |
            Adds roles the template lacks. A life cycle role can also be mapped to another role
            (role-to-role mapping), but that is rarely used; the mapped role must eventually exist in a
            team template or context team.
        - id: d-wf
          label: Workflow process
          sublabel: last-resort roles
          x: 155
          y: 180
          w: 200
          tone: accent
          detail: |
            Process roles still missing are added and resolved to the workflow template's
            **responsible role**. If no responsible role is chosen, the process initiator fills it.
        - id: d-ctx
          label: Context team
          sublabel: augments existing roles
          x: 550
          y: 110
          w: 200
          tone: info
          detail: |
            Adds participants to roles that are **already** in the instance. It never adds a role.
            In products and libraries, a role that is in neither the life cycle nor the team template
            is left out - even if the context team has people in it.
      edges:
        - { from: d-tpl, to: d-lc, label: then }
        - { from: d-lc, to: d-ctx, label: then }
        - { from: d-ctx, to: d-wf, label: then, dashed: true }

  - type: example
    variant: real-world
    title: The battery safety review nobody received
    industry: Micromobility
    md: |
      Acme's battery specifications run their own review workflow. One activity is assigned to
      **Battery Safety Engineer**, and E-Bike E1's team has Leo in that role. Yet the first five
      specifications went to Maya instead.

      Jordan opens one specification's details: its team template is **E-Bike Document Team**, which
      lists Submitter and Reviewer - but not Battery Safety Engineer. The life cycle state didn't list
      it either. So the role only came in at the last step, from the workflow, and resolved to the
      workflow's responsible role: Maya. Jordan adds the role to the team template; the next
      specification reaches Leo. The five open ones he updates by hand.
    takeaway: If the role isn't in the template or the life cycle, the context team can't help.

  - type: scenario
    variant: what-if
    title: What if Jordan changes the team template?
    start: s1
    nodes:
      - id: s1
        md: |
          Twelve battery specifications are mid-review. Their team instances have *Reviewer* filled
          by ACME-Quality. Jordan now edits the **E-Bike Document Team** template and maps Reviewer
          to the group **ACME-Battery-Lab** instead. What happens to the twelve open specifications?
        choices:
          - label: "Nothing - their team instances keep ACME-Quality"
            next: s2
            good: true
            feedback: Correct. A team instance is unaffected by later updates to the template it came from.
          - label: "Their reviews move to ACME-Battery-Lab right away"
            next: f-move
            feedback: That would be convenient, but it's not how team instances work.
      - id: s2
        md: |
          Priya creates a **new** specification the next morning. The context team still lists
          ACME-Quality under Reviewer. Who ends up in Reviewer on the new team instance?
        choices:
          - label: "ACME-Battery-Lab from the template, plus ACME-Quality added by the context team"
            next: s3
            good: true
            feedback: Right. The template resolves the role first; the context team then augments it with its own participants.
          - label: "Only ACME-Quality - the context team always wins"
            next: f-ctx
            feedback: The context team doesn't replace template participants; it adds to them.
          - label: "Only ACME-Battery-Lab - the template always wins"
            next: f-tpl
            feedback: The template goes first, but the context team still adds its people to that role.
      - id: s3
        md: |
          Kai only wants the battery lab to review. What's the cleanest way to get there?
        choices:
          - label: "Use one master: either keep Reviewer empty in the template and fill it in the context team, or remove ACME-Quality from the context team's Reviewer"
            next: win
            good: true
            feedback: Pick one place to resolve each role. Best practice is the context team as master for product roles.
          - label: "Add every role to the template so nothing is ever missed"
            next: f-all
            feedback: That's the safety-net anti-pattern - long lists of empty roles nobody understands.
      - id: win
        md: |
          Jordan keeps the template's Reviewer empty and lets E-Bike E1's team decide. One place to
          look, one place to change. **Clean role resolution.**
        outcome: success
      - id: f-move
        md: Jordan tells Kai the open reviews moved. They didn't. ACME-Quality still has the tasks; the battery lab waits. **Wrong expectation.**
        outcome: fail
      - id: f-ctx
        md: The battery lab is surprised to get the task too - the template mapped them, and the context team only added more people. **Read the build order again.**
        outcome: partial
      - id: f-tpl
        md: ACME-Quality also gets the task, because the context team added its participants to the existing Reviewer role. **Read the build order again.**
        outcome: partial
      - id: f-all
        md: Every new specification now shows thirty roles, most of them empty. Users can't tell who actually works on the review. **More noise, same problem.**
        outcome: fail

  - type: walkthrough
    title: Inspect and update one object's team instance
    who: A user with permission to manage the object's team (for example Jordan)
    steps:
      - title: Open the object's details
        where: ["<object>", Details page]
        md: |
          Open the object, for example a battery specification. Its properties show the life cycle
          template, the current state and the **team template** applied when it was created.
      - title: Review the team instance
        where: ["<object>", Details page, Team]
        md: |
          Look at the roles and participants of the object's own team. A role you expected but
          can't find never made it in from the template or the life cycle.
      - title: Update it if you have permission
        where: ["<object>", Details page, Team]
        md: |
          With the right permissions you can update the team instance here - add the missing
          participants so the open process reaches the right people. Workflow designers can also
          give users a **Setup Participants** task to do this as part of the process.
      - title: Fix the source for next time
        where: [Utilities, Team Administration]
        md: Add the role to the team template (or the life cycle state) so new objects get it automatically.
    result: The open object's team instance names the right people, and new objects of that type are built correctly.

  - type: callout
    variant: note
    title: Projects work differently
    md: |
      Windchill **project** business objects don't use team templates. Their roles and participants
      come from the life cycle template, the workflow template, the context team and the choices made
      when an object is routed.

  - type: callout
    variant: pitfall
    title: Two workflows, two answers for the same role
    md: |
      If *Product Manager* is used in both a document workflow and a change workflow, it must resolve
      to the same person in both. Resolve product roles in **one** place - ideally the context team -
      and keep team templates for organization-wide positions.

  - type: callout
    variant: pro-tip
    md: |
      When you design a new workflow, write down every role its activities use and tick each one off
      against the team template or the life cycle state **before** go-live. That ten-minute check
      prevents the most common team instance bug.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Forty E-Bike E1 parts are promoted with one promotion request. The parts themselves have no workflow. Do the parts get team instances?
        options:
          - "No - roles act through the context team for access, and the promotion request runs the process"
          - "Yes - one team instance per part"
          - "Yes - one shared team instance for all forty"
          - "Only if the context team has a Reviewer"
        answer: 0
        explanation: Team instances are generated when an object initiates its own workflow-driven process. Objects managed through a process object don't get one.
      - kind: order
        prompt: Put the steps Windchill uses to build a team instance in order.
        items:
          - Find a valid team template through the object initialization rules
          - Add the team template's roles and resolve its mapped participants
          - Add missing roles from the current life cycle state
          - Let the context team add participants to existing roles
          - Add missing workflow process roles, resolved to the responsible role
        explanation: Template, life cycle, context team, workflow - and only the context team can't add roles.
      - kind: truefalse
        prompt: The context team can add a new role to a team instance if the role has participants in the context team.
        answer: false
        explanation: The context team only augments roles that already exist in the team instance with more participants.
      - kind: single
        prompt: A workflow role is missing from the template, the life cycle and the context team. Who gets the activity?
        options:
          - "Whoever fills the workflow template's responsible role (the process initiator if none is set)"
          - "Every member of Team Members"
          - "Nobody - the workflow is deleted"
          - "The site administrator"
        answer: 0
        explanation: Missing process roles are added to the team instance and resolved to the workflow template's responsible role, which defaults to the initiator.
      - kind: multi
        prompt: Which statements about team instances are true? (Choose all that apply.)
        options:
          - "They are generated by the system when an object initiates a process"
          - "Later changes to the team template don't change existing team instances"
          - "They can be updated from the object's details page with the right permissions"
          - "Project business objects build them from team templates"
        answers: [0, 1, 2]
        explanation: Team instances are system-generated snapshots you can update by hand. Project business objects don't use team templates.

  - type: summary
    points:
      - Objects managed through a process object have no team instance; workflow-driven objects do.
      - Build order - team template, life cycle state, context team, workflow process.
      - Only the context team can't add roles; it just adds people to roles already there.
      - Missing workflow roles fall back to the workflow template's responsible role.
      - Once built, a team instance is frozen; update it on the object or with a Setup Participants task.
