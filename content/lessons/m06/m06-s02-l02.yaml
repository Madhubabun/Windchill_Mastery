id: m06-s02-l02
subtitle: Spreadsheet in, objects out. The catch - Windchill only reads XML, and only from the server.
version: 1.0.0
updated: "2026-10-06"
tags: [migration, load-files, loadfromfile, csv2xml, command-line]
