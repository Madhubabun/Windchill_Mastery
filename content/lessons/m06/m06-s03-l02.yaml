id: m06-s03-l02
subtitle: Their folders, states and views are not yours. Translate them once, on purpose, and keep the translation stable.
version: 1.0.0
updated: "2026-10-06"
tags: [migration, mapping, received-delivery, mapping-management, data-exchange]
