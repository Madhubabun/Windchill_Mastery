id: m06-cap
subtitle: Kestrel's designs have to be in Windchill by Monday. You plan it, rehearse it and prove it worked.
version: 1.0.0
updated: "2026-10-06"
tags: [capstone, migration, data-assessment, mapping, validation, cutover]
