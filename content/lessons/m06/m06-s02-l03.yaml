id: m06-s02-l03
subtitle: Pack objects into a JAR, unpack them in another Windchill, and know what to do when two objects claim the same name.
version: 1.0.0
updated: "2026-10-06"
tags: [migration, import-export, jar, ufid, conflicts, mapping-rules]
