id: m06-s04-l01
subtitle: Thirty thousand loose files and one folder called FINAL_v3. Turn them into structure you can trust.
version: 1.0.0
updated: "2026-10-06"
tags: [migration, file-share, legacy-pdm, duplicates, orphans, cad]
sources:
