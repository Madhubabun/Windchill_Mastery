id: m06-s03-l03
subtitle: "\"It imported\" is not the same as \"it's right\". Prove it with counts, content and a signature."
version: 1.0.0
updated: "2026-10-06"
tags: [migration, validation, reconciliation, sign-off, received-delivery]
