blocks:
  - type: text
    md: |
      The wheel bearing supplier just announced a 16-week delay. The factory asks the question every
      engineer dreads: **"Can we use something else?"**

      Sometimes the answer is "yes, anywhere" - a bearing from another maker is identical in every
      way. Sometimes it's "yes, but only in the scooter wheel" - it's fine at scooter speeds but not
      in the e-bike hub. Windchill has a different tool for each answer: an **alternate** and a
      **substitute**. Windchill calls them together *replacement parts*.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "can replace this part anywhere it's used" → *[[alternate-part|alternate]]* (global)
      - "works both ways round" → *two-way alternate*; "only this way round" → *one-way alternate*
      - "can replace this part, but only in this one assembly" → *[[substitute-part|substitute]]* (local)
      - "the plan B parts, together" → *replacement parts*, set up with *Manage Replacements*

  - type: diagram
    title: Where each one lives
    caption: An alternate is good wherever the part is used. A substitute is good in one assembly only. Click to explore.
    diagram:
      width: 820
      height: 420
      groups:
        - { label: "Alternate - global", x: 10, y: 10, w: 390, h: 400, tone: info }
        - { label: "Substitute - one assembly only", x: 420, y: 10, w: 390, h: 400, tone: warning }
      nodes:
        - id: screw
          label: M6 screw
          sublabel: FS-0620
          x: 30
          y: 60
          w: 160
          tone: primary
          detail: The library screw used across scooters and e-bikes.
        - id: screw-alt
          label: M6 screw, maker B
          sublabel: FS-0621 · two-way
          x: 220
          y: 60
          w: 160
          tone: success
          detail: |
            Identical spec from a second supplier. Defined as an **alternate** of FS-0620, so it may
            be used in **every** assembly that uses FS-0620 - frame, handlebar, e-bike, anything.
            Because it's identical, it's set up as **two-way**: FS-0620 may stand in for it too.
        - id: frame
          label: Frame SC-2000
          x: 30
          y: 230
          w: 160
          tone: neutral
          detail: Uses FS-0620. The alternate is approved here too, because an alternate covers every assembly that uses the part.
        - id: ebike
          label: E-bike frame EB-2000
          x: 220
          y: 230
          w: 160
          tone: neutral
          detail: Also uses FS-0620, so the alternate applies here too. One definition, every use.
        - id: wheel
          label: Wheel SC-3100
          sublabel: scooter
          x: 440
          y: 60
          w: 160
          tone: neutral
          detail: The scooter wheel. Its BOM line for the bearing carries a substitute.
        - id: line
          label: "Line: bearing ×2"
          sublabel: SC-3120
          x: 440
          y: 180
          w: 160
          tone: primary
          detail: |
            The wheel's use of bearing SC-3120. The **substitute** is defined in the wheel's
            structure, so it only applies when this bearing is used in this wheel.
        - id: sub
          label: Bearing SC-3125
          sublabel: substitute here only
          x: 630
          y: 180
          w: 160
          tone: success
          detail: Fine at scooter speeds. Allowed as a stand-in for SC-3120 inside wheel SC-3100 only.
        - id: hub
          label: E-bike hub EB-3300
          sublabel: also uses SC-3120
          x: 440
          y: 320
          w: 180
          tone: danger
          detail: |
            Also uses bearing SC-3120 - but **no** substitute here. The hub spins faster under motor
            load, so SC-3125 isn't qualified. A substitute keeps the stand-in where it's safe.
      edges:
        - { from: screw, to: screw-alt, label: alternate, dashed: true }
        - { from: frame, to: screw, label: uses }
        - { from: ebike, to: screw, label: uses }
        - { from: wheel, to: line }
        - { from: line, to: sub, label: substitute, dashed: true }

  - type: comparison
    title: Alternate vs substitute
    columns: [Alternate, Substitute]
    rows:
      - { label: Applies, cells: [Everywhere the original part is used, Only in one parent's use of the part] }
      - { label: Direction, cells: ["One-way or two-way", Stand-in for the specified part in that assembly] }
      - { label: Set up with, cells: ["Manage Replacements > Add Alternate Part", "Manage Replacements > Add Substitute Part"] }
      - { label: Typical reason, cells: ["Second source, identical spec", Good enough in this assembly only] }
      - { label: Typical owner (general practice), cells: ["Component engineering, sourcing", The assembly's design engineer] }
      - { label: Example, cells: [FS-0621 for FS-0620 everywhere, SC-3125 for SC-3120 in wheel SC-3100] }
    takeaway: "Ask: is the stand-in OK everywhere (alternate) or only here (substitute)?"

  - type: callout
    variant: why-it-matters
    md: |
      Supply shortages are normal, not rare. When planners and ERP know which replacements are
      already **approved**, a delay becomes a swap instead of a line stop. And because the approval
      is recorded at the right scope - every use, or one assembly - nobody uses a stand-in where it
      was never qualified.

  - type: example
    variant: case-study
    title: The bearing shortage
    industry: Micromobility
    md: |
      When bearing SC-3120 slipped by 16 weeks, Acme's engineers tested SC-3125 from another maker.
      Results: fine in the scooter wheel, **not** fine in the e-bike hub, which runs hotter and faster.

      A first draft defined SC-3125 as an **alternate** of SC-3120. Kai's review caught it - an
      alternate would have approved SC-3125 in the e-bike hub too. They removed it and added SC-3125
      as a **substitute** for SC-3120 in the wheel's structure instead. The scooter line kept running; the
      e-bike team waited for the original bearing.
    takeaway: An alternate is a promise about every use. Only make it if you've checked every use.

  - type: walkthrough
    title: Add an alternate or a substitute
    who: Engineers with the right permissions
    where: ["<assembly> information page", Structure tab, Manage Replacements]
    steps:
      - title: Open Manage Replacements
        where: ["SC-3100 information page", Structure tab, "right-click SC-3120", Manage Replacements]
        md: |
          On the Structure tab, select the part that may be replaced (bearing **SC-3120** under the
          wheel) and choose **Manage Replacements** from the right-click menu. The window has an
          **Alternates** table and a **Substitutes** table.
      - title: Add an alternate
        where: [Manage Replacements, Alternates, Add Alternate Part]
        md: |
          Click **Add Alternate Part**, search, select the part and click OK. In the **Two-Way**
          column, choose *Yes* if each part can stand in for the other; the default is *No*
          (one-way).
      - title: Or add a substitute
        where: [Manage Replacements, Substitutes, Add Substitute Part]
        md: |
          Click **Add Substitute Part**, search for **SC-3125** and click OK. It applies only in this
          assembly's structure.
      - title: Finish and check
        where: [Manage Replacements, OK]
        md: |
          Click **OK**. The replacements appear under the selected part in the structure. If the
          parent was checked out along the way, check it in with a comment such as "SC-3125
          substitute approved for SC-3100 only - test report DOC-0711".
    result: Everyone can see which stand-ins are approved, and where. The Multi-Level BOM with Replacements report lists them for people outside Windchill.

  - type: callout
    variant: pitfall
    md: |
      **Using Replace when you meant "plan B".** *Replace* (lesson 2) swaps the part on the line in
      a new iteration of the parent. Alternates and substitutes keep the original as the primary
      choice and record an approved stand-in. Don't swap the BOM for a temporary shortage - and if
      you do swap one in, **Replace with Alternate/Substitute** offers only the approved ones.

  - type: callout
    variant: pro-tip
    md: |
      Before creating an alternate, run a **where-used** on the original part (next lesson). If any
      parent can't accept the stand-in, you need a substitute on the parents that can - not an
      alternate.

  - type: callout
    variant: note
    md: |
      Direction matters for alternates: a one-way alternate may replace the original, but not the
      other way round. How replacement parts reach ERP depends on your company's integration -
      check the rule before relying on a replacement in production.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: A second supplier's M6 screw is identical in every way and can be used anywhere. What should you create?
        options: [A substitute on every BOM line, An alternate, A Replace in every assembly, A new revision of the screw]
        answer: 1
        explanation: An alternate is defined once and applies wherever the screw is used - and since the parts are identical, make it two-way. Substitutes would mean one per assembly.
      - kind: single
        prompt: A cheaper bearing is qualified only for the scooter wheel, not the e-bike hub. What fits?
        options: [An alternate, A substitute on the wheel's bearing line, Replace the bearing everywhere, Nothing - just tell the factory]
        answer: 1
        explanation: A substitute applies only in the assembly where you define it. The e-bike hub is untouched.
      - kind: truefalse
        prompt: A one-way alternate means the two parts can always stand in for each other.
        answer: false
        explanation: One-way means the alternate may replace the specified part, not the reverse. Set the Two-Way column to Yes only if both directions are safe.
      - kind: multi
        prompt: Which statements about alternates are true? (Choose all that apply.)
        options:
          - They can be one-way or two-way
          - They apply in every assembly that uses the original part
          - They only apply in the assembly where you add them
          - They're a good fit for an identical second-source part
        answers: [0, 1, 3]
        explanation: Alternates are global, which is exactly why you must be sure the alternate works everywhere. "Only this assembly" describes a substitute.

  - type: summary
    points:
      - Alternate = OK everywhere the part is used; one-way or two-way.
      - Substitute = OK in this one assembly only.
      - Both are set up with Manage Replacements on the Structure tab.
      - Use where-used before creating an alternate to check every use.
      - Replace swaps the line; alternates and substitutes are approved plan B parts.
