id: m02-s04-l04
subtitle: Measure it, slice it, spot the difference - three superpowers for people who don't run CAD.
version: 1.1.0
updated: "2026-10-14"
tags: [visualization, measure, cross-section, compare, creo-view]
sources:
  - id: te
    where: "Module 2: Activity: Open a CAD model in Creo View (Markup tab > Measurements: Diameter, Length, apply to the view; Sectioning tab > Preset Section X/Y/Z axis, Planar, Quarter Cut, View Section; Isolate, Orientation; Save Annotation Set with Include section)"
  - id: trn-pdmlink
    where: "02 Navigation: Creo View lets you view, annotate, analyze, measure and animate CAD documents and parts"
  - id: hc-cv-compare
    label: PTC Help Center supplement
    title: "Comparing in Creo View Desktop"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/wvsvisual/WVSComparingInCVClient.html"
    covers: "Compare two versions: History tab, select a version, Open in Creo View, then Tools > Compare; Creo View compares MCAD designs, structure, BOMs, drawings and images"
  - id: hc-struct-compare
    label: PTC Help Center supplement
    title: "Compare to Part Structure"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/prodstructure/PMStructureComparePart.html"
    covers: "Windchill structure compare shows added or removed parts and attribute differences such as quantity"

blocks:
  - type: text
    md: |
      Looking at a model is nice. But real questions sound like this:

      - "Will a 32 mm clamp fit around the frame tube?" → you need to **measure**.
      - "Is there a reinforcement rib inside that joint?" → you need to **look inside**.
      - "What actually changed between A.4 and B.1?" → you need to **compare**.

      Creo View can answer all three - no CAD tool, no asking a designer to "just quickly check".

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "use a virtual ruler" → *measure* (on Creo View's **Markup** tab, for example *Diameter* or *Length*)
      - "slice it open" → *[[cross-section]]* (Creo View's **Sectioning** tab)
      - "cut away a quarter to look in" → *Quarter Cut*
      - "spot the difference" → *compare* (Creo View's **Tools > Compare**)

  - type: diagram
    title: Three questions, three tools
    caption: Click each tool to see what it answers - and its catch.
    diagram:
      width: 800
      height: 380
      nodes:
        - id: model
          label: Frame SC-2000
          sublabel: representation B.1
          x: 300
          y: 20
          w: 200
          h: 60
          tone: info
          shape: doc
          detail: The published representation of the frame assembly. All three tools work on this light copy, never on the CAD file.
        - id: measure
          label: Measure
          sublabel: how big? how far?
          x: 30
          y: 170
          w: 200
          tone: primary
          detail: |
            Pick a measurement type, click the edge or face, and the value appears in a label you can
            apply to the view. **Catch:** a viewer measurement is a check, not the spec - the released
            drawing with its tolerances is the official definition (general engineering practice).
          real: Buyers often measure envelope sizes for packaging and shipping quotes.
        - id: section
          label: Cross-section
          sublabel: "what's inside?"
          x: 300
          y: 170
          w: 200
          tone: accent
          detail: |
            Cut the model along the X, Y or Z axis with a preset section, or use **Quarter Cut** to
            remove a quarter. Hidden ribs, wall thickness and clearances become visible. **Catch:** a
            cut only shows what lies on that plane - try the other axes before you conclude.
        - id: compare
          label: Compare
          sublabel: what changed?
          x: 570
          y: 170
          w: 200
          tone: warning
          detail: |
            Open a version from the **History** tab in Creo View and use **Tools > Compare** against
            another one. Creo View can compare designs, drawings and images. **Catch:** for a line-by-line
            BOM review with quantities and usage attributes, Windchill's *Compare to Part Structure* is
            the better tool (section 3, lesson 5).
        - id: answer1
          label: "\"The tube is 31.8 mm\""
          x: 30
          y: 290
          w: 200
          tone: success
          shape: pill
          detail: A number to sanity-check a quote request - then confirm it on the released drawing.
        - id: answer2
          label: "\"There's a gusset\""
          x: 300
          y: 290
          w: 200
          tone: success
          shape: pill
          detail: An internal feature you'd never see from outside.
        - id: answer3
          label: "\"The tab moved 5 mm\""
          x: 570
          y: 290
          w: 200
          tone: success
          shape: pill
          detail: The change you need to check against the Change Notice.
      edges:
        - { from: model, to: measure }
        - { from: model, to: section }
        - { from: model, to: compare }
        - { from: measure, to: answer1 }
        - { from: section, to: answer2 }
        - { from: compare, to: answer3 }

  - type: animation
    title: Slicing the frame joint
    diagram:
      width: 820
      height: 280
      nodes:
        - { id: outside, label: Outside view, sublabel: looks solid, x: 20, y: 110, w: 160, tone: neutral }
        - { id: plane, label: Preset section, sublabel: Sectioning tab, x: 220, y: 110, w: 160, tone: accent }
        - { id: slice1, label: Cut on X axis, sublabel: just tube wall, x: 430, y: 30, w: 170, tone: info }
        - { id: slice2, label: Cut on Y axis, sublabel: gusset visible!, x: 430, y: 190, w: 170, tone: success }
        - { id: measurewall, label: Measure wall, sublabel: 2.0 mm, x: 640, y: 110, w: 160, tone: primary, shape: pill }
      edges:
        - { from: outside, to: plane, label: add section }
        - { from: plane, to: slice1 }
        - { from: plane, to: slice2, label: other axis }
        - { from: slice2, to: measurewall }
    chapters:
      - title: From outside it tells you nothing
        caption: The steering-column joint of frame SC-2000 looks like a plain tube. Is it reinforced?
        show: [outside]
        highlight: [outside]
      - title: Add a section
        caption: On Creo View's **Sectioning** tab you choose **Preset Section > X Axis**. With *Planar* selected, the model is cut in half along that axis.
        show: [outside, plane]
        highlight: [plane]
        flow: [outside>plane]
      - title: Wrong cut, wrong answer
        caption: This cut only shows tube wall. Stop here and you'd say "no reinforcement".
        show: [outside, plane, slice1]
        highlight: [slice1]
        flow: [plane>slice1]
      - title: Try another axis
        caption: Switch to **Preset Section > Y Axis** - and a triangular **gusset** appears. A section only shows its own plane.
        show: [outside, plane, slice1, slice2]
        highlight: [slice2]
        flow: [plane>slice2]
      - title: Measure on the section
        caption: Now measure the gusset thickness on the cut face. Combine tools to answer real questions.
        highlight: [measurewall]
        flow: [slice2>measurewall]
        seconds: 7

  - type: callout
    variant: why-it-matters
    md: |
      Every "can you quickly check...?" sent to a designer costs them focus. When buyers, testers and
      change reviewers can measure, section and compare themselves, designers design - and reviewers stop
      approving changes they never actually looked at.

  - type: comparison
    title: Which compare do you need?
    columns: [Visual compare (Creo View), Structure compare (Windchill)]
    rows:
      - label: Answers
        cells: ["What does the design look like now?", "Which parts, quantities or attributes changed?"]
      - label: Example
        cells: ["Mounting tab moved 5 mm", "New bolt added; quantity 4 → 6; material changed"]
      - label: Where
        cells: ["History tab > Open in Creo View, then Tools > Compare", "Actions > Compare > Compare to Part Structure"]
    takeaway: A full change review often needs both. Creo View shows the design; structure compare lists the BOM and attribute differences.

  - type: example
    variant: real-world
    title: The clamp that almost didn't fit
    industry: Micromobility
    md: |
      Acme's buyer was sourcing a phone-holder clamp for the Scooter S2 handlebar. She opened the bar in
      Creo View and measured the diameter: **22.1 mm**. The supplier's clamp range was 22.0-22.2 mm.

      Kai asked her to check the **released drawing** before ordering. It said **22.2 ±0.1 mm** - so a
      real bar could be up to 22.3 mm, outside the clamp's range. Acme picked a clamp with a wider range.
    takeaway: Measure in the viewer to explore. For decisions that hinge on tenths of a millimetre, the released drawing and its tolerances decide.

  - type: walkthrough
    title: Take a measurement
    who: Users with Creo View (the PTC course uses Creo View Lite)
    where: [Information page, Creo View, Markup tab, Measurements]
    steps:
      - title: Open the version you need
        where: ["SC-2000 information page", Actions, Open in, Open in Creo View]
        md: Open the information page of the right version and choose **Actions > Open in > Open in Creo View**.
      - title: Isolate what you're measuring
        where: [Creo View, Model tab, Isolate]
        md: Select the component and click **Isolate**, then **Zoom All**, so only that part is on screen.
      - title: Pick a measure type
        where: [Creo View, Markup tab, Measurements]
        md: On the **Markup** tab, in the **Measurements** section, choose a type such as **Diameter** or **Length**.
      - title: Pick the geometry
        where: [Creo View, Markup tab, "<pick edge>"]
        md: |
          Click the edge. The value appears in a label you can drag aside; apply the measurement to
          the view to keep it. Save it in an annotation set if others should see it (lesson 3).
    result: You have a dimension to check - and you know to confirm critical ones on the drawing.

  - type: walkthrough
    title: Create a cross-section
    where: [Creo View, Sectioning tab]
    steps:
      - title: Add a section
        where: [Creo View, Sectioning tab, Preset Section]
        md: On the **Sectioning** tab choose **Preset Section > X Axis** (or Y or Z). With **Planar** selected the model is cut in half.
      - title: Look from another angle
        where: [Creo View, Sectioning tab, Quarter Cut]
        md: Try the other axes, or click **Quarter Cut** to remove just a quarter of the model. Click **View Section** again to switch the section off.
      - title: Keep it
        where: [Creo View, File, Save Annotation Set]
        md: Measure on the cut face, then save an annotation set with **Include section** ticked so others see the same cut.
    result: You can see and measure inside the model without asking for a CAD screenshot.

  - type: walkthrough
    title: Compare two versions visually
    where: [Information page, History, Creo View]
    steps:
      - title: Open the version history
        where: ["SC-2000 information page", History tab]
        md: Open the frame's information page and go to the **History** tab, which lists its versions.
      - title: Open a version in Creo View
        where: [History tab, "<version>", Open in Creo View]
        md: Select the version you want to compare (for example B.1) and click its **Open in Creo View** icon.
      - title: Run the compare
        where: [Creo View, Tools, Compare]
        md: |
          In Creo View, use **Compare** under **Tools** and choose the other version (A.4, the last
          released one). How the differences are displayed depends on your Creo View version.
    result: You see which parts of the design changed between the two versions.

  - type: simulation
    title: Inspect the frame like a pro
    intro: |
      A Change Notice says frame **SC-2000** went from **A.4** to **B.1**. You're the change reviewer.
      Get a reliable tube diameter, find out if the joint is reinforced, and see what changed.
    headline: "Value from: {geometry} · tube: {tube} · section: {section} · compare: {compare}"
    initial: { geometry: Viewer, tube: "not measured", section: "Off", compare: "Off" }
    actions:
      - id: measure
        label: Measure tube diameter in Creo View
        when: { section: "Off", geometry: Viewer }
        do: [{ set: { tube: "about 31.8 mm" } }]
        log: The viewer says about 31.8 mm. Good for a sanity check - but what tolerance applies?
        blockedHint: Switch the section off to pick the outside of the tube cleanly.
      - id: measure-exact
        label: Read the tube dimension on the drawing
        when: { section: "Off", geometry: Drawing }
        do: [{ set: { tube: "31.8 ±0.1 mm" } }]
        log: The released drawing says 31.8 ±0.1 mm. That's a number you can order against.
        blockedHint: Open the released drawing and switch the section off first.
      - id: exact
        label: Open the released drawing of SC-2000
        when: { geometry: Viewer }
        do: [{ set: { geometry: Drawing, tube: "not measured" } }]
        log: Released drawing open. Now read the official dimension and tolerance.
        blockedHint: You already have the drawing open.
      - id: addsection
        label: Preset section on X axis
        when: { section: "Off" }
        do: [{ set: { section: Edge } }]
        log: "Cut on the X axis: just tube wall. Looks unreinforced... or is it?"
        blockedHint: A section is already on.
      - id: drag
        label: Switch to Y axis
        when: { section: Edge }
        do: [{ set: { section: Middle } }]
        log: A triangular gusset appears in the cut. It IS reinforced.
        blockedHint: Add an X-axis section first.
      - id: removesection
        label: Switch the section off
        when: { section: [Edge, Middle] }
        do: [{ set: { section: "Off" } }]
        log: Section off. The model is whole again.
        blockedHint: There's no section to switch off.
      - id: compare
        label: Compare with A.4
        when: { compare: "Off" }
        do: [{ set: { compare: Shown } }]
        log: "The compare shows the rear mounting tab moved 5 mm. Everything else matches A.4."
        blockedHint: Compare is already on.
    goals:
      - label: Get a reliable tube dimension
        when: { tube: "31.8 ±0.1 mm" }
        message: The drawing gives the dimension and its tolerance - the values you can put in a quote or a tolerance check.
      - label: Find the hidden reinforcement
        when: { section: Middle }
        message: A section only shows its own plane - always try more than one cut.
      - label: Spot what changed from A.4
        when: { compare: Shown }
        message: Now check that the moved tab matches what the Change Notice says should change.

  - type: callout
    variant: pitfall
    md: |
      **Treating a viewer measurement as the spec.** The **drawing** with its dimensions and tolerances
      is the official definition. Use Creo View measurements to check and explore, and use the released
      drawing when something gets ordered or inspected.

  - type: callout
    variant: pro-tip
    md: |
      When reviewing a change, run a visual compare **before** reading the change description. If it
      shows changes the Change Notice doesn't mention, you just caught an unplanned edit.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: You need to know if there's a rib inside the frame joint. Which tool?
        options: [Measure, Cross-section, Thumbnail, Attribute compare]
        answer: 1
        explanation: A cross-section cuts the model open so internal features become visible. Try more than one axis - one cut can miss the rib.
      - kind: truefalse
        prompt: A diameter measured in Creo View is the official value to order and inspect against.
        answer: false
        explanation: Viewer measurements are for checking and exploring. The released drawing, with its dimensions and tolerances, is the official definition.
      - kind: single
        prompt: A reviewer wants a line-by-line list of components added to the frame BOM between A.4 and B.1, with quantities. What's the best tool?
        options: [Creo View visual compare, Compare to Part Structure in Windchill, Cross-section, A markup]
        answer: 1
        explanation: Visual compare is great for seeing the design. A line-by-line list of added or removed parts and quantity changes is what Windchill's structure compare gives you.
      - kind: multi
        prompt: Which of these can you do in Creo View? (Choose all that apply.)
        options: [Measure a hole diameter, Section a model along an axis, Compare two versions, Change a dimension in the CAD model]
        answers: [0, 1, 2]
        explanation: Creo View measures, sections and compares published representations. Changing the design itself still needs the CAD tool and a new iteration.

  - type: flashcards
    cards:
      - front: "Cross-section"
        back: "Sectioning tab: cut the model along X, Y or Z (or Quarter Cut) to see inside. Try more than one cut."
      - front: "Viewer measurement vs drawing"
        back: "Measure in Creo View to check. The released drawing and its tolerances are the spec."
      - front: "How do you compare two versions in Creo View?"
        back: "History tab → Open in Creo View on one version, then Tools → Compare with the other."

  - type: summary
    points:
      - Measure on Creo View's Markup tab - Diameter, Length and more - to check and explore.
      - A cross-section shows one plane; try other axes or a quarter cut.
      - Compare versions from the History tab with Tools > Compare; use Compare to Part Structure for line-by-line BOM differences.
      - The released drawing stays the official spec.
