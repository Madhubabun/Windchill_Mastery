id: m02-s03-l01
subtitle: A product is a family tree of parts. Learn to read it level by level.
version: 1.0.0
updated: "2026-10-05"
tags: [bom, ebom, structure, multi-level-bom]

blocks:
  - type: text
    md: |
      Ever built a LEGO set? The booklet starts with a page that lists every brick in the box and how
      many of each. Then each step shows a small group of bricks becoming a sub-build, and sub-builds
      snapping together into the final model.

      A real product works the same way. The Acme **Scooter S2** is a frame, two wheels, a handlebar
      and a battery. The frame itself is a tube, a hinge and some screws. That nested list - *what
      goes into what, and how many* - is a **bill of materials**, or **BOM**.

      In Windchill a BOM isn't a spreadsheet someone types up. It is built from [[part|parts]] joined
      by [[uses-link|uses links]]. Change the structure and every report, every viewer and every
      downstream system sees the same answer.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the list of what goes into the product" → *[[bom]]* (bill of materials)
      - "the BOM as engineering designed it" → *[[ebom|eBOM]]* (engineering BOM)
      - "the BOM as the factory builds it" → *[[mbom|mBOM]]* (manufacturing BOM, covered later)
      - "parent → child, with how many" → *[[uses-link|uses link]]* carrying quantity and unit
      - "the whole tree, every level" → *[[multi-level-bom|multi-level BOM]]* (also *indented BOM*)
      - "just one parent and its direct children" → *single-level BOM*

  - type: animation
    title: Exploding the Scooter S2 into a BOM
    diagram:
