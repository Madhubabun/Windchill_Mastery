        - { id: frame, label: Frame assembly, sublabel: SC-2000, x: 30, y: 160, w: 170, tone: info }
        - { id: wheel, label: Wheel 10 in, sublabel: SC-3100 · qty 2, x: 230, y: 160, w: 170, tone: info }
        - { id: bar, label: Handlebar, sublabel: SC-4000, x: 430, y: 160, w: 160, tone: info }
