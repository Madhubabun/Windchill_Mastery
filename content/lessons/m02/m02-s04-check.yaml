blocks:
  - type: text
    md: |
      Ten questions on everything in **Visualization**: opening designs in Creo View, where thumbnails
      and representations come from, saving markups for reviews, and measuring, sectioning and comparing.
      Score 80% to pass. The flashcards below go straight into your review deck.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: single
        prompt: Acme's buyer has no CAD licence but needs to see the hinge before ordering. What does she open?
        options:
          - The native Creo part file
          - The hinge's representation in Creo View
          - A screenshot from Priya's Creo session
          - The hinge's Problem Reports
        answer: 1
        explanation: Creo View opens the lightweight representation Windchill published from the CAD data - no CAD licence needed, and it's the managed version, not whatever happened to be open on a designer's screen.
      - kind: single
        prompt: Where do you usually launch Creo View for a model or drawing?
        options:
          - From the object's information page - the thumbnail or a view action
          - From the site administration pages only
          - By downloading the CAD file first
          - From the workspace in Creo Parametric only
        answer: 0
        explanation: The information page shows the thumbnail; clicking it, or choosing Actions > Open in > Open in Creo View, opens the model in Creo View.
      - kind: order
        prompt: Put the publishing chain in order.
        items: [A check-in triggers a publish job, The job waits in the queue, A CAD worker converts the model, Representation and thumbnail are stored with the iteration]
        explanation: Publishing runs in the background. That's why a fresh check-in briefly has no thumbnail - and why a stuck worker makes thumbnails disappear across the system.
      - kind: single
        prompt: A new iteration of the frame shows no thumbnail, but older iterations do. What's the most likely reason?
        options:
          - The CAD file was deleted
          - Publishing for the new iteration is pending or failed
          - Thumbnails are only made for released versions
          - Someone forgot to draw one
        answer: 1
        explanation: Thumbnails are a by-product of publishing each version. No thumbnail on a new version almost always means the job hasn't run yet or failed - check the queue, not the vault.
      - kind: truefalse
        prompt: One CAD document version can have more than one representation, and the default one opens when you click the thumbnail.
        answer: true
        explanation: An object can have several representations - for example a full one and one from a simplified rep. The default is the one used on click; a new representation can be marked Set as Default Representation.
      - kind: multi
        prompt: Which make a markup useful as review evidence? (Choose all that apply.)
        options:
          - It's saved to Windchill, not just on a laptop
          - It's saved with the object and version that was reviewed
          - It has a clear name with number, version and finding
          - It's emailed as a flat screenshot
        answers: [0, 1, 2]
        explanation: An annotation set saved to Windchill is listed on the reviewed object's page, so anyone with access can find it and reopen the 3D view. Screenshots in email lose the version and the context.
      - kind: single
        prompt: Kai saved an annotation set on hinge B.2. Priya checks in B.3 with the fix. How does Kai confirm it?
        options:
          - Point to his B.2 annotation set - it covers B.3 too
          - Save his old notes onto B.3 without looking
          - Open B.3 in Creo View, check the wall and record the result
          - Ask Priya for a screenshot
        answer: 2
        explanation: A review describes the version it looked at. To confirm a fix, open B.3, check it and record the result - don't reuse the old notes.
      - kind: single
        prompt: You need to see whether the steering-column joint has an internal gusset. Which tool?
        options: [Measure, Cross-section, Thumbnail, Attribute compare]
        answer: 1
        explanation: A cross-section cuts the model open along a plane. Try more than one axis - a single cut can miss the gusset.
      - kind: truefalse
        prompt: A diameter measured in Creo View is the official value to order and inspect against.
        answer: false
        explanation: Viewer measurements are for checking and exploring. The released drawing, with its dimensions and tolerances, remains the official spec.
      - kind: single
        prompt: A change reviewer wants a line-by-line list of components added to the frame BOM between A.4 and B.1. What should they use?
        options:
          - Creo View visual compare
          - Part structure compare in Windchill
          - A cross-section
          - A markup
        answer: 1
        explanation: Visual compare is for seeing the design. A line-by-line list of added or removed components and quantity changes comes from Compare to Part Structure in Windchill.

  - type: flashcards
    title: Visualization deck
    cards:
      - front: "Creo View"
        back: "PTC's viewer for 3D models and drawings. No CAD tool needed to look."
      - front: "Representation"
        back: "The lightweight viewable published from CAD data, belonging to a specific iteration."
      - front: "Thumbnail"
        back: "Small preview image created during publishing. No representation, no thumbnail."
      - front: "Visualization publishing (WVS)"
        back: "Trigger → queue → CAD worker → representation + thumbnail."
      - front: "Default representation"
        back: "The one that opens when you click the thumbnail."
      - front: "Markup"
        back: "Notes and measurements on Creo View's Markup tab. Save them to Windchill as an annotation set."
      - front: "Annotation set"
        back: "A named set of annotations (and the view they sit on) saved from Creo View to Windchill; listed in the Representations/Annotations table."
      - front: "Does a B.2 review prove B.3 is fixed?"
        back: "No. A review describes the version it looked at - check B.3 itself."
      - front: "Cross-section"
        back: "Sectioning tab: cut along X, Y or Z (or Quarter Cut) to see inside. Try more than one cut."
      - front: "Viewer measurement vs drawing"
        back: "Measure in Creo View to check. The released drawing and its tolerances are the spec."
      - front: "Visual compare vs structure compare"
        back: "Visual (Creo View): see the design change. Structure (Compare to Part Structure): line-by-line parts, quantities and attributes."
