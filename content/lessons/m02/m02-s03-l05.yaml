id: m02-s03-l05
subtitle: Spot-the-difference for BOMs - and how to hand a clean report to someone who'll never open Windchill.
version: 1.1.0
updated: "2026-10-14"
tags: [bom, structure, compare, reports, export, configuration]
sources:
  - id: te
    where: "Module 2: part structure reports such as multilevel BOMs and parts lists; Module 5: Filter a BOM; Specify a configuration specification (Latest default, As Matured, Baseline); Activity: Filter BOMs (Edit Filter, Saved Filters)"
  - id: hc-struct-compare
    label: PTC Help Center supplement
    title: "Compare to Part Structure"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/prodstructure/PMStructureComparePart.html"
    covers: "Launch from Actions > Compare > Compare to Part Structure, the Structure tab toolbar or the right-click menu; each side set by its configuration specification filter; shows added or removed parts and attribute differences"
  - id: hc-struct-compare-start
    label: PTC Help Center supplement
    title: "Starting a Part to Part Structure Comparison"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/prodstructure/PMStructureComparePartStart.html"
    covers: "Parts tab with Left Side and Right Side, Enter Number/Name and Version; Edit Filter and Saved Filters per side; both sides start identical, so change the right side"
  - id: hc-struct-compare-results
    label: PTC Help Center supplement
    title: "Interpreting Part to Part Structure Comparison Results"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/prodstructure/PMStructureComparePartResults.html"
    covers: "Child, relation, usage attribute and attribute differences; blank row where there is no equivalent object; Show only differences; Previous and Next difference; Export list to file exports only displayed rows"
  - id: hc-part-reports
    label: PTC Help Center supplement
    title: "Reports Action Set - Parts"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/prodstructure/PMStructureReports.html"
    covers: "Reports in the Structure tab toolbar open BOM Reports in a new browser tab; report names (Single-Level BOM, Single-Level Consolidated BOM, Multi-Level BOM, Multi-Level Components List, Multi-Level BOM with Replacements...); Export action and Export list to file"

blocks:
  - type: text
    md: |
      Kai's change review board meets on Thursday. The question on the table: "What exactly
      changed in the frame between the released version and Priya's new one?"

      Nobody wants to scroll two 200-line BOMs side by side and squint. Windchill can **compare**
      two structures and flag every difference for you. And when the answer has to go to purchasing
      or a supplier who never logs in, you run a **BOM report** or export the structure.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the tree with all the columns" → *structure view* (the part's **Structure** tab)
      - "which versions the tree shows" → *configuration specification* (Latest, As Matured, Baseline…)
      - "spot the difference between two BOMs" → *[[structure-compare|structure compare]]* (the action is *Compare to Part Structure*)
      - "the BOM as a printable table" → *BOM report* (Single-Level BOM, Multi-Level BOM, Multi-Level Components List…)
      - "download the table" → *Export* / *Export list to file*

  - type: diagram
    title: Reading a compare result
    caption: Frame SC-2000 released A.3 (left) vs A.5 (right), simplified. Click a line to see how compare flags it.
    diagram:
      width: 800
      height: 420
      groups:
        - { label: Left - A.3 Released, x: 10, y: 10, w: 370, h: 400, tone: neutral }
        - { label: Right - A.5 In Work, x: 420, y: 10, w: 370, h: 400, tone: info }
      nodes:
        - id: l-tube
          label: SC-2010 tube ×1
          x: 40
          y: 50
          w: 310
          h: 50
          tone: neutral
          detail: "**Identical.** Same child, same usage attributes on both sides. Switch to **Show only differences** and lines like this disappear."
        - id: r-tube
          label: SC-2010 tube ×1
          x: 450
          y: 50
          w: 310
          h: 50
          tone: neutral
          detail: Identical to the left. Nothing to review.
        - id: l-hinge
          label: SC-1042 hinge ×1
          sublabel: removed
          x: 40
          y: 130
          w: 310
          tone: danger
          detail: |
            **Only on the left.** The old hinge is gone in A.5. The replacement is a different part
            (a different master), so compare finds no equivalent: SC-1042 gets a blank row opposite it
            on the right - a *relation difference*.
        - id: r-hinge
          label: SC-1043 hinge ×1
          sublabel: added
          x: 450
          y: 130
          w: 310
          tone: success
          detail: "**Only on the right.** The two-piece hinge that replaced SC-1042, with a blank row opposite it on the left."
        - id: l-screw
          label: FS-0620 screw ×4
          x: 40
          y: 220
          w: 310
          tone: warning
          detail: "**Changed.** The same child on both sides, but a usage attribute differs - here quantity 4 on the left. Compare flags it as a *usage attribute difference*."
        - id: r-screw
          label: FS-0620 screw ×6
          sublabel: quantity changed
          x: 450
          y: 220
          w: 310
          tone: warning
          detail: Quantity 6 on the right. Selecting the difference icon opens a window listing the usage attribute differences. Reference designator changes are flagged the same way.
        - id: r-latch
          label: SC-1050 latch ×1
          sublabel: added
          x: 450
          y: 310
          w: 310
          tone: success
          detail: "**Only on the right.** A brand-new line. On the left there's a blank row where it would be."
      edges:
        - { from: l-tube, to: r-tube, label: same }
        - { from: l-screw, to: r-screw, label: changed }

  - type: comparison
    title: Which tool for which question?
    columns: [Structure view, Structure compare, BOM report]
    rows:
      - { label: Answers, cells: ["What is in it now?", "What changed between two?", Give me this BOM as a table] }
      - { label: Typical user, cells: [Designers browsing, "Reviewers, change boards", "Purchasing, suppliers, auditors"] }
      - { label: "Interactive?", cells: ["Yes - expand, filter, Visualization tab", "Yes - show only differences, jump to the next one", "Opens in a new browser tab, ready to share"] }
      - { label: Watch out for, cells: [The configuration in use, The filter on each side, The filter it was run with] }
    takeaway: Browse with the structure view, review changes with compare, share with a report.

  - type: callout
    variant: why-it-matters
    md: |
      Change boards approve **differences**, not whole BOMs. A compare turns "here are 200 lines,
      trust me" into "here are the 3 lines that changed". It's also how you catch the change nobody
      mentioned - a quantity quietly edited from 4 to 6 can cost more than the headline change.

  - type: walkthrough
    title: Compare two structures
    who: Anyone with read access to both structures
    where: ["<part> information page", Actions, Compare, Compare to Part Structure]
    steps:
      - title: Start the compare from the part
        where: ["SC-2000 information page", Actions, Compare, Compare to Part Structure]
        md: |
          Open the frame's information page and choose **Actions > Compare > Compare to Part
          Structure**. On the Structure tab you'll also find it under the **Compare** drop-down in the
          toolbar's Tools set, or on the right-click menu. The part you start from goes on the left.
      - title: Set up the two sides
        where: [Compare to Part Structure, Parts tab, Left Side / Right Side]
        md: |
          Both sides start as the same structure, which would show no differences - so change the
          right side. Pick another **Version** from the list (A.5), type another part's number, or
          use **Edit Filter** on a side to apply a different configuration specification, such as a
          baseline. Click **OK**.
      - title: Read the differences
        where: [Compare results, Show only differences]
        md: |
          The structures sit side by side with difference columns in between: *child* (something
          differs further down), *relation* (no equivalent on the other side - a blank row),
          *usage attribute* (for example quantity) and *attribute*. Turn on **Show only differences**
          and use **Next difference** to step through them.
      - title: Export what you found
        where: [Compare results, Export list to file]
        md: Expand the branches you need first - **Export list to file** saves only the rows that are displayed.
    result: You see exactly what changed between the two frames, line by line.

  - type: walkthrough
    title: Run a BOM report and export
    who: Anyone with read access to the part
    where: ["<part> information page", Structure tab, Reports]
    steps:
      - title: Select the right structure
        where: ["SC-2000 information page", Structure tab, Filter]
        md: Reports use the structure of the part selected in the tree, as currently filtered. Set the configuration specification first - for example *As Matured* for released data.
      - title: Open the report
        where: [Structure tab, Reports, BOM Reports]
        md: |
          Click **Reports** in the Structure tab toolbar (or **BOM Reports** from its drop-down). The
          reports open in a new browser tab. Pick one: **Single-Level BOM**, **Multi-Level BOM**
          (indented, every level), or **Multi-Level Components List** (one total per component, no levels).
      - title: Export the structure itself
        where: [Structure tab, Export]
        md: |
          To get a file, use the **Export** action on the Structure tab and choose a format. The file
          holds only the branches and columns visible in the tree, so expand what you need first.
          The **Uses** and **Occurrences** tabs also offer **Export list to file**.
    result: A BOM you can send to purchasing or a supplier, labelled with the configuration it was run with.

  - type: simulation
    title: Find every difference
    intro: |
      The change board wants to know what changed in frame SC-2000 between released **A.3** and
      Priya's **A.5**. Run the compare, inspect each marked line, then export the result for the
      meeting.
    headline: "Left A.3 vs right {right} · latch {latch} · hinge {hinge} · screws {screws} · exported {exported}"
    initial:
      right: none
      latch: "?"
      hinge: "?"
      screws: "?"
      exported: "no"
    actions:
      - id: cmp-a5
        label: Compare A.3 with A.5
        when: { right: [none, A.3] }
        do: [{ set: { right: A.5 } }]
        log: Compare done. 3 lines on the left, 4 on the right. Everything except the tube is flagged as different.
        blockedHint: You're already comparing with A.5.
      - id: cmp-self
        label: Compare A.3 with A.3
        when: { right: [none, A.5] }
        do: [{ set: { right: A.3, latch: "?", hinge: "?", screws: "?" } }]
        log: Zero differences. Comparing a version with itself always is - check what you picked!
        blockedHint: You're already comparing A.3 with itself.
      - id: tube
        label: Inspect the tube line
        when: { right: A.5 }
        do: [{ set: { right: A.5 } }]
        log: SC-2010 tube ×1 on both sides - identical. Tip - Show only differences hides lines like this.
        blockedHint: Compare with A.5 first.
      - id: latch
        label: Inspect the latch line
        when: { right: A.5 }
        do: [{ set: { latch: added } }]
        log: SC-1050 latch ×1 appears only on the right - an added line.
        blockedHint: Compare with A.5 first - there's no latch in A.3.
      - id: hinge
        label: Inspect the hinge lines
        when: { right: A.5 }
        do: [{ set: { hinge: replaced } }]
        log: SC-1042 only on the left, SC-1043 only on the right, each with a blank row opposite. Gone + new in the same spot = a replace.
        blockedHint: Compare with A.5 first.
      - id: screws
        label: Inspect the screw line
        when: { right: A.5 }
        do: [{ set: { screws: "4 → 6" } }]
        log: Same screw FS-0620 on both sides, but quantity 4 → 6. Easy to miss - the sneaky change!
        blockedHint: Compare with A.5 first.
      - id: export
        label: Export the compare for the meeting
        when: { right: A.5, latch: added, hinge: replaced, screws: "4 → 6" }
        do: [{ set: { exported: "yes" } }]
        log: Export list to file done. You rename it "SC-2000 A.3 vs A.5". The board reviews 3 changes instead of 6 lines.
        blockedHint: Inspect every marked line first - the board will ask about each one.
    goals:
      - label: Find all three differences
        when: { latch: added, hinge: replaced, screws: "4 → 6" }
        message: Added, replaced (gone + new) and changed. Those are the three shapes most BOM differences take.
      - label: Export the result for the change board
        when: { exported: "yes" }
        message: Ready for Thursday. Always note which two versions you compared.

  - type: scenario
    variant: troubleshooting
    title: The BOM report that disagrees with the factory
    start: s1
    nodes:
      - id: s1
        md: |
          Purchasing exports a multi-level BOM report for Scooter S2 and orders **hinge SC-1043**.
          The factory says: "We build with SC-1042 - SC-1043 isn't released yet!" What do you check first?
        choices:
          - label: The configuration the report was run with
            next: s2
            good: true
            feedback: Good instinct. The configuration decides which versions - and which structure - a report shows.
          - label: Whether SC-1043 exists in Windchill
            next: s1b
            feedback: It clearly exists - it's on the report. The question is why it was included.
      - id: s1b
        md: SC-1043 exists, In Work. So why did the report include it?
        choices:
          - label: Check the report's configuration
            next: s2
            good: true
      - id: s2
        md: |
          The report was run with **Latest**. That resolved frame SC-2000 to A.5 (In Work), which uses
          SC-1043. The released frame is A.3, with SC-1042. What do you tell purchasing?
        choices:
          - label: Re-run the report with a released (As Matured) or baseline configuration before ordering
            next: win
            good: true
            feedback: Exactly. Buy from what's released, not from work in progress.
          - label: Order both hinges to be safe
            next: meh
            feedback: Expensive - and it hides the real problem, which will come back on the next order.
      - id: win
        md: |
          Purchasing re-runs the report with an **As Matured** (released) configuration and orders SC-1042.
          Acme also adds the configuration name to the export file name so this can't happen silently again.
        outcome: success
      - id: meh
        md: Acme now has a box of unreleased hinges and still no rule. Re-run with a released configuration and label exports with their configuration.
        outcome: partial

  - type: example
    variant: real-world
    title: The supplier who only reads spreadsheets
    industry: Micromobility
    md: |
      Acme's wheel supplier doesn't have Windchill access. For each new wheel release, Kai's team
      runs a multi-level BOM report of **SC-3100** with the released configuration, exports it, and
      sends it with the drawing package. The file name always includes the part, the revision and
      the configuration: *SC-3100_B_released_BOM.xlsx*.
    takeaway: An exported BOM is a snapshot. Label it so nobody mistakes it for the live structure.

  - type: callout
    variant: pitfall
    md: |
      **Treating an export as the truth forever.** The moment you export, the file starts going
      stale. If a spreadsheet BOM gets edited and passed around, you're back to "final_v5". The
      managed structure in Windchill is the source; exports are for reading.

  - type: callout
    variant: pro-tip
    md: |
      In compare, turn on **Show only differences** first. A 300-line structure with 4 changes
      becomes a short review - and Windchill remembers your choice next time.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: A compare shows SC-1042 only on the left and SC-1043 only on the right, at the same position. What happened?
        options: [Two separate mistakes, The hinge was replaced by a different part, SC-1042 was revised to SC-1043, The compare is broken]
        answer: 1
        explanation: Different numbers mean different part masters, so compare finds no equivalent for either - each shows with a blank row opposite it.
      - kind: single
        prompt: Purchasing wants to order parts for production. Which configuration should their BOM report use?
        options: [Latest, Latest released (or a released baseline), Whatever the default is, The configuration in Priya's workspace]
        answer: 1
        explanation: Latest can include In Work versions. Production orders should come from released data.
      - kind: truefalse
        prompt: Structure compare can show a difference even when the same child part is on both sides.
        answer: true
        explanation: If a usage attribute such as quantity or a reference designator changed, compare flags a usage attribute difference.
      - kind: multi
        prompt: Which belong on an exported BOM so nobody misreads it later? (Choose all that apply.)
        options: [The top part number and revision, The configuration used, The export date, The designer's favourite colour]
        answers: [0, 1, 2]
        explanation: An export is a snapshot. Part, revision, configuration and date tell the reader exactly what they're holding.

  - type: summary
    points:
      - The Structure tab shows what's in a BOM - always with a configuration.
      - Compare to Part Structure flags parts with no equivalent (blank rows) and usage attribute and attribute differences.
      - BOM reports (Single-Level BOM, Multi-Level BOM, Multi-Level Components List) give shareable tables; Export saves what's displayed.
      - Exports are snapshots - label them with part, revision and configuration.
