          x: 300
          y: 170
          w: 200
          tone: neutral
          shape: pill
          detail: Priya revises the frame, the bracket gets three new iterations and the report is updated. None of that changes the baseline's list.
        - { id: now-frame, label: Frame B.2, x: 555, y: 140, w: 200, tone: warning }
        - { id: now-bracket, label: Battery bracket C.1, x: 555, y: 210, w: 200, tone: warning }
        - { id: now-report, label: Test report E.1, x: 555, y: 280, w: 200, tone: warning, shape: doc }
