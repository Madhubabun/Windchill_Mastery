id: m02-s02-l06
subtitle: Take a photo of your product data at the moment that matters - and find it again years later, exactly as it was.
version: 1.0.0
updated: "2026-10-05"
tags: [baseline, configuration-management, audit, compliance]

blocks:
  - type: text
    md: |
      Your phone camera roll is a time machine. The photo from launch day shows exactly who was
      there and what they wore, no matter how much has changed since.

      Product data needs the same thing. The E-bike E1 goes to a certification lab today. Next
      month Priya will revise half the parts. Two years from now an auditor asks: *"Show me exactly
      what you certified."* Latest won't help - it has moved on.

      A **baseline** is that photo: a saved list of **exactly which version** of each object
      belonged together at one moment.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a photo of the data at one moment" → *[[baseline]]*
      - "a baseline you create and name yourself" → *managed baseline*
      - "freeze it so nobody can change the list" → *lock* the baseline
      - "show the structure as it was in the photo" → *Baseline* [[configuration-specification|config spec]]
      - "one version per object" → one version per [[master]]

  - type: diagram
    title: A baseline is a list of exact versions
    caption: Versions keep moving on. The baseline keeps pointing at the ones that were current on certification day. Click to explore.
    diagram:
      width: 800
      height: 380
      groups:
        - { label: "Baseline: E1 Certification", x: 20, y: 20, w: 250, h: 340, tone: success }
        - { label: Today's latest, x: 530, y: 20, w: 250, h: 340, tone: warning }
      nodes:
        - id: bl
          label: E1 Certification
          sublabel: managed · locked
          x: 45
          y: 50
          w: 200
          tone: success
          shape: doc
          detail: |
            A managed baseline has its own number, name, context, folder and lifecycle. Its member
            list says "E1 frame **A.5**, battery bracket **B.3**, motor mount **A.2**, test report **C.1**…"
            Locked, so nobody can add or swap members.
          real: Typical baselines - design reviews, prototype builds, certification submissions, customer deliveries.
        - { id: bl-frame, label: Frame A.5, x: 45, y: 140, w: 200, tone: success }
        - { id: bl-bracket, label: Battery bracket B.3, x: 45, y: 210, w: 200, tone: success }
        - { id: bl-report, label: Test report C.1, x: 45, y: 280, w: 200, tone: success, shape: doc }
        - id: arrow
          label: Time passes
