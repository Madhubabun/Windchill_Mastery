id: m02-s02-l04
subtitle: One is a light switch, the other is a signed permission slip. Know which one your company expects you to use.
version: 1.1.0
updated: "2026-10-14"
tags: [lifecycle, set-state, promotion-request, approval, governance]
sources:
  - id: te
    where: "Module 5: Set State activities (Actions > Set State, Target State). Module 6: Windchill's change and promotion processes: overview; Promotion process: overview; Create a promotion request; Activity: Create and approve a promotion request"
  - id: ac
    where: "Access control permissions (Set State); Identify life cycle transition types (Set State, Promote, Lock)"

blocks:
  - type: text
    md: |
      There are two ways to move the hinge from In Work to Released:

      1. **Set State** - flip it. One click, done. No questions asked.
      2. **Promotion request** - ask for it. You collect the objects, reviewers check them,
         someone approves, and *then* Windchill moves them. Every step is recorded.

      Both end with "Released" on the screen. Only one of them can answer the auditor's question
      *"who approved this, and when?"* That's why many companies give Set State to very few
      people.

      (There's a third road: PTC's course notes that engineering data - parts, CAD documents -
      is usually released through the **change process** with a change notice, while promotion
      requests are mostly used for non-engineering data. Some companies use both together. The
      change process gets its own lessons later; here we compare the two direct roads.)

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "flip the state directly" → *[[set-state|Set State]]*
      - "ask for approval to move it" → *[[promotion-request|promotion request]]* (action: *New Promotion Request*)
      - "the objects you're moving" → *promotion objects*
      - "the state you're asking for" → *target promotion state*
      - "the automatic approval route" → a promotion *[[workflow]]* with review and approve *[[task|tasks]]*

  - type: animation
    title: A promotion request, step by step
    diagram:
      width: 800
      height: 320
      nodes:
        - { id: priya, label: Priya, sublabel: creates request, x: 20, y: 40, w: 150, tone: primary, shape: pill }
        - { id: req, label: Promotion request, sublabel: "hinge + drawing", x: 210, y: 40, w: 170, tone: info, shape: doc }
        - { id: lock, label: Locked state, sublabel: if configured, x: 210, y: 200, w: 170, tone: warning }
        - { id: kai, label: Kai approves, sublabel: workflow task, x: 420, y: 40, w: 160, tone: accent }
        - { id: rel, label: Released, sublabel: target state, x: 620, y: 40, w: 160, tone: success, shape: pill }
        - { id: record, label: Approval record, sublabel: "who · when · what", x: 520, y: 200, w: 180, tone: neutral, shape: doc }
      edges:
        - { from: priya, to: req, label: collect }
        - { from: req, to: lock }
        - { from: req, to: kai, label: route }
        - { from: kai, to: rel, label: approve }
        - { from: kai, to: record, dashed: true }
    chapters:
      - title: Collect the objects
        caption: Priya selects the hinge A.3 and its drawing, starts a **New Promotion Request** and picks **Released** as the target promotion state. Both objects land in the promotion objects list.
        show: [priya, req]
        highlight: [req]
        flow: [priya>req]
      - title: Freeze while reviewing
        caption: If the administrator has configured a **Lock** transition, the objects move to an interim locked state while the request is reviewed, so nobody changes them mid-review.
        show: [priya, req, lock]
        highlight: [lock]
        flow: [req>lock]
      - title: Route to the approver
        caption: The Promotion Request Approval Process sends Kai, the approver, a task. He checks the promotion objects and approves - or denies, which leaves the objects in (or returns them to) their original state.
        show: [priya, req, lock, kai]
        highlight: [kai]
        flow: [req>kai]
      - title: Released, with receipts
        caption: When all approvers approve, Windchill promotes the objects to **Released**. The request stays on record with its objects, the tasks, who completed them and their comments.
        highlight: [rel, record]
        flow: [kai>rel, kai>record]
        seconds: 8

  - type: comparison
    title: Set State vs promotion request
    columns: [Set State, Promotion request]
    rows:
      - label: What it does
        cells: [Changes the state directly, "Collects objects, routes a review, then changes the state"]
      - label: Approval
        cells: [None, Review and approval tasks in a workflow]
      - label: Record left behind
        cells: ["The state change in the history - who and when", "A full request: objects, versions, approvers, comments, dates"]
      - label: Speed
        cells: [Instant, Hours to days]
      - label: Who can use it
        cells: [Only users granted the Set State permission, "Team members; approvers come from the team's promotion roles"]
      - label: New iteration?
        cells: [No, No]
      - label: Best for
        cells: ["Fixing mistakes, migration clean-up, admin tasks", "Everyday releases of new data"]
    takeaway: Set State is an admin tool. A promotion request is the approved road - and for engineering data, check whether your company expects a change notice instead.

  - type: callout
    variant: why-it-matters
    md: |
      In ISO 9001, medical, automotive or aerospace audits, "Released" means nothing without
      evidence of approval. A promotion request **is** that evidence. A Set State click leaves a
      line in the history saying who flipped it - but no review, no approver, no reason. That's
      why many companies grant the Set State permission to only a few people.

  - type: example
    variant: real-world
    title: When Set State is the right tool
    industry: Micromobility
    md: |
      Acme migrates 4,000 legacy parts from an old system. They were all approved years ago, with
      paper sign-offs scanned into documents. Running 4,000 promotion requests would mean
      re-approving decisions that were already made.

      Instead, the migration specialist loads them In Work and the PLM admin uses **Set State** to
      move the whole batch to Released, with a note referencing the migration plan. That's a
      controlled, documented admin action - not a shortcut around review.
    takeaway: Set State is legitimate for admin clean-up with its own documentation. It's not a way to skip approvals.

  - type: scenario
    variant: what-if
    title: Friday, 4:55 pm
    start: s1
    nodes:
      - id: s1
        md: |
          The hinge drawing must reach the supplier tonight. It's **A.3 In Work**. You happen to
          have Set State rights from an old admin project. Kai, the approver, is on a plane. What
          do you do?
        choices:
          - label: Set State to Released - it's ready
            next: w1
            feedback: Let's see where that leads.
          - label: Submit a promotion request and call Kai's backup approver
            next: s2
            good: true
            feedback: Good. Speed comes from the right people, not from skipping them.
      - id: w1
        md: |
          The drawing is Released and goes to the supplier. Monday, Kai spots that the tolerance
          on the pin hole is wrong. **What if** an auditor now asks who approved A.3?
        choices:
          - label: Show the state history
            next: f1
            feedback: It shows you flipped it. It doesn't show any approval.
      - id: f1
        md: |
          There's no approval record, the supplier has already cut steel to a wrong tolerance, and
          your Set State rights get removed. A ten-minute review would have caught it.
        outcome: fail
      - id: s2
        md: |
          The backup approver reviews the promotion request in 20 minutes and approves. **What if**
          the approver had rejected it instead?
        choices:
          - label: Fix it, check in A.4, and resubmit
            next: win
            good: true
            feedback: Exactly - a rejection sends it back to In Work for a fix, and the request records why.
      - id: win
        md: The supplier gets an approved drawing - maybe a day later than hoped, but correct, with a full record of who checked it.
        outcome: success

  - type: walkthrough
    title: Release with a promotion request
    who: Team members allowed to create promotion requests in the context
    steps:
      - title: Start the promotion
        where: ["<object> information page", Actions, New, New Promotion Request]
        md: |
          Start from the object's information page - or select several objects (for example the
          hinge and its drawing) in Folder Contents or search results first. Give the request a
          clear name and click **Next**.
      - title: Choose the target state and objects
        where: [New Promotion Request, Target Promotion State]
        md: |
          Pick the state you're asking for, for example **Released**. In the **Promotion Objects**
          table, select the rows and click **Set Object for Promotion**, then **Next**.
      - title: Pick the process
        where: [New Promotion Request, Process]
        md: |
          The **Promotion Request Approval Process** (the default) needs approvers to approve; the
          **Promotion Request Review Process** promotes and just notifies reviewers. Approver and
          reviewer roles are pre-filled from the product team. Click **Finish**.
      - title: Follow it
        where: [Home, Tasks]
        md: Reviewers and approvers get tasks on their Home page. When all approvers approve, Windchill promotes the objects to the target state.
    result: The objects are Released and the promotion request records exactly who approved which versions, and when.

  - type: walkthrough
    title: Set State (only if you're allowed)
    who: Users granted the Set State permission
    steps:
      - title: Open Set State
        where: ["<object> information page", Actions, Set State]
        md: If you don't see the action, your access rules or the life cycle don't allow it - that's normal for most users.
      - title: Pick the target state and confirm
        where: [Set State, Target State]
        md: Select the rows, choose the state from the **Target State** list and click **OK**. The state changes immediately; the version number does not.
    result: The state changes at once. The history records who changed it, but no review took place.

  - type: callout
    variant: pitfall
    md: |
      **Promoting the part but forgetting the drawing.** The hinge is Released, its drawing is still
      In Work, and the supplier portal only shows Released data - so the supplier gets no drawing.
      Use the collect step and check the object list before submitting.

  - type: callout
    variant: pro-tip
    md: |
      If you hold Set State rights, record **every** use somewhere traceable - a ticket or a plan
      that says why. Months later, that note is the only evidence that the change was intended.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Why do most companies restrict Set State?
        options:
          - It's slow
          - It moves objects to a new state without review or approval
          - It creates a new revision
          - It deletes the workflow history
        answer: 1
        explanation: Set State changes the state immediately with no review. Restricting it makes sure everyday releases leave an approval record.
      - kind: single
        prompt: Priya's new e-bike bracket and its drawing are ready for first release. Which path fits best?
        options: [Set State, Promotion request, Save As, Revise]
        answer: 1
        explanation: Of these options, a promotion request is the one that routes the bracket and drawing for approval and releases them together, leaving evidence. (Many companies release engineering data through a change notice instead - check your process.)
      - kind: truefalse
        prompt: Set State creates a new iteration of the object.
        answer: false
        explanation: Changing the state updates the existing version. A.3 In Work becomes A.3 Released - same version.
      - kind: multi
        prompt: Which are reasonable uses of Set State? (Choose all that apply.)
        options:
          - Moving migrated, already-approved legacy data to Released
          - Correcting an object accidentally left in the wrong state, with the reason recorded
          - Releasing a drawing quickly because the approver is busy
          - Skipping review for "small" changes
        answers: [0, 1]
        explanation: Set State suits documented admin actions such as migration clean-up and corrections. Using it to bypass approval defeats the purpose of the life cycle.

  - type: summary
    points:
      - Set State flips the state directly - no review, no approval. Usually admin-only.
      - A promotion request collects objects, routes review and approval, then moves them to the target state. Engineering data often goes through a change notice instead.
      - The promotion request is your evidence of approval in an audit.
      - Neither creates a new iteration - they change the state of existing versions.
