id: m02-s01-l03
subtitle: The main file, the extras and the lightweight preview - three different jobs.
version: 1.1.0
updated: "2026-10-14"
tags: [primary-content, attachments, representations, visualization, thumbnails]
sources:
  - id: te
    where: "Module 2: Activity: Explore the Windchill user interface (mini-thumbnails; CAD document Content tab with default representation). Module 3: Activity: Explore and create documents (Content tab, attachments); Activity: Update a document. Module 4: Identify characteristics of CAD documents; Activity: Create a CAD drawing (Save Representation)"
  - id: ac
    where: "Describe Windchill Visualization Services (WVS); Describe the WVS architecture (Publisher, Worker Agent, Loader thumbnails); Configure WVS (MCAD, ECAD and Microsoft Office publishing)"
  - id: hc-doc-create
    label: PTC Help Center supplement
    title: "Creating a Document"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/docmgmt/DocMgmtDocCreate.html"
    covers: "Primary content source options (Local File, URL Link, External Storage, No Content); attachments are secondary content that can be added and removed after creation"
  - id: hc-visualize
    label: PTC Help Center supplement
    title: "Visualizing Parts and CAD Documents"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/wvsvisual/VisualWCVisualizePartsAndDocumentsUser.html"
    covers: "Representations are created by publishing, automatically (for example on check-in) or by user request, with requests queued; an object can have several representations and one is the default; thumbnails show the default representation; republishing is available for CAD data"

blocks:
  - type: text
    md: |
      Think of a music release. There's **the track** itself. There are **extras** - lyrics,
      liner notes, the stems for remixers. And there's the **preview clip** that plays in the app
      so you can check it out without downloading the full thing.

      A Windchill object's files work the same way:

      - **Primary content** - the one main file the object is about.
      - **Attachments** - any number of extra files or links riding along.
      - **Representations** - lightweight viewable versions generated for viewing, for example
        in [[creo-view|Creo View]].

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the main file" → [[primary-content|primary content]] (one per document)
      - "the extras" → [[attachment|attachments]] (also called *secondary content*)
      - "the preview version" → [[representation]] (a *viewable*)
      - "the tiny picture in tables" → *thumbnail*
      - "the robot that makes previews" → *publishing* by Windchill Visualization Services (WVS),
        run by a [[cad-worker|CAD worker]]

  - type: diagram
    title: What's inside test report TR-0057
    caption: Click each box to see what it holds and how it changes.
    diagram:
      width: 800
      height: 380
      groups:
        - { label: Versioned content - change needs check-out, x: 10, y: 120, w: 520, h: 120, tone: info }
        - { label: Visualization, x: 550, y: 120, w: 240, h: 250, tone: success }
      nodes:
        - id: doc
          label: TR-0057 A.2
          sublabel: brake test report
          x: 290
          y: 20
          w: 220
          tone: primary
          shape: doc
          detail: The document object - number, name, type, version, state. It holds pointers to its files.
        - id: primary
          label: Primary content
          sublabel: brake-test.pdf
          x: 30
          y: 160
          w: 220
          tone: warning
          shape: doc
          detail: |
            **One** main file - or instead a URL link, an external storage location, or (if your
            company allows it) no content. Replace it by checking out and uploading a new file -
            which creates a new iteration on check-in.
          real: The Content tab's Primary Content table links to this file for download.
        - id: attach
          label: Attachments
          sublabel: raw-data.csv, photos
          x: 290
          y: 160
          w: 220
          tone: neutral
          shape: doc
          detail: |
            **Zero or more** extras - a local file, a URL link or an externally stored source: raw
            data, photos, a supplier certificate. Adding or changing them is part of editing the
            document (for example with *Check Out and Edit*), so they ride along with its iterations.
        - id: rep
          label: Representation
          sublabel: viewable for Creo View
          x: 570
          y: 160
          w: 200
          tone: success
          detail: |
            A lightweight, generated file set for viewing - for a CAD model a Creo View viewable,
            for a drawing files you can open in a PDF viewer. Office documents can be published too
            if your company sets it up. An object can have several representations; one is the
            **default**.
          real: You never edit a representation yourself - Windchill Visualization Services generates it by publishing.
        - id: thumb
          label: Thumbnail
          sublabel: tiny preview image
          x: 570
          y: 280
          w: 200
          tone: success
          detail: A small image of the default representation, created during publishing and shown in tables (as a mini-thumbnail) and on the information page so you recognise objects at a glance.
      edges:
        - { from: doc, to: primary, label: one }
        - { from: doc, to: attach, label: many }
        - { from: doc, to: rep, label: published }
        - { from: rep, to: thumb }

  - type: comparison
    title: Primary content vs attachments vs representations
    columns: [Primary content, Attachments, Representation]
    rows:
      - label: How many
        cells: [One (or a link or none), Zero or more, Zero or more - one is default]
      - label: Made by
        cells: [You upload it, You upload them, "Generated by publishing (WVS)"]
      - label: Changing it
        cells: [Check out → new iteration, "Edit the document (check out) → new iteration", "Publish again - you don't edit it"]
      - label: Typical use
        cells: [The file the object is about, Supporting evidence and extras, "Viewing, markup, sharing without CAD"]
    takeaway: You own the content. Windchill generates the representation from it.

  - type: callout
    variant: why-it-matters
    md: |
      Most people who look at engineering data **don't have CAD**: buyers, quality, service,
      suppliers. Representations let them view, measure and mark up a model in Creo View without a
      CAD license. Meanwhile attachments keep the evidence (raw data, certificates) next to the
      document it supports - instead of in somebody's inbox.

  - type: example
    variant: real-world
    title: Where's the raw data?
    industry: Micromobility
    md: |
      A quality auditor asked Acme for the raw measurements behind the brake test report. The PDF
      (primary content) only had the summary. Because Priya had added **raw-data.csv as an
      attachment** on the same iteration, Kai downloaded it in seconds - and it was provably the
      data for *that* version of the report, A.2.
    takeaway: Attach supporting evidence to the iteration it supports. It stays matched forever.

  - type: walkthrough
    title: Find content, attachments and representations
    who: Any user with read access
    where: ["<object> information page"]
    steps:
      - title: Download the primary content
        where: [Information page, Content, Primary Content]
        md: |
          Open the **Content** tab. In the **Primary Content** table, click the file name to
          download it.
      - title: See the attachments
        where: [Information page, Content]
        md: |
          The same **Content** tab lists the attachments (secondary content). Download any of them
          from there.
      - title: See the representations
        where: [Information page, Content, Representations/Annotations]
        md: |
          For a CAD document, the **Representations/Annotations** table on the Content tab lists
          the viewables, including the **default** one. Click its thumbnail to open it in Creo
          View, or right-click the row and choose **Save Representation** to download it.
      - title: If the preview looks wrong
        where: ["<object> information page", Content]
        md: |
          Publishing can be started by a user request where your setup allows it; requests wait in
          a publishing queue, so a new representation can take a while. Which publish actions you
          see is decided by your company's configuration - ask your administrator if unsure.
    result: You can tell the main file, the extras and the viewables apart - and get each one.

  - type: exercise
    title: Sort the files
    environment: windchill-trial
    goal: |
      Take three files and decide where each belongs: primary content, attachment or "let
      Windchill generate it". Then try it on a test document in a trial or training system.
    steps:
      - "For Acme's **brake test report**, you have: `brake-test.pdf`, `raw-data.csv` and `preview.pvz` (a Creo View file someone exported by hand)."
      - Decide which file is the primary content and which is an attachment.
      - Decide what to do with the hand-made viewable. (Hint - who should make representations?)
      - "In a trial system: create a test document with the PDF as primary content, use **Check Out and Edit** to add the CSV as an attachment, and check it in."
      - Open the information page and confirm the version went up by one iteration.
    expected: |
      PDF = primary content, CSV = attachment. The hand-made viewable is skipped: representations
      should be generated by publishing so they always match the content. After check-in the
      document moved up one iteration (for example A.1 → A.2) and shows the CSV as an attachment.

  - type: callout
    variant: pitfall
    md: |
      **Putting the important file in an attachment.** *Download Primary File*, *Check Out and
      Download* and the document's thumbnail all work from the **primary content**. If the real
      report is attachment #3 and the primary content is a cover sheet, people will read the wrong
      thing.

  - type: callout
    variant: pro-tip
    md: |
      If a thumbnail or Creo View preview doesn't match the latest iteration, publishing may not
      have run yet (requests wait in a queue) or it may have failed. Check the representation
      before you trust it - and ask for it to be published again rather than raising a change.

  - type: flashcards
    cards:
      - front: Primary content
        back: The one main file of a document (or CAD document). Changing it needs a check-out.
      - front: Attachment
        back: Extra files or links on an object - zero or more. Also called secondary content.
      - front: Representation
        back: A lightweight viewable generated by publishing - for Creo View and the browser.
      - front: Default representation
        back: The representation opened when you view the object. An object can have several.
      - front: Thumbnail
        back: A small preview image shown in tables and on the information page.
      - front: Do you edit a representation yourself?
        back: No. It is generated from the content by publishing.
      - front: Who makes representations?
        back: Windchill Visualization Services (WVS) - its Worker Agent uses configured workers, such as CAD workers, to convert the files.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Priya wants to keep the raw CSV data with the test report PDF. Where does it go?
        options: [As a second primary content, As an attachment on the document, As a representation, In a separate email]
        answer: 1
        explanation: A document has one primary content. Extra supporting files go in attachments, which stay with that iteration.
      - kind: truefalse
        prompt: A buyer without a CAD license can look at a 3D model through its representation.
        answer: true
        explanation: That's the point of representations - lightweight viewables for Creo View and the browser, no CAD tool needed.

  - type: summary
    points:
      - Primary content = the one main file. Attachments = the extras. Both change through the document's iterations.
      - Representations are viewables generated by publishing; one of them is the default.
      - Thumbnails show the default representation and help you recognise objects at a glance.
      - Keep the real file as primary content and evidence as attachments on the same iteration.
