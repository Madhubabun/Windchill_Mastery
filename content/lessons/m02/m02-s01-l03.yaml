id: m02-s01-l03
subtitle: The main file, the extras and the lightweight preview - three different jobs.
version: 1.0.0
updated: "2026-10-05"
tags: [primary-content, attachments, representations, visualization, thumbnails]

blocks:
  - type: text
    md: |
      Think of a music release. There's **the track** itself. There are **extras** - lyrics,
      liner notes, the stems for remixers. And there's the **preview clip** that plays in the app
      so you can check it out without downloading the full thing.

      A Windchill object's files work the same way:

      - **Primary content** - the one main file the object is about.
      - **Attachments** - any number of extra files or links riding along.
      - **Representations** - lightweight viewable versions generated for viewing, for example
        in [[creo-view|Creo View]].

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the main file" → [[primary-content|primary content]] (one per document)
      - "the extras" → [[attachment|attachments]] (also called *secondary content*)
      - "the preview version" → [[representation]] (a *viewable*)
      - "the tiny picture in tables" → *thumbnail*
      - "the robot that makes previews" → *publishing* by Windchill Visualization Services (WVS),
        run by a [[cad-worker|CAD worker]]

  - type: diagram
    title: What's inside test report TR-0057
    caption: Click each box to see what it holds and how it changes.
    diagram:
      width: 800
      height: 380
      groups:
        - { label: Versioned content - change needs check-out, x: 10, y: 120, w: 520, h: 120, tone: info }
        - { label: Visualization, x: 550, y: 120, w: 240, h: 250, tone: success }
      nodes:
        - id: doc
          label: TR-0057 A.2
          sublabel: brake test report
          x: 290
          y: 20
          w: 220
          tone: primary
          shape: doc
          detail: The document object - number, name, type, version, state. It holds pointers to its files.
        - id: primary
          label: Primary content
          sublabel: brake-test.pdf
          x: 30
          y: 160
          w: 220
          tone: warning
          shape: doc
          detail: |
            **Exactly one** main file (or a URL link, or none). Replace it by checking out and
            uploading a new file - which creates a new iteration on check-in.
          real: Search results and the information page's download link point to this file.
        - id: attach
          label: Attachments
          sublabel: raw-data.csv, photos
          x: 290
          y: 160
          w: 220
          tone: neutral
          shape: doc
          detail: |
            **Zero or more** extra files or URL links - raw data, photos, a supplier certificate.
            They belong to the iteration, so adding or removing one normally needs a check-out too.
        - id: rep
          label: Representation
          sublabel: viewable for Creo View
          x: 570
          y: 160
          w: 200
          tone: success
          detail: |
            A lightweight, generated file set for viewing - for CAD that's tessellated 3D geometry,
            for a drawing a 2D viewable, for Office files often a PDF (if your company sets it up).
            An object can have several representations; one is the **default**.
          real: Republishing a representation does not create a new iteration of the object.
        - id: thumb
          label: Thumbnail
          sublabel: tiny preview image
          x: 570
          y: 280
          w: 200
          tone: success
          detail: A small image generated alongside the representation, shown in tables and on the information page so you recognise objects at a glance.
      edges:
        - { from: doc, to: primary, label: one }
        - { from: doc, to: attach, label: many }
        - { from: doc, to: rep, label: published }
        - { from: rep, to: thumb }

  - type: comparison
    title: Primary content vs attachments vs representations
    columns: [Primary content, Attachments, Representation]
    rows:
      - label: How many
        cells: [One (or none), Zero or more, Zero or more - one is default]
      - label: Made by
        cells: [You upload it, You upload them, "Generated by publishing (WVS)"]
      - label: Changing it
        cells: [Check out → new iteration, Check out → new iteration, "Republish - no new iteration"]
      - label: Typical use
        cells: [The file the object is about, Supporting evidence and extras, "Viewing, markup, sharing without CAD"]
    takeaway: You own the content. Windchill generates the representation from it.

  - type: callout
    variant: why-it-matters
    md: |
      Most people who look at engineering data **don't have CAD**: buyers, quality, service,
      suppliers. Representations let them view, measure and mark up a model in Creo View without a
      CAD license. Meanwhile attachments keep the evidence (raw data, certificates) next to the
      document it supports - instead of in somebody's inbox.

  - type: example
    variant: real-world
    title: Where's the raw data?
    industry: Micromobility
    md: |
      A quality auditor asked Acme for the raw measurements behind the brake test report. The PDF
      (primary content) only had the summary. Because Priya had added **raw-data.csv as an
      attachment** on the same iteration, Kai downloaded it in seconds - and it was provably the
      data for *that* version of the report, A.2.
    takeaway: Attach supporting evidence to the iteration it supports. It stays matched forever.

  - type: walkthrough
    title: Find content, attachments and representations
    who: Any user with read access
    where: ["<object> information page"]
    steps:
      - title: Download the primary content
        where: [Information page, Primary content]
        md: |
          The information page shows the primary content near the top (often as a file name or
          download icon). Click it to download.
      - title: See the attachments
        where: [Information page, Content or Attachments]
        md: |
          Attachments are listed in a content or attachments area or tab. The label differs by
          release. Download any of them from there.
      - title: See the representations
        where: [Information page, Representations or Visualization]
        md: |
          A representations table (often on a tab named something like *Representations/Annotations*)
          lists the viewables and which one is the default. Open one in Creo View from there.
      - title: Republish if the preview looks wrong
        where: [Representations table, Actions, Publish or Republish]
        md: |
          Users with the right permission can request a new representation. The job goes to a
          publishing queue; it can take a few minutes. Whether this action is available is set by
          your company.
    result: You can tell the main file, the extras and the viewables apart - and get each one.

  - type: exercise
    title: Sort the files
    environment: windchill-trial
    goal: |
      Take three files and decide where each belongs: primary content, attachment or "let
      Windchill generate it". Then try it on a test document in a trial or training system.
    steps:
      - "For Acme's **brake test report**, you have: `brake-test.pdf`, `raw-data.csv` and `preview.pvz` (a Creo View file someone exported by hand)."
      - Decide which file is the primary content and which is an attachment.
      - Decide what to do with the hand-made viewable. (Hint - who should make representations?)
      - "In a trial system: create a test document with the PDF as primary content, check it out, add the CSV as an attachment, and check it in."
      - Open the information page and confirm the version went up by one iteration.
    expected: |
      PDF = primary content, CSV = attachment. The hand-made viewable is skipped: representations
      should be generated by publishing so they always match the content. After check-in the
      document moved up one iteration (for example A.1 → A.2) and shows the CSV as an attachment.

  - type: callout
    variant: pitfall
    md: |
      **Putting the important file in an attachment.** Searches, viewers and integrations usually
      look at the **primary content**. If the real report is attachment #3 and the primary content
      is a cover sheet, people will read the wrong thing.

  - type: callout
    variant: pro-tip
    md: |
      If a thumbnail or Creo View preview doesn't match the latest iteration, the representation may
      not have been republished yet (or publishing failed). Check the representation's date before
      you trust it - and republish rather than raising a change.

  - type: flashcards
    cards:
      - front: Primary content
        back: The one main file of a document (or CAD document). Changing it needs a check-out.
      - front: Attachment
        back: Extra files or links on an object - zero or more. Also called secondary content.
      - front: Representation
        back: A lightweight viewable generated by publishing - for Creo View and the browser.
      - front: Default representation
        back: The representation opened when you view the object. An object can have several.
      - front: Thumbnail
        back: A small preview image shown in tables and on the information page.
      - front: Does republishing create a new iteration?
        back: No. Representations are generated from the content, not edited by you.
      - front: Who makes representations?
        back: Windchill Visualization Services, usually by sending a job to a CAD worker.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Priya wants to keep the raw CSV data with the test report PDF. Where does it go?
        options: [As a second primary content, As an attachment on the document, As a representation, In a separate email]
        answer: 1
        explanation: A document has one primary content. Extra supporting files go in attachments, which stay with that iteration.
      - kind: truefalse
        prompt: A buyer without a CAD license can look at a 3D model through its representation.
        answer: true
        explanation: That's the point of representations - lightweight viewables for Creo View and the browser, no CAD tool needed.

  - type: summary
    points:
      - Primary content = the one main file. Attachments = the extras. Both are versioned.
      - Representations are generated viewables; republishing doesn't create a new iteration.
      - Thumbnails come from publishing and help you recognise objects at a glance.
      - Keep the real file as primary content and evidence as attachments on the same iteration.
