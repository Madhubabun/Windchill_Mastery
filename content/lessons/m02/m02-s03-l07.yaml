id: m02-s03-l07
subtitle: Reusing a part saves money - until you change it. Where-used tells you who you're about to surprise.
version: 1.0.0
updated: "2026-10-05"
tags: [bom, where-used, reuse, impact, change]

blocks:
  - type: text
    md: |
      Reusing parts is one of the smartest things an engineering team can do. One hinge used in
      three products means one design to test, one supplier contract, bigger orders, better prices.

      But reuse has a price tag that shows up later: **when you change a shared part, you change it
      for everyone.** Before touching a part, you need the answer to one question: *who uses this?*
      The structure view looks **down** a BOM. [[where-used|Where-used]] looks **up**.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "who uses this part?" → *[[where-used|where-used]]*
      - "just the direct parents" → *single-level where-used*
      - "all the way up to the products we sell" → *multi-level where-used* (up to the *end items*)
      - "what a change will touch" → *impact* (the parents become candidate [[affected-object|affected objects]])
      - "still fits, still works, same job" → *interchangeable* (often called *form, fit and function*)

  - type: animation
