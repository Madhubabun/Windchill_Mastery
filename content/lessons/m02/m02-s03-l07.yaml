    chapters:
      - title: Start from the part
        caption: Priya wants to widen the hole spacing on hinge **SC-1042**. Before she does, she runs a where-used.
        show: [hinge]
        highlight: [hinge]
        seconds: 5
      - title: One level up
        caption: A **single-level** where-used lists the direct parents - three different assemblies, not just the scooter frame she knows.
        show: [hinge, frame, fold, s3frame]
        highlight: [frame, fold, s3frame]
        flow: [hinge>frame, hinge>fold, hinge>s3frame]
        seconds: 7
