id: m02-s03-l04
subtitle: Is the CAD model in charge of the part, part of its picture, or just describing it? The association type decides.
version: 1.1.0
updated: "2026-10-13"
tags: [bom, cad, associations, owner, contributing, image, content, build]
sources:
  - id: te
    where: "Module 4: CAD and Windchill product structures (eBOMs); Describe the CAD-centric approach to product development; Update CAD documents: check in (owner association drives the WTPart structure, owner-associated parts iterate); Activity: Create a CAD part in Creo (Auto Associate Parts to CAD Documents)"
  - id: te
    where: "Module 5: Create a BOM: techniques (auto-associating from CAD); Activity: Create a baseline of a BOM (removing a part and confirming the change is synchronized with future CAD builds); Manage object associations in a BOM (Edit Associations)"
  - id: hc-cad-assoc
    label: PTC Help Center supplement
    title: "Association Usage Examples"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/ManagingCADandPartRelationships/MCPR_AssociationUsageExamples.html"
    covers: "The five association types Owner, Contributing Image, Image, Contributing Content and Content; which pass attributes; an Image-associated model assembled into an Owner-associated assembly appears in the product structure after the build; build at check-in or with an explicit Build action"
  - id: hc-cad-assoc-compare
    label: PTC Help Center supplement
    title: "Comparing CAD and Part Association Types"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/ManagingCADandPartRelationships/MCPR_ComparingCADandPartAssocTypes.html"
    covers: "Per type - creates structure, passes attributes, part participates in structure, how many associations are allowed; multi-owner needs a preference"
  - id: hc-cad-assoc-overview
    label: PTC Help Center supplement
    title: "CAD and Part Association Overview"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/ManagingCADandPartRelationships/MCPR_AssociationOview.html"
    covers: "Definitions of Owner, Contributing Image, Image, Contributing Content, Content (formerly passive) and Calculated (drawings); limits per part; associating or disassociating iterates the part; build at next check-in by default; Auto Associate vs Edit Association"
  - id: hc-cad-driven
    label: PTC Help Center supplement
    title: "Association Types for CAD-Driven Product Design"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/ManagingCADandPartRelationships/MCPR_CAD-DrivenProductStructure.html"
    covers: "Owner (formerly Active) decomposed into structure, attribute and representation build links; Content (formerly Passive) behaves like a describes link"
  - id: hc-build-rules
    label: PTC Help Center supplement
    title: "Build Rules and Build Links"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/ManagingCADandPartRelationships/MCPR_BuildRulesAndLinksOview.html"
    covers: "The build passes an Owner CAD document's children to its part; each child needs a linked part with at least a representation build link; the part iterates only if the structure changed"

blocks:
  - type: text
    md: |
      Priya adds four washers to the frame assembly in Creo and checks it in. Will the washers show
      up in the frame's BOM? **It depends on how each CAD model is linked to its part.**

      A [[cad-document|CAD document]] and a [[part]] are separate objects. An *association* joins
      them and controls three things that can flow from CAD to the part:

      - **Structure** - does this CAD document build the part's list of children?
      - **Attributes** - do CAD values (like material) pass to the part?
      - **Representation** - does this CAD document stand for the part, so the part shows up when
        the model is assembled somewhere?

      Windchill 13.1.2.0 names five association types, each a different mix of those three. Pick
      the right one and a CAD change lands in the BOM exactly as intended.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term** (names as in the 13.1.2.0 Help Center)
      - "this CAD model is in charge of this part" → **Owner** ([[owner-association|owner association]])
      - "it stands for the part and passes attributes, but doesn't build its children" → **Contributing Image**
      - "it stands for the part - nothing more" → **Image**
      - "it only passes attributes, and doesn't put the part in any structure" → **Contributing Content**
      - "it just describes the part, like a layout" → **Content** (older releases called this *passive*)
      - "Windchill works out the drawing-to-part link itself" → [[calculated-association|Calculated]]
      - "update the part structure from the CAD" → *build* (at check-in, or with an explicit Build action)

  - type: animation
    title: How a CAD change becomes a BOM change
    diagram:
      width: 820
      height: 360
      groups:
        - { label: "Priya's desk (Creo)", x: 10, y: 10, w: 250, h: 340, tone: neutral }
        - { label: Windchill, x: 290, y: 10, w: 520, h: 340, tone: info }
      nodes:
        - { id: creo, label: Frame assembly, sublabel: "in Creo + washer", x: 40, y: 60, w: 190, tone: accent }
        - { id: ws, label: Workspace, sublabel: check in, x: 40, y: 220, w: 190, tone: neutral }
        - { id: cad, label: SC-2000.asm, sublabel: CAD document A.5, x: 320, y: 60, w: 190, tone: info, shape: doc }
        - { id: build, label: Build, sublabel: owner association, x: 320, y: 220, w: 190, tone: warning, shape: pill }
        - { id: part, label: SC-2000 part, sublabel: new iteration, x: 590, y: 60, w: 190, tone: primary }
        - { id: washer, label: Washer FS-0810, sublabel: new BOM line ×4, x: 590, y: 220, w: 190, tone: success }
      edges:
        - { from: creo, to: ws }
        - { from: ws, to: cad, label: check in }
        - { from: cad, to: build }
        - { from: build, to: part }
        - { from: part, to: washer, label: uses ×4 }
    chapters:
      - title: Priya edits the CAD assembly
        caption: She assembles four washers into the frame in Creo. The washer model already has its own part, FS-0810, from the fastener library.
        show: [creo]
        highlight: [creo]
        seconds: 6
      - title: Check in through the workspace
        caption: The changed assembly goes to Windchill. The CAD document gets a new iteration.
        show: [creo, ws, cad]
        highlight: [cad]
        flow: [creo>ws, ws>cad]
        seconds: 6
      - title: The association decides
        caption: SC-2000.asm is the **Owner** of part SC-2000, so a **build** runs - by default as part of the check-in.
        show: [creo, ws, cad, build]
        highlight: [build]
        flow: [cad>build]
        seconds: 6
      - title: The part follows the CAD
        caption: "The owner's CAD children are passed to part SC-2000, which iterates because its structure changed. A **washer ×4** line appears - because the washer model *represents* part FS-0810 (through an Owner, Contributing Image or Image link)."
        highlight: [part, washer]
        flow: [build>part, part>washer]
        seconds: 8
      - title: No representing part, no line
        caption: If the washer model had no part, or only a Content or Contributing Content link, there would be nothing to put on the BOM line. Every CAD child needs a part that it represents.
        highlight: [washer]
        seconds: 7

  - type: diagram
    title: The association family
    caption: Five types, each a different mix of structure, attributes and representation. Click each.
    diagram:
      width: 820
      height: 420
      groups:
        - { label: "Stand for the part (it appears in structures)", x: 10, y: 10, w: 560, h: 180, tone: warning }
        - { label: "Don't put the part in a structure", x: 10, y: 210, w: 560, h: 180, tone: info }
      nodes:
        - id: owner
          label: Owner
          sublabel: structure + attributes + image
          x: 30
          y: 60
          w: 170
          tone: warning
          detail: |
            The CAD document is **in charge**: it builds the part's structure, passes most
            attributes and is the part's primary representation. One Owner link per part. (A CAD
            document can own several parts only if multi-owner is enabled by a preference.)
            Owner-associated parts iterate when their CAD is checked in.
          real: Typical for every designed component and sub-assembly in a CAD-centric company.
        - id: cimage
          label: Contributing Image
          sublabel: attributes + image
          x: 210
          y: 60
          w: 170
          tone: warning
          detail: |
            Stands for the part and passes attributes, but **doesn't build its children**. Its part
            still appears in the parent's structure. One per part - useful for flexible parts, such
            as a cable routed differently in two places.
        - id: image
          label: Image
          sublabel: image only
          x: 390
          y: 60
          w: 160
          tone: warning
          detail: |
            Representation only. No structure built, no attributes passed - but when the model is
            assembled into an Owner-driven assembly, its part shows up in that structure. A part
            can have many Image CAD documents; each CAD document images one part.
        - id: ccontent
          label: Contributing Content
          sublabel: attributes only
          x: 60
          y: 260
          w: 200
          tone: info
          detail: |
            Passes attributes to the part and nothing else - the part doesn't appear in a structure
            through this link. Meant for multi-CAD cases where secondary attributes matter to the
            BOM, usually next to an Owner.
        - id: content
          label: Content
          sublabel: describes only
          x: 300
          y: 260
          w: 200
          tone: info
          detail: |
            Passive: the CAD document **describes** the part - like a layout or process plan - but
            builds nothing, passes nothing and doesn't represent it. No limit per part. Older
            releases called it a *passive* link.
        - id: part
          label: Part
          sublabel: WTPart
          x: 610
          y: 130
          w: 180
          tone: primary
          detail: The part is what purchasing, the factory and service use. The association types decide what reaches it from CAD.
        - id: calc
          label: Calculated
          sublabel: drawings
          x: 610
          y: 290
          w: 180
          tone: neutral
          shape: doc
          detail: |
            Created automatically when a drawing of an Owner-associated model is first uploaded.
            Windchill works it out - it isn't a link you model or edit.
      edges:
        - { from: owner, to: part }
        - { from: cimage, to: part }
        - { from: image, to: part, dashed: true }
        - { from: ccontent, to: part, dashed: true }
        - { from: content, to: part, dashed: true }
        - { from: calc, to: part, dashed: true }

  - type: comparison
    title: The five types at a glance
    columns: [Builds structure, Passes attributes, Part appears in structures, How many]
    rows:
      - { label: Owner, cells: ["Yes", "Yes", "Yes", One per part] }
      - { label: Contributing Image, cells: ["No", "Yes", "Yes", One per part] }
      - { label: Image, cells: ["No", "No", "Yes", Many per part - one part per CAD document] }
      - { label: Contributing Content, cells: ["No", "Yes", "No", "Help Center pages differ (see note)"] }
      - { label: Content, cells: ["No", "No", "No", No limit] }
    takeaway: Only Owner builds a part's children. Owner, Contributing Image and Image make the part show up where the model is used.

  - type: callout
    variant: why-it-matters
    md: |
      The association type is a **policy decision** about where the BOM is authored. With Owner
      links, CAD and BOM stay in step automatically, so designers can't forget to update the BOM.
      Where a part's children aren't driven by CAD, the structure is maintained in Windchill. Most
      companies mix them, and write the rule down so everyone links the same way.

  - type: example
    variant: real-world
    title: One part, several CAD documents
    industry: Micromobility
    md: |
      At Acme, every Creo sub-assembly - frame SC-2000, wheel SC-3100, handlebar SC-4000 - is the
      **Owner** of its part, so a change in Creo reaches the BOM on check-in.

      The brake cable SC-4050 is trickier: it's routed one way on the S2 and another way on the
      S2 Sport. Priya's main cable model is the **Owner** of SC-4050; the second routing is linked
      as an **Image**. Both scooters' BOMs show SC-4050, but only one model drives its attributes.

      The frame's weld layout sketch is linked to SC-2000 as **Content** - it describes the part
      and reaches nobody's BOM.
    takeaway: Ask two questions per CAD file - "should it build this part?" and "should this part show up where the model is used?"

  - type: walkthrough
    title: Check and change how a part is linked to CAD
    who: Designers; changing associations may need extra rights
    steps:
      - title: See the associated CAD documents
        where: ["<part> information page", Related Objects]
        md: |
          On the part's information page, find the related CAD documents and read the
          **association type** of each: Owner, Contributing Image, Image, Contributing Content or
          Content.
      - title: Associate automatically at check-in
        where: [Creo, Workspace, Check In, Next, Auto Associate Parts to CAD Documents]
        md: |
          For new CAD documents, keep **Auto Associate Parts to CAD Documents** selected at
          check-in. It suits mature CAD structures where most links are Owner, and it can match
          existing parts or create new ones.
      - title: Create, change or remove an association
        where: [Workspace, select CAD document and part, Edit Associations]
        md: |
          With the CAD document and part in your workspace, use **Edit Associations** to create,
          modify or delete the association - including the many-to-one cases. Associating or
          disassociating a structure-related CAD document iterates the part.
    result: You know which CAD documents feed each part, and how.

  - type: scenario
    variant: what-if
    title: Predict the BOM
    start: s1
    nodes:
      - id: s1
        md: |
          Priya adds **four washers** to SC-2000.asm and checks in. The assembly is the **Owner** of
          part SC-2000, and the washer model is the Owner of part FS-0810. What happens to the
          frame's BOM?
        choices:
          - label: A washer ×4 line appears in the part structure
            next: s2
            good: true
            feedback: Right. The Owner build passes the assembly's CAD children to the part, and the washer model represents FS-0810.
          - label: Nothing - someone must add it in Windchill
            next: s1-wrong
            feedback: Not with an Owner link. The build runs (by default at check-in) and adds the CAD children.
      - id: s1-wrong
        md: The Owner association is exactly what makes the frame's structure follow the CAD. Try the next case with that in mind.
        choices:
          - label: Next case
            next: s2
      - id: s2
        md: |
          Leo models a second routing of brake cable SC-4050 for the S2 Sport and links it to part
          SC-4050 as an **Image**. He assembles it into the S2 Sport handlebar (Owner-linked) and
          checks in. Does SC-4050 appear in the S2 Sport handlebar BOM?
        choices:
          - label: Yes - an Image-linked model's part shows up in the parent's structure
            next: s3
            good: true
            feedback: Correct. Image provides representation, so the part participates in the structure the Owner builds.
          - label: No - Image links never touch the BOM
            next: s3-hint
            feedback: An Image link doesn't build SC-4050's own children, but its part does show up wherever the model is assembled.
      - id: s3-hint
        md: The Help Center example is exactly this - an Image-linked model assembled into an Owner assembly appears in that assembly's product structure after the build.
        choices:
          - label: Next case
            next: s3
      - id: s3
        md: |
          Kai links a stress-analysis model to the frame part as **Contributing Content** so its
          mass value reaches the part. Someone then assembles that analysis model into another
          Owner-driven assembly. Does the frame part appear in that assembly's BOM?
        choices:
          - label: No - Contributing Content passes attributes only
            next: win
            good: true
            feedback: Right. With Contributing Content the part doesn't participate in a structure through that model.
          - label: Yes - any associated model puts its part in the BOM
            next: partial
            feedback: Only Owner, Contributing Image and Image represent the part. Contributing Content and Content don't.
      - id: win
        md: |
          You can predict the flow. **Owner** builds the part's children. **Owner, Contributing
          Image and Image** make the part appear where its model is assembled. **Contributing
          Content** passes attributes only, and **Content** just describes.
        outcome: success
      - id: partial
        md: Close. Go back to the comparison table - the "Part appears in structures" column is the one that answers this.
        outcome: partial

  - type: callout
    variant: pitfall
    md: |
      **"Why isn't my new bracket in the BOM?"** Check three things: is the parent assembly
      linked as **Owner** (only Owner builds children)? Does the bracket's model have a part it
      **represents** (Owner, Contributing Image or Image)? And has the build run - by default at
      the next check-in of the CAD document?

  - type: callout
    variant: pro-tip
    md: |
      Editing a CAD-driven structure in Windchill? When the course manual removes a part from a
      CAD-built structure, Windchill asks you to confirm that the change should be **synchronized
      with future CAD builds**. Read that prompt carefully - it's Windchill telling you CAD and
      BOM are linked.

  - type: callout
    variant: note
    md: |
      Build behaviour is configurable: the build normally runs at the CAD document's next check-in,
      but preferences can delay it (then a *Build* action does it) or build right after
      associating. Which attributes map, and whether parts are created automatically, also differ
      between companies. Under the hood the Help Center splits an Owner link into *structure*,
      *attribute* and *representation* build links - the other types are subsets of those.

      **Help Center conflict, not resolved here:** the 13.1.2.0 *CAD and Part Association
      Overview* allows several Contributing Content links next to an Owner, while *Comparing CAD
      and Part Association Types* lists one CAD document per part for Contributing Content. Check
      your own system before relying on either.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Which association lets a CAD assembly build a part's children on check-in?
        options: [Image, Owner, Contributing Image, Content]
        answer: 1
        explanation: Only Owner creates structure. Contributing Image and Image represent the part but don't build its children; Content only describes.
      - kind: single
        prompt: A model must pass its attributes to a part but must not make that part appear in any structure. Which type?
        options: [Owner, Image, Contributing Content, Contributing Image]
        answer: 2
        explanation: Contributing Content passes attributes only - the part doesn't participate in a structure through it.
      - kind: multi
        prompt: Which types make the part show up in a parent's structure when the model is assembled there? (Choose all that apply.)
        options: [Owner, Contributing Image, Image, Contributing Content, Content]
        answers: [0, 1, 2]
        explanation: Owner, Contributing Image and Image all provide representation, so the part participates in the structure. Contributing Content and Content don't.
      - kind: truefalse
        prompt: An Image association passes CAD attributes such as material to the part.
        answer: false
        explanation: Image is representation only. Owner, Contributing Image and Contributing Content are the types that pass attributes.
      - kind: single
        prompt: A layout sketch should be linked to a part purely as description. Which type?
        options: [Owner, Content, Contributing Image, Image]
        answer: 1
        explanation: Content (formerly called passive) describes the part without building structure, passing attributes or providing a representation.

  - type: summary
    points:
      - Five types - Owner, Contributing Image, Image, Contributing Content and Content - mix structure, attributes and representation.
      - Only Owner builds a part's children; owner-associated parts iterate with their CAD at check-in.
      - Owner, Contributing Image and Image make the part appear where its model is assembled.
      - Contributing Content passes attributes only; Content just describes; drawings get a Calculated link.
