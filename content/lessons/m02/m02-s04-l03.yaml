id: m02-s04-l03
subtitle: Circle it, note it, save it where everyone can find it - not in a screenshot lost in someone's inbox.
version: 1.1.0
updated: "2026-10-14"
tags: [visualization, markup, annotation-set, design-review, creo-view]
sources:
  - id: te
    where: "Module 2: Activity: Open a CAD model in Creo View (Isolate, Orientation, Filters saved as an annotation set; Markup tab > Measurements; Annotations > Note with Leader; Sectioning; File > Save Annotation Set > Save Annotation Set As with Include section; Representations/Annotations table; opening an annotation set from its row or the Annotation Sets tab; annotation set stays with the model it was saved on); Module 2: Home page My Tasks; Module 6: Activity: Create a problem report (Actions > New > New Problem Report, affected object, attachments); Promotion process: overview (Approver and Reviewer tasks)"
  - id: ac
    where: "Windchill architecture: visualization workers create representations that users can view, review, discuss and mark up in Creo View"

blocks:
  - type: text
    md: |
      You know how you screenshot a meme, scribble a red circle on it and send it to the group chat?
      Engineers do the same thing with designs - and for years they did it with screenshots and email.
      Three weeks later, nobody knows which version was circled, or whether anyone fixed it.

      Creo View lets you scribble **on the managed design itself** and save the scribble **into
      Windchill**, next to the object you reviewed. You make it on the **Markup** tab and save it as
      an **annotation set**.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the note and measurement on the model" → *[[markup]]* (Creo View's *Markup* tab: notes, measurements)
      - "a note with an arrow pointing at the spot" → *Note with Leader*
      - "a named bundle of notes and the view they sit on, saved to Windchill" → *[[annotation-set]]*
      - "the viewable copy you're marking up" → *[[representation]]*
      - "making it official" → *saving to Windchill*, so others with access can open it

  - type: animation
    title: A markup's life in a design review
    diagram:
      width: 820
      height: 320
      nodes:
        - { id: rep, label: Hinge B.2, sublabel: representation, x: 20, y: 130, w: 150, tone: info, shape: doc }
        - { id: view, label: Set up the view, sublabel: "isolate · orient · section", x: 200, y: 130, w: 150, tone: neutral }
        - { id: mk, label: Markup, sublabel: "note + measurement", x: 380, y: 130, w: 150, tone: warning }
        - { id: wc, label: Annotation set, sublabel: saved with the hinge, x: 580, y: 30, w: 210, tone: accent, shape: cylinder }
        - { id: pr, label: Problem Report, sublabel: references markup, x: 580, y: 140, w: 210, tone: danger }
        - { id: fix, label: Hinge B.3, sublabel: Priya's fix, x: 580, y: 250, w: 210, tone: success, shape: pill }
      edges:
        - { from: rep, to: view, label: frame }
        - { from: view, to: mk, label: annotate }
        - { from: mk, to: wc, label: save }
        - { from: wc, to: pr, label: link }
        - { from: pr, to: fix, label: fixed in }
    chapters:
      - title: Kai opens the hinge
        caption: Kai is reviewing hinge **SC-1042 B.2** for release. He opens its representation in Creo View.
        show: [rep]
        highlight: [rep]
      - title: Frame the problem
        caption: He isolates the hinge, picks an orientation and adds a **section** through the thin wall near the pin. The annotation set will remember this view.
        show: [rep, view]
        highlight: [view]
        flow: [rep>view]
      - title: Scribble and explain
        caption: "On the **Markup** tab he measures the wall and adds a **Note with Leader**: *Wall 1.2 mm - below our 1.5 mm guideline. Please check.*"
        show: [rep, view, mk]
        highlight: [mk]
        flow: [view>mk]
      - title: Save it where it belongs
        caption: "He uses **File > Save Annotation Set As**. It's saved to Windchill with the hinge model he opened - not on his laptop."
        show: [rep, view, mk, wc]
        highlight: [wc]
        flow: [mk>wc]
      - title: Turn the note into action
        caption: Because it's a real problem, Kai raises a **Problem Report** on the hinge that names the annotation set, so the evidence travels with the issue.
        show: [rep, view, mk, wc, pr]
        highlight: [pr]
        flow: [wc>pr]
      - title: The fix is traceable
        caption: Priya opens the annotation set, thickens the wall and checks in **B.3**. Anyone can later see what was found, on which version, and what fixed it.
        highlight: [fix]
        flow: [pr>fix]
        seconds: 8

  - type: callout
    variant: why-it-matters
    md: |
      A design review is only worth something if its findings are **recorded**. Auditors, new team
      members and future you will ask: "Who spotted this, on which version, and what was decided?"
      Annotation sets saved to Windchill answer that. Screenshots in email don't - they rot, and they
      never say which iteration they show.

  - type: comparison
    title: Screenshot in email vs markup in Windchill
    columns: [Screenshot + email, Annotation set in Windchill]
    rows:
      - { label: "Which object?", cells: [Usually unknown, Listed on the reviewed object's information page] }
      - label: Who can find it later?
        cells: [Whoever got the email, Anyone with access to the object]
      - label: Can others open the 3D view?
        cells: ["No - it's a flat picture", "Yes - open it and keep exploring"]
      - label: Useful as review evidence
        cells: [Weak, Strong]
    takeaway: If it's a finding, save it to Windchill. Email is for the conversation - not the record.

  - type: walkthrough
    title: Create and save a markup
    who: Reviewers with Creo View (the PTC course uses Creo View Lite)
    where: ["<object> information page", Actions, Open in, Open in Creo View]
    steps:
      - title: Open the right version
        where: ["SC-1042 information page", Actions, Open in, Open in Creo View]
        md: |
          Open the information page of the **version under review** and choose **Actions > Open in
          > Open in Creo View**. Double-check the version shown.
      - title: Set up the view
        where: [Creo View, Model tab / Isolate / Orientation / Sectioning]
        md: |
          Isolate the component, choose an orientation and, if it helps, add a section. The
          annotation set you save can remember this view - frame it well.
      - title: Measure
        where: [Creo View, Markup tab, Measurements]
        md: |
          On the **Markup** tab, pick a measurement such as **Diameter** or **Length**, click the
          geometry, then apply the measurement to the view.
      - title: Add a note
        where: [Creo View, Markup tab, Annotations, Note, Note with Leader]
        md: |
          Choose **Note > Note with Leader**, drag from the spot to where the text should sit, and
          type the finding - **what**, **where**, **why it matters** - not "fix this?".
      - title: Save it to Windchill
        where: [Creo View, File, Save Annotation Set, Save Annotation Set As]
        md: |
          Choose **File > Save Annotation Set > Save Annotation Set As**, give it a clear name (for
          example *SC-1042 B.2 - thin wall at pin*), decide whether to **Include section**, and
          click OK.
    result: The annotation set appears in the Representations/Annotations table of the object you opened, for everyone with access.

  - type: walkthrough
    title: Use annotation sets in a review
    who: Reviewers and designers
    steps:
      - title: Find annotation sets on an object
        where: ["<object> information page", "Representations/Annotations"]
        md: |
          The table lists annotation sets next to the representations. Click the thumbnail in an
          annotation set's row and Creo View opens straight at it. Note: an annotation set saved
          on an assembly shows on the assembly's page, not on each child part's page.
      - title: Respond to a review task
        where: [Home, My Tasks, "<review task>"]
        md: |
          If your company reviews through workflow tasks (for example the Approver and Reviewer
          tasks of a promotion request), open the objects from the task, add your annotation set,
          then complete the task with a comment that **names** it.
      - title: Escalate real problems
        where: ["<object> information page", Actions, New, New Problem Report]
        md: |
          If a finding needs a design change, raise a Problem Report from the object - it is
          pre-selected as the affected object - and name the annotation set in the description, or
          add an exported image on the attachments step.
    result: Findings are saved with the design, linked to the decision, and easy to find later.

  - type: simulation
    title: Mark it up, don't lose it
    intro: |
      You're Kai reviewing hinge **SC-1042 B.2**. Mark up the thin wall, save it to Windchill as an
      annotation set and get it in front of Priya. Watch out - closing Creo View before saving
      throws your work away.
    headline: "View: {view} · note: {note} · measured: {circle} · saved: {saved} · in PR: {linked}"
    initial: { view: Free, note: "No", circle: "No", saved: "No", linked: "No", priyaSeen: "No" }
    actions:
      - id: capture
        label: Set up the view (isolate and section the pin area)
        when: { view: Free }
        do: [{ set: { view: Set up } }]
        log: Pin area isolated and sectioned. The annotation set can remember this view.
        blockedHint: The view is already set up.
      - id: note
        label: Add a Note with Leader
        when: { view: Set up, note: "No" }
        do: [{ set: { note: "Yes" } }]
        log: "Note added: Wall 1.2 mm - below 1.5 mm guideline."
        blockedHint: Set up the view first - or you already added the note.
      - id: circle
        label: Measure the wall
        when: { view: Set up, circle: "No" }
        do: [{ set: { circle: "Yes" } }]
        log: Length measurement applied to the view - 1.2 mm.
        blockedHint: Set up the view first - or it's already measured.
      - id: close
        label: Close Creo View without saving
        when: { saved: "No" }
        do: [{ set: { view: Free, note: "No", circle: "No" } }]
        log: Creo View closed. Your unsaved notes are gone - nobody else will ever see them.
        blockedHint: Nothing unsaved to lose.
      - id: save
        label: Save annotation set to Windchill
        when: { note: "Yes", saved: "No" }
        do: [{ set: { saved: "Yes" } }]
        log: "Saved as SC-1042 B.2 - thin wall at pin. It now shows in the hinge's Representations/Annotations table."
        blockedHint: Add at least a note first - a markup with no explanation helps nobody.
      - id: link
        label: Raise Problem Report naming the annotation set
        when: { saved: "Yes", linked: "No" }
        do: [{ set: { linked: "Yes" } }]
        log: Problem Report created on SC-1042 B.2 with the annotation set named as evidence.
        blockedHint: Save the annotation set to Windchill first, so there's something to reference.
      - id: priya
        label: Priya opens the annotation set
        when: { saved: "Yes" }
        do: [{ set: { priyaSeen: "Yes" } }]
        log: Priya clicks the annotation set's row on the information page and Creo View opens at your view and note.
        blockedHint: Priya can't see anything that isn't saved to Windchill.
    goals:
      - label: Save a markup with a note to Windchill
        when: { saved: "Yes" }
        message: A saved annotation set is listed on the reviewed object's page, findable by anyone with access.
      - label: Get it to Priya through a Problem Report
        when: { linked: "Yes", priyaSeen: "Yes" }
        message: The finding is now recorded, linked to the issue and seen by the designer. That's a real review.

  - type: example
    variant: case-study
    title: The review that didn't happen twice
    industry: Micromobility
    md: |
      For the E-bike E1 battery cover, Acme's reviewers used to send feedback as annotated screenshots.
      After release, a cracked cover came back from testing. The team dug through email to find out if
      anyone had flagged the snap-fit - and found a screenshot from *two iterations earlier* that no one
      had acted on.

      For the next product, reviews ran through a promotion request task. Every finding had to be an
      annotation set saved to Windchill and named in the task comment. When a similar question came
      up, Kai opened the cover's annotation sets and had the answer in a minute.
    takeaway: A finding you can't find later is the same as no finding.

  - type: scenario
    variant: what-if
    title: Kai's markup and the moving target
    start: s1
    nodes:
      - id: s1
        md: |
          Kai saved an annotation set on hinge **B.2**. The next morning Priya checks in **B.3** with a
          thicker wall. What does Kai's annotation set prove?
        choices:
          - label: "What Kai found on B.2 - not whether B.3 is fixed"
            next: s2
            good: true
            feedback: "Right. It records the review of B.2's geometry."
          - label: "That B.3 is fixed too"
            next: s1-deleted
            feedback: "Nobody has looked at B.3 yet."
      - id: s1-deleted
        md: |
          The note says "Wall 1.2 mm" - a measurement Kai took on B.2. B.3 hasn't been checked by
          anyone. So what does the annotation set really tell you?
        choices:
          - label: "Only what was found on B.2"
            next: s2
            good: true
            feedback: "Exactly - each review describes the version it looked at."
      - id: s2
        md: |
          Kai wants to confirm the fix. What's the best move?
        choices:
          - label: "Open B.3 in Creo View, check the wall and note the result in the review"
            next: s3
            good: true
            feedback: "Verify on the new version and record the outcome."
          - label: "Save his old notes onto B.3 without looking"
            next: fail-copy
            feedback: "That would claim B.3 has the problem B.2 had."
      - id: s3
        md: |
          The wall is now 1.6 mm. Kai notes "verified on B.3" in the Problem Report and completes his
          review task. Six months later an auditor asks how the thin-wall issue was handled. What will
          they find?
        choices:
          - label: "The B.2 annotation set, the Problem Report and B.3 - the full story"
            next: win
            good: true
            feedback: "Finding → issue → fix, all traceable."
      - id: win
        md: |
          **Clean review trail.** The annotation set proves what was found on which version, the Problem Report
          tracks the decision, and B.3 shows the fix. That's what design reviews are for.
        outcome: success
      - id: fail-copy
        md: |
          **Misleading record.** Now B.3 appears to have a thin wall it doesn't have, and the next reviewer
          wastes time chasing it. Review notes should always describe the version they looked at.
        outcome: fail

  - type: callout
    variant: pitfall
    md: |
      **Marking up a work-in-progress iteration and calling it a review.** If you review B.2 while Priya
      is already editing B.3, your notes may be outdated before you save them. Agree on *which version*
      is under review - ideally the one attached to the review task.

  - type: callout
    variant: pro-tip
    md: |
      Name annotation sets like a commit message: **number, version, what** - for example
      *SC-1042 B.2 - thin wall at pin*. In a table of twenty of them, "Markup 7" tells nobody anything.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Kai wants Priya and future reviewers to see his comment on the hinge. Where should the markup go?
        options:
          - Saved on his desktop as an image
          - Saved to Windchill from Creo View as an annotation set
          - Pasted into a chat message
          - Printed and pinned to the wall
        answer: 1
        explanation: Saving the annotation set to Windchill lists it on the object's information page, so anyone with access can open it - with the 3D view - and it survives as review evidence.
      - kind: truefalse
        prompt: Adding a markup in Creo View changes the CAD model.
        answer: false
        explanation: Markups are notes and measurements on top of a view. The design only changes when a designer edits the CAD model and checks in a new iteration.
      - kind: order
        prompt: Put the steps for making a useful markup in order.
        items: [Open the version under review, Set up the view on the problem area, Add measurements on the Markup tab, Add a note with leader, Name it and save the annotation set]
        explanation: Frame the problem first, because the annotation set can remember the view. Then measure and annotate, name it clearly and save it so it becomes part of the record.

  - type: summary
    points:
      - Markups are notes and measurements made on Creo View's Markup tab.
      - Save them to Windchill as an annotation set - it appears on the reviewed object's page.
      - Use annotation sets as evidence in review tasks and Problem Reports, and name them clearly.
      - A review describes the version it looked at - verify the fix on the new version.
