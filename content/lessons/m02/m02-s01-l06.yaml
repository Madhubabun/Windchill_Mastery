id: m02-s01-l06
subtitle: A conflict isn't an error - it's Windchill stopping you from breaking something. Read it, then pick the fix.
version: 1.1.0
updated: "2026-10-14"
tags: [conflicts, check-in, workspace, troubleshooting, cad]
sources:
  - id: te
    where: "Module 2: Describe revision and iteration control (business rules, New Revision). Module 4: Explore the Creo CAD integration user interface (Event Management); Update CAD documents: check out; Activity: modify a CAD part (Conflicts dialog box and its actions); Manage out-of-date workspace objects; Import and export CAD documents; Activity: import CAD documents and manage the conflict (incomplete CAD documents, Event Management, View Conflicts, Auto resolve incomplete objects)"
  - id: hc-conflict-mgmt
    label: PTC Help Center supplement
    title: "Managing Conflicts"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/cadx/CADxWspActionsMenuConflictManage.html"
    covers: "The Conflicts table (reached from Event Management with the view or resolve conflicts icon) lists each object, its conflict type and description; overridable conflicts are resolved by choosing a Retry Option, clicking Set and retrying the action"
  - id: hc-cad-naming
    label: PTC Help Center supplement
    title: "Policy-Managed Naming and Numbering"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/ProEWCInteg/ProEWCIntegCustObjNameNumberManagePolicy.html"
    covers: "A CAD document's Number and File Name must both be unique within the Windchill site"

blocks:
  - type: text
    md: |
      You click **Check In** on the frame assembly. Instead of "done", the message area says the
      check-in **failed**, and the conflicts list is full of rows. Your heart rate goes up.

      Breathe. That list is Windchill doing its job. It's saying: *"If I do exactly what you asked,
      something will break - someone's work gets overwritten, a file name clashes, or an assembly
      opens with holes in it. Pick how you want to handle it."*

      Almost every conflict falls into one of a handful of types. Learn to recognise them and each
      has a calm, standard fix.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "Windchill won't do it yet" → [[cad-conflict|conflict]]
      - "someone else is editing it" → *checked out by another user*
      - "there's a newer one on the server" → *out of date*
      - "that file name is taken" → the CAD document already exists (CAD file names and numbers are unique)
      - "the assembly needs a file that isn't there" → *incomplete CAD document* (a missing [[cad-dependency|dependent]])
      - "the fix you pick" → an action or *retry option* (some conflicts are overridable, others block)

  - type: diagram
    title: Read the conflict, pick the fix
    caption: Start from the action that stopped. Click each conflict type to see the usual fix.
    diagram:
      width: 820
      height: 440
      nodes:
        - id: stop
          label: Action stopped
          sublabel: conflicts listed
          x: 310
          y: 20
          w: 200
          tone: danger
          detail: |
            If you start editing something in Creo that you haven't checked out, a **Conflicts**
            dialog box appears straight away. If a check-in fails, open **Event Management** (click
            the server name in the message area) and use **View Conflicts**. Either way you see the
            object, the conflict and your options.
        - id: other
          label: Checked out by other
          sublabel: someone else's lock
          x: 20
          y: 140
          w: 180
          tone: warning
          detail: |
            You changed an object that **another user** has checked out. Their check-out locks it,
            so nobody else can check it out or check a change in until it's checked in or the
            check-out is cancelled.
        - id: notco
          label: Not checked out
          sublabel: you edited without lock
          x: 220
          y: 140
          w: 180
          tone: warning
          detail: |
            You started modifying an object you hadn't checked out. Creo's Conflicts dialog box
            offers **Check out now**, **Continue**, keeping it read-only, or **Revise and Check out
            now**.
        - id: outdated
          label: Out of date
          sublabel: newer one on server
          x: 420
          y: 140
          w: 180
          tone: warning
          detail: |
            Someone checked in a newer iteration after you brought the object into your workspace,
            so your workspace copy is marked **out of date**. Your edits are based on old data.
        - id: name
          label: Already exists
          sublabel: file name taken
          x: 620
          y: 140
          w: 180
          tone: warning
          detail: |
            A **new** CAD file has the same file name (or number) as a CAD document already in
            Windchill - perhaps in a product you can't even see. Both must be unique site-wide.
        - id: fix-other
          label: Talk, don't force
          sublabel: or Save As a new object
          x: 20
          y: 290
          w: 180
          tone: success
          detail: |
            Find who has it (the information page shows it), agree who makes the change, and leave
            yours out of this check-in. If you really meant a **new variant**, Save As a new object.
        - id: fix-notco
          label: Check out
          sublabel: then carry on
          x: 220
          y: 290
          w: 180
          tone: success
          detail: Pick **Check out now** and continue. If business rules lock the current version, **Revise and Check out now** does both in one step. If someone else has it, it becomes the "checked out by other" case.
        - id: fix-outdated
          label: Update first
          sublabel: then redo your change
          x: 420
          y: 290
          w: 180
          tone: success
          detail: |
            Select the object and click **Update out of date versions** in the workspace (or use
            **Update** in Creo's model tree) to get the latest iteration, then reapply your change on
            top of it. Talk to whoever made the newer iteration if the changes overlap.
        - id: fix-name
          label: Rename
          sublabel: or reuse the existing one
          x: 620
          y: 290
          w: 180
          tone: success
          detail: |
            If it's genuinely a new design, **rename** it following your naming rule. If it's the
            same thing that already exists (a standard screw, say), reuse the existing CAD document
            instead of creating a duplicate.
        - id: missing
          label: Incomplete CAD document
          sublabel: assembly has a hole
          x: 310
          y: 380
          w: 200
          h: 50
          tone: info
          detail: |
            An assembly references a file that isn't there. The best practice is to fix it in the
            CAD tool. The Check In page also offers *Auto resolve incomplete objects* with *Always
            ignore* - a workaround that leaves the gap for everyone who opens the assembly.
      edges:
        - { from: stop, to: other }
        - { from: stop, to: notco }
        - { from: stop, to: outdated }
        - { from: stop, to: name }
        - { from: other, to: fix-other }
        - { from: notco, to: fix-notco }
        - { from: outdated, to: fix-outdated }
        - { from: name, to: fix-name }
        - { from: stop, to: missing, dashed: true }

  - type: comparison
    title: Conflict cheat sheet
    columns: [What it means, Calm fix, Don't]
    rows:
      - label: Checked out by another user
        cells: [Someone else holds the lock, "Talk to them, leave it out of your check-in or Save As", Ask an admin to undo their check-out without asking]
      - label: Not checked out
        cells: [You edited without the lock, "Check out now (or Revise and Check out now)", Keep editing and hope]
      - label: Out of date
        cells: [Your workspace copy is older than the latest, "Update, then redo your change", Check in on top without looking]
      - label: Already exists
        cells: [File name or number is taken, Rename or reuse the existing one, Add random suffixes like _new2]
      - label: Incomplete CAD document
        cells: [A referenced file isn't there, Fix it in the CAD tool or bring the dependent in, Auto-ignore it and check in a broken assembly]
      - label: Locked by its state
        cells: [Business rules stop changes in this state, Revise (often through the change process), Ask for extra rights to bypass it]
    takeaway: Every conflict protects someone - another user, the history, or the people who will open the file next.

  - type: callout
    variant: why-it-matters
    md: |
      The fastest way to lose a teammate's work is to "click whatever makes the window go away".
      An ignored conflict quietly hands a broken assembly or a design built on stale data to the
      next person. Reading the conflict takes ten seconds; untangling the result takes a day.

  - type: walkthrough
    title: Handle a failed CAD check-in
    who: Creo or Workgroup Manager users
    steps:
      - title: Start the check-in
        where: [Workspace, Object List, Check In]
        md: |
          Click the **Check In** icon in the object's row. The Check In page collects what goes
          with it; click **Finish**.
      - title: Notice the failure
        where: [Message area, "Windchill (Primary)"]
        md: |
          If a message says the check-in failed, click the server name at the bottom to open
          **Event Management**, which shows details of each Windchill event.
      - title: Read the conflicts
        where: [Event Management, View Conflicts]
        md: |
          Click **View Conflicts**. The Conflict Management window lists each object, its conflict
          type and a description (click the description to read it in full). Read every row before
          acting.
      - title: Find out who and what
        where: ["<object> information page"]
        md: |
          For lock or out-of-date conflicts, open the object's information page to see who has it
          checked out and what the latest iteration is.
      - title: Fix the cause, then try again
        where: [Workspace, Check In]
        md: |
          Check out, update, rename or fix the model in the CAD tool, then check in again. For an
          overridable conflict you can instead choose a **Retry Option**, click **Set** and retry -
          only when you understand what the conflict protects.
    result: Either the check-in completes cleanly, or your work waits safely in your workspace while you sort it out.

  - type: scenario
    variant: troubleshooting
    title: Friday afternoon frame check-in
    start: s1
    nodes:
      - id: s1
        md: |
          Priya checks in her updated **frame SC-2000** assembly. Two conflicts appear. Row 1: the
          **hinge SC-1042** is *checked out by Kai* - but Priya also tweaked a hole in it in her
          workspace. What does she do with row 1?
        choices:
          - label: Ask an admin to undo Kai's check-out
            next: f1
            feedback: That could throw away Kai's work. Locks are there to be respected.
          - label: Message Kai and remove the hinge from her check-in
            next: s2
            good: true
            feedback: Right. The frame can go in now; the hinge change is agreed with Kai.
      - id: s2
        md: |
          Kai replies: "I'm changing that hole too - I'll include your size." Row 2: a new part
          **bracket.prt** already exists in Windchill. Search shows bracket.prt is a
          completely different bracket in the E-bike E1 product. What now?
        choices:
          - label: Rename hers to the Acme naming rule, e.g. sc-2010_brake_bracket.prt
            next: s3
            good: true
            feedback: Yes - it's a new design, so it needs its own unique name.
          - label: Reuse the e-bike bracket
            next: p1
            feedback: Reuse is right only when it's the same part. This one isn't.
      - id: s3
        md: |
          She renames it in her workspace. One more thing catches her eye: the **steering stem**
          that the frame uses is marked **out of date** - Kai checked in a newer iteration of it
          this morning. What does she do?
        choices:
          - label: Ignore it - only the frame matters
            next: f2
            feedback: The frame goes in - but it was checked against yesterday's stem.
          - label: Update out-of-date versions, check the fit, then check in
            next: win
            good: true
            feedback: The calm route. Ten minutes now, no surprises later.
      - id: win
        md: Priya updates the stem, sees Kai only moved a mounting label, confirms the frame still fits and checks in. Frame, bracket and (later) hinge all land cleanly. Nobody's work was lost.
        outcome: success
      - id: f1
        md: The admin undoes Kai's check-out. Kai's half-finished hinge rework - three hours of it - is gone. Monday starts with an awkward conversation.
        outcome: fail
      - id: p1
        md: The frame now uses the e-bike bracket, which doesn't fit. The mistake is found at the prototype build a week later.
        outcome: partial
      - id: f2
        md: Her frame is checked in, but she never looked at Kai's new stem. A clash between the two is only found during the design review a week later.
        outcome: fail

  - type: example
    variant: real-world
    title: The screw that existed three times
    industry: Micromobility
    md: |
      Acme found three CAD documents for the same M6 screw: `m6x20.prt`, `m6x20_new.prt` and
      `m6x20_scooter.prt`. Each started as an "already exists" conflict that someone "fixed" by
      adding a suffix. The library team merged them into the one standard screw in the Standard
      Fasteners library and added a rule: **name conflict on a standard part = reuse, never rename.**
    takeaway: A name conflict on something standard usually means "use the one that exists".

  - type: callout
    variant: pitfall
    md: |
      **Overriding without reading.** Some conflicts are overridable. Auto-ignoring an incomplete
      CAD document or checking in against out-of-date copies doesn't make the problem go away - it
      hands it to the next person who opens the file.

  - type: callout
    variant: pro-tip
    md: |
      Prevent conflicts upstream: **update** your workspace before you start editing, **check out**
      before you change anything, and **check in** in small, frequent batches. Fewer stale files,
      fewer locks, fewer surprises.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Check-in says the hinge is out of date. What does that mean?
        options:
          - Your licence has expired
          - A newer iteration was checked in after you brought the hinge into your workspace
          - The hinge is Released
          - The file is corrupted
        answer: 1
        explanation: Out of date means your workspace copy isn't the latest iteration on the server. Your edits are based on old data, so update first (Update out of date versions) and reapply them.
      - kind: single
        prompt: Your new part sc-2010.prt can't be checked in because that file name already exists in Windchill. It's a different part from the existing one. Best fix?
        options: [Reuse the existing one, Rename yours following the naming rule, Override the conflict, Delete the existing one]
        answer: 1
        explanation: CAD document file names (and numbers) must be unique site-wide. If yours is a genuinely new design, it needs its own name. Reuse is right only when it's actually the same part.
      - kind: multi
        prompt: Which actions are safe when you hit a conflict you don't understand? (Choose all that apply.)
        options: [Leave the work in your workspace until you understand it, Open the object's information page to see who has it and what's latest, Override every conflict you can, Ask the person who has it checked out]
        answers: [0, 1, 3]
        explanation: A failed check-in leaves your work in your workspace, and finding out who and what is involved lets you choose the right fix. Overriding blindly hands problems to other people.
      - kind: truefalse
        prompt: Auto-ignoring an incomplete CAD document during check-in only affects you.
        answer: false
        explanation: Everyone who opens that assembly later gets the hole. The best practice is to fix the file in the CAD tool or bring the missing dependent in.

  - type: summary
    points:
      - A conflict means Windchill is protecting something - read it before acting.
      - "Common types: checked out by another user, not checked out, out of date, already exists, incomplete CAD document."
      - "Calm fixes: talk, check out, update and redo, rename or reuse, fix the model."
      - A failed check-in leaves your work in your workspace. Overriding blindly is not safe.
