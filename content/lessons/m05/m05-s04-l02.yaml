id: m05-s04-l02
subtitle: Priya checks in a frame and a 3D thumbnail appears minutes later. Follow the job all the way, then fix the worker that won't start.
version: 1.0.0
updated: "2026-10-06"
tags: [system-admin, visualization, wvs, worker-agent, cad-worker, publishing]
sources:
  - id: ac
    where: "Appendix A: Describe Windchill Visualization Services (WVS); Describe the WVS architecture; Configure WVS; Evaluate the visualization publishing system size; Evaluate the CAD worker hardware; Calculate the number of CAD workers; Optimize the visualization publishing system; Administer worker agents; View and manage WVS publication jobs; View WVS job statistics; Describe the WVS Publisher; Configure publisher queues and jobs"
  - id: ac
    where: "Module 16: Identify out-of-the-box background queues 2 (PublisherQueues); Activity: Manage publishing queues in Windchill"
