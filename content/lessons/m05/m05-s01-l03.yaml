id: m05-s01-l03
subtitle: The installer says "complete". Rosa doesn't believe it until every layer answers, from the database up to the Windchill home page.
version: 1.0.0
updated: "2026-10-06"
tags: [system-admin, installation, verification, smoke-test, server-status]
