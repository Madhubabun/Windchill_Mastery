id: m05-s04-l04
subtitle: Give background work its own engines, decide which engine runs which queue, and give the heaviest workflows their own lane.
version: 1.0.0
updated: "2026-10-06"
tags: [system-admin, queues, background-method-server, queue-groups, workflow-queues, performance]
