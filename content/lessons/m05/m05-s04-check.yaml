    where: "Appendix A: Describe the WVS architecture; Calculate the number of CAD workers; Administer worker agents; View and manage WVS publication jobs; Administer the WVS Job Scheduler; Manage publishing and thumbnail generation; Configure publisher queues and jobs; Set up the publish job priority; Clean up publisher queue entries; Configure queue pooling; Describe dedicated queues; Configure dedicated queues"
