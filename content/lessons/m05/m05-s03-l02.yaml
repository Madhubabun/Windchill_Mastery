versionNotes:
  - versions: ["all"]
    md: |
      File servers, replica vaults and replication rules are described in the supplied course for
      customer-run installations. On Windchill+ PTC runs the servers; how remote-site content delivery is
      offered there is not confirmed by the supplied sources. Older training calls the main site **master**
      and uses its own example host names; the 13.0 course uses **main**.

blocks:
  - type: text
    md: |
      The **Lakeside plant** opens a Scooter S2 frame assembly. Every byte crosses a slow WAN link from
      HQ. Four minutes later the model appears - and the next person at Lakeside who opens it waits four
      minutes again.

      The fix isn't a bigger link (well, not only). It's to put the files **near the people**: a Windchill
      [[file-server]] at Lakeside, `wc-fs-lakeside`, holding copies of the content Lakeside uses.
      The metadata still lives in one database at HQ. Only the bytes travel - ahead of time.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a mini Windchill at the plant that only stores files" → [[file-server]] (also called a [[replica|replica site]])
      - "the vault at the plant" → [[replica-vault]]
      - "which files get copied there" → [[replication-rule]]
      - "when they get copied" → a **replication schedule**
      - "the server I download from" → [[preferred-file-server]]
      - "who's next-closest if my server lacks the file" → [[proximity-list]]
      - "copy it the first time someone asks" → [[ad-hoc-replication]]

