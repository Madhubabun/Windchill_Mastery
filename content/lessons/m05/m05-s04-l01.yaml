id: m05-s04-l01
subtitle: Half of Windchill's work happens after you click OK. Learn to read the to-do lists, and to unstick them.
version: 1.0.0
updated: "2026-10-06"
tags: [system-admin, queues, background-queues, queue-management, maintenance]
sources:
  - id: ac
    where: "Module 16: What is a queue?; Describe Windchill background queues; Identify queue types; Identify out-of-the-box background queues 1 and 2; Manage queues; Describe queue entry states; Activity: Manage publishing queues in Windchill; Develop a queue maintenance routine; Identify queue performance issues"
  - id: ac
    where: "Module 19: Identify daily administrative tasks; Monitor queues using Queue Management; Monitor queues using JMX clients; Use the Queue and Workflow Health Check script"
  - id: ac
    where: "Appendix A: Describe workflow queues"
