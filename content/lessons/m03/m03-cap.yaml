id: m03-cap
subtitle: A bracket is cracking in the field. Take it from angry customer to released fix, the controlled way.
version: 1.0.0
updated: "2026-10-05"
tags: [capstone, problem-report, change-request, change-review-board, change-notice, resulting-object, form-fit-function]

blocks:
  - type: text
    md: |
      Monday, 08:40. Sam from field service drops a message in the team chat:

      > "Third one this week. The **fold-lock bracket** on the Scooter S2 is cracking. All three
      > scooters are about six months old. Riders say the stem wobbles, then the lock won't click.
      > Photos attached. This one's getting serious."

      The part is **SC-1048 Fold-lock bracket, C.2, Released**. It's in every Scooter S2 that has
      left the factory. Kai, your engineering lead, looks at you: "You know the change process now.
      Run it. I want a released fix, and I want it done properly - no hero edits."

      This is everything from Module 3 in one mission: problem reports, change requests, the CCB,
      change notices and tasks, and the form-fit-function call.

  - type: callout
    variant: note
    title: Your mission checklist
    md: |
      1. Raise a **[[problem-report]]** with real evidence.
      2. Take a **[[change-request]]** through the **[[change-review-board|CCB]]** decision.
      3. Plan and complete the **[[change-notice]]** with the right **[[resulting-object|resulting objects]]**.
      4. Decide: does the fix need a **new part number**, or a new revision?

  - type: animation
    title: The bracket's journey from complaint to fix
    caption: Every stage has an owner and a decision. Press play.
    diagram:
      width: 820
      height: 300
      groups:
        - { label: Decide, x: 10, y: 10, w: 400, h: 280, tone: neutral }
        - { label: Do, x: 420, y: 10, w: 390, h: 280, tone: neutral }
      nodes:
        - id: field
          label: Field reports
          sublabel: Sam, service
          x: 30
          y: 40
          w: 160
          tone: danger
          shape: doc
          detail: Three cracked brackets, photos, scooter serial numbers and the age of each unit. Raw evidence, not yet a decision.
        - id: pr
          label: PR-0412
          sublabel: problem report
          x: 220
          y: 40
          w: 170
          tone: warning
          detail: |
            The **problem report** captures *what* is wrong and *where*: SC-1048 C.2 is the affected
            object, with the photos and serial numbers attached. It doesn't decide the fix.
        - id: cr
          label: CR-0233
          sublabel: change request
          x: 30
          y: 170
          w: 160
          tone: info
          detail: |
            The **change request** proposes the fix and its impact: cost, stock, which products use the
            bracket (where-used), and how to treat scooters already sold.
        - id: ccb
          label: CCB decision
          sublabel: chaired by Maya
          x: 220
          y: 170
          w: 170
          tone: primary
          shape: pill
          detail: The change control board (Maya chairs it, with engineering, quality, manufacturing and service) approves, rejects or sends the request back for more analysis.
        - id: cn
          label: CN-0187
          sublabel: change notice
          x: 450
          y: 40
          w: 160
          tone: accent
          detail: The **change notice** turns the approved request into a plan of change tasks with owners and due dates.
        - id: tasks
          label: Change tasks
          sublabel: Priya, Ana
          x: 640
          y: 40
          w: 150
          tone: accent
          detail: Priya revises the bracket model and drawing. Ana updates the manufacturing side. Each task lists its affected objects and the resulting objects it produces.
        - id: released
          label: SC-1048 D.1
          sublabel: Released
          x: 545
          y: 190
          w: 170
          tone: success
          detail: When every task is done and the notice is approved, the resulting objects are released together. C.2 stays in history, untouched.
      edges:
        - { from: field, to: pr, label: report }
        - { from: pr, to: cr, label: analyse }
        - { from: cr, to: ccb, label: decide }
        - { from: ccb, to: cn, label: approved }
        - { from: cn, to: tasks, label: plan }
        - { from: tasks, to: released, label: release }
    chapters:
      - title: Something breaks
        caption: Field service sees a pattern. Evidence first, opinions later.
        show: [field]
        highlight: [field]
        seconds: 5
      - title: Capture the problem
        caption: A **problem report** names the affected bracket and attaches the photos and serial numbers.
        show: [field, pr]
        highlight: [pr]
        flow: [field>pr]
        seconds: 6
      - title: Propose a fix
        caption: The **change request** says what to change, why, and what it will cost and touch.
        show: [field, pr, cr]
        highlight: [cr]
        flow: [pr>cr]
        seconds: 6
      - title: The board decides
        caption: The **CCB** weighs cost, risk and timing, then approves.
        show: [field, pr, cr, ccb]
        highlight: [ccb]
        flow: [cr>ccb]
        seconds: 6
      - title: Plan the work
        caption: The **change notice** splits the work into tasks with owners.
        show: [field, pr, cr, ccb, cn, tasks]
        highlight: [cn, tasks]
        flow: [ccb>cn, cn>tasks]
        seconds: 7
      - title: Release the fix
        caption: Resulting objects are released together. Revision D is what the factory builds next.
        highlight: [released]
        flow: [tasks>released]
        seconds: 6

  - type: walkthrough
    title: "Task 1: raise the problem report"
    who: Any user allowed to create problem reports in the Scooter S2 product (often everyone)
    where: ["SC-1048 information page", Actions, New Problem Report]
    steps:
      - title: Start from the part
        where: [Search, "SC-1048", "Information page"]
        md: |
          Open SC-1048's information page. Starting from the object means Windchill can add it to
          the report as an **affected object** for you.
      - title: Create the report
        where: [Actions, New Problem Report]
        md: |
          From the Actions menu choose the new problem report action. Give it a name a stranger would
          understand: *"Fold-lock bracket cracks after ~6 months of use"*.
      - title: Describe what, where and how bad
        where: [New Problem Report, Details]
        md: |
          Describe the symptom, how often it happens (3 of roughly 4,000 units in one week) and the
          risk (the stem can wobble while riding). Set the priority and category your company uses.
      - title: Attach the evidence
        where: [New Problem Report, Attachments]
        md: Add the three photos and a short list of the scooter serial numbers and their ages.
      - title: Check the affected objects
        where: [New Problem Report, Affected Objects]
        md: Make sure **SC-1048 C.2** is listed. Don't add things you haven't proven are affected yet.
      - title: Submit
        where: [New Problem Report, Finish]
        md: Submit it. The workflow routes it to the change administrator for review.
    result: PR-0412 exists, with evidence, linked to SC-1048 C.2, and someone owns the next step.

  - type: simulation
    title: Drive the fix from report to release
    intro: |
      Play the whole process. You can't skip a gate: the board needs a request, the notice needs an
      approval, and nothing releases until every resulting object is ready. Your company's names and
      gates may differ; the shape stays the same.
    headline: "SC-1048 {rev} · {partState} · stage: {stage}"
    initial: { stage: Field report, evidence: 0, rev: C, partState: Released, partDone: false, drawingDone: false }
    actions:
      - id: evidence
        label: Attach evidence
        when: { stage: Field report, evidence: [0, 1] }
        do: [{ inc: evidence }]
        log: Evidence attached ({evidence} of 2). Photos and serial numbers make the case.
        blockedHint: Evidence goes on the report before you submit it.
      - id: submit-pr
        label: Submit problem report
        when: { stage: Field report, evidence: 2 }
        do: [{ set: { stage: Problem reported } }]
        log: PR-0412 submitted with SC-1048 C.2 as the affected object.
        blockedHint: Attach the photos and the serial numbers first (2 pieces of evidence).
      - id: create-cr
        label: Create change request
        when: { stage: Problem reported }
        do: [{ set: { stage: Request in analysis } }]
        log: CR-0233 created from PR-0412. Impact analysis starts.
        blockedHint: A change request answers a problem report. Submit the report first.
      - id: ccb-back
        label: "CCB: needs more analysis"
        when: { stage: Request in analysis }
        do: [{ set: { stage: Problem reported } }]
        log: The board sent it back. Add the cost of the field retrofit and try again.
        blockedHint: The board only looks at a request in analysis.
      - id: ccb-approve
        label: "CCB: approve"
        when: { stage: Request in analysis }
        do: [{ set: { stage: Request approved } }]
        log: Approved. Maya signs off for the board.
        blockedHint: The board only looks at a request in analysis.
      - id: create-cn
        label: Create change notice
        when: { stage: Request approved }
        do: [{ set: { stage: Notice in work } }]
        log: CN-0187 created with two change tasks for Priya and Ana.
        blockedHint: You need an approved change request first.
      - id: revise-part
        label: Revise bracket (task)
        when: { stage: Notice in work, partDone: false }
        do: [{ nextLetter: rev }, { set: { partState: In Work, partDone: true } }]
        log: Bracket revised to {rev}.1 and added as a resulting object. C.2 stays Released.
        blockedHint: The bracket is already revised on this notice.
      - id: revise-drawing
        label: Revise drawing (task)
        when: { stage: Notice in work, drawingDone: false }
        do: [{ set: { drawingDone: true } }]
        log: Drawing SC-1048.drw revised and added as a resulting object.
        blockedHint: The drawing is already revised on this notice.
      - id: complete
        label: Complete tasks
        when: { stage: Notice in work, partDone: true, drawingDone: true }
        do: [{ set: { stage: Ready to release } }]
        log: All tasks complete. The notice goes for final approval.
        blockedHint: Both the bracket and its drawing must be resulting objects first.
      - id: release
        label: Release
        when: { stage: Ready to release }
        do: [{ set: { stage: Released, partState: Released } }]
        log: CN-0187 approved. SC-1048 {rev}.1 and its drawing are Released together.
        blockedHint: Finish the change tasks first.
    goals:
      - label: Submit a report with evidence
        when: { stage: Problem reported }
        message: A report with proof gets taken seriously.
      - label: Get the CCB to approve
        when: { stage: Request approved }
        message: The decision is recorded, with who approved it and why.
      - label: Release SC-1048 D
        when: { stage: Released, rev: D }
        message: Released together, traceable back to Sam's photos.

  - type: scenario
    variant: challenge
    title: "The cracked bracket: make the calls"
    start: s1
    nodes:
      - id: s1
        md: |
          **Task 1.** You're writing PR-0412. Which description gives the change team the most to
          work with?
        choices:
          - label: "Bracket is bad, please fix ASAP"
            next: s1-vague
            feedback: Urgent, but nobody can act on it.
          - label: "SC-1048 C.2 cracks at the lock pin hole after ~6 months. 3 units this week. Photos and serials attached."
            next: s2
            good: true
            feedback: What, where, how often and proof. That's a report people can act on.
          - label: "Change the bracket material to forged aluminium"
            next: s1-solution
            feedback: That's a solution, not a problem.
      - id: s1-vague
        md: |
          Maya replies: "Which bracket? Which version? How many? Any photos?" A day lost. Rewrite it
          with the part number, version, symptom, frequency and evidence.
        choices:
          - label: Rewrite it properly
            next: s2
            good: true
            feedback: Better. Now it can move.
      - id: s1-solution
        md: |
          Jumping to a fix in the report skips the analysis. Maybe it's the material, maybe the hole
          is in the wrong place, maybe riders over-tighten. Describe the **problem** and let the
          change request propose the fix.
        choices:
          - label: Describe the problem instead
            next: s2
            good: true
            feedback: Right. Problem first, solution next.
      - id: s2
        md: |
          **Task 2.** Priya's analysis says: forged aluminium, a small rib near the pin hole, same
          mounting holes and same outside envelope. The CR is ready for the CCB. What does the board
          need to see?
        choices:
          - label: "The cost, the where-used list, stock on hand, and the plan for scooters already sold"
            next: s3
            good: true
            feedback: That's impact analysis. The board decides on cost, risk and timing, not only on the design.
          - label: Just the new CAD model, the design speaks for itself
            next: s2-cad
            feedback: The board isn't only engineers.
      - id: s2-cad
        md: |
          Ana from manufacturing asks: "What do we do with the 600 cast brackets in stock?" Sam asks:
          "And the 4,000 scooters out there?" Nobody knows. The board sends the request back for more
          analysis.
        choices:
          - label: Add cost, where-used, stock and field plan, then resubmit
            next: s3
            good: true
            feedback: Approved on the second try.
      - id: s3
        md: |
          **Task 3.** The CCB approves. You build CN-0187. Priya's task revises the bracket part and
          its CAD model. What goes in the **resulting objects**?
        choices:
          - label: "SC-1048 D.1 (part), its CAD model and its drawing SC-1048.drw"
            next: s4
            good: true
            feedback: Everything that changes and must be released together. C.2 stays as the affected object.
          - label: Only SC-1048 D.1, the part
            next: s3-missing
            feedback: What about the drawing the supplier builds from?
          - label: "SC-1048 C.2, the version that cracks"
            next: s3-wrong
            feedback: That's the affected object, not the result.
      - id: s3-missing
        md: |
          The notice releases the new part, but the drawing stays at the old revision. The supplier
          makes brackets from the old drawing for another month. Add every changed object as a
          resulting object.
        choices:
          - label: Add the CAD model and drawing to the task
            next: s4
            good: true
            feedback: Now the whole package releases together.
      - id: s3-wrong
        md: |
          **Affected** objects are what you start from (C.2). **Resulting** objects are what the work
          produces (D.1 and its new CAD and drawing versions). Mixing them up leaves the notice
          releasing nothing new.
        choices:
          - label: Use the new versions as resulting objects
            next: s4
            good: true
            feedback: Fixed.
      - id: s4
        md: |
          **Task 4.** Kai asks the big one: "Is this still SC-1048, or a new part number?" The new
          bracket has the same mounting holes and outside shape, fits every Scooter S2 and does the
          same job, only stronger. It can replace the old one anywhere, including in scooters already
          sold.
        choices:
          - label: "Revise it: SC-1048 revision D, because form, fit and function are interchangeable"
            next: s5
            good: true
            feedback: The new one can go anywhere the old one went. Interchangeable changes are revisions.
          - label: "New number: SC-1049, because the material changed"
            next: s4-new
            feedback: A material change alone doesn't force a new number.
      - id: s4-new
        md: |
          A new number means new item records in ERP, new stock locations and new service catalogue
          entries, for a part that drops straight into the same spot. The rule of thumb: a **new
          number** when the new part can't replace the old one everywhere; a **new revision** when it
          can.
        choices:
          - label: Go back to a revision
            next: s5
            good: true
            feedback: Right call.
      - id: s5
        md: |
          Last call. There are **600 cast brackets** in stock and Ana asks what to do with them. They
          fit, but they're the ones that crack.
        choices:
          - label: Record a disposition on the change - scrap stock, retrofit sold scooters at next service
            next: win
            good: true
            feedback: Disposition decisions belong on the change, so everyone acts on the same plan.
          - label: Use up the old stock first, then switch
            next: lose
            feedback: Would you ride on one?
      - id: lose
        md: |
          Using up known-defective stock puts 600 more risky scooters on the road. "Use up existing
          stock" is fine for a cosmetic change, never for a safety problem. Replay the last step.
        outcome: fail
      - id: win
        md: |
          **Mission complete.** PR-0412 holds the evidence, CR-0233 holds the decision, CN-0187 holds
          the work, and SC-1048 D.1 is Released with its drawing. Six months from now, an auditor can
          follow the whole story in five clicks.
        outcome: success

  - type: comparison
    title: "Who decides what, in this mission"
    columns: [Answers the question, Owner here]
    rows:
      - label: Problem report
        cells: ["What's wrong and where?", Sam (service)]
      - label: Change request
        cells: ["What should we change, and is it worth it?", Priya (analysis) and Maya's CCB (decision)]
      - label: Change notice
        cells: ["How and by when do we do it?", Maya (plans) with Kai]
      - label: Change tasks
        cells: ["Who changes which objects?", Priya (design) and Ana (manufacturing)]
    takeaway: One question per object. That's why the process has more than one step.

  - type: callout
    variant: why-it-matters
    md: |
      Safety problems in the field are where companies get judged. Regulators, insurers and
      customers ask the same thing: *show me how you found it, who decided, and what you changed.*
      A clean report → request → notice chain answers that in minutes instead of weeks.

  - type: callout
    variant: pitfall
    md: |
      **The quiet fix.** It's tempting to check out the Released bracket, tweak the model and push it
      through. Most companies block that, and for good reason: no decision, no impact analysis, no
      plan for stock, and nobody downstream knows anything changed.

  - type: callout
    variant: pro-tip
    md: |
      Link everything. Create the change request *from* the problem report and the notice *from* the
      request. Windchill then shows the chain on each object's information page, so anyone can
      trace a released part back to the original complaint.

  - type: quiz
    title: Capstone check
    passMark: 0.7
    questions:
      - kind: order
        prompt: Put the bracket fix in order.
        items:
          - Raise problem report PR-0412 with evidence
          - Analyse the fix in change request CR-0233
          - CCB approves the request
          - Plan change notice CN-0187 with tasks
          - Complete the tasks and release SC-1048 D.1
        explanation: Report the problem, decide on a change, then plan and do it. Each step has a different owner and question.
      - kind: single
        prompt: On CN-0187, which object is the **affected** object of Priya's task?
        options: [SC-1048 C.2, SC-1048 D.1, The drawing's new version, PR-0412]
        answer: 0
        explanation: The affected object is the version you start from. D.1 and the new drawing version are resulting objects.
      - kind: truefalse
        prompt: The forged bracket fits and works anywhere the cast one did, so it can keep the number SC-1048 with a new revision.
        answer: true
        explanation: Interchangeable in form, fit and function means a revision is enough. A new number is for parts that can't replace the old one everywhere.
      - kind: multi
        prompt: What should the change request show the CCB? (Choose all that apply.)
        options:
          - The cost of the change
          - Where else SC-1048 is used
          - What to do with stock and sold scooters
          - Priya's personal opinion of the old design
        answers: [0, 1, 2]
        explanation: The board decides on cost, impact and risk. Facts beat opinions.
      - kind: single
        prompt: Why shouldn't the 600 cast brackets be used up?
        options:
          - They don't fit the new design
          - They're known to crack, so this is a safety issue
          - Windchill won't allow it
          - They have the wrong part number
        answer: 1
        explanation: Disposition depends on risk. Use-up is fine for cosmetic changes, not for parts that fail in the field.

  - type: summary
    points:
      - A problem report captures what's wrong, with evidence and the affected objects.
      - A change request proposes the fix with its impact, and the CCB decides.
      - A change notice plans the work as tasks; resulting objects are released together.
      - Interchangeable fixes get a new revision; non-interchangeable ones need a new number.
      - Record stock and field disposition on the change so everyone acts on one plan.
