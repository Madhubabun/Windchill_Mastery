id: m03-s02-l06
subtitle: '"Just this once" - with a signature, a limit and an expiry date.'
version: 1.1.0
updated: "2026-10-14"
tags: [change, variance, deviation, waiver]
sources:
  - id: te
    where: "Module 2: Activity: Explore the Windchill user interface (Navigate changes: Variances table); Module 6: Change management process: overview (deviation/waiver requests); Activity: Analyze a problem report (variance, deviation and waiver)"
  - id: ac
    where: "Appendix B: Describe the out-of-the-box change objects data model (variance, deviation, waiver); Configure change management preferences and administration (Affected End Items Display); Module 9: Manage organization templates (Variance Approvers role in a context team)"
  - id: hc-variance-create
    label: PTC Help Center supplement
    title: "Creating a Variance"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/changemanagement/ChgMgmtVarianceCreate.html"
    covers: "Where to start New Variance (Actions > New on part and document information pages, Folder Contents, Variances table) and the wizard steps: Set Attributes, Define Impact, Select Affected End Items, Select Affected Objects with an approved unit count, Set Attachments, Select Associations"

blocks:
  - type: text
    md: |
      Friday afternoon. A box of 300 brand-new SC-1048 B brackets arrives from the supplier. Leo
      measures a few: the mounting holes are **0.3 mm** off position. The drawing allows 0.2 mm.

      Options? Scrap 300 parts and stop the line on Monday. Change the drawing forever to allow
      sloppier holes. Or... ask for permission to use **these 300**, just this once, because
      testing shows they still fit and work.

      That third option is a **[[variance]]**: an authorization to depart from the as-designed
      configuration for a set number of units or a set time - without changing the design itself.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "an approved just-this-once exception" → *[[variance]]*
      - "asking before you build it differently" → *[[deviation]]*
      - "asking after it was built wrong - can we still use it?" → *[[waiver]]* (some companies say *concession*)
      - "how many, which batch, until when" → the variance's limits; Windchill records an *approved unit count* per affected object

  - type: comparison
    title: Change, deviation or waiver?
    columns: [Change (CR → CN), Deviation, Waiver]
    rows:
      - { label: When, cells: [Any time, Before making the parts, After the parts exist] }
      - label: Changes the released design?
        cells: ["Yes - new revisions", "No - design stays as is", "No - design stays as is"]
      - label: How long
        cells: [Permanent, "Limited: a quantity, lot or time window", "Limited: the specific nonconforming items"]
      - label: Acme example
        cells: ["SC-1048 goes from 3 mm to 4 mm for good", "Use clear anodizing on 500 brackets while black dye is out of stock", "Accept 300 brackets with holes 0.3 mm off position"]
      - label: Windchill object
        cells: ["Change request + change notice", "A variance that is a deviation", "A variance that is a waiver"]
    takeaway: If you want it forever, it's a change. If it's just this lot or this month, it's a variance.

  - type: callout
    variant: why-it-matters
    md: |
      Without variances, teams face two bad options: scrap good-enough parts, or quietly use them
      and hope nobody asks. A variance makes the exception **visible, limited and signed off**.
      When a scooter comes back in two years, service can see exactly which serial numbers got
      the 300 off-position brackets.

  - type: example
    variant: case-study
    title: VR-0101 - the 300 brackets
    industry: Micromobility
    md: |
      **Problem:** lot L-2611 of SC-1048 B arrived with mounting holes 0.3 mm off position.
      The drawing allows 0.2 mm. The line needs brackets on Monday.

      **Analysis:** Kai and Leo assembled 10 brackets from the lot into SC-2000 frames. Screws
      went in without force, fold tests passed 2,000 cycles. Strength unaffected.

      **Decision:** Leo raised **VR-0101**, a *waiver*, for **lot L-2611 only, 300 pieces**,
      on Scooter S2 production. Maya, one of the product's variance approvers, approved it with
      one condition: the serial numbers of the 300 scooters get recorded.

      **And then:** the supplier got a nonconformance notice and fixed their fixture. The next
      lot was in spec. Nobody touched the SC-1048 drawing - the design was right; the parts were not.
    takeaway: The variance fixed the lot. The supplier fixed the process. The design didn't need fixing.

  - type: walkthrough
    title: Create a variance
    who: Usually quality or manufacturing engineers - here Leo
    where: ["<affected part> information page", Actions, New, New Variance]
    steps:
      - title: Start from the part
        where: [SC-1048 information page, Actions, New, New Variance]
        md: |
          Open the affected part and choose **Actions** > **New** > **New Variance**. You can also
          start from the toolbar of the **Variances** table (**Browse** > **Changes** > **Variances**)
          or from a product's Folder Contents.
      - title: Name it and explain
        where: [New Variance, Set Attributes]
        md: |
          Give it a clear name and describe the departure in numbers: "hole position 0.3 mm vs 0.2 mm
          allowed, lot L-2611". Whether it's a deviation or a waiver, and which extra fields you see,
          depends on how your company set up the variance attributes.
      - title: Describe the impact
        where: [New Variance, Define Impact]
        md: Explain the business impact - the corrective action (the supplier fixes its fixture) and any effect on cost, schedule and support.
      - title: Add end items and affected objects
        where: [New Variance, Select Affected End Items, Select Affected Objects]
        md: |
          Check the end item (Scooter S2). SC-1048 B is already an affected object because you started
          from it; set its **approved unit count** to **300**. A variance with no limits is just a
          change in disguise.
      - title: Attach evidence and submit
        where: [New Variance, Set Attachments, Select Associations, Finish]
        md: |
          Attach the measurements and fold-test results, link any related change objects, and click
          **Finish**. Who approves it depends on your company's workflow - product teams can have a
          **Variance Approvers** role.
    result: VR-0101 is linked to SC-1048 and listed in the Variances table, so anyone can see the one-time exception.

  - type: callout
    variant: pitfall
    md: |
      **The variance that never ends.** "Use the clear anodizing" gets approved for one lot,
      then renewed, then renewed again. Two years later it's how every bracket is made, but the
      drawing still says black. The course manual is clear: variances are only temporary and must
      be followed by a permanent solution. If you keep renewing one, raise a change request.

  - type: callout
    variant: pro-tip
    md: Always write the limit as something **countable** - a quantity, a lot number, a serial range or a date. "Until the supplier fixes it" isn't a limit anyone can audit.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: The supplier warns you **before** the next run that black dye is out of stock and asks to use clear anodizing on 500 brackets. What fits best?
        options: [A deviation, A waiver, A change notice that updates the drawing, Nothing - just accept the parts]
        answer: 0
        explanation: It's a planned, limited departure agreed before the parts are made - a deviation. The design isn't changing permanently, so a change notice would be wrong.
      - kind: single
        prompt: 300 brackets were already made with holes 0.3 mm off position. Tests show they work. What fits best?
        options: [A deviation, A waiver, A new revision of SC-1048, A promotion request]
        answer: 1
        explanation: The parts already exist and don't conform. Accepting them for use, for that lot only, is a waiver.
      - kind: truefalse
        prompt: An approved variance creates a new revision of the affected part.
        answer: false
        explanation: A variance leaves the released design untouched. It authorises a limited exception; only a change creates new revisions.
      - kind: multi
        prompt: Which belong on a good variance? (Choose all that apply.)
        options:
          - The quantity, lot or serial range it covers
          - Evidence that the parts are fit for use
          - An open-ended "until further notice" limit
          - The affected part and end item
        answers: [0, 1, 3]
        explanation: A variance must be limited and evidenced. "Until further notice" has no countable limit - if it really needs to last, it's a change.

  - type: summary
    points:
      - A variance authorizes a departure from the as-designed configuration for a set number of units or time, leaving the design unchanged.
      - Deviation = agreed before building; waiver = accepting items already built.
      - Set countable limits (Windchill records an approved unit count per affected object) and attach evidence.
      - If a variance keeps getting renewed, the design needs a real change.
