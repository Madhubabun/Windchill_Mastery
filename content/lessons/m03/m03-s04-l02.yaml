id: m03-s04-l02
subtitle: Your task list is where the whole change process waits on you. Clear it like a pro.
version: 1.1.0
updated: "2026-10-14"
tags: [workflow, task, work-item, accept, reassign, complete]
sources:
  - id: te
    where: "Module 2: Activity: Explore the Windchill user interface (Tasks are work items assigned to you directly or through a role; My Tasks table on the Home page). Module 6: Activity: Complete a change notice to release product data (sorting the My Tasks table, Workflow Tasks or All list); Activity: Analyze a change request (Task Completion comments and routing options); Activity: Create and approve a promotion request (Process tab, Task History)"
  - id: ac
    where: "Module 5: Assign activities in a workflow (Tasks table; task form with instructions, primary business object link, input fields and Complete Task); Define assigned activities (Activity, Deadline, Participant and Routing tabs); Activity: Create a workflow template (participants: users, groups, roles, actors, team; required or optional). Module 2: Delete a user (reassign assignments first)"
  - id: hc-my-tasks-actions
    label: PTC Help Center supplement
    title: "Actions on the My Tasks Table"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/assignments/AssignmentsMyTasksTableRef.html"
    covers: "Accept and Decline actions; Accept on an activity classified as Any removes the other assignees' tasks, on All it does not; Reassign and Reassign Tasks actions"
  - id: hc-reassign-task
    label: PTC Help Center supplement
    title: "Reassigning a Task"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/assignments/AssignmentsTaskReassign.html"
    covers: "Reassign from the Tasks table toolbar or the Actions list; Reassign to list; Reason for reassignment; email to the new assignee; Reassignment History; optional restriction to the task's role"

blocks:
  - type: text
    md: |
      Here's the truth about workflows: most of the time, they're **waiting for a human**. A change
      for the fold-lock bracket SC-1048 can't move until Kai reviews it, Leo checks quality and Maya
      signs off. Each of those waits shows up as a **task** in someone's list.

      Your task list is your inbox for the whole company's processes. Leave a task sitting there
      and a scooter line can sit there too. This lesson shows you how to **find**, **accept**,
      **complete** and **reassign** tasks without fuss.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a to-do from a process" → *[[task]]*, technically a *[[work-item|work item]]*
      - "your list of to-dos" → the *My Tasks* table on your Home page
      - "the box in the process that created it" → *[[workflow-activity|assigned activity]]*
      - "take responsibility for a task" → *Accept* (and *Decline* to undo it)
      - "give it to someone else" → *Reassign*
      - "your answer, like Approve or Reject" → *[[routing|routing option]]*
      - "finish and send it on" → *Complete Task*

  - type: diagram
    title: Anatomy of a task
    caption: Every task has the same parts. Click each one.
    diagram:
      width: 800
      height: 380
      nodes:
        - id: task
          label: "Review CN-0451 task"
          sublabel: work item
          x: 300
          y: 150
          w: 200
          h: 70
          tone: primary
          detail: |
            The task itself. It belongs to one running process and one assigned activity in it, such
            as *Review Change Notice Task*. It stays open until someone completes it.
        - id: subject
          label: Subject
          sublabel: "CN-0451 + SC-1048"
          x: 30
          y: 30
          w: 180
          tone: info
          shape: doc
          detail: |
            The task form links to the **primary business object** - the change notice or promotion
            request the process manages - and from there to the objects you need to look at, such as
            resulting objects. Always open them before you vote.
        - id: instructions
          label: Instructions
          sublabel: what to do
          x: 310
          y: 30
          w: 180
          tone: neutral
          shape: doc
          detail: Text written on the activity's **Activity** tab by whoever designed the workflow, for example "Check the drawing matches the 3D model". Read it. It's often the checklist auditors expect.
        - id: deadline
          label: Deadline
          sublabel: due date
          x: 590
          y: 30
          w: 180
          tone: warning
          detail: An activity can have a due date (its **Deadline** tab), plus actions the designer chose for when it is close or past due. Setting a deadline is optional.
        - id: assignee
          label: Assignee
          sublabel: you or your role
          x: 30
          y: 280
          w: 180
          tone: accent
          shape: pill
          detail: |
            The activity's **Participants** tab can name users, groups, roles, actors or a team. Roles
            are resolved to people through the product's team. If a group or team is named, every
            member gets the task in their own list.
        - id: options
          label: Routing options
          sublabel: Approve / Reject
          x: 310
          y: 280
          w: 180
          tone: warning
          shape: pill
          detail: The routing events set on the activity's **Routing** tab, such as Approve or Reject. You pick one when you complete the task, and it decides where the process goes next.
        - id: comments
          label: Comments
          sublabel: why you chose
          x: 590
          y: 280
          w: 180
          tone: neutral
          shape: doc
          detail: Typed in the **Comments** box of the Task Completion section. Your reason stays with the process.
      edges:
        - { from: subject, to: task }
        - { from: instructions, to: task }
        - { from: deadline, to: task }
        - { from: assignee, to: task }
        - { from: task, to: options }
        - { from: task, to: comments }

  - type: walkthrough
    title: Find, accept and complete a task
    who: Anyone assigned a workflow task
    where: [Home, My Tasks]
    steps:
      - title: Open your task list
        where: [Home, My Tasks]
        md: |
          Go to the **Home** page and find the **My Tasks** table. It lists the tasks you're
          responsible for as owner or assignee, across contexts. Click a column header such as
          **Assigned** or **State** to sort it. (A product's own **Tasks** link shows only that
          product's tasks.)
      - title: Check the list filter
        where: [My Tasks, list beside My Tasks]
        md: The list beside **My Tasks** is often set to **Workflow Tasks**. Switch it to **All** if you also want to see tasks you've already finished.
      - title: Accept it if it's shared
        where: [My Tasks, "<task> row", Accept]
        md: |
          **Accept** means "I take responsibility for this task". If the activity is set to **Any**
          (any one assignee may do it), accepting removes the same task from the other assignees'
          lists. If it is set to **All**, their tasks stay. **Decline** undoes an Accept.
      - title: Read before you click
        where: ["<task> page", Subject and objects]
        md: Read the instructions. Open the subject (for example **CN-0451**) and its objects. Look at SC-1048 in a viewer if you're reviewing geometry.
      - title: Choose an option and comment
        where: ["<task> page", Task Completion]
        md: In **Task Completion**, pick a routing option such as **Approve** or **Reject** and type a comment that would make sense to a stranger in two years.
      - title: Complete it
        where: ["<task> page", Complete Task]
        md: Click **Complete Task**. The task leaves your list and the process moves on.
    result: The task leaves your open tasks and shows as completed in the process's task list (for example the Process Status table on the change object's Process tab).

  - type: walkthrough
    title: Reassign a task
    who: The assignee (context managers and administrators can also reach other people's tasks)
    steps:
      - title: Select the task
        where: [Home, My Tasks, "<task> check box"]
        md: Select the check box of each task you want to hand over.
      - title: Choose Reassign
        where: [Tasks table toolbar, Reassign]
        md: |
          Click the **reassign** icon on the toolbar, or choose **Reassign** from the task's
          **Actions** list. In **Reassign to**, pick the new person - your site may limit the list to
          people in the task's role.
      - title: Say why
        where: [Reassign window, Reason for reassignment]
        md: Type a short **Reason for reassignment**, then click **OK**.
      - title: Give them a heads-up
        where: [Chat or email]
        md: Windchill emails the new assignee, but a quick "this one's yours, here's why" message still saves a day.
    result: The task leaves your list and appears in theirs, and the reason is kept in the reassignment history.

  - type: simulation
    title: Clear Leo's review task
    intro: |
      A review task for change notice **CN-0451** went to the **Quality role**, shared by Leo and
      Ana. The activity is set to **Any**, so one of them is enough. Play Leo. Accept it, review the
      objects, vote and complete it. Or hand it to Ana. This is a concept sandbox, not a Windchill screen.
    headline: "CN-0451 review · {status} · held by {assignee}"
    initial: { assignee: Quality role, accepted: false, reviewed: false, vote: none, status: Open }
    actions:
      - id: accept
        label: Accept
        when: { accepted: false, status: Open }
        do: [{ set: { accepted: true, assignee: Leo } }]
        log: Leo accepted the task. Because the activity is set to Any, Ana's copy of the task disappears from her list.
        blockedHint: Already accepted, or the task is closed.
      - id: reassign
        label: Reassign to Ana
        when: { status: Open, assignee: [Quality role, Leo] }
        do: [{ set: { assignee: Ana, accepted: true, reviewed: false, vote: none } }]
        log: Reassigned to Ana with a reason for reassignment. She gets an email and starts her own review.
        blockedHint: Only an open task held by Leo or the role can be reassigned here.
      - id: review
        label: Open the objects
        when: { accepted: true, status: Open }
        do: [{ set: { reviewed: true } }]
        log: "{assignee} opened CN-0451 and viewed SC-1048 and its drawing."
        blockedHint: Accept the task first so it's clearly yours.
      - id: approve
        label: Choose Approve
        when: { reviewed: true, status: Open }
        do: [{ set: { vote: Approve } }]
        log: Routing option set to Approve.
        blockedHint: Look at the objects before you vote.
      - id: reject
        label: Choose Reject
        when: { reviewed: true, status: Open }
        do: [{ set: { vote: Reject } }]
        log: Routing option set to Reject. Add a clear comment.
        blockedHint: Look at the objects before you vote.
      - id: complete
        label: Complete Task
        when: { vote: [Approve, Reject], status: Open }
        do: [{ set: { status: Completed } }]
        log: "{assignee} completed the task with {vote}. The process moves on."
        blockedHint: Pick a routing option first.
    goals:
      - label: Accept the shared task
        when: { accepted: true, assignee: Leo }
        message: Your name is on it now. No double work.
      - label: Complete it with a vote
        when: { status: Completed }
        message: Done. The workflow follows the path your vote chose.
      - label: Hand it to Ana instead
        when: { assignee: Ana }
        message: Reassigning is fine. Leaving a task to rot is not.

  - type: callout
    variant: why-it-matters
    md: |
      Change cycle time is one of the numbers managers watch most closely, and in practice much of
      it is **waiting time** in task lists, not work time. A one-day review that sits for a week costs
      a week of old parts being built. Clearing or reassigning tasks quickly is the simplest way
      you personally speed up your company's changes.

  - type: example
    variant: real-world
    title: The vacation inbox
    industry: Micromobility
    md: |
      Leo went on a two-week trip. Three review tasks for SC-1048 changes landed in his list on day
      one. Nobody else could act on them, and the CN sat still. Maya, Acme's Change Admin I, spotted
      the stalled process, and with context-manager rights she could see the product's tasks. She had the
      tasks reassigned to Ana. The changes moved again within an hour.
    takeaway: Before time off, clear or reassign your tasks - or set up a stand-in. Next lesson shows how.

  - type: callout
    variant: pitfall
    md: |
      **Approving without opening anything.** "Approve" is two clicks. It's tempting. But your name
      goes into the record as the person who checked it. If the drawing was wrong, the audit trail
      points at you. Always open the subject and affected objects first.

  - type: callout
    variant: pro-tip
    md: |
      Treat My Tasks like a zero-inbox. Check it at the start of each day, sort it, and either
      complete or reassign every task. You can also build a custom table view with the **New View
      Wizard** (from the menu at the top of the table), for example to show only change tasks.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Where do you normally find the workflow tasks waiting for you?
        options: ["The My Tasks table on the Home page", "The product's Folders", "Your CAD workspace", "The object's Structure tab"]
        answer: 0
        explanation: The My Tasks table on the Home page lists the tasks you're responsible for as owner or assignee. A product's Tasks link shows only that product's tasks.
      - kind: single
        prompt: A task went to the Quality role, shared by Leo and Ana, on an activity set to **Any**. What does **Accept** do?
        options: [Approves the change, "Takes responsibility for the task - and removes Ana's copy", Closes the process, Deletes the task for everyone]
        answer: 1
        explanation: Accept takes responsibility for the task. On an Any activity the other assignees' copies are removed (Decline brings them back). It does not complete the task or vote.
      - kind: order
        prompt: Put the steps for handling a review task in order.
        items: [Open the task from My Tasks, Read the instructions and open the objects, Choose a routing option and comment, Click Complete Task]
        explanation: Find it, review the real objects, decide with a comment, then complete. Completing is what moves the process on.
      - kind: truefalse
        prompt: Reassigning a task leaves a record of who handed it to whom.
        answer: true
        explanation: The reason for reassignment is kept in the reassignment history (and the Process tab's Task History shows assignment changes) - useful when someone later asks why a different person approved.

  - type: summary
    points:
      - Tasks (work items) are where workflows wait for people.
      - Find them in the My Tasks table on the Home page.
      - Accept a shared task, review the real objects, choose an option, comment, then Complete Task.
      - Can't do it? Reassign with a reason instead of letting it sit.
