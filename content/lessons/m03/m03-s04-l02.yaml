id: m03-s04-l02
subtitle: Your task list is where the whole change process waits on you. Clear it like a pro.
version: 1.0.0
updated: "2026-10-05"
tags: [workflow, task, work-item, accept, reassign, complete]

blocks:
  - type: text
    md: |
      Here's the truth about workflows: most of the time, they're **waiting for a human**. A change
      for the fold-lock bracket SC-1048 can't move until Kai reviews it, Leo checks quality and Maya
      signs off. Each of those waits shows up as a **task** in someone's list.

      Your task list is your inbox for the whole company's processes. Leave a task sitting there
      and a scooter line can sit there too. This lesson shows you how to **find**, **accept**,
      **complete** and **reassign** tasks without fuss.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a to-do from a process" → *[[task]]*, technically a *[[work-item|work item]]*
      - "your list of to-dos" → *My Tasks* (or *Tasks*, on the Home page)
      - "the box in the process that created it" → *[[workflow-activity|assigned activity]]*
      - "grab a shared task so others know it's yours" → *Accept*
      - "give it to someone else" → *Reassign*
      - "your answer, like Approve or Reject" → *[[routing|routing option]]*
      - "finish and send it on" → *Complete Task*

  - type: diagram
    title: Anatomy of a task
    caption: Every task has the same parts. Click each one.
    diagram:
      width: 800
      height: 380
      nodes:
        - id: task
          label: "Review CN-0451 task"
          sublabel: work item
          x: 300
          y: 150
          w: 200
          h: 70
          tone: primary
          detail: |
            The task itself. It belongs to one running process and one activity in it, such as
            "Review change notice". It stays open until someone completes it.
        - id: subject
          label: Subject
          sublabel: "CN-0451 + SC-1048"
          x: 30
          y: 30
          w: 180
          tone: info
          shape: doc
          detail: |
            The **primary business object**, such as the change notice or promotion request, plus
            links to the affected and resulting objects you need to look at. Always open them
            before you vote.
        - id: instructions
          label: Instructions
          sublabel: what to do
          x: 310
          y: 30
          w: 180
          tone: neutral
          shape: doc
          detail: Text written into the activity by whoever designed the workflow, for example "Check the drawing matches the 3D model". Read it. It's often the checklist auditors expect.
        - id: deadline
          label: Deadline
          sublabel: due date
          x: 590
          y: 30
          w: 180
          tone: warning
          detail: Many activities have a due date. Overdue tasks can trigger reminder emails or escalate to a manager, depending on configuration.
        - id: assignee
          label: Assignee
          sublabel: you or your role
          x: 30
          y: 280
          w: 180
          tone: accent
          shape: pill
          detail: |
            Tasks are usually assigned to a **role** (Reviewer, Quality) and resolved to people from
            the team of the product or change. If several people share the role, the setup may ask
            one of them to **Accept** it first.
        - id: options
          label: Routing options
          sublabel: Approve / Reject
          x: 310
          y: 280
          w: 180
          tone: warning
          shape: pill
          detail: The choices you pick when you complete the task. Your choice decides where the process goes next.
        - id: comments
          label: Comments
          sublabel: why you chose
          x: 590
          y: 280
          w: 180
          tone: neutral
          shape: doc
          detail: Your reason, saved with the process history forever. Some setups make comments mandatory when you reject.
      edges:
        - { from: subject, to: task }
        - { from: instructions, to: task }
        - { from: deadline, to: task }
        - { from: assignee, to: task }
        - { from: task, to: options }
        - { from: task, to: comments }

  - type: walkthrough
    title: Find, accept and complete a task
    who: Anyone assigned a workflow task
    where: [Home, My Tasks]
    steps:
      - title: Open your task list
        where: [Home, My Tasks]
        md: |
          Go to the **Home** page and open **Tasks** (often labelled **My Tasks**). You'll see a
          table of open work items: the task name, the subject object, the context and the
          deadline. Sort by deadline so the urgent ones float to the top.
      - title: Or jump in from the email
        where: [Email notification, task link]
        md: Many setups send an email when a task arrives. Its link opens the task directly. Same task, faster route.
      - title: Accept it if it's shared
        where: ["<task>", Actions menu, Accept]
        md: |
          If the task went to a role shared by several people, some setups ask one person to
          **Accept** it. That puts your name on it so your teammates don't double up. If you
          don't see Accept, the task is already yours.
      - title: Read before you click
        where: ["<task> page", Subject and objects]
        md: Read the instructions. Open the subject (for example **CN-0451**) and its affected objects. Look at SC-1048 in a viewer if you're reviewing geometry.
      - title: Choose an option and comment
        where: ["<task> page", Routing options, Comments]
        md: Pick a routing option such as **Approve** or **Reject**. Write a comment that would make sense to a stranger in two years.
      - title: Complete it
        where: ["<task> page", Complete Task]
        md: Click **Complete Task**. The task leaves your list and the process moves on.
    result: The task disappears from My Tasks and shows as completed in the process history, with your name, choice, comment and time.

  - type: walkthrough
    title: Reassign a task
    who: The assignee, or a process owner or admin, depending on configuration
    steps:
      - title: Select the task
        where: [Home, My Tasks, "<task>"]
        md: Select the task in your list, or open it.
      - title: Choose Reassign
        where: ["<task>", Actions menu, Reassign]
        md: |
          Use **Reassign** from the task's actions. Pick the new person, ideally someone who
          holds the same role, and add a short comment saying why.
      - title: Tell them
        where: [Chat or email]
        md: Windchill notifies them in many setups, but a quick "this one's yours, here's why" message saves a day.
    result: The task leaves your list and appears in theirs. The history records who reassigned it to whom.

  - type: simulation
    title: Clear Leo's review task
    intro: |
      A review task for change notice **CN-0451** went to the **Quality role**, shared by Leo and
      Ana. Play Leo. Accept it, review the objects, vote and complete it. Or hand it to Ana.
      This is a concept sandbox - real setups vary.
    headline: "CN-0451 review · {status} · held by {assignee}"
    initial: { assignee: Quality role, accepted: false, reviewed: false, vote: none, status: Open }
    actions:
      - id: accept
        label: Accept
        when: { accepted: false, status: Open }
        do: [{ set: { accepted: true, assignee: Leo } }]
        log: Leo accepted the task. Ana sees it's taken.
        blockedHint: Already accepted, or the task is closed.
      - id: reassign
        label: Reassign to Ana
        when: { status: Open, assignee: [Quality role, Leo] }
        do: [{ set: { assignee: Ana, accepted: true, reviewed: false, vote: none } }]
        log: Reassigned to Ana with a comment. She starts her own review.
        blockedHint: Only an open task held by Leo or the role can be reassigned here.
      - id: review
        label: Open the objects
        when: { accepted: true, status: Open }
        do: [{ set: { reviewed: true } }]
        log: "{assignee} opened CN-0451 and viewed SC-1048 and its drawing."
        blockedHint: Accept the task first so it's clearly yours.
      - id: approve
        label: Choose Approve
        when: { reviewed: true, status: Open }
        do: [{ set: { vote: Approve } }]
        log: Routing option set to Approve.
        blockedHint: Look at the objects before you vote.
      - id: reject
        label: Choose Reject
        when: { reviewed: true, status: Open }
        do: [{ set: { vote: Reject } }]
        log: Routing option set to Reject. Add a clear comment.
        blockedHint: Look at the objects before you vote.
      - id: complete
        label: Complete Task
        when: { vote: [Approve, Reject], status: Open }
        do: [{ set: { status: Completed } }]
        log: "{assignee} completed the task with {vote}. The process moves on."
        blockedHint: Pick a routing option first.
    goals:
      - label: Accept the shared task
        when: { accepted: true, assignee: Leo }
        message: Your name is on it now. No double work.
      - label: Complete it with a vote
        when: { status: Completed }
        message: Done. The workflow follows the path your vote chose.
      - label: Hand it to Ana instead
        when: { assignee: Ana }
        message: Reassigning is fine. Leaving a task to rot is not.

  - type: callout
    variant: why-it-matters
    md: |
      Change cycle time is one of the numbers managers watch most closely, and most of it is
      **waiting time** in task lists, not work time. A one-day review that sits for a week costs
      a week of old parts being built. Clearing or reassigning tasks quickly is the simplest way
      you personally speed up your company's changes.

  - type: example
    variant: real-world
    title: The vacation inbox
    industry: Micromobility
    md: |
      Leo went on a two-week trip. Three review tasks for SC-1048 changes landed in his list on day
      one. Nobody else could act on them, and the CN sat still. Maya, as change manager, spotted
      the stalled process and asked an admin to reassign the tasks to Ana. The changes moved again
      within an hour.
    takeaway: Before time off, clear or reassign your tasks - or set up a stand-in. Next lesson shows how.

  - type: callout
    variant: pitfall
    md: |
      **Approving without opening anything.** "Approve" is two clicks. It's tempting. But your name
      goes into the record as the person who checked it. If the drawing was wrong, the audit trail
      points at you. Always open the subject and affected objects first.

  - type: callout
    variant: pro-tip
    md: |
      Treat My Tasks like a zero-inbox. Check it at the start of each day, sort by deadline, and
      either complete, reassign or comment on every task. Many companies also let you filter the
      list or save a view, so you can see only change tasks.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Where do you normally find the workflow tasks waiting for you?
        options: ["Home → My Tasks (or Tasks)", "The product's Folders", "Your CAD workspace", "The object's Structure tab"]
        answer: 0
        explanation: The Home page task list collects every open work item assigned to you, across all contexts. Email links often take you to the same task.
      - kind: single
        prompt: A task went to the Quality role, shared by Leo and Ana. What does **Accept** do in setups that use it?
        options: [Approves the change, Puts your name on the task so others know you've taken it, Closes the process, Deletes the task for everyone]
        answer: 1
        explanation: Accept claims a shared task. It does not complete it or vote on anything.
      - kind: order
        prompt: Put the steps for handling a review task in order.
        items: [Open the task from My Tasks, Read the instructions and open the objects, Choose a routing option and comment, Click Complete Task]
        explanation: Find it, review the real objects, decide with a comment, then complete. Completing is what moves the process on.
      - kind: truefalse
        prompt: Reassigning a task leaves a record of who handed it to whom.
        answer: true
        explanation: The process history keeps the reassignment, which is useful when someone later asks why a different person approved.

  - type: summary
    points:
      - Tasks (work items) are where workflows wait for people.
      - Find them in Home → My Tasks or via the email link.
      - Accept a shared task, review the real objects, choose an option, comment, then Complete Task.
      - Can't do it? Reassign with a comment instead of letting it sit.
