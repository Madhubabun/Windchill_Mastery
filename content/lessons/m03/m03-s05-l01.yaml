id: m03-s05-l01
subtitle: Four jobs that keep "what we designed" and "what we built" telling the same story.
version: 1.0.0
updated: "2026-10-05"
tags: [configuration-management, identification, change-control, status-accounting, audit]

blocks:
  - type: text
    md: |
      Picture a customer calling Acme Mobility: "My Scooter S2 makes a click when I fold it. Which
      fold-lock bracket is in it?" If you can answer that in two minutes, with proof, your company
      is doing **configuration management** well. If it takes two weeks and three spreadsheets, it isn't.

      Configuration management (CM) sounds huge, but it boils down to four jobs:

      1. **Name it.** Give every thing a unique number and version so nobody mixes them up.
      2. **Control it.** Change it only through an approved process.
      3. **Track it.** Keep a record of what changed, when, why and where it's used.
      4. **Check it.** Prove that the real product matches its documents.

      Every change process you learned in this module is one of these four jobs in action.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "keeping product data trustworthy for its whole life" → *[[configuration-management]]* (CM)
      - "name it" → *[[configuration-identification]]*
      - "control it" → *configuration change control* (or just *change control*)
      - "track it" → *[[configuration-status-accounting]]*
      - "check it" → *[[configuration-audit]]* (also called *configuration verification and audit*)

      These four functions come from public CM standards such as EIA-649 and are used across
      aerospace, defence, automotive, medical devices and consumer products. Many standards add a
      fifth function on top: **CM planning and management** (who owns CM, which rules apply).

  - type: diagram
    title: The four CM functions and where Windchill helps
    caption: Click each function to see what it means and which Windchill features support it.
    diagram:
      width: 800
      height: 420
      groups:
        - { label: CM function, x: 20, y: 10, w: 360, h: 400, tone: neutral }
        - { label: Windchill features, x: 420, y: 10, w: 360, h: 400, tone: info }
      nodes:
        - id: ident
          label: Identification
          sublabel: name it
          x: 60
          y: 50
          w: 280
          tone: primary
          detail: |
            Decide **what** is under control and give it a unique identity: numbers, names, versions,
            and the structure that says which parts make up the product. Also decide which documents
            define it (drawings, specs) and which approved set counts as the reference point.
          real: If two people can mean different things by "the bracket", identification has failed.
        - id: control
          label: Change control
          sublabel: control it
          x: 60
          y: 140
          w: 280
          tone: warning
          detail: |
            Once something is released, it changes only through a **controlled process**: someone
            reports the issue, a board decides, the work is planned, done and checked. No silent edits.
          real: At Acme, Maya's Change Control Board approves every change to released scooter data.
        - id: account
          label: Status accounting
          sublabel: track it
          x: 60
          y: 230
          w: 280
          tone: accent
          detail: |
            Record and report the **status** of everything: current versions, open changes, approved
            changes not yet built, where a part is used. It answers "where are we right now, and how
            did we get here?"
          real: Status accounting is what lets you answer the customer's "which bracket is in my scooter?" call.
        - id: audit
          label: Audit
          sublabel: check it
          x: 60
          y: 320
          w: 280
          tone: success
          detail: |
            **Verify** that the product meets its requirements (a functional audit) and that the
            physical product matches its released documents (a physical audit). Also spot-check that
            the CM process itself was followed.
          real: Customers, regulators and certification bodies run audits. Good CM makes them boring.
        - id: wc-ident
          label: Numbers, versions, BOM
          sublabel: parts, documents, CAD
          x: 460
          y: 50
          w: 280
          tone: info
          detail: |
            Parts, documents and CAD documents each get a number and a version (revision.iteration).
            Uses links build the product structure. Products and libraries give each item a home.
            Baselines (covered in Module 2) freeze an approved set of versions.
        - id: wc-control
          label: Change objects, life cycles
          sublabel: PR, CR, CN, tasks
          x: 460
          y: 140
          w: 280
          tone: info
          detail: |
            [[problem-report|Problem reports]], [[change-request|change requests]],
            [[change-notice|change notices]] and [[change-task|change tasks]] carry the change.
            [[lifecycle-state|Lifecycle states]] and access rules stop people editing Released data.
            [[promotion-request|Promotion requests]] control first release.
        - id: wc-account
          label: History, Changes tab, reports
          sublabel: who, what, when, why
          x: 460
          y: 230
          w: 280
          tone: info
          detail: |
            Each object's [[information-page|information page]] shows its version history and the
            change objects that touched it. [[where-used|Where-used]] shows impact. Searches and
            reports list open changes, their state and age.
        - id: wc-audit
          label: Compare, baselines, records
          sublabel: evidence on demand
          x: 460
          y: 320
          w: 280
          tone: info
          detail: |
            Compare a structure with a baseline or with another version. Pull the closed change
            notices for a release. Show approvals and votes recorded by the [[workflow]]. Windchill
            supplies the evidence; the audit itself is done by people.
      edges:
        - { from: ident, to: wc-ident }
        - { from: control, to: wc-control }
        - { from: account, to: wc-account }
        - { from: audit, to: wc-audit }
        - { from: ident, to: control, dashed: true }
        - { from: control, to: account, dashed: true }
        - { from: account, to: audit, dashed: true }

  - type: animation
    title: One change, all four functions
    diagram:
      width: 800
      height: 300
      nodes:
        - { id: part, label: SC-1048 A.2, sublabel: Released, x: 20, y: 120, w: 140, tone: primary }
        - { id: cr, label: CR-0101, sublabel: approved by CCB, x: 200, y: 30, w: 150, tone: warning }
        - { id: cn, label: CN-0101, sublabel: tasks done, x: 200, y: 210, w: 150, tone: warning }
        - { id: newpart, label: SC-1048 B.1, sublabel: Released, x: 400, y: 120, w: 150, tone: success }
        - { id: record, label: History + links, sublabel: status accounting, x: 600, y: 30, w: 180, tone: accent, shape: cylinder }
        - { id: check, label: Audit, sublabel: "built = designed?", x: 600, y: 210, w: 180, tone: success, shape: pill }
      edges:
        - { from: part, to: cr, label: identify }
        - { from: cr, to: cn, label: control }
        - { from: cn, to: newpart, label: release }
        - { from: newpart, to: record, label: track }
        - { from: record, to: check, label: verify }
    chapters:
      - title: Identify
        caption: The fold-lock bracket **SC-1048 A.2** is Released. Its number and version say exactly which design we mean.
        show: [part]
        highlight: [part]
        seconds: 5
      - title: Control - ask first
        caption: Sam reports clicking hinges in the field. A change request lists SC-1048 A.2 as an affected object. Maya's CCB approves **CR-0101**.
        show: [part, cr]
        highlight: [cr]
        flow: [part>cr]
      - title: Control - do the work
        caption: Change notice **CN-0101** plans the work in change tasks. Priya revises the bracket and its drawing.
        show: [part, cr, cn]
        highlight: [cn]
        flow: [cr>cn]
      - title: Release the result
        caption: When the change notice completes, **SC-1048 B.1** is Released. A.2 stays in history, untouched.
        show: [part, cr, cn, newpart]
        highlight: [newpart]
        flow: [cn>newpart]
      - title: Track
        caption: Windchill keeps the chain - part version → change notice → change request → problem report. That's **status accounting**, mostly for free.
        show: [part, cr, cn, newpart, record]
        highlight: [record]
        flow: [newpart>record]
      - title: Check
        caption: Later, an auditor asks "prove scooters from serial 3000 have bracket B". The chain plus build records answer it. That's the **audit**.
        highlight: [check]
        flow: [record>check]
        seconds: 6

  - type: callout
    variant: why-it-matters
    md: |
      CM is what lets a company answer **recall, warranty and certification** questions fast. When a
      batch of scooters has a safety issue, the company with good CM recalls 400 scooters. The company
      without it recalls 40,000 "just to be safe". Same problem, 100 times the cost.

  - type: example
    variant: case-study
    title: The bracket nobody could trace
    industry: Micromobility
    md: |
      Before Acme moved its changes into Windchill, engineers emailed updated drawings straight to
      the supplier. One day the supplier shipped fold-lock brackets with a thinner wall. Nobody could
      say **which** drawing they used, **who** approved it or **which** scooters got the thin part.

      - **Identification** was weak: two drawing files were both called "bracket_final".
      - **Change control** was missing: the email *was* the approval.
      - **Status accounting** didn't exist: no record linked the change to scooter serial numbers.
      - **Audit** failed: the built bracket didn't match any released drawing.

      Acme had to inspect every scooter built that quarter. Afterwards, Kai's team made one rule:
      **suppliers only build from Released data**, and released data only changes through a change notice.
    takeaway: Each missing CM function turned a small supplier mistake into a big, expensive mystery.

  - type: comparison
    title: The four functions at a glance
    columns: [Question it answers, Windchill support, Who cares most]
    rows:
      - label: Identification
        cells: ["What exactly is this?", "Numbers, versions, BOM, documents, baselines", "Everyone - it's the shared language"]
      - label: Change control
        cells: ["Who allowed this change?", "PR, CR, CN, change tasks, life cycles, promotion requests", "Change manager, CCB"]
      - label: Status accounting
        cells: ["Where are we, and how did we get here?", "History, Changes tab, where-used, reports", "Service, quality, management"]
      - label: Audit
        cells: ["Does the product match its documents?", "Baselines, compares, closed change records", "Quality, customers, regulators"]
    takeaway: Identify → control → track → check. Skip one and the others wobble.

  - type: walkthrough
    title: See CM in action on one part
    who: Any user who can read the product
    where: [Search, "<part> information page"]
    steps:
      - title: Identification
        where: ["<part> information page", header]
        md: Read the number, name, version and state, for example `SC-1048, Fold-lock bracket, B.1, Released`.
      - title: Change control
        where: ["<part> information page", Changes tab]
        md: |
          Look at the change objects linked to this part: problem reports, change requests and
          change notices. Open one to see who approved it.
      - title: Status accounting
        where: ["<part> information page", History]
        md: |
          Open the version history. Each revision should line up with a change notice. Then check
          **Where Used** to see which assemblies depend on the part.
      - title: Audit evidence
        where: ["<part> information page", Structure or related documents]
        md: |
          Check that the released drawing and the part are on matching revisions. This is the kind
          of spot check an auditor does.
    result: In four clicks you've seen all four CM functions on one real object.

  - type: callout
    variant: note
    md: |
      Tab names and where they sit can vary with your Windchill release and your company's setup.
      If you don't see a **Changes** tab, look for related change objects on the information page.

  - type: callout
    variant: pitfall
    md: |
      **Treating CM as "the change process only".** Companies often build a beautiful change workflow
      but forget identification (sloppy numbering) and status accounting (no one can report on it).
      A great change process on top of messy identities still gives you messy answers.

  - type: callout
    variant: pro-tip
    md: |
      When someone asks "is our CM any good?", ask four test questions: *What exactly is this?*
      *Who approved its last change?* *Which units have it?* *Can you prove it?* Any question that
      takes more than a few minutes points at the weak function.

  - type: flashcards
    cards:
      - front: "Configuration management (CM)"
        back: "The discipline that keeps product data and the real product consistent through their whole life."
      - front: "Configuration identification"
        back: "Giving each item a unique identity (number, version) and defining the documents and structure that describe it."
      - front: "Configuration change control"
        back: "Changing released items only through an approved process (PR → CR → CN → tasks)."
      - front: "Configuration status accounting"
        back: "Recording and reporting the status and history of items and changes."
      - front: "Configuration audit"
        back: "Verifying that the product meets its requirements and matches its released documents."
      - front: "Which CM function does the Changes tab support most?"
        back: "Status accounting - it shows which changes touched an object."
      - front: "Windchill features for change control"
        back: "Change objects, lifecycle states, access rules and promotion requests."
      - front: "Four test questions for CM"
        back: "What is it? Who approved it? Which units have it? Can you prove it?"

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Service asks which scooters received bracket SC-1048 B.1. Which CM function answers this?
        options: [Identification, Change control, Status accounting, Audit]
        answer: 2
        explanation: Status accounting records the status and history of items and changes, including where and when a version was used.
      - kind: order
        prompt: Put the four CM functions in their natural order for one change.
        items: [Identification, Change control, Status accounting, Audit]
        explanation: You must know what something is before you control its change, record the result and finally verify it.
      - kind: truefalse
        prompt: Windchill performs the configuration audit for you automatically.
        answer: false
        explanation: Windchill provides the evidence (history, baselines, compares, change records). People plan and perform the audit.

  - type: summary
    points:
      - "CM has four core functions: identification, change control, status accounting and audit."
      - Identification = numbers, versions, structure and defining documents.
      - Change control = PR, CR, CN, change tasks and life cycles in Windchill.
      - Status accounting = history, Changes tab, where-used and reports.
      - Audit = proving the product matches its documents, using Windchill as the evidence store.
