id: m03-s04-l04
subtitle: Nothing's moving and nobody knows why. Become the person who finds the jam in five minutes.
version: 1.0.0
updated: "2026-10-05"
tags: [workflow, troubleshooting, process-manager, robot, administrator]

blocks:
  - type: text
    md: |
      Change notice **CN-0451** (stronger steel for the SC-1048 fold-lock bracket) was approved
      ten days ago. The new revision still isn't Released. Ana keeps asking. Kai shrugs. Everyone
      says "the workflow is stuck".

      Workflows almost never "just break". They **wait**: for a person, for a missing person, for
      a parallel branch, or for an automatic step that failed. Your job is to find **what it's
      waiting on**. Then you either fix it yourself or hand the admin a precise ticket.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the live map of the process" → *[[process-manager|Process Manager]]* (or a process view)
      - "the step that's running now" → *open* or *running* [[workflow-activity|activity]]
      - "a task nobody can see" → an activity whose **role** resolved to no one
      - "the automatic step that failed" → a failed *robot* (for example a set state robot)
      - "wait for all branches" → an *AND connector* or *synchronize* step
      - "admin pause or stop" → *suspend*, *resume* or *terminate* a process

  - type: diagram
    title: Where workflows get stuck
    caption: Five usual suspects. Click each one to see the symptom and who fixes it.
    diagram:
      width: 800
      height: 420
      nodes:
        - id: process
          label: CN-0451 process
          sublabel: "\"stuck\""
          x: 300
          y: 170
          w: 200
          h: 70
          tone: primary
          detail: The process is still running, but nothing visible is happening. Open its graphical view to see which activity is open.
        - id: person
          label: Waiting on a person
          sublabel: most common
          x: 20
          y: 20
          w: 220
          tone: warning
          detail: |
            A task is sitting in someone's list - busy, on holiday or ignoring the email.
            **Symptom:** an activity is open and has an assignee. **Fix:** remind them, or get
            the task reassigned. Users and change managers can often handle this.
        - id: nobody
          label: Role with nobody in it
          sublabel: task assigned to no one
          x: 560
          y: 20
          w: 220
          tone: danger
          detail: |
            The activity is assigned to a role (say *Quality Reviewer*) but the team of that
            product has nobody in that role, or the person left the company. **Symptom:** an open
            activity, but no one has the task, or it went to a fallback person such as the
            process creator. **Fix:** add someone to the team role and reassign. Usually a
            product manager or admin job.
        - id: parallel
          label: Waiting on a branch
          sublabel: AND / sync
          x: 20
          y: 330
          w: 220
          tone: info
          detail: |
            Several change tasks ran in parallel. The process only moves on when **all** are
            done. **Symptom:** "my task is complete but nothing happened". **Fix:** find the other
            open task - often a manufacturing or documentation task.
        - id: robot
          label: Failed robot
          sublabel: automatic step errored
          x: 560
          y: 330
          w: 220
          tone: danger
          detail: |
            An automatic step failed, for example a **set state robot** could not move an object
            to Released because it was still **checked out**, or the transition is not allowed in
            its life cycle. **Symptom:** human tasks are all done, but states didn't change. Some
            fixes are simple (check the object in), but restarting the step is an **admin** job.
        - id: object
          label: Object not ready
          sublabel: checked out or wrong state
          x: 290
          y: 330
          w: 220
          tone: warning
          detail: |
            A resulting object is still checked out, is in an unexpected state, or a needed
            object is missing from the change task. **Fix:** the task owner checks it in or
            corrects the data, then the admin retries the step if it already failed.
      edges:
        - { from: person, to: process, dashed: true }
        - { from: nobody, to: process, dashed: true }
        - { from: parallel, to: process, dashed: true }
        - { from: robot, to: process, dashed: true }
        - { from: object, to: process, dashed: true }

  - type: walkthrough
    title: Find what a process is waiting on
    who: Anyone who can read the change object; admins see more
    steps:
      - title: Open the change object
        where: [Search, "CN-0451", information page]
        md: Open the change notice (or promotion request) that owns the process. Note its state, for example *Implementation*.
      - title: Look at its tasks and process
        where: ["CN-0451 information page", Tasks or Processes]
        md: |
          Find the area that lists the change tasks and the process or routing history. Look for
          anything **open**: which activity, who holds it, and since when. Names and tabs differ
          between releases.
      - title: Open the graphical view
        where: ["<process>", Process Manager or View Process]
        md: |
          If available, open the **Process Manager** view. Completed activities, the running one
          and the ones not started yet are shown differently. The running one is where the
          process waits.
      - title: Check the objects
        where: ["CN-0451", Change tasks, Resulting objects]
        md: Open each resulting object, such as the new revision of SC-1048. Is anything still **checked out**? Is it in the state you expect?
      - title: Write it down
        where: [Your notes or ticket]
        md: "Record: process name, open activity, assignee (or none), how long it has waited and any object problems. That's your diagnosis."
    result: You can say in one sentence what the process is waiting on - and whether you can fix it or need an admin.

  - type: comparison
    title: Fix it yourself or call the admin?
    columns: [You can usually fix it, Call an administrator]
    rows:
      - label: Task in a colleague's list
        cells: [Remind them or ask for a reassign, Only if nobody with rights can reassign]
      - label: Your own object still checked out
        cells: [Check it in or undo the checkout, If a robot already failed and must be retried]
      - label: Role empty or person left
        cells: [Tell the product or change manager, To fix team roles and reassign orphaned tasks]
      - label: Robot failed or error message
        cells: [Note the exact message and time, Always - they can view errors and retry or restart steps]
      - label: Process must be stopped or redone
        cells: ["Never terminate on your own", Suspend - resume - terminate are admin actions]
    takeaway: People problems you can chase. System problems you report - with evidence.

  - type: scenario
    variant: troubleshooting
    title: CN-0451 won't release
    start: s1
    nodes:
      - id: s1
        md: |
          Ana asks why the new SC-1048 revision isn't Released yet. CN-0451 was approved ten days
          ago. What do you do first?
        choices:
          - label: Open CN-0451 and look at its open tasks and process
            next: s2
            good: true
            feedback: Start with facts, not guesses.
          - label: Ask an admin to restart the workflow
            next: f1
            feedback: Restarting without a diagnosis can create duplicate tasks or lose history.
          - label: Set the bracket to Released yourself
            next: f2
            feedback: Even if you could, that skips the approvals on record.
      - id: s2
        md: |
          Priya's design task is **complete**. Ana's manufacturing task is complete. But one
          change task, *Update service manual*, is open - assigned to **Sam**. Sam is in field
          service and says he never saw it.
        choices:
          - label: Check his task list together and look for the email
            next: s3
            good: true
            feedback: Make sure the task really reached him.
          - label: Complete the task for him by logging in as Sam
            next: f2b
            feedback: No shared logins - ever.
      - id: s3
        md: |
          It's in Sam's My Tasks, buried under 40 old notifications. He updates the manual and
          completes the task. The process moves to the release step... and stops again. All human
          tasks are done, but SC-1048 is still Under Review.
        choices:
          - label: Check whether any resulting object is still checked out
            next: s4
            good: true
            feedback: A classic cause of a failed set state step.
          - label: Wait another week
            next: p1
            feedback: Automatic steps don't fix themselves.
      - id: s4
        md: |
          The drawing **SC-1048.drw** is still checked out to Priya from a last-minute fix. The
          set state step couldn't move it. What now?
        choices:
          - label: Priya checks it in, then you ask an admin to retry the failed step with the details
            next: win
            good: true
            feedback: Fix the data, then let the admin restart the robot.
          - label: Priya checks it in and you wait for it to retry by itself
            next: p2
            feedback: Some failed steps won't retry on their own.
      - id: win
        md: |
          The admin retries the step. SC-1048 B.1 and its drawing go to **Released** and Ana's
          line switches over. Your ticket - process, activity, cause and fix - took the admin
          five minutes.
        outcome: success
      - id: p1
        md: A week later it's still waiting. Someone finally reports it, and you lose a week of production on the new steel.
        outcome: partial
      - id: p2
        md: Nothing happens for two days. An admin finally retries the step. Right fix, slow route.
        outcome: partial
      - id: f1
        md: The admin restarts the process. Everyone gets their tasks again and Sam's task is still the problem. Two days lost and a messy history.
        outcome: fail
      - id: f2
        md: The state changes without the approvals the auditors expect. Quality has to open a corrective action against the process itself.
        outcome: fail
      - id: f2b
        md: The audit trail now says Sam did work he didn't do. That's a compliance problem much bigger than a late manual.
        outcome: fail

  - type: scenario
    variant: what-if
    title: The reviewer who left
    start: s1
    nodes:
      - id: s1
        md: |
          Promotion request **PROM-0453** for SC-4510 (a new brake cable clip) has an open review
          activity. The Process Manager shows it was assigned to **Jordan**, who left Acme last
          month. Jordan's account is disabled. What's the best move?
        choices:
          - label: Ask an admin or the product manager to reassign the task and replace Jordan in the team role
            next: win
            good: true
            feedback: Fix this task and every future one.
          - label: Ask the admin to reassign just this one task
            next: p1
            feedback: Better than nothing, but the next process will pick Jordan again.
          - label: Cancel the promotion request and create a new one
            next: p2
            feedback: The new one hits the same empty role.
      - id: win
        md: The task moves to Leo, and the team role now lists Leo as reviewer. Future processes route correctly.
        outcome: success
      - id: p1
        md: This one moves. Next week's promotion request stalls in exactly the same place.
        outcome: partial
      - id: p2
        md: The new request resolves the same role to the same disabled user. You're back where you started, with an extra canceled request in the history.
        outcome: fail

  - type: callout
    variant: why-it-matters
    md: |
      A stuck change costs real money: old parts keep being built, suppliers wait, and service
      ships the wrong spares. Companies that track change cycle time find that a big share of
      delay is processes waiting silently. People who can diagnose a stall quickly are the ones
      change managers love.

  - type: example
    variant: case-study
    title: Forty stuck processes and one empty role
    industry: Micromobility
    md: |
      After a reorganisation, Acme's e-bike team found that **40 promotion requests** had stalled
      over three weeks. Every one was waiting on the same review activity. Maya opened a few in
      the Process Manager: the review role on the e-bike product's team had been emptied when
      people moved teams. The tasks had gone to a fallback user who didn't know what to do with
      them.

      The admin added two reviewers to the role and bulk-reassigned the open tasks. All 40 moved
      within a day. Acme then added "check team roles" to its reorganisation checklist.
    takeaway: When many processes stall at the same step, suspect the setup (roles), not the people.

  - type: callout
    variant: pitfall
    md: |
      **Asking for a restart before a diagnosis.** Terminating and restarting a process throws
      away where it was, can send duplicate tasks, and rarely fixes the cause. Find the open
      activity and the reason first.

  - type: callout
    variant: pro-tip
    md: |
      Write admin tickets like this: *"CN-0451, release step, set state failed after Sam's task
      completed on the 12th. SC-1048.drw was checked out - now checked in. Please retry."* One
      sentence with object, activity, symptom and what you already fixed gets solved fast.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: All human tasks on a change are complete, but the parts never reached Released. What's the most likely cause?
        options: [A task is still in someone's list, An automatic step such as a set state robot failed, The vault is full, The CCB voted twice]
        answer: 1
        explanation: When people are done but states didn't change, suspect the automatic steps. A checked-out object or a blocked transition is a common reason.
      - kind: single
        prompt: Your change task is complete, but the process hasn't moved. Other change tasks ran in parallel. What do you check?
        options: [Whether the other parallel tasks are still open, Your workspace, The revision letter, Nothing - it's broken]
        answer: 0
        explanation: Parallel branches often join at a step that waits for all of them. Find the other open task.
      - kind: multi
        prompt: Which of these should go to an administrator? (Choose all that apply.)
        options:
          - Retrying a failed robot step
          - Terminating or restarting a process
          - Reminding a colleague about their task
          - Fixing an empty team role across many processes
        answers: [0, 1, 3]
        explanation: Reminders are something anyone can do. Retrying steps, terminating processes and fixing roles in bulk need admin rights and care.
      - kind: truefalse
        prompt: If many processes stall at the same activity, the likeliest cause is the setup, such as an empty team role.
        answer: true
        explanation: One stuck process is usually a person. Many stuck at the same step usually means the role, template or data behind that step.

  - type: summary
    points:
      - Workflows rarely break - they wait. Find what the open activity is waiting on.
      - Five usual suspects - a busy person, an empty role, a parallel branch, a failed robot, an object not ready.
      - Use the change object's tasks and the Process Manager view to diagnose.
      - Chase people yourself. Send system issues to admins with a one-sentence diagnosis. Never restart blindly.
