id: m03-s05-l02
subtitle: '"Which bracket is in scooter 3010?" Two honest answers, and why both matter.'
version: 1.0.0
updated: "2026-10-05"
tags: [effectivity, date-effectivity, lot-effectivity, serial-effectivity, as-designed, as-built]

blocks:
  - type: text
    md: |
      Releasing a new bracket design doesn't magically change every scooter on Earth. Scooters
      already sold keep the old bracket. The factory still has a shelf full of old brackets. So
      the real question is never just "what's the latest design?" It's:

      > **From when, or from which unit, does the new design apply?**

      That "from when" is called effectivity. You can pin it to a **date**, a **lot** (batch) or a
      **serial number**. And once scooters roll off the line, there's a second question: did the
      factory actually build what engineering designed?

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "from 1 March onward" → *[[date-effectivity|date effectivity]]*
      - "from batch 24 onward" → *[[lot-effectivity|lot effectivity]]*
      - "from scooter #3000 onward" → *[[serial-effectivity|serial (unit) effectivity]]*
      - "what engineering approved" → *[[as-designed]]* configuration
      - "what actually went into this unit" → *[[as-built]]* configuration

      Lot and serial effectivity count **end items** - the product you ship, like the Scooter S2 -
      not the bracket itself. "Serial 3000" means "scooter number 3000".

  - type: diagram
    title: One bracket, two designs, a clear cut-over
    caption: Serial effectivity on the Scooter S2 decides which bracket revision each scooter should get. Click to explore.
    diagram:
      width: 800
      height: 380
      groups:
        - { label: As-designed (Windchill), x: 20, y: 10, w: 760, h: 170, tone: info }
        - { label: As-built (factory and service records), x: 20, y: 200, w: 760, h: 170, tone: neutral }
      nodes:
        - id: a2
          label: SC-1048 A.2
          sublabel: "S2 serials 1 - 2999"
          x: 60
          y: 60
          w: 200
          tone: primary
          detail: |
            Revision A.2 of the fold-lock bracket stays the right design for scooters 1 to 2999. It is
            still Released - it is just no longer effective for new units.
        - id: cn
          label: CN-0101
          sublabel: sets the cut-over
          x: 300
          y: 60
          w: 200
          tone: warning
          detail: |
            The change notice released B.1 and recorded the cut-over: serial 3000 onward. Depending on
            your company's configuration, effectivity is entered on the change notice or set on the
            resulting part version.
        - id: b1
          label: SC-1048 B.1
          sublabel: "S2 serials 3000 and up"
          x: 540
          y: 60
          w: 200
          tone: success
          detail: Revision B.1 with the thicker wall. Planned for every Scooter S2 from serial 3000.
        - id: u2950
          label: Scooter 2950
          sublabel: built with A.2
          x: 60
          y: 260
          w: 200
          tone: neutral
          detail: As-designed says A.2. The build record says A.2. Designed = built.
        - id: u3010
          label: Scooter 3010
          sublabel: built with A.2 (VR-0551)
          x: 300
          y: 260
          w: 200
          tone: danger
          detail: |
            As-designed says **B.1**. But the factory used up old A.2 brackets under variance
            **VR-0551** (approved for 20 units). The as-built record must show A.2 so service orders
            the right spare.
          real: This gap is legal and approved - but only if it's recorded.
        - id: u3050
          label: Scooter 3050
          sublabel: built with B.1
          x: 540
          y: 260
          w: 200
          tone: success
          detail: As-designed says B.1. Built with B.1. Designed = built.
      edges:
        - { from: a2, to: cn, label: replaced by }
        - { from: cn, to: b1 }
        - { from: a2, to: u2950, dashed: true }
        - { from: b1, to: u3010, dashed: true, label: planned }
        - { from: b1, to: u3050, dashed: true }

  - type: comparison
    title: Date, lot or serial effectivity?
    columns: [Date, Lot, Serial]
    rows:
      - label: Says
        cells: ["Valid from 1 March", "Valid from lot 24", "Valid from unit 3000"]
      - label: Counts
        cells: [Calendar time, "Batches of end items", Individual end items]
      - label: Precision
        cells: ["Low - dates slip, stock lingers", Medium, "High - exact unit"]
      - label: Typical use
        cells: ["Consumer goods, documents, rules that start on a date", "Batch production: batteries, food, chemicals, cables", "Aerospace, vehicles, medical devices, anything serviced per unit"]
      - label: Acme example
        cells: ["New warning label from 1 March", "New grip compound from battery lot 24", "Bracket B.1 from Scooter S2 serial 3000"]
    takeaway: The more you need to know what's inside one specific unit, the more you want serial effectivity.

  - type: comparison
    title: As-designed vs as-built
    columns: [As-designed, As-built]
    rows:
      - label: Answers
        cells: ["What should this unit contain?", "What does this unit actually contain?"]
      - label: Source
        cells: ["Released engineering data plus effectivity", "Build records, scans, variances, repairs"]
      - label: Usually lives in
        cells: ["Windchill (PLM)", "MES, ERP or a service system - sometimes fed back to PLM"]
      - label: Can it differ?
        cells: [It's the plan, "Yes - variances, substitutions, field repairs"]
      - label: Used by
        cells: ["Engineering, planning, change management", "Service, quality, recall teams"]
    takeaway: As-designed is the promise. As-built is the receipt. Recalls need both.

  - type: callout
    variant: why-it-matters
    md: |
      When a safety issue hits, regulators ask "which units are affected?" With serial effectivity
      and good as-built records, Acme can say "scooters 3000 to 3019 have the old bracket, here are
      the owners". Without them, the answer is "maybe all of them" - and the recall bill explodes.

  - type: simulation
    title: Which bracket is in this scooter?
    intro: |
      You're Sam in field service. A customer gives you their **Scooter S2** serial number. First
      check the **as-designed** answer (what effectivity says), then the **as-built** record (what
      the factory logged). Effectivity: SC-1048 A.2 for serials 1-2999, B.1 from 3000. Variance
      VR-0551 let the factory use 20 old A.2 brackets on serials 3000-3019.
    headline: "Scooter S2 #{unit} · designed: {designed} · built: {built}"
    initial: { unit: "?", designed: "?", built: "?", spare: "none" }
    actions:
      - id: u2950
        label: "Look up serial 2950"
        when: {}
        do: [{ set: { unit: "2950", designed: "A.2", built: "?", spare: "none" } }]
        log: "Effectivity for serial 2950 resolves to SC-1048 A.2 (serials 1-2999)."
      - id: u3010
        label: "Look up serial 3010"
        when: {}
        do: [{ set: { unit: "3010", designed: "B.1", built: "?", spare: "none" } }]
        log: "Effectivity for serial 3010 resolves to SC-1048 B.1 (serial 3000 and up)."
      - id: u3050
        label: "Look up serial 3050"
        when: {}
        do: [{ set: { unit: "3050", designed: "B.1", built: "?", spare: "none" } }]
        log: "Effectivity for serial 3050 resolves to SC-1048 B.1."
      - id: built2950
        label: "Check build record of 2950"
        when: { unit: "2950", built: "?" }
        do: [{ set: { built: "A.2" } }]
        log: "Build record: A.2. As-designed and as-built match."
        blockedHint: Look up a serial number first, then check its build record once.
      - id: built3010
        label: "Check build record of 3010"
        when: { unit: "3010", built: "?" }
        do: [{ set: { built: "A.2 (VR-0551)" } }]
        log: "Build record: A.2, used under variance VR-0551. As-built differs from as-designed!"
        blockedHint: Look up a serial number first, then check its build record once.
      - id: built3050
        label: "Check build record of 3050"
        when: { unit: "3050", built: "?" }
        do: [{ set: { built: "B.1" } }]
        log: "Build record: B.1. As-designed and as-built match."
        blockedHint: Look up a serial number first, then check its build record once.
      - id: order
        label: Order the spare bracket
        when: { built: ["A.2", "A.2 (VR-0551)", "B.1"] }
        do: [{ set: { spare: "ordered" } }]
        log: "Spare ordered to match the as-built record of scooter {unit}: {built}."
        blockedHint: Never order from the design alone. Check the build record first.
    goals:
      - label: Find a scooter where designed and built match
        when: { unit: "2950", built: "A.2" }
        message: For most units, effectivity alone gives the right answer.
      - label: Find the unit where built differs from designed
        when: { unit: "3010", built: "A.2 (VR-0551)" }
        message: Variances create approved gaps between as-designed and as-built. Only the build record shows them.
      - label: Order the right spare for scooter 3010
        when: { unit: "3010", spare: "ordered" }
        message: You ordered an A.2-compatible bracket. Effectivity alone would have sent the wrong part.

  - type: example
    variant: real-world
    title: The date that slipped
    industry: Micromobility
    md: |
      Acme first tried **date effectivity** for a new handlebar grip: "effective 1 March". The
      factory still had 600 old grips on 1 March and kept using them until 18 March. Engineering
      data said every March scooter had the new grip. Service records said otherwise. Ana switched
      the next change to **serial effectivity**, cut over at the first scooter actually built with
      the new part.
    takeaway: Dates are easy to set and easy to break. Serial numbers match reality.

  - type: walkthrough
    title: Check effectivity and filter a structure by it
    who: Engineers, change managers, service planners
    where: ["<part> information page"]
    steps:
      - title: See a version's effectivity
        where: ["<part> information page", Effectivity]
        md: |
          Open the part version and look for its **effectivity** information (on the information
          page or under a related tab). You'll see the type (date, lot or serial), the end item
          (such as the Scooter S2) and the range.
      - title: Where effectivity is set
        where: ["<change notice>", Resulting objects]
        md: |
          Effectivity is usually set as part of a change, for the resulting objects. Depending on
          your company's configuration, you enter it on the change notice or use an effectivity action
          from the part's **Actions** menu. Many companies limit this to change or configuration
          managers.
      - title: Filter the structure
        where: ["<end item> information page", Structure tab, Filter]
        md: |
          Open the end item's structure and edit the filter. Choose **effectivity**, then a date, lot
          or serial number. The structure now shows the versions valid for that unit.
      - title: Compare two units
        where: [Structure tab, Filter]
        md: Switch the serial from 2950 to 3050 and watch SC-1048 change from A.2 to B.1.
    result: You can show the as-designed configuration for any date, lot or serial number.

  - type: callout
    variant: note
    md: |
      Effectivity options, where they appear and who may edit them depend on your company's
      configuration. Some companies don't use effectivity in Windchill at all and manage cut-overs
      in ERP instead.

  - type: callout
    variant: pitfall
    md: |
      **Gaps and overlaps.** If A.2 is effective for serials 1-2999 and B.1 starts at 3001, scooter
      3000 has no valid bracket. If B.1 starts at 2990, ten scooters have two. Check every cut-over
      so ranges meet exactly.

  - type: callout
    variant: pro-tip
    md: |
      Set the cut-over **late, then confirm**. Plan serial effectivity on the change notice, then let
      manufacturing confirm the first unit actually built with the new part. Update the range if
      the line was slower than planned. Truth beats a tidy plan.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Acme needs to know exactly which scooters got the old bracket, unit by unit. Which effectivity fits best?
        options: [Date effectivity, Lot effectivity, Serial effectivity, No effectivity - use Latest Released]
        answer: 2
        explanation: Serial effectivity ties a version to individual end-item serial numbers. Dates and lots are coarser and can't pinpoint one unit.
      - kind: truefalse
        prompt: As-built can legitimately differ from as-designed for a specific unit.
        answer: true
        explanation: Variances, approved substitutions and field repairs can all make a unit differ from its design. That's fine as long as the as-built record shows it.
      - kind: single
        prompt: Serial effectivity "3000 and up" on the bracket counts what?
        options: [Brackets made by the supplier, Scooter S2 end items, Days since release, Iterations of the bracket]
        answer: 1
        explanation: Lot and serial effectivity are tied to an end item - here the Scooter S2. The serial number counts scooters, not brackets.
      - kind: multi
        prompt: Which belong to the as-built configuration? (Choose all that apply.)
        options:
          - The serial number of the bracket actually fitted
          - A variance used during assembly
          - The released drawing of SC-1048 B.1
          - A replacement bracket fitted by service
        answers: [0, 1, 3]
        explanation: As-built records what really happened to a unit. The released drawing is part of the as-designed definition.

  - type: summary
    points:
      - "Effectivity says from when a version applies: by date, lot or serial number."
      - Lot and serial effectivity count end items, such as Scooter S2 serial 3000.
      - Serial is the most precise; date is the easiest to break.
      - As-designed is the plan from released data; as-built is what went into each unit.
      - Variances and repairs create approved gaps. Service and recalls depend on recording them.
