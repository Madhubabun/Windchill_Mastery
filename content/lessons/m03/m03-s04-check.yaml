id: m03-s04-check
subtitle: Life cycles, workflows, tasks, votes and stuck processes - prove you can keep change moving.
version: 1.0.0
updated: "2026-10-05"
tags: [checkpoint, lifecycle, workflow, routing, delegation]

blocks:
  - type: text
    md: |
      Ten questions on **Lifecycle and workflow fundamentals**: the two engines, tasks in your
      inbox, voting and delegation, and diagnosing a stuck process. They're scenario-based, set
      at Acme Mobility around the SC-1048 fold-lock bracket. Score 80% to pass. The flashcards
      below go straight into your review deck.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: single
        prompt: Ana can't edit SC-1048 because its state is **Under Review**. Kai says "the workflow is broken". Who's right?
        options:
          - Kai - workflows control editing
          - Neither - the life cycle state's access rules block edits by design
          - Ana must have lost her license
          - The vault is locked
        answer: 1
        explanation: Editing rights are usually tied to the life cycle state. Under Review locks edits on purpose while a review runs. Nothing is broken.
      - kind: multi
        prompt: Which of these are parts of a **life cycle template**? (Choose all that apply.)
        options: [States such as In Work and Released, Transitions such as promote and demote, Routing options such as Approve, Assigned activities]
        answers: [0, 1]
        explanation: The life cycle holds states and allowed transitions. Routing options and activities belong to workflow templates.
      - kind: single
        prompt: How does a workflow usually move an object to Released at the end of an approval?
        options: [The approver edits the state field by hand, A set state robot asks the life cycle to change the state, The object revises itself, The CAD tool does it on check-in]
        answer: 1
        explanation: Robots are automatic workflow steps. A set state robot is the bridge between the workflow engine and the life cycle engine.
      - kind: order
        prompt: Leo gets a shared review task for CN-0451. Put his steps in order.
        items: [Open it from Home → My Tasks, Accept it so Ana knows it's taken, Open the change notice and affected objects, Choose a routing option and comment, Complete Task]
        explanation: Find it, claim it if it's shared, review the real objects, decide with a comment, then complete to move the process on.
      - kind: single
        prompt: Priya is assigned a review task but has no time this week. Ana holds the same role. What's the best move?
        options: [Ignore it until next week, Approve without looking, Reassign it to Ana with a comment, Ask Ana to log in as Priya]
        answer: 2
        explanation: Reassigning keeps the process moving and records who acted. Approving blind or sharing logins corrupts the audit trail.
      - kind: single
        prompt: The CCB activity on CR-0450 uses "all must approve". Maya and Leo approve; Ana hasn't voted yet. What happens?
        options: [It routes to approved, It routes to rework, It keeps waiting for Ana's vote, It cancels the change]
        answer: 2
        explanation: A voting activity routes only when its tally rule can be decided. With "all must approve", it needs Ana's vote.
      - kind: truefalse
        prompt: Conditional routing picks the next path from a rule, without anyone choosing an option.
        answer: true
        explanation: Conditional routing evaluates an expression, for example adding a quality review when the part is safety-critical.
      - kind: multi
        prompt: Kai goes hiking for two weeks with open tasks. Which actions keep the process honest and moving? (Choose all that apply.)
        options:
          - Reassign his tasks to a qualified colleague with a comment
          - Set a delegate or out-of-office option if his setup has one
          - Share his password with Priya
          - Ask for a backup to be added to his team role
        answers: [0, 1, 3]
        explanation: Reassigning, delegating and adding role backups all keep a clean record. Shared logins break it.
      - kind: single
        prompt: All human tasks on CN-0451 are done, but SC-1048.drw is still Under Review. The drawing is checked out to Priya. What's the right fix?
        options:
          - Restart the whole process
          - Priya checks it in, then an admin retries the failed step
          - Set the drawing to Released by hand
          - Wait - it will sort itself out
        answer: 1
        explanation: A checked-out object often makes a set state robot fail. Fix the data, then ask an admin to retry the step with a precise ticket.
      - kind: single
        prompt: Thirty promotion requests are all stuck at the same review activity. What's the most likely cause?
        options: [Thirty lazy reviewers, The review role on the team is empty or points to someone who left, The vault is full, Each request has a typo]
        answer: 1
        explanation: Many stalls at one step point to the setup behind that step, usually team roles. Fixing the role and reassigning clears them all.

  - type: flashcards
    title: Lifecycle and workflow deck
    cards:
      - front: "Life cycle vs workflow"
        back: "Life cycle = where an object is (states). Workflow = who does what next (activities and tasks)."
      - front: "Life cycle template"
        back: "Admin-defined states and the transitions allowed between them."
      - front: "Workflow template"
        back: "The process recipe. Each run creates a process instance from it."
      - front: "Assigned activity"
        back: "A workflow step that creates tasks for people and waits for them."
      - front: "Robot"
        back: "An automatic workflow step, such as set state, notify or timer."
      - front: "Work item"
        back: "The task in your list. Accept (if shared), review, choose an option, Complete Task."
      - front: "Routing"
        back: "How the workflow picks its next path - manual, voting (tally) or conditional."
      - front: "Tally rule"
        back: "How votes combine, for example all must approve or any reject sends it back."
      - front: "Delegation"
        back: "A stand-in acts on your tasks while you're away - by reassigning or an out-of-office setting."
      - front: "Process Manager"
        back: "The graphical view of a running process. Shows which activity it's waiting on."
      - front: "Five reasons a workflow stalls"
        back: "Busy person, empty role, waiting parallel branch, failed robot, object not ready (e.g. checked out)."
      - front: "When to call the admin"
        back: "Failed robots, retries, restarts or terminations, and fixing roles in bulk."
