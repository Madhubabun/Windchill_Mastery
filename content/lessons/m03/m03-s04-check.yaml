blocks:
  - type: text
    md: |
      Ten questions on **Lifecycle and workflow fundamentals**: the two engines, tasks in your
      inbox, voting and delegation, and diagnosing a stuck process. They're scenario-based, set
      at Acme Mobility around the SC-1048 fold-lock bracket. Score 80% to pass. The flashcards
      below go straight into your review deck.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: single
        prompt: Ana can't edit SC-1048 because its state is **Under Review**. Kai says "the workflow is broken". Who's right?
        options:
          - Kai - workflows control editing
          - Neither - the life cycle state's access rules block edits by design
          - Ana must have lost her license
          - The vault is locked
        answer: 1
        explanation: Editing rights are usually tied to the life cycle state. At Acme, Under Review blocks edits on purpose while a review runs. Nothing is broken.
      - kind: multi
        prompt: Which of these are parts of a **life cycle template**? (Choose all that apply.)
        options: [States such as In Work and Released, Transitions such as Promote and Revise, Routing options such as Approve, Assigned activities]
        answers: [0, 1]
        explanation: The life cycle holds states and allowed transitions. Routing options and activities belong to workflow templates.
      - kind: single
        prompt: How does a workflow usually move an object to Released at the end of an approval?
        options: [The approver edits the state field by hand, A Set State robot changes the object's state, The object revises itself, The CAD tool does it on check-in]
        answer: 1
        explanation: Robots are automatic workflow steps, and setting the life cycle state is their most common job. A Set State robot is the bridge between the workflow and the life cycle.
      - kind: order
        prompt: Leo gets a shared review task for CN-0451. Put his steps in order.
        items: [Open it from the My Tasks table, Accept it so Ana's copy is removed, Open the change notice and its objects, Choose a routing option and comment, Complete Task]
        explanation: Find it, accept it if it's shared on an Any activity, review the real objects, decide with a comment, then complete to move the process on.
      - kind: single
        prompt: Priya is assigned a review task but has no time this week. Ana holds the same role. What's the best move?
        options: [Ignore it until next week, Approve without looking, Reassign it to Ana with a comment, Ask Ana to log in as Priya]
        answer: 2
        explanation: Reassigning (with a reason for reassignment) keeps the process moving and records who acted. Approving blind or sharing logins corrupts the audit trail.
      - kind: single
        prompt: The CCB activity on CR-0450 uses an "all" tally - Approve wins only if everyone picks it. Maya and Leo approve; Ana hasn't voted yet. What happens?
        options: [It routes to approved, It routes to rework, It keeps waiting for Ana's vote, It cancels the change]
        answer: 2
        explanation: A voting activity routes once the votes can be tallied. With an "all" tally, it needs Ana's vote.
      - kind: truefalse
        prompt: Conditional routing picks the next path from a rule, without anyone choosing an option.
        answer: true
        explanation: Conditional routing evaluates an expression, for example adding a quality review when the part is safety-critical.
      - kind: multi
        prompt: Kai goes hiking for two weeks with open tasks. Which actions keep the process honest and moving? (Choose all that apply.)
        options:
          - Reassign his tasks to a qualified colleague with a comment
          - Delegate his calendar days, if the site has enabled delegation
          - Share his password with Priya
          - Ask for a backup to be added to his team role
        answers: [0, 1, 3]
        explanation: Reassigning, delegating and adding role backups all keep a clean record. Shared logins break it.
      - kind: single
        prompt: All human tasks on CN-0451 are done, but SC-1048.drw is still Under Review. The Process Manager shows the Set State robot node in red (aborted). What's the right fix?
        options:
          - Terminate the whole process and start again
          - Send an admin the details so they can fix the cause and restart the aborted activity
          - Set the drawing to Released by hand
          - Wait - it will sort itself out
        answer: 1
        explanation: An aborted activity stays aborted. An admin with the right permissions fixes the cause and uses Restart Aborted Activity - your precise ticket makes that fast.
      - kind: single
        prompt: Thirty promotion requests are all stuck at the same review activity. What's the most likely cause?
        options: [Thirty lazy reviewers, The review role on the team is empty or points to someone who left, The vault is full, Each request has a typo]
        answer: 1
        explanation: Many stalls at one step point to the setup behind that step, usually team roles. Tasks nobody can take go to the workflow's Responsible Role. Fixing the role and reassigning clears them all.

  - type: flashcards
    title: Lifecycle and workflow deck
    cards:
      - front: "Life cycle vs workflow"
        back: "Life cycle = where an object is (states). Workflow = who does what next (activities and tasks)."
      - front: "Life cycle template"
        back: "Admin-defined states (phase + gate) and the transitions allowed between them, such as Promote, Lock, Revise and Set State."
      - front: "Workflow template"
        back: "The process recipe: activity, connector, robot and terminal nodes joined by links. Each run creates a process instance."
      - front: "Assigned activity"
        back: "A workflow step that creates tasks for people and waits for them."
      - front: "Robot"
        back: "An automatic workflow step, such as set state, notify or timer."
      - front: "Work item"
        back: "The task in your My Tasks table. Accept (if shared), review, choose an option, Complete Task."
      - front: "Routing"
        back: "How the workflow picks its next path - manual, voting (tally) or conditional."
      - front: "Tally rule"
        back: "How votes combine - for example any, all, percent, number or plurality."
      - front: "Delegation"
        back: "A stand-in acts for you while you're away - by reassigning tasks or delegating calendar days (if enabled)."
      - front: "Process Manager"
        back: "The graphical view of a process. Green = running, grey = done, white = not started, orange/red = failed or aborted."
      - front: "Five reasons a workflow stalls"
        back: "Busy person, empty role, waiting parallel branch (And connector), failed robot, a life cycle with no allowed transition."
      - front: "When to call the admin"
        back: "Aborted robots (Restart Aborted Activity), suspends or terminations, life cycle fixes and fixing roles in bulk."
