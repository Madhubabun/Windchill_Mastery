id: m03-s05-l04
subtitle: Measure the change process like a coach, and walk into an audit like you own the place.
version: 1.0.0
updated: "2026-10-05"
tags: [kpi, metrics, configuration-audit, fca, pca, status-accounting]

blocks:
  - type: text
    md: |
      "We closed 300 changes this quarter!" Cool... but were they **fast**? Did they **stick**? Or
      did half of them come back as new problems? Counting changes is like counting steps without
      checking where you walked.

      Good change metrics tell you where the process gets stuck and whether it fixes things for
      real. And an audit is the moment someone outside your team checks that your product matches
      your data. Both get much easier when Windchill holds the records.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a number that shows how well we're doing" → *KPI* (key performance indicator)
      - "how long a change takes, start to finish" → *change cycle time*
      - "changes waiting in the queue" → *change backlog*, with its *aging*
      - "does it do what the spec says?" → *functional configuration audit* (FCA)
      - "does the built thing match the drawings?" → *physical configuration audit* (PCA)
      - "the checking job in CM" → *[[configuration-audit]]*

  - type: comparison
    title: "Cheat sheet: change KPIs that actually help"
    columns: [What it measures, Why it's useful, Watch out for]
    rows:
      - label: Cycle time
        cells: ["Days from CR created to CN completed - also split by stage", "Shows where changes wait: review, CCB, implementation", "Averages hide outliers. Track the slowest 10% too"]
      - label: Backlog and aging
        cells: ["Open PRs, CRs and CNs, and how old they are", "Old items are risk: known problems not yet fixed", "A small backlog of very old items is still bad"]
      - label: First-pass approval
        cells: ["Share of CRs approved without being sent back", "Low = poor impact analysis or unclear requests", "Don't push it to 100% by approving everything"]
      - label: Reopen or rework rate
        cells: ["Changes that needed a follow-up change to fix them", "Measures change quality, not just speed", "Link follow-ups to the original change to count them"]
      - label: Fast-track share
        cells: ["Share of changes that skipped the full CR route", "Healthy for small fixes; too high = control is leaking", "What counts as fast track depends on your configuration"]
      - label: Variance count
        cells: ["Approved one-time departures per product or period", "Rising variances = the design doesn't match reality", "Repeated variances should become a real change"]
      - label: Release-to-build lag
        cells: ["Time from CN complete to first unit built with it", "Shows how fast changes reach the product", "Needs effectivity or ERP data to measure"]
    takeaway: Pair a speed metric (cycle time) with a quality metric (rework). One alone can be gamed.

  - type: callout
    variant: why-it-matters
    md: |
      KPIs decide where a company invests. If the board only sees "changes closed", people rush
      changes through and quality drops. If it sees cycle time **and** rework, it fixes the real
      bottleneck - often a slow CCB meeting or missing impact analysis.

  - type: example
    variant: case-study
    title: The 41-day change
    industry: Micromobility
    md: |
      Maya measured Acme's change cycle time: **41 days** on average. Everyone blamed engineering.
      She split the time by stage:

      | Stage | Days |
      | --- | --- |
      | Problem report to CR | 6 |
      | CR waiting for the CCB | **19** |
      | CN tasks (engineering work) | 11 |
      | Final release | 5 |

      The work itself took 11 days. Changes spent **19 days waiting** for a CCB that met once a month.
      Maya switched to a weekly 30-minute CCB plus a fast-track route for low-risk document fixes.
      Six months later the average was 18 days, and the rework rate didn't rise.
    takeaway: Split cycle time by stage. The bottleneck is rarely where people think.

  - type: walkthrough
    title: Pull change data for your KPIs
    who: Change managers and business administrators
    where: [Search, Advanced Search]
    steps:
      - title: Search for change objects
        where: [Search, Advanced Search]
        md: |
          Choose the type, for example **Change Notice** or **Change Request**. Add criteria such as
          the product context, state and a created-date range.
      - title: Add the columns you need
        where: [Search results, Table view]
        md: |
          Use a [[table-view|table view]] to show number, state, created date, last modified date and
          any dates your company tracks (such as need date or resolution date).
      - title: Save it
        where: [Search results, Save search]
        md: Save the search so you can run the same query every month. Consistent queries make trends meaningful.
      - title: Export and analyse
        where: [Search results, Actions or Export]
        md: |
          Export the table to a spreadsheet and calculate cycle time and aging. Many companies use
          prebuilt Windchill reports or a dashboard tool for this instead; ask your administrator
          what's available.
    result: A repeatable data pull for cycle time, backlog and aging.

  - type: animation
    title: Getting audit-ready
    diagram:
      width: 800
      height: 300
      nodes:
        - { id: base, label: Baseline, sublabel: approved config, x: 20, y: 120, w: 150, tone: primary, shape: cylinder }
        - { id: changes, label: Change records, sublabel: "all CNs closed?", x: 210, y: 30, w: 160, tone: warning }
        - { id: variances, label: Variances, sublabel: "all recorded?", x: 210, y: 210, w: 160, tone: warning }
        - { id: fca, label: FCA, sublabel: "meets requirements?", x: 420, y: 30, w: 160, tone: accent }
        - { id: pca, label: PCA, sublabel: "matches documents?", x: 420, y: 210, w: 160, tone: accent }
        - { id: pass, label: Audit passed, sublabel: evidence on file, x: 620, y: 120, w: 160, tone: success, shape: pill }
      edges:
        - { from: base, to: changes }
        - { from: base, to: variances }
        - { from: changes, to: fca }
        - { from: variances, to: pca }
        - { from: fca, to: pass }
        - { from: pca, to: pass }
    chapters:
      - title: Freeze the reference
        caption: Pick the configuration being audited - for Acme, the Scooter S2 as released for serial 3000 onward - and capture it, often as a baseline.
        show: [base]
        highlight: [base]
      - title: Close the loose ends
        caption: Check that every change notice for this configuration is complete, and that nothing is still In Work or Under Review.
        show: [base, changes]
        highlight: [changes]
        flow: [base>changes]
      - title: Account for every variance
        caption: List approved variances such as **VR-0551** with their units. Each one explains a gap between as-designed and as-built.
        show: [base, changes, variances]
        highlight: [variances]
        flow: [base>variances]
      - title: Functional audit
        caption: The **FCA** checks test results against requirements. Does the fold-lock pass its cycle test? The reports should be linked to the parts.
        show: [base, changes, variances, fca]
        highlight: [fca]
        flow: [changes>fca]
      - title: Physical audit
        caption: The **PCA** compares a real scooter with the released drawings and BOM. Bracket on the scooter = SC-1048 B.1 on the drawing?
        show: [base, changes, variances, fca, pca]
        highlight: [pca]
        flow: [variances>pca]
      - title: Pass, with evidence
        caption: Findings are recorded and fixed through the normal change process. Good CM makes the audit a box-ticking day instead of a fire drill.
        highlight: [pass]
        flow: [fca>pass, pca>pass]
        seconds: 6

  - type: text
    md: |
      **Audit prep checklist (cheat sheet)**

      - The audited configuration is defined and frozen (for example in a baseline).
      - Every part and document in it is **Released** - no In Work surprises.
      - Every change notice affecting it is complete; open ones are listed with a plan.
      - Drawings and parts are on matching revisions.
      - Variances are listed with their units, quantities and expiry.
      - Test reports are linked to the parts they prove.
      - Effectivity ranges have no gaps or overlaps.
      - You can show the approval history (who voted, when) for a sample of changes.

  - type: callout
    variant: pitfall
    md: |
      **Building the evidence the night before.** If you need a heroic spreadsheet effort to prepare
      an audit, your status accounting is broken. Fix the process so the evidence builds up as part
      of every change, not as a special project.

  - type: callout
    variant: pro-tip
    md: |
      Run a **mini-audit every quarter**: pick three random released parts and trace each one from
      problem report to released version to built unit. Fix whatever breaks the chain. The real
      audit then finds nothing new.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Maya wants one KPI pair that can't easily be gamed. Which is best?
        options:
          - Changes closed and changes opened
          - Cycle time and rework rate
          - Number of CCB meetings and attendees
          - Number of documents and number of parts
        answer: 1
        explanation: Cycle time measures speed; rework rate measures whether the changes worked. Pushing one up at the expense of the other shows up immediately.
      - kind: single
        prompt: An auditor compares a real Scooter S2 against its released drawings and BOM. What kind of audit is this?
        options: [Functional configuration audit, Physical configuration audit, Security audit, Supplier audit]
        answer: 1
        explanation: A physical configuration audit checks that the built item matches its released documentation. A functional audit checks performance against requirements.
      - kind: truefalse
        prompt: A rising number of variances on one part is a signal that the design may need a real change.
        answer: true
        explanation: Repeated one-time departures mean the design doesn't match what manufacturing can or should do. Turn them into a proper change.
      - kind: multi
        prompt: Which belong on an audit prep checklist? (Choose all that apply.)
        options:
          - All change notices for the configuration are complete or listed
          - Drawings and parts are on matching revisions
          - Every part's latest iteration is In Work
          - Variances are listed with the units they affect
        answers: [0, 1, 3]
        explanation: Audits look at the released configuration, closed changes, matching revisions and recorded variances. In Work data is a red flag, not a goal.

  - type: summary
    points:
      - Measure speed and quality together - cycle time plus rework rate.
      - Split cycle time by stage to find the real bottleneck.
      - Track backlog aging, first-pass approval, fast-track share and variance count.
      - Functional audit = meets requirements; physical audit = matches documents.
      - Audit-ready means evidence builds up with every change, not the night before.
