id: m03-s01-l03
subtitle: Not every change needs a board meeting. Learn when to take the express lane - and when it's a trap.
version: 1.0.0
updated: "2026-10-05"
tags: [change-management, fast-track, full-track, change-review-board, change-notice]

blocks:
  - type: text
    md: |
      Think of a supermarket. Ten items or fewer? Express lane. A full trolley? Normal checkout.
      Nobody wants to wait behind a full trolley to buy one apple.

      Change works the same way. A typo in a drawing note shouldn't need the same board meeting as a
      new bracket material. So most companies have two routes:

      - **Full track** - the whole process: Problem Report, Change Request, board decision, then a
        Change Notice with tasks.
      - **Fast track** - a shortcut for small, low-risk changes, usually going straight to a Change
        Notice without a separate Change Request.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the complete route with a board decision" → *[[full-track-change|full track change]]*
      - "the express lane for small stuff" → *[[fast-track-change|fast track change]]*
      - "does it still fit, look and work the same?" → *form, fit and function* (FFF)
      - "can the old and new parts be swapped freely?" → *interchangeability*

  - type: diagram
    title: Two routes to the same release
    caption: Both routes end with a Change Notice, tasks and released revisions. Click a box to compare.
    diagram:
      width: 800
      height: 300
      groups:
        - { label: Full track, x: 10, y: 10, w: 780, h: 130, tone: warning }
        - { label: Fast track, x: 10, y: 160, w: 780, h: 130, tone: success }
      nodes:
        - id: fpr
          label: Problem Report
          x: 30
          y: 60
          w: 140
          tone: danger
          detail: Captures the problem and evidence. Often the starting point on the full track.
        - id: fcr
          label: Change Request
          x: 190
          y: 60
          w: 140
          tone: warning
          detail: The business case. Cost, stock, suppliers, safety and urgency are written down so the board can judge.
        - id: fccb
          label: Board decision
          x: 350
          y: 60
          w: 140
          tone: neutral
          shape: pill
          detail: Maya's change board approves, rejects or asks for more information. This is the step fast track skips.
        - id: fcn
          label: Change Notice
          x: 510
          y: 60
          w: 130
          tone: primary
          detail: The implementation plan with change tasks.
        - id: frel
          label: Released
          x: 660
          y: 60
          w: 110
          tone: success
          shape: pill
          detail: New revisions released and traceable to the CR and PR.
        - id: scn
          label: Change Notice
          x: 190
          y: 210
          w: 300
          tone: primary
          detail: |
            On the fast track the change starts here. The CN still lists affected objects, has tasks,
            and is usually reviewed by someone before release - just without the full board.
            Exactly how this works **depends on your company's configuration**.
        - id: srel
          label: Released
          x: 660
          y: 210
          w: 110
          tone: success
          shape: pill
          detail: Still a new, traceable revision. Fast track is shorter, not sloppier.
      edges:
        - { from: fpr, to: fcr }
        - { from: fcr, to: fccb }
        - { from: fccb, to: fcn }
        - { from: fcn, to: frel }
        - { from: scn, to: srel }

  - type: comparison
    title: Fast track vs full track
    columns: [Fast track, Full track]
    rows:
      - label: Typical route
        cells: ["Change Notice (no separate Change Request)", "Problem Report → Change Request → board → Change Notice"]
      - label: Use it for
        cells: ["Low-risk fixes - typos, missing notes, clarifications", "Anything that affects form, fit, function, safety, cost or suppliers"]
      - label: Who decides
        cells: ["A delegated approver, such as a change analyst", "The change board (CRB / CCB)"]
      - label: Impact on stock and parts already made
        cells: [None - existing parts are still good, "Needs a decision - use up, rework or scrap"]
      - label: Speed
        cells: [Hours to days, Days to weeks]
      - label: Paper trail
        cells: [Shorter but still traceable, Full - from problem to release]
    takeaway: Fast track is a shorter route, not a way around the rules. Still a CN, still tasks, still a new revision.

  - type: callout
    variant: why-it-matters
    md: |
      If every change goes full track, the board drowns in typo fixes and real issues wait in the queue.
      If too much goes fast track, risky changes slip past the people who should have seen them. Real
      companies write down **clear rules** for which changes may take the fast track, and audits check
      that the rules were followed.

  - type: text
    md: |
      ### The quick test

      Ask these questions about the change. If **any** answer is "yes", take the **full track**.

      1. Does it change **form, fit or function** - shape, size, material, performance?
      2. Can the new part **not** be swapped freely with the old one?
      3. Does it touch **safety**, regulations or certification?
      4. Does it affect **cost**, **suppliers**, tooling or **stock** already made?
      5. Does it need input from **several teams** to judge?

      All "no"? It's a fast track candidate - if your company's rules allow it.

  - type: scenario
    variant: challenge
    title: Pick the right lane
    start: c1
    nodes:
      - id: c1
        md: |
          **Change 1 of 3.** Priya notices the title block on **SC-1048.drw** spells "bracket" as
          "braket". The geometry, tolerances and material are all fine. Which track?
        choices:
          - label: Fast track
            next: c2
            good: true
            feedback: Right. It's a documentation fix with no effect on the part. A Change Notice is enough.
          - label: Full track with a board review
            next: slow
            feedback: Technically allowed, but you've just added a typo to the board's agenda.
      - id: c2
        md: |
          **Change 2 of 3.** Kai wants to switch the SC-1048 bracket from steel to aluminium to save
          weight. The supplier changes, tooling changes and 3,000 steel brackets are in stock. Which track?
        choices:
          - label: Full track
            next: c3
            good: true
            feedback: Yes. Material, supplier, cost and stock all change. The board needs to decide.
          - label: Fast track - it's the same shape
            next: risky
            feedback: Same shape, different function. Material affects strength, weight and cost.
      - id: c3
        md: |
          **Change 3 of 3.** Sam reports that some S2 fold-locks can open while riding. The suspected fix
          is a stronger latch spring - a tiny, cheap part. Which track?
        choices:
          - label: Full track, starting with a Problem Report
            next: win
            good: true
            feedback: Small part, huge impact. Anything safety-related gets the full process, with evidence.
          - label: Fast track - it's only a spring
            next: danger
            feedback: The size of the part says nothing about the size of the risk.
      - id: win
        md: |
          Three for three. You judged each change by its **impact**, not by how big the edit looks. That's
          exactly how a good change analyst thinks.
        outcome: success
      - id: slow
        md: |
          The typo waits two weeks for a board slot, and the board spends time on it instead of real
          issues. Nothing breaks, but the process got slower for everyone.
        outcome: partial
      - id: risky
        md: |
          The aluminium bracket gets released without manufacturing or purchasing seeing it. Steel stock
          is left over and the new supplier isn't qualified. Changes like this need the full track.
        outcome: fail
      - id: danger
        md: |
          A safety issue went through without a board decision or a documented problem. If a rider is
          hurt, Acme can't show the risk was assessed. Safety always takes the full track.
        outcome: fail

  - type: walkthrough
    title: Start a fast track change (when your rules allow it)
    who: Users allowed to create change notices directly (depends on your company's configuration)
    steps:
      - title: Check the rules first
        where: [Your company's change policy]
        md: Confirm the change meets your fast track criteria. If you're unsure, ask your change manager (at Acme, Maya).
      - title: Open the affected object
        where: [Search, "<object> information page"]
        md: Find the drawing or part by number and open its information page. Check the **Changes** tab for an open change first.
      - title: Create the Change Notice
        where: ["<object> information page", Actions menu, New Change Notice]
        md: |
          From the **Actions** menu choose the action to create a new **Change Notice**. In some setups
          you instead create a change request and mark it as a simple or fast track change. Follow what
          your company has configured.
      - title: Explain why it's fast track
        where: [New Change Notice, description]
        md: Write a clear description and why it qualifies - for example "documentation only, no form, fit or function impact".
    result: The change runs on the short route but still produces a traceable new revision.

  - type: callout
    variant: note
    title: Fast track setups vary
    md: |
      Windchill supports both routes, but how fast track is set up differs by company. Some create
      Change Notices directly, some use a "simple" vs "complex" setting on the change object to choose
      a shorter workflow. Treat your company's change policy as the source of truth.

  - type: callout
    variant: pitfall
    md: |
      **Fast track as a way to dodge the board.** Splitting one big change into several "small" fast
      track changes, or calling a material change a "clarification", is a classic audit finding. If you
      need to argue that it's fast track, it probably isn't.

  - type: callout
    variant: pro-tip
    md: |
      Put your fast track rules on one page as a yes/no checklist (like the quick test above) and link
      it from your change templates. Fewer debates, faster decisions and cleaner audits.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: What do fast track and full track changes have in common?
        options:
          - Both need the change board to meet
          - Both end with a Change Notice producing new released revisions
          - Both start with a Problem Report
          - Neither leaves a record
        answer: 1
        explanation: Both routes implement the change through a Change Notice and its tasks, and both produce traceable new revisions. Fast track mainly skips the separate Change Request and board decision.
      - kind: multi
        prompt: Which changes should take the full track? (Choose all that apply.)
        options:
          - Changing the bracket material
          - Fixing a spelling mistake in a drawing note
          - A fix for a fold-lock that can open while riding
          - A new supplier for a machined part
        answers: [0, 2, 3]
        explanation: Material, safety and supplier changes have real impact and need the board. A spelling fix with no effect on the part is a typical fast track candidate.
      - kind: truefalse
        prompt: A change to a small, cheap part can always use the fast track.
        answer: false
        explanation: Judge the impact, not the size. A tiny spring that keeps a scooter folded is safety-critical.
      - kind: single
        prompt: Who decides exactly how fast track works in your Windchill?
        options:
          - It's the same in every Windchill installation
          - Your company's configuration and change policy
          - Whoever creates the change
          - The supplier
        answer: 1
        explanation: Windchill supports short and full routes, but the details - who may use fast track and which workflow runs - are configured per company.

  - type: summary
    points:
      - Full track - Problem Report, Change Request, board decision, Change Notice with tasks.
      - Fast track - a shorter route for low-risk changes, usually a Change Notice without a separate CR.
      - Choose by impact - form, fit, function, safety, cost, suppliers and stock mean full track.
      - Both routes still produce traceable new revisions.
      - How fast track is set up depends on your company's configuration and policy.
