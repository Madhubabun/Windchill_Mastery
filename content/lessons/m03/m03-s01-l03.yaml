id: m03-s01-l03
subtitle: Not every change needs a board meeting. Learn when to take the express lane - and when it's a trap.
version: 1.1.0
updated: "2026-10-14"
tags: [change-management, fast-track, full-track, change-review-board, change-notice]
sources:
  - id: te
    where: "Module 6: Identify roles in the change management process (CRB, CIB, 80/20 Fast and Full Track); Change management process: Investigate Need; Activity: Analyze a change request (Fast-Track Approval, Full-Track Online Review, Full-Track Offline Review); Activity: Create a change notice to release product data (Complexity: Fast Track, Full Track, Basic)"
  - id: pf
    where: "Module 4: The change process (Basic, Fast and Full Track); Activity: Use the Fast Track change process to revise a business object; Activity: Use the Full Track change process to revise a business object"
  - id: ac
    where: "Appendix B: Describe the change request life cycle and workflow; Describe the change request process for offline and online CRB processes; Describe the change notice life cycle and workflow (Schedule CIB Review)"
  - id: trn-cm-itc
    where: "Intro to the change process: change process diagram (Full Track and Fast Track routes); Creating change requests: Analyzing change requests, Fast Track versus Full Track (used only where the 13.x course manual agrees)"

blocks:
  - type: text
    md: |
      Think of a supermarket. Ten items or fewer? Express lane. A full trolley? Normal checkout.
      Nobody wants to wait behind a full trolley to buy one apple.

      Change works the same way. A typo in a drawing note shouldn't need the same board meeting as a
      new bracket material. Windchill's out-of-the-box change process has two routes for a change
      request:

      - **Full track** - the change request is reviewed by the **change review board**, and later the
        change notice's plan is reviewed by the **change implementation board** before work starts.
      - **Fast track** - the same change request and change notice, but **without the two board
        reviews**. The change admins move it along.

      The route is picked by the **Change Admin I** while analysing the change request. The course
      manual says that typically about **80%** of changes are fast track and **20%** full track.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the route with board reviews" → *[[full-track-change|full track change]]*
      - "the express lane without board reviews" → *[[fast-track-change|fast track change]]*
      - "the board that decides on the request" → *[[change-review-board]]* (CRB)
      - "the board that decides on the plan" → *[[change-implementation-board]]* (CIB)
      - "the task where the route is picked" → *Analyze Change Request*, with its *routing options*
      - "does it still fit, look and work the same?" → *[[form-fit-function|form, fit and function]]* (FFF), a general PLM idea
      - "can the old and new parts be swapped freely?" → *[[interchangeability]]*, also general PLM practice

  - type: diagram
    title: Two routes to the same release
    caption: Both routes use a change request, a change notice with tasks and a final audit. Full track adds two board reviews. Click a box to compare.
    diagram:
      width: 860
      height: 300
      groups:
        - { label: Full track, x: 10, y: 10, w: 840, h: 130, tone: warning }
        - { label: Fast track, x: 10, y: 160, w: 840, h: 130, tone: success }
      nodes:
        - id: fpr
          label: Problem Report
          sublabel: optional
          x: 20
          y: 60
          w: 120
          tone: danger
          detail: Captures the problem and evidence. Problem reports are optional - an issue can also start straight in a change request.
        - id: fcr
          label: Change Request
          sublabel: Change Admin I
          x: 160
          y: 60
          w: 120
          tone: warning
          detail: |
            The business case: scope, impact, cost and the proposed solution. In the **Analyze Change
            Request** task, Change Admin I picks a full-track routing option.
        - id: fccb
          label: CRB review
          x: 300
          y: 60
          w: 120
          tone: neutral
          shape: pill
          detail: The change review board approves, denies or asks for more investigation. Typical members come from design engineering, manufacturing engineering and quality. Fast track skips this.
        - id: fcn
          label: Change Notice
          sublabel: Change Admin II plans
          x: 440
          y: 60
          w: 120
          tone: primary
          detail: The change notice holds the implementation plan - the change tasks with their assignees, reviewers and need dates.
        - id: fcib
          label: CIB review
          x: 580
          y: 60
          w: 120
          tone: neutral
          shape: pill
          detail: The change implementation board approves or denies the plan before the tasks go out. Fast track skips this too.
        - id: frel
          label: Released
          sublabel: after CA III audit
          x: 720
          y: 60
          w: 120
          tone: success
          shape: pill
          detail: The tasks are done and reviewed, Change Admin III audits the change notice, and approval releases the resulting objects.
        - id: spr
          label: Problem Report
          sublabel: optional
          x: 20
          y: 210
          w: 120
          tone: danger
          detail: Same as on the full track.
        - id: scr
          label: Change Request
          sublabel: Change Admin I
          x: 160
          y: 210
          w: 120
          tone: warning
          detail: |
            Still a change request, still analysed. Change Admin I picks **Fast-Track Approval** in
            the Analyze Change Request task, and the request goes straight on to change planning.
        - id: scn
          label: Change Notice
          sublabel: Change Admin II plans
          x: 440
          y: 210
          w: 120
          tone: primary
          detail: The same kind of change notice and tasks as the full track, but no CIB review of the plan.
        - id: srel
          label: Released
          sublabel: after CA III audit
          x: 720
          y: 210
          w: 120
          tone: success
          shape: pill
          detail: Still reviewed task by task, still audited, still a new traceable revision. Fast track is shorter, not sloppier.
      edges:
        - { from: fpr, to: fcr }
        - { from: fcr, to: fccb, label: full track }
        - { from: fccb, to: fcn }
        - { from: fcn, to: fcib }
        - { from: fcib, to: frel }
        - { from: spr, to: scr }
        - { from: scr, to: scn, label: fast track }
        - { from: scn, to: srel }

  - type: comparison
    title: Fast track vs full track
    columns: [Fast track, Full track]
    rows:
      - label: Who picks the route
        cells: ["Change Admin I, in the Analyze Change Request task", "Change Admin I, in the Analyze Change Request task"]
      - label: Board reviews
        cells: [None, "CRB reviews the change request; CIB reviews the change notice's plan"]
      - label: Use it for
        cells: ["Low impact and cost - the cost limit is usually set by company policy", "High impact and cost that needs close analysis, often across departments"]
      - label: How common
        cells: ["About 80% of changes (the course manual's typical figure)", About 20% of changes]
      - label: Still has a change notice, tasks, reviews and an audit?
        cells: [Yes, Yes]
    takeaway: Fast track is a shorter route, not a way around the rules. Same objects, same audit, fewer board reviews.

  - type: callout
    variant: why-it-matters
    md: |
      If every change goes full track, the boards drown in typo fixes and real issues wait in the
      queue. If too much goes fast track, risky changes slip past the people who should have seen
      them. Real companies write down **clear rules** for which changes may take the fast track, and
      audits check that the rules were followed.

  - type: text
    md: |
      ### The quick test

      This checklist is **general PLM practice**, not a Windchill setting - your company's change
      policy is what counts. Ask these questions about the change. If **any** answer is "yes", it's a
      **full track** candidate.

      1. Does it change **form, fit or function** - shape, size, material, performance?
      2. Can the new part **not** be swapped freely with the old one?
      3. Does it touch **safety**, regulations or certification?
      4. Does it affect **cost**, **suppliers**, tooling or **stock** already made?
      5. Does it need input from **several departments** to judge?

      All "no"? It's a fast track candidate - if your company's rules allow it.

  - type: scenario
    variant: challenge
    title: Pick the right lane
    start: c1
    nodes:
      - id: c1
        md: |
          **Change 1 of 3.** Priya notices the title block on **SC-1048.drw** spells "bracket" as
          "braket". The geometry, tolerances and material are all fine. Which track?
        choices:
          - label: Fast track
            next: c2
            good: true
            feedback: Right. It's a documentation fix with no effect on the part. Maya can approve it as fast track - no board needed.
          - label: Full track with board reviews
            next: slow
            feedback: Technically allowed, but you've just added a typo to the board's agenda.
      - id: c2
        md: |
          **Change 2 of 3.** Kai wants to switch the SC-1048 bracket from steel to aluminium to save
          weight. The supplier changes, tooling changes and 3,000 steel brackets are in stock. Which track?
        choices:
          - label: Full track
            next: c3
            good: true
            feedback: Yes. Material, supplier, cost and stock all change. The board needs to decide.
          - label: Fast track - it's the same shape
            next: risky
            feedback: Same shape, different function. Material affects strength, weight and cost.
      - id: c3
        md: |
          **Change 3 of 3.** Sam reports that some S2 fold-locks can open while riding. The suspected fix
          is a stronger latch spring - a tiny, cheap part. Which track?
        choices:
          - label: Full track, starting with a Problem Report
            next: win
            good: true
            feedback: Small part, huge impact. Anything safety-related gets the full process, with evidence.
          - label: Fast track - it's only a spring
            next: danger
            feedback: The size of the part says nothing about the size of the risk.
      - id: win
        md: |
          Three for three. You judged each change by its **impact**, not by how big the edit looks. That's
          exactly how a good Change Admin I thinks.
        outcome: success
      - id: slow
        md: |
          The typo waits two weeks for a board slot, and the board spends time on it instead of real
          issues. Nothing breaks, but the process got slower for everyone.
        outcome: partial
      - id: risky
        md: |
          The aluminium bracket gets released without manufacturing or purchasing seeing it. Steel stock
          is left over and the new supplier isn't qualified. Changes like this need the full track.
        outcome: fail
      - id: danger
        md: |
          A safety issue went through without a board decision or a documented problem. If a rider is
          hurt, Acme can't show the risk was assessed. Safety always takes the full track.
        outcome: fail

  - type: walkthrough
    title: Pick the track for a change request
    who: A member of the Change Admin I role for the product (at Acme, Maya)
    where: [Home, My Tasks, Analyze Change Request]
    steps:
      - title: Open the analysis task
        where: [Home, My Tasks]
        md: In the **My Tasks** table click **Analyze Change Request**. The task's information page opens.
      - title: Read the change request
        where: [Analyze Change Request, Details tab, Subject link]
        md: Open the change request from the task's **Subject** link. Check its description, proposed solution and affected objects against your company's fast track rules.
      - title: Choose a routing option
        where: [Analyze Change Request, Task Completion]
        md: |
          Click **Task Completion**. Choose **Fast-Track Approval** for a low-impact change, or
          **Full-Track Online Review** to add approval tasks for the CRB and CIB roles in Windchill.
          **Full-Track Offline Review** means the boards meet outside Windchill and a Change Admin II
          records the results. You can also reject the request or reassign it.
      - title: Explain and complete
        where: [Task Completion, Comments, Complete Task]
        md: Write a comment that says why the route fits - for example "documentation only, no form, fit or function impact" - and click **Complete Task**.
    result: The change request moves on by the route you chose, and your reason is recorded with the task.

  - type: callout
    variant: note
    title: Names and setups vary
    md: |
      The routing option names above are from the out-of-the-box process in the Windchill 13.x course
      manual. A change notice also has a **Complexity** setting (Fast Track, Full Track or Basic), and
      configurations such as the PLM Foundation Pacesetter add a **Basic Track** for first releases.
      PTC expects these processes to be adapted to each company, so treat your company's change
      policy as the source of truth.

  - type: callout
    variant: pitfall
    md: |
      **Fast track as a way to dodge the board.** Splitting one big change into several "small" fast
      track changes, or calling a material change a "clarification", is a classic audit finding. If you
      need to argue that it's fast track, it probably isn't.

  - type: callout
    variant: pro-tip
    md: |
      Put your fast track rules on one page as a yes/no checklist (like the quick test above) and link
      it from your change templates. Fewer debates, faster decisions and cleaner audits.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: What do fast track and full track changes have in common in the out-of-the-box process?
        options:
          - Both need the change review board to meet
          - Both go through a change request, a change notice with tasks and a Change Admin III audit
          - Both skip the change request
          - Neither leaves a record
        answer: 1
        explanation: Both routes use the same change objects and end with an audit. Full track adds the CRB review of the request and the CIB review of the plan.
      - kind: multi
        prompt: Which changes should take the full track? (Choose all that apply.)
        options:
          - Changing the bracket material
          - Fixing a spelling mistake in a drawing note
          - A fix for a fold-lock that can open while riding
          - A new supplier for a machined part
        answers: [0, 2, 3]
        explanation: Material, safety and supplier changes have real impact and need the boards. A spelling fix with no effect on the part is a typical fast track candidate.
      - kind: truefalse
        prompt: A change to a small, cheap part can always use the fast track.
        answer: false
        explanation: Judge the impact, not the size. A tiny spring that keeps a scooter folded is safety-critical.
      - kind: single
        prompt: Where is the track chosen in the out-of-the-box process?
        options:
          - When the problem report is created
          - In the Analyze Change Request task, by Change Admin I
          - In the Audit Change Notice task
          - By the supplier
        answer: 1
        explanation: Change Admin I picks a routing option - Fast-Track Approval or a Full-Track review - while analysing the change request.
      - kind: truefalse
        prompt: In the out-of-the-box process, fast track means creating a change notice without a change request.
        answer: false
        explanation: Fast track still has a change request; it skips the two board reviews. Releasing data through a change notice without a change request is a separate option your administrator has to allow.

  - type: summary
    points:
      - Full track adds a CRB review of the change request and a CIB review of the change notice's plan.
      - Fast track uses the same change request, change notice, tasks and audit - just without the board reviews.
      - Change Admin I picks the route in the Analyze Change Request task; typically about 80% of changes are fast track.
      - Choose by impact - form, fit, function, safety, cost, suppliers and stock point to full track (general practice).
      - Route names and rules are configurable, so follow your company's change policy.
