id: m03-s01-check
subtitle: Cost of change, the four change objects and choosing the right track - prove you've got them.
version: 1.0.0
updated: "2026-10-05"
tags: [checkpoint, change-management]

blocks:
  - type: text
    md: |
      Ten questions on **Why change management matters**: why late and uncontrolled changes are so
      expensive, the order of Problem Report → Change Request → Change Notice → Change Tasks, and when
      to take the fast track or the full track. Score 80% to pass. The flashcards below go straight
      into your review deck.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: single
        prompt: Priya emails an updated bracket drawing straight to the supplier without a change in Windchill. What's the biggest risk?
        options:
          - The email might be too large
          - The supplier and the factory build different versions under the same part number
          - Windchill automatically rejects the supplier's parts
          - None - the fix was correct
        answer: 1
        explanation: The factory still trusts the Released drawing while the supplier follows the email. Two truths under one number lead to mixed stock, scrap and lost traceability - even if the fix itself was right.
      - kind: single
        prompt: By the rule of ten, a fix that would cost 1,000 during prototyping costs roughly how much once scooters are with customers?
        options: ["1,000", "10,000", "100,000", "It costs less because the design is mature"]
        answer: 2
        explanation: Prototype → production is about x10 (10,000), production → field another x10 (100,000). It's a rule of thumb, but it shows why catching problems early pays off.
      - kind: order
        prompt: Put the change objects in the order they're used on the full track.
        items: [Problem Report, Change Request, Change Notice, Change Task]
        explanation: Report what's wrong, decide whether to change it, plan how, then do the work in tasks that produce the resulting objects.
      - kind: single
        prompt: Which object carries the decision "should we make this change at all"?
        options: [Problem Report, Change Request, Change Notice, Change Task]
        answer: 1
        explanation: The Change Request holds the business case - fix, cost, stock and urgency - and the change board approves or rejects it. The PR only describes the problem; the CN plans an already-approved change.
      - kind: multi
        prompt: Which statements about change tasks are true? (Choose all that apply.)
        options:
          - They belong to a Change Notice
          - They are assigned to a person or role
          - They record the resulting objects - the new versions produced
          - They are where the change board votes
        answers: [0, 1, 2]
        explanation: Change tasks are the units of work inside a CN. The board decides on the Change Request, not on individual tasks.
      - kind: truefalse
        prompt: Every Problem Report must become a Change Request.
        answer: false
        explanation: Some PRs are duplicates, already fixed or not worth changing. Several PRs can also be grouped into one CR.
      - kind: single
        prompt: Sam reports that some fold-locks open while riding. The fix is a stronger latch spring that costs a few cents. Which track?
        options:
          - Fast track - the part is tiny and cheap
          - Full track - it's a safety issue
          - No change needed - just tell riders to check the lock
          - Email the new spring spec to the supplier
        answer: 1
        explanation: Judge by impact, not part size. Safety-related changes always go through the full process with evidence and a board decision.
      - kind: single
        prompt: Which change is the best fast track candidate?
        options:
          - Switching the bracket from steel to aluminium
          - Fixing a spelling mistake in a drawing title block
          - Moving the bracket to a new supplier
          - Changing a hole size that affects the hinge fit
        answer: 1
        explanation: A documentation-only fix with no effect on form, fit or function is the classic fast track case. The others change the part, its cost or its supplier.
      - kind: truefalse
        prompt: A fast track change skips the Change Notice and edits the released version directly.
        answer: false
        explanation: Fast track is shorter, not sloppier. It usually skips the separate Change Request and board, but still uses a Change Notice and produces a new traceable revision.
      - kind: multi
        prompt: You find odd brackets on the line. Which first moves are good change practice? (Choose all that apply.)
        options:
          - Set the suspect stock aside
          - Raise a Problem Report with measurements and photos
          - File the parts down so production keeps moving
          - Check the part's Changes tab for an existing open change
        answers: [0, 1, 3]
        explanation: Contain first, report with evidence and check whether a change is already under way. Reworking parts without a record creates yet another undocumented version.

  - type: flashcards
    title: Why change management matters deck
    cards:
      - front: "Rule of ten"
        back: "The same fix costs roughly ten times more in each later phase - design, prototype, production, field."
      - front: "Uncontrolled change"
        back: "Editing what others depend on without reporting, deciding or telling anyone. Leads to scrap, mixed stock and recalls."
      - front: "Change control"
        back: "Report, decide, plan and trace every change to released data."
      - front: "Problem Report (PR)"
        back: "What's wrong? The issue, evidence and affected objects."
      - front: "Change Request (CR)"
        back: "Should we change it? The business case the change board decides on."
      - front: "Change Notice (CN)"
        back: "How and when? The implementation plan, holding the change tasks."
      - front: "Change Task"
        back: "Who does what? One piece of work that produces resulting objects."
      - front: "Full track"
        back: "PR → CR → board decision → CN with tasks. For changes with real impact."
      - front: "Fast track"
        back: "A shorter route for low-risk changes, usually a CN without a separate CR. Setup depends on configuration."
      - front: "Quick test for full track"
        back: "Form, fit or function, interchangeability, safety, cost, suppliers or stock affected? Then full track."
