id: m03-s01-l01
subtitle: One "quick fix" by email can turn into a pile of scrap and a recall. Here's why companies control change.
version: 1.0.0
updated: "2026-10-05"
tags: [change-management, cost-of-change, rule-of-ten, recall, scrap]

blocks:
  - type: text
    md: |
      Picture this. Priya spots that the **SC-1048 fold-lock bracket** on the Scooter S2 is 1 mm too
      thin. She fixes the CAD, exports a PDF and emails it to the supplier. Done in ten minutes.
      Hero move, right?

      Not quite. The factory still builds from the **Released** drawing in Windchill. The supplier now
      makes the new one. Service has no idea anything changed. Three weeks later the warehouse has two
      kinds of bracket in the same bin, and nobody can tell which scooter got which.

      That's **uncontrolled change**. It feels fast. It's actually the most expensive way to change a
      product.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "changing stuff without telling everyone who depends on it" → *uncontrolled change*
      - "a fix costs more the later you find it" → *[[cost-of-change|cost of change]]* (the "rule of ten")
      - "an agreed, tracked way to change released data" → *[[change-control|change control]]* or change management
      - "parts you have to throw away" → *scrap*; "parts you fix after they're made" → *rework*
      - "calling products back from customers" → *recall* or *field campaign*

  - type: diagram
    title: The rule of ten
    caption: A rule of thumb, not a law of physics. Each later phase multiplies the cost of the same fix by roughly ten. Click a step.
    diagram:
      width: 800
      height: 380
      nodes:
        - id: concept
          label: Concept
          sublabel: "≈ 1x"
          x: 20
          y: 290
          w: 130
          tone: success
          detail: |
            The bracket is still a sketch. Changing the thickness costs a few minutes of thinking.
            Nothing exists yet that has to be thrown away.
          real: Acme example - a few minutes of Priya's time.
        - id: design
          label: Design (CAD)
          sublabel: "≈ 10x"
          x: 175
          y: 230
          w: 130
          tone: success
          detail: |
            The model and drawing exist. Now a change means editing CAD, updating the drawing and
            re-checking the parts around it, such as the [[part|part]] SC-1042 folding hinge it clamps.
          real: Acme example - a day or two of engineering.
        - id: proto
          label: Prototype & test
          sublabel: "≈ 100x"
          x: 330
          y: 170
          w: 140
          tone: warning
          detail: |
            Prototype brackets are made and tested. A change now means new samples, new tests and
            maybe a new test report. The schedule slips.
          real: Acme example - new samples plus another round of fatigue tests.
        - id: production
          label: Production
          sublabel: "≈ 1,000x"
          x: 495
          y: 110
          w: 140
          tone: danger
          detail: |
            Tooling is cut and thousands of brackets are on shelves. A change now means **scrap** or
            **rework**, tooling changes, new work instructions and sorting mixed stock.
          real: Acme example - 3,000 brackets in stock plus a modified stamping tool.
        - id: field
          label: In the field
          sublabel: "≈ 10,000x"
          x: 655
          y: 40
          w: 130
          tone: danger
          detail: |
            Scooters are in customers' hands. Now it's a **recall** or field campaign: finding every
            affected scooter, replacing parts, shipping, labour, legal reviews and brand damage.
          real: Acme example - thousands of scooters to trace and fix, plus angry reviews.
      edges:
        - { from: concept, to: design, label: x10 }
        - { from: design, to: proto, label: x10 }
        - { from: proto, to: production, label: x10 }
        - { from: production, to: field, label: x10 }

  - type: callout
    variant: why-it-matters
    md: |
      Most of a product's cost is locked in by early design decisions, but most of the money is
      **spent** later, in tooling, stock and service. A late change throws away work that was
      already paid for. That's why real companies don't let anyone change released data on a whim:
      every change has to be **reported, decided, planned and traced**. That system is change
      management, and Windchill runs it.

  - type: animation
    title: How one untracked edit spreads
    diagram:
      width: 820
      height: 340
      nodes:
        - { id: priya, label: Priya edits CAD, sublabel: "bracket now 4 mm", x: 20, y: 30, w: 170, tone: accent }
        - { id: wc, label: Windchill drawing, sublabel: "SC-1048.drw · B · Released", x: 20, y: 200, w: 190, tone: info, shape: doc }
        - { id: supplier, label: Supplier, sublabel: "makes 4 mm version", x: 300, y: 30, w: 170, tone: warning }
        - { id: factory, label: Acme factory, sublabel: "builds to rev B (3 mm)", x: 300, y: 200, w: 180, tone: warning }
        - { id: stock, label: Warehouse bin, sublabel: "3 mm + 4 mm mixed", x: 570, y: 110, w: 170, tone: danger, shape: cylinder }
        - { id: field, label: Scooters in the field, sublabel: "which one has which?", x: 570, y: 260, w: 220, tone: danger }
        - { id: cn, label: Change Notice, sublabel: "the controlled way", x: 300, y: 115, w: 180, tone: success, shape: pill }
      edges:
        - { from: priya, to: supplier, label: emailed PDF, dashed: true }
        - { from: wc, to: factory, label: Released data }
        - { from: supplier, to: stock }
        - { from: factory, to: stock }
        - { from: stock, to: field }
        - { from: priya, to: cn }
        - { from: cn, to: supplier }
        - { from: cn, to: factory }
    chapters:
      - title: A quick fix
        caption: Priya makes the bracket 1 mm thicker in CAD. She doesn't check anything into Windchill or raise a change. It's "just a small tweak".
        show: [priya, wc]
        highlight: [priya]
        flow: []
      - title: An email, not a change
        caption: She emails a PDF to the supplier. The supplier happily starts making the **4 mm** version. Nobody else is told.
        show: [priya, wc, supplier]
        highlight: [supplier]
        flow: [priya>supplier]
      - title: The factory trusts Windchill
        caption: The factory builds from the **Released** drawing, revision B. That's still **3 mm**. Two truths now exist at the same time.
        show: [priya, wc, supplier, factory]
        highlight: [factory, wc]
        flow: [wc>factory]
      - title: Mixed stock
        caption: Both versions land in the same bin with the same part number. Nobody can tell them apart without a caliper.
        show: [priya, wc, supplier, factory, stock]
        highlight: [stock]
        flow: [supplier>stock, factory>stock]
      - title: Problems reach customers
        caption: Some scooters get a bracket that doesn't match the hinge. The fold-lock rattles. Sam in field service sees complaints but can't tell **which** scooters are affected. Hello, recall.
        show: [priya, wc, supplier, factory, stock, field]
        highlight: [field]
        flow: [stock>field]
        seconds: 7
      - title: The controlled way
        caption: With a **Change Notice**, the drawing is revised to C, released, and the supplier and the factory switch together. Every scooter can be traced to a revision.
        highlight: [cn]
        flow: [priya>cn, cn>supplier, cn>factory]
        seconds: 7

  - type: example
    variant: case-study
    title: The bracket that cost a summer
    industry: Micromobility
    md: |
      This is the full (fictional) Acme story behind the animation.

      - **Week 0:** Priya's emailed fix reaches the supplier. No change object, no new revision.
      - **Week 3:** Ana in manufacturing notices some brackets need a hammer to fit the hinge. The
        line slows down while the team investigates.
      - **Week 5:** Leo in quality measures the stock. About **3,000** brackets are a mix of 3 mm
        and 4 mm. Sorting costs more than the parts, so they're **scrapped**.
      - **Week 8:** Sam logs fold-lock rattle complaints from customers. Because nobody knows which
        bracket went into which scooter, Acme has to inspect a whole production range, not just the
        bad ones.

      The fix itself was right. The **way** it was made was the problem. The same change through a
      Change Notice would have cost a couple of days of review.
    takeaway: The fix was cheap. Making it in secret was what cost the money.

  - type: comparison
    title: Uncontrolled vs controlled change
    columns: [Uncontrolled change, Controlled change]
    rows:
      - label: How it starts
        cells: ["An email or a quick word in the hallway", "A Problem Report or Change Request in Windchill"]
      - label: Who decides
        cells: ["Whoever happens to make the edit", "The right people, such as a change board"]
      - label: Who's told
        cells: ["Whoever is on the email", "Everyone downstream, through the process"]
      - label: New revision?
        cells: ["Often not - the same number means two different things", "Yes - the change produces a new revision"]
      - label: Traceability
        cells: ["Lost in inboxes", "Linked records: why, what, who and when"]
      - label: Real cost
        cells: [Scrap and rework and recalls, A few days of review up front]
    takeaway: Control feels slower on day one and is much faster by month three.

  - type: scenario
    variant: what-if
    title: Ana finds odd brackets on the line
    start: s1
    nodes:
      - id: s1
        md: |
          You're **Ana**, manufacturing engineer. On the line, some SC-1048 brackets are thicker than
          the Released drawing says. Production is waiting on you. What do you do first?
        choices:
          - label: Stop using the odd ones, set them aside and report the problem formally
            next: s2
            good: true
            feedback: You stop the damage spreading and start a traceable record. That's the move.
          - label: File the thick ones down so the line keeps moving
            next: fail1
            feedback: Now you have a third, undocumented version of the bracket.
          - label: Message Priya and ask her to email you the latest drawing
            next: partial1
            feedback: Faster than nothing, but it repeats the original mistake - a drawing by email.
      - id: s2
        md: |
          You raise a **Problem Report** against SC-1048 and attach your measurements. Leo from quality
          puts the bin on hold. The next question is who decides what happens now.
        choices:
          - label: Let the change process route it - a Change Request goes to the change board chaired by Maya
            next: win
            good: true
            feedback: Exactly. The board looks at cost, stock, supplier and safety before anyone edits released data.
          - label: Decide yourself and tell the supplier to go back to 3 mm
            next: partial2
            feedback: Maybe the 4 mm one is actually better. One person can't see the whole picture.
      - id: win
        md: |
          The board approves a change to the bracket. A Change Notice revises the drawing to **C**, the
          supplier and factory switch on the same date, and the 3,000 mixed parts are handled with a
          clear decision. Every scooter can be traced to a bracket revision.
        outcome: success
      - id: partial1
        md: |
          Priya sends a PDF. Now you have *her* truth, and Windchill still says revision B. The next
          shift uses the Released drawing again. You've patched today, not the system.
        outcome: partial
      - id: partial2
        md: |
          The supplier switches back, but engineering had a good reason for 4 mm. Two weeks later
          you're changing it again. Decisions about released data need the right people in the room.
        outcome: partial
      - id: fail1
        md: |
          Filed-down brackets have no drawing, no test and no record. If one cracks in the field, nobody
          can explain why. That's the worst kind of uncontrolled change.
        outcome: fail

  - type: walkthrough
    title: See what changes already touch a part
    who: Any user who can see the part
    where: ["<part> information page", Changes tab]
    steps:
      - title: Find the part
        where: [Search, "SC-1048"]
        md: Search by **number**, not name, and open the part's information page.
      - title: Open the change history
        where: ["<part> information page", Changes]
        md: |
          Open the **Changes** tab (in some setups it sits under a related-objects area). It lists the
          problem reports, change requests and change notices that involve this part.
      - title: Check for open changes
        where: [Changes tab, open items]
        md: Look for items that are still open. If someone is already changing the part, join that change instead of starting a parallel one.
    result: Before you touch a released part you know its change story, and whether a fix is already on the way.

  - type: callout
    variant: pitfall
    md: |
      **"It's just a small change."** Small changes to released data are the ones that skip review,
      and they still change what the factory, the supplier and service should do. Size of the edit is
      not the same as size of the impact.

  - type: callout
    variant: pro-tip
    md: |
      When you find a problem late, **contain first, fix second**: quarantine suspect stock, raise a
      Problem Report with evidence (photos, measurements, serial numbers), then let the process decide
      the fix. Evidence you capture on day one saves weeks of guessing later.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Using the rule of ten, a fix costs about 100 in design. Roughly what does the same fix cost once parts are in production?
        options: ["About 100", "About 1,000", "About 10,000", "Nothing - production can absorb it"]
        answer: 2
        explanation: Design → prototype is x10 (1,000), prototype → production is another x10 (10,000). It's a rule of thumb, but the direction is always the same - later costs more.
      - kind: multi
        prompt: Which of these are typical costs of an uncontrolled change? (Choose all that apply.)
        options: [Scrapped or reworked stock, Mixed versions under one part number, Lost traceability for field issues, Faster approvals for future changes]
        answers: [0, 1, 2]
        explanation: Uncontrolled change creates scrap, mixed stock and lost traceability. It doesn't make anything faster later - it makes every investigation slower.
      - kind: truefalse
        prompt: In the Acme story, the bracket fix itself was wrong.
        answer: false
        explanation: The 4 mm bracket may well have been better. The damage came from making the change outside the process, so nobody else knew.

  - type: summary
    points:
      - Uncontrolled change means editing what others depend on without telling or asking them.
      - The rule of ten - a fix costs roughly ten times more in each later phase, up to recalls in the field.
      - Late changes waste paid-for work - scrap, rework, tooling, sorting and service.
      - Change control routes every change to released data through report, decide, plan and trace.
      - Found a problem late? Contain first, report with evidence, then let the process decide.
