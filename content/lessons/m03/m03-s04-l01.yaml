id: m03-s04-l01
subtitle: One engine says where an object is. The other moves people. Learn to tell them apart.
version: 1.0.0
updated: "2026-10-05"
tags: [lifecycle, workflow, life-cycle-template, workflow-template, process]

blocks:
  - type: text
    md: |
      Think of a train trip. The **stations** are fixed: In Work, Under Review, Released. The
      **timetable and the crew** decide who checks tickets, who waves the flag and when the train
      leaves each station.

      Windchill runs change on the same two engines:

      - The **life cycle** is the line of stations. It says *where* an object is right now and
        where it is allowed to go next.
      - The **workflow** is the crew and the timetable. It sends tasks to real people, waits for
        their answers and then does things, like moving the object to the next station.

      When the fold-lock bracket **SC-1048** gets stuck, the first question a pro asks is: *is this
      a life cycle thing or a workflow thing?* By the end of this lesson, you'll ask it too.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the list of stations and the tracks between them" → *[[life-cycle-template|life cycle template]]* (states + transitions)
      - "the station an object is at" → *[[lifecycle-state|life cycle state]]*
      - "the recipe for a process" → *[[workflow-template|workflow template]]*
      - "one running copy of that recipe" → *process* (a workflow process instance)
      - "a box in the recipe, like Review or Approve" → *[[workflow-activity|activity]]*
      - "a to-do that lands in your inbox" → *[[task]]*, technically a *[[work-item|work item]]*
      - "an automatic step nobody clicks" → *robot* (for example a set state robot)

  - type: diagram
    title: Two engines, one change
    caption: The workflow (top) does the work. The life cycle (bottom) records where the object stands. Click any box.
    diagram:
      width: 800
      height: 400
      groups:
        - { label: Workflow - the crew, x: 10, y: 10, w: 780, h: 170, tone: info }
        - { label: Life cycle - the stations, x: 10, y: 230, w: 780, h: 160, tone: neutral }
      nodes:
        - id: start
          label: Start
          sublabel: process begins
          x: 30
          y: 70
          w: 120
          tone: neutral
          shape: pill
          detail: |
            A process starts when something kicks it off, for example submitting a promotion
            request or a change notice. Windchill makes a fresh running copy of the
            **workflow template**.
        - id: review
          label: Review
          sublabel: activity → task
          x: 180
          y: 70
          w: 150
          tone: accent
          detail: |
            An **assigned activity**. Windchill creates a **work item** for each person in the
            role, for example Kai as reviewer. The process waits here until they finish.
          real: Most "why is nothing happening?" questions end at an activity like this one, waiting on a person.
        - id: vote
          label: Approve?
          sublabel: routing decision
          x: 360
          y: 70
          w: 150
          tone: warning
          shape: pill
          detail: |
            The reviewer's choice (Approve or Reject) **routes** the process down one path or
            another. You'll dig into voting in a later lesson.
        - id: robot
          label: Set state robot
          sublabel: automatic
          x: 540
          y: 70
          w: 160
          tone: primary
          detail: |
            A **robot** is an automatic activity. This one tells the life cycle engine to move the
            objects to Released. No human clicks it.
        - id: inwork
          label: In Work
          sublabel: state
          x: 60
          y: 290
          w: 150
          tone: neutral
          detail: The first state. Authors can edit here. Access rules are usually loosest in this state.
        - id: underreview
          label: Under Review
          sublabel: state
          x: 320
          y: 290
          w: 150
          tone: warning
          detail: |
            A "frozen while we look" state. Many companies lock editing here. The workflow often
            sets this state at the start of a review.
        - id: released
          label: Released
          sublabel: state
          x: 580
          y: 290
          w: 150
          tone: success
          detail: The trusted state. Manufacturing, buying and service work from here.
          real: In most setups only a workflow robot or an admin can put something into Released.
      edges:
        - { from: start, to: review }
        - { from: review, to: vote }
        - { from: vote, to: robot, label: approve }
        - { from: vote, to: review, label: reject, dashed: true }
        - { from: inwork, to: underreview, label: promote }
        - { from: underreview, to: released, label: promote }
        - { from: underreview, to: inwork, label: demote, dashed: true }
        - { from: start, to: underreview, dashed: true, label: sets }
        - { from: robot, to: released, dashed: true, label: sets }

  - type: animation
    title: The bracket's trip to Released
    diagram:
      width: 800
      height: 320
      nodes:
        - { id: priya, label: Priya, sublabel: submits PROM-0452, x: 20, y: 30, w: 160, tone: primary, shape: pill }
        - { id: proc, label: Process starts, sublabel: from the template, x: 220, y: 30, w: 160, tone: info }
        - { id: task, label: "Kai's task", sublabel: review + vote, x: 420, y: 30, w: 160, tone: accent }
        - { id: robot, label: Set state robot, sublabel: automatic, x: 620, y: 30, w: 160, tone: primary }
        - { id: s1, label: In Work, sublabel: "SC-1048 A.3", x: 20, y: 210, w: 160, tone: neutral }
        - { id: s2, label: Under Review, sublabel: locked, x: 320, y: 210, w: 160, tone: warning }
        - { id: s3, label: Released, sublabel: trusted, x: 620, y: 210, w: 160, tone: success }
      edges:
        - { from: priya, to: proc }
        - { from: proc, to: task }
        - { from: task, to: robot, label: approve }
        - { from: s1, to: s2 }
        - { from: s2, to: s3 }
        - { from: proc, to: s2, dashed: true }
        - { from: robot, to: s3, dashed: true }
    chapters:
      - title: Sitting at the first station
        caption: The fold-lock bracket **SC-1048 A.3** is **In Work**. That's the life cycle talking. No process is running yet.
        show: [s1]
        highlight: [s1]
      - title: Priya presses go
        caption: Priya submits promotion request **PROM-0452**. Windchill copies the **workflow template** into a fresh running **process**.
        show: [s1, priya, proc]
        highlight: [proc]
        flow: [priya>proc]
      - title: The workflow moves the object
        caption: First thing the process does is ask the life cycle to set the bracket to **Under Review**. Now nobody can sneak in an edit.
        show: [s1, s2, priya, proc]
        highlight: [s2]
        flow: [proc>s2, s1>s2]
      - title: A human decides
        caption: Kai gets a **task** in his inbox. The process **waits**. It can wait for minutes or for weeks, which is why stuck tasks matter.
        show: [s1, s2, priya, proc, task]
        highlight: [task]
        flow: [proc>task]
      - title: The robot finishes the job
        caption: Kai approves. A **set state robot** asks the life cycle to move the bracket to **Released**. Two engines, one result.
        highlight: [robot, s3]
        flow: [task>robot, robot>s3, s2>s3]
        seconds: 8

  - type: comparison
    title: Life cycle vs workflow
    columns: [Life cycle, Workflow]
    rows:
      - label: Question it answers
        cells: ["Where is this object now?", "Who has to do what next?"]
      - label: Made of
        cells: ["States, transitions (promote, demote, revise) and phases", "Activities, robots, connectors and links between them"]
      - label: Lives on
        cells: [Every versioned object such as parts and documents, "A process, usually started by a change object or promotion request"]
      - label: Time
        cells: [Always there - every version has a state, "Runs for a while, then completes or is terminated"]
      - label: Controls
        cells: ["What you may do at each state, often including who can edit", "Who gets tasks, how votes route, what happens automatically"]
      - label: Admin builds it in
        cells: [Life cycle template administration, Workflow template administration]
      - label: Acme example
        cells: ["SC-1048 A.3 is Under Review", "Kai has an open review task on PROM-0452"]
    takeaway: The life cycle is a noun - a place. The workflow is a verb - the work of getting there.

  - type: callout
    variant: why-it-matters
    md: |
      Auditors, customers and regulators ask two kinds of questions. "Was this part released?" is a
      **life cycle** question. "Who approved it, and did the right people review it?" is a
      **workflow** question. Companies need both answers, and they need them for every change, years
      later. When you know which engine owns which answer, you find evidence fast and you send
      problems to the right person.

  - type: example
    variant: real-world
    title: "\"It won't let me edit!\""
    industry: Micromobility
    md: |
      Ana, Acme's manufacturing engineer, tried to fix a typo on the routing note for SC-1048. The
      edit action was greyed out. She pinged Kai: "Is the workflow broken?"

      Kai checked: the bracket was **Under Review**. That state's access rules block edits for
      everyone except admins. Nothing was broken. The *life cycle* was doing its job while the
      *workflow* waited for Leo's quality review. Ana added a comment to Leo's review instead, and
      the fix went into the next iteration after the review sent it back to In Work.
    takeaway: Greyed-out edit buttons are usually a state thing. Silent waiting is usually a workflow thing.

  - type: walkthrough
    title: See both engines on one object
    who: Any user who can read the object
    steps:
      - title: Open the object
        where: [Search, "SC-1048", information page]
        md: Search for the bracket and open its **information page**. The header and the attributes show its current **state**.
      - title: Check the life cycle history
        where: ["<object> information page", History]
        md: |
          Look at the history for the object. Many setups show a life cycle history listing every
          state change, when it happened and who or what did it. A state set "by the system" is
          usually a workflow robot at work.
      - title: Find the related process
        where: ["<change object> information page", Processes or Process History]
        md: |
          Open the promotion request or change object that is moving the bracket. Look for an area
          that lists **processes** or routing history. It shows which activities are done, which
          are open and who holds them. Names of this area differ between releases and setups.
      - title: Open the graphical view
        where: ["<process>", Process Manager or View Process]
        md: If you have access, open the process in the **[[process-manager|Process Manager]]** view. It draws the workflow and colours the activity that is running now.
    result: You can say where the object is (state) and what it is waiting for (open activity and owner).

  - type: callout
    variant: note
    md: |
      Who wires the two together? An administrator. The life cycle template can name which
      workflow runs for a phase or a state, and change objects get their own workflow templates. In
      most companies object initialization rules decide which life cycle a new object gets. You
      don't need to build any of this as a user. You just need to read it.

  - type: callout
    variant: pitfall
    md: |
      **Blaming the workflow for a state problem (and the other way round).** Calling the admin
      because "Windchill won't let me edit" wastes a day if the object is simply Under Review. And
      demanding someone "fix the state" doesn't help when the real issue is a task sitting in a
      colleague's inbox. Check the state first, then the process.

  - type: callout
    variant: pro-tip
    md: |
      Use the one-line test. *Is it about where?* Life cycle. *Is it about who or when?* Workflow.
      Write the answer in your support ticket - admins love it.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: You can't edit SC-1048 because it is **Under Review**. Which engine is stopping you?
        options: [The workflow, The life cycle (state-based access rules), The vault, Your workspace]
        answer: 1
        explanation: Access to edit is usually tied to the state. Under Review locks editing in many setups. The workflow may have set that state, but the block itself comes from the life cycle and its access rules.
      - kind: single
        prompt: "Which one decides that Kai, not Priya, gets the approval task?"
        options: [The life cycle template, The workflow (its activity and role assignment), The object's revision, The folder]
        answer: 1
        explanation: Workflows assign activities to roles or people. The life cycle knows nothing about who must review.
      - kind: multi
        prompt: Which belong to a **workflow template**? (Choose all that apply.)
        options: [Activities, Robots, States such as Released, Links and connectors]
        answers: [0, 1, 3]
        explanation: States belong to the life cycle template. A workflow is made of activities, robots, connectors and the links that join them.
      - kind: truefalse
        prompt: Every versioned part has a life cycle state, even when no workflow is running on it.
        answer: true
        explanation: State is always there. Workflows come and go - they start, run and complete.

  - type: summary
    points:
      - The life cycle is the stations - states and allowed transitions. It answers "where is it?"
      - The workflow is the crew - activities, tasks, robots and routing. It answers "who does what next?"
      - Workflows often move objects through states using set state robots.
      - Can't edit? Check the state. Nothing happening? Check the process and its open task.
