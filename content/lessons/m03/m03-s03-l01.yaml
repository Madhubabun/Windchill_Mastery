id: m03-s03-l01
subtitle: "A brand-new design is ready. A promotion request gets it reviewed, approved and Released in one move."
version: 1.1.0
updated: "2026-10-14"
tags: [promotion-request, lifecycle-state, review, approval, release]
sources:
  - id: te
    where: "Module 6: Windchill's change and promotion processes: overview; Promotion process: overview (Promotion Request Approval and Review processes); Create a promotion request; Activity: Create and approve a promotion request (Home page My Tasks, task Promotion Objects and Details tabs, Task Completion, History tab, Process tab)"
  - id: ac
    where: "Module 5: Identify life cycle transition types (Lock); Compare promotion requests to change management objects; Identify OOTB promotion request settings; Describe the Promotion Request Approval process; Manage promotion preferences (Automatic Revision Mode)"
  - id: hc-create-promotion-request
    label: PTC Help Center supplement
    title: "Create a Promotion Request"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/promotionrequest/ProdMatPromoReqCreate.html"
    covers: "Wizard steps (Set Attributes, Select Promotion Objects, Select Participants); Need By date; Collect Objects and Add Promotion Objects toolbar actions; Target Promotion State; set object for promotion; Promotion Comments column"

blocks:
  - type: text
    md: |
      Priya just finished something new: a **phone mount** that clips onto the Scooter S2
      handlebar. Three parts, one CAD assembly, one drawing. All of it sits at **In Work**.

      Nothing is broken. Nothing old is being changed. She just needs the team to say
      "yep, this is good" so the factory and suppliers can use it. She doesn't want to
      email five people and hope they reply.

      So she bundles everything into **one request**, picks where it should end up
      (**Released**) and sends it to the right reviewers. When they approve, every object
      in the bundle moves together. That request is a **[[promotion-request|promotion request]]**.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a bundle of stuff asking to level up" → *[[promotion-request]]* (Acme's example: PROM-0310)
      - "where the stuff should end up" → *[[promotion-target-state]]*, picked from the *Target Promotion State* list
      - "each item in the bundle" → *[[promotion-candidate]]*, listed in the *Promotion Objects* table
      - "people who look and comment" → *reviewers*, who get a *[[review-task]]*
      - "people who say yes or no" → *approvers*, who get an *[[approval-task]]*
      - "the steps the request goes through" → its *[[workflow]]*, for example the *Promotion Request Approval Process*

  - type: animation
    title: "PROM-0310: the phone mount levels up"
    diagram:
      width: 800
      height: 330
      groups:
        - { label: The bundle, x: 10, y: 10, w: 230, h: 310, tone: info }
        - { label: The promotion process, x: 260, y: 10, w: 530, h: 310, tone: neutral }
      nodes:
        - { id: asm, label: SC-3500 assembly, sublabel: Phone mount A.3, x: 30, y: 45, w: 190, tone: neutral }
        - { id: brk, label: SC-3510 bracket, sublabel: A.2 In Work, x: 30, y: 125, w: 190, tone: neutral }
        - { id: drw, label: SC-3500.drw, sublabel: drawing A.2, x: 30, y: 205, w: 190, tone: neutral, shape: doc }
        - { id: prom, label: PROM-0310, sublabel: "target: Released", x: 290, y: 125, w: 160, tone: primary, shape: pill }
        - { id: rev, label: Review, sublabel: Ana + Leo comment, x: 480, y: 45, w: 140, tone: info }
        - { id: appr, label: Approve, sublabel: Kai votes, x: 640, y: 125, w: 130, tone: warning }
        - { id: rel, label: Released, sublabel: all 3 together, x: 480, y: 235, w: 150, tone: success, shape: pill }
      edges:
        - { from: asm, to: prom }
        - { from: brk, to: prom }
        - { from: drw, to: prom }
        - { from: prom, to: rev }
        - { from: prom, to: appr }
        - { from: appr, to: rel }
        - { from: appr, to: prom, label: rejected, dashed: true }
    chapters:
      - title: Work is done
        caption: Priya's phone mount is checked in. The **assembly**, the **bracket** and the **drawing** are all **In Work**. Nobody downstream can trust them yet.
        show: [asm, brk, drw]
        highlight: [asm, brk, drw]
      - title: Bundle it up
        caption: She creates **PROM-0310**, adds the three objects as **promotion candidates** and sets the **target state** to **Released**. One request, one decision.
        show: [asm, brk, drw, prom]
        highlight: [prom]
        flow: [asm>prom, brk>prom, drw>prom]
      - title: Lock and review
        caption: The request is submitted. Acme's life cycle has a **Lock** transition, so the candidates sit in **Under Review** while the request runs. **Ana** (manufacturing) and **Leo** (quality) get **review tasks** and add comments.
        show: [asm, brk, drw, prom, rev]
        highlight: [rev]
        flow: [prom>rev]
        seconds: 7
      - title: The vote
        caption: At the same time, Kai, the engineering lead, gets an **approval task**. Reviews and approvals run in parallel, so he can read comments as they arrive before he votes **Approve**.
        show: [asm, brk, drw, prom, rev, appr]
        highlight: [appr]
        flow: [prom>appr]
      - title: Everything moves together
        caption: All approvers said yes, so **every** candidate is promoted to **Released**. If any approver had rejected, the objects would stay in, or go back to, their original state (In Work) instead.
        highlight: [rel, asm, brk, drw]
        flow: [appr>rel]
        seconds: 7

  - type: callout
    variant: why-it-matters
    md: |
      Without a promotion request, "release" means one person flipping states by hand, with
      no proof anyone looked. Auditors hate that. With one, you get a record of **what** was
      released (exact versions), **who** reviewed it, **who** approved it and **when**. That's
      the evidence a quality audit or a customer complaint will ask for months later.

  - type: example
    variant: real-world
    title: The supplier who got the wrong drawing
    industry: Micromobility
    md: |
      Before Acme used promotion requests, an engineer released the SC-3510 bracket part by
      hand but forgot its drawing. The drawing stayed **In Work**. Purchasing sent the supplier
      the "latest" drawing anyway, which had an unfinished hole pattern on it. 500 brackets
      came back wrong.

      Now the rule is simple: **part, CAD model and drawing travel in the same promotion
      request.** The promotion request wizard has a **Collect Objects** action to gather related
      objects, such as the drawing for a part, so nothing gets left behind.
    takeaway: Release things that belong together, together.

  - type: walkthrough
    title: Create a promotion request
    who: The person who owns the work (for example a design engineer)
    where: ["<object> information page", Actions, New, New Promotion Request]
    steps:
      - title: Start from your objects
        where: ["<folder, object or search results>", Actions, New, New Promotion Request]
        md: |
          Start from the **Folder Contents** table, an object's **information page** or the
          **Search Results** table: select the objects, then choose **Actions → New → New Promotion
          Request**. The objects you select go into the promotion baseline that reviewers and
          approvers look at. Promotion requests can only be created in product and library contexts.
      - title: Describe it
        where: [Set Attributes, Name and Description]
        md: |
          The name is filled in from the first object - change it to something clear. Then say what
          this is, why it's ready and what reviewers should focus on. "Phone mount v1 for S2. Check the
          clamp torque note on sheet 2." beats "Please release." You can also set a **Need By** date.
      - title: Pick the target state and the objects
        where: [Select Promotion Objects, Target Promotion State]
        md: |
          Choose the **Target Promotion State**, for example **Released**. The list only offers the
          states your life cycle's **Promote** transitions allow. Use **Collect Objects** or **Add
          Promotion Objects** to pull in the drawing and CAD model that belong with your part. Then
          select the rows to promote and click **set object for promotion** - every request needs at
          least one object set for promotion.
      - title: Choose the process and people
        where: [Select Participants, Process]
        md: |
          Pick the process. The **Promotion Request Approval Process** (often the default) uses
          Approver and Reviewer roles; the **Promotion Request Review Process** uses Reviewers only.
          The participant lists are pre-filled from the **Promotion Approvers** and **Promotion
          Reviewers** roles of the product team. Click **Finish**.
    result: |
      You get a new promotion request (Acme's example: PROM-0310). Reviewers and approvers find their
      tasks in the **My Tasks** table on their Home page. Later, the object's **History** tab links to
      the promotion request, and its **Process** tab shows the members, the task history and the
      process status.

  - type: text
    md: |
      ### What reviewers actually see

      When Ana opens her task from **My Tasks**, she doesn't get a random email. She gets a task page
      tied to the **promotion request itself**:

      - a **Promotion Objects** tab listing the objects, their exact versions (like SC-3510 A.2) and
        the state they move from and to
      - a **Details** tab with the request's name and description (this is why a good description
        matters) and a **Process Status** table showing the other tasks of the process
      - links to open each object's information page
      - a **Task Completion** section with a **Comments** box and the **Complete Task** button;
        approvers also vote **Approve** or **Reject**

  - type: callout
    variant: pitfall
    md: |
      **Checking in after you submit.** The request points at the exact versions you added.
      If you sneak in "one tiny fix" later (when your setup even allows it), reviewers may be
      approving a version that isn't the one you meant. Finish the work first. Then promote.

  - type: callout
    variant: pro-tip
    md: |
      Before you click **Finish**, open the drawing and the model yourself in Creo View and
      look at them like a reviewer would. Catching your own typo takes one minute. A rejection
      round trip takes a day.

  - type: callout
    variant: note
    md: |
      Windchill ships **two** promotion processes: *Approval* (approvers must all approve) and
      *Review* (objects are promoted right away and reviewers only comment). Administrators often
      copy and adapt them, and can offer a different process per target state.

      One more thing from the course manual: promotion requests are **mostly used for releasing
      non-engineering data**, while engineering data (parts, CAD, engineering documents) is usually
      released through the change process. Acme's configuration lets engineers promote brand-new
      designs like the phone mount; many companies use a change notice instead. The next lesson
      shows how to choose.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: What does a promotion request change on its objects when it's approved?
        options: [Their revision letter, Their lifecycle state, Their number, Their folder]
        answer: 1
        explanation: Promotion moves objects to the target state, like In Work → Released. It doesn't renumber anything, and it only revises objects if an admin has turned on the Automatic Revision Mode preference.
      - kind: multi
        prompt: Which of these does a reviewer see on the promotion request? (Choose all that apply.)
        options:
          - The target state
          - The exact versions being promoted
          - The description written by the requester
          - A private chat log between the approvers
        answers: [0, 1, 2]
        explanation: The task shows the promotion objects with their versions and states, plus the request's details. There's no hidden approver chat - comments go on the tasks.
      - kind: order
        prompt: Put these steps for creating a promotion request in order.
        items:
          - Select the objects and choose New Promotion Request
          - Name and describe the request
          - Pick the target state and set the objects for promotion
          - Choose the process and participants, then Finish
        explanation: That's the wizard order - attributes, promotion objects with the target state, then participants. Reviewers and approvers then work their tasks in parallel.
      - kind: truefalse
        prompt: In the Promotion Request Approval Process, if one approver rejects, the objects are Released anyway but flagged with a warning.
        answer: false
        explanation: Any rejection ends the process in a rejection. The objects stay in, or return to, their original state, such as In Work.

  - type: summary
    points:
      - A promotion request bundles objects and asks to move them to one target state.
      - Reviewers comment; approvers vote. When all approvers approve, every candidate moves together.
      - Create it with Actions → New → New Promotion Request; collect related objects.
      - Write a description that tells reviewers what to check.
      - Out of the box there are two processes (Approval and Review); target states come from the life cycle.
