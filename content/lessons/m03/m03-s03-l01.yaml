id: m03-s03-l01
subtitle: "A brand-new design is ready. A promotion request gets it reviewed, approved and Released in one move."
version: 1.0.0
updated: "2026-10-05"
tags: [promotion-request, lifecycle-state, review, approval, release]

blocks:
  - type: text
    md: |
      Priya just finished something new: a **phone mount** that clips onto the Scooter S2
      handlebar. Three parts, one CAD assembly, one drawing. All of it sits at **In Work**.

      Nothing is broken. Nothing old is being changed. She just needs the team to say
      "yep, this is good" so the factory and suppliers can use it. She doesn't want to
      email five people and hope they reply.

      So she bundles everything into **one request**, picks where it should end up
      (**Released**) and sends it to the right reviewers. When they approve, every object
      in the bundle moves together. That request is a **[[promotion-request|promotion request]]**.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a bundle of stuff asking to level up" → *[[promotion-request]]* (numbered like PROM-0310)
      - "where the stuff should end up" → *[[promotion-target-state]]* (for example Released)
      - "each item in the bundle" → *[[promotion-candidate]]* (often shown as *promotion objects*)
      - "people who look and comment" → *reviewers*, who get a *[[review-task]]*
      - "people who say yes or no" → *approvers*, who get an *[[approval-task]]*
      - "the steps the request goes through" → its *[[workflow]]* (the promotion process)

  - type: animation
    title: "PROM-0310: the phone mount levels up"
    diagram:
      width: 800
      height: 330
      groups:
        - { label: The bundle, x: 10, y: 10, w: 230, h: 310, tone: info }
        - { label: The promotion process, x: 260, y: 10, w: 530, h: 310, tone: neutral }
      nodes:
        - { id: asm, label: SC-3500 assembly, sublabel: Phone mount A.3, x: 30, y: 45, w: 190, tone: neutral }
        - { id: brk, label: SC-3510 bracket, sublabel: A.2 In Work, x: 30, y: 125, w: 190, tone: neutral }
        - { id: drw, label: SC-3500.drw, sublabel: drawing A.2, x: 30, y: 205, w: 190, tone: neutral, shape: doc }
        - { id: prom, label: PROM-0310, sublabel: "target: Released", x: 290, y: 125, w: 160, tone: primary, shape: pill }
        - { id: rev, label: Review, sublabel: Ana + Leo comment, x: 480, y: 45, w: 140, tone: info }
        - { id: appr, label: Approve, sublabel: Kai votes, x: 640, y: 125, w: 130, tone: warning }
        - { id: rel, label: Released, sublabel: all 3 together, x: 480, y: 235, w: 150, tone: success, shape: pill }
      edges:
        - { from: asm, to: prom }
        - { from: brk, to: prom }
        - { from: drw, to: prom }
        - { from: prom, to: rev }
        - { from: rev, to: appr }
        - { from: appr, to: rel }
        - { from: appr, to: prom, label: rejected, dashed: true }
    chapters:
      - title: Work is done
        caption: Priya's phone mount is checked in. The **assembly**, the **bracket** and the **drawing** are all **In Work**. Nobody downstream can trust them yet.
        show: [asm, brk, drw]
        highlight: [asm, brk, drw]
      - title: Bundle it up
        caption: She creates **PROM-0310**, adds the three objects as **promotion candidates** and sets the **target state** to **Released**. One request, one decision.
        show: [asm, brk, drw, prom]
        highlight: [prom]
        flow: [asm>prom, brk>prom, drw>prom]
      - title: Lock and review
        caption: The request is submitted. In many setups the candidates move to **Under Review** and get locked, so nobody sneaks in a change. **Ana** (manufacturing) and **Leo** (quality) get **review tasks** and add comments.
        show: [asm, brk, drw, prom, rev]
        highlight: [rev]
        flow: [prom>rev]
        seconds: 7
      - title: The vote
        caption: Kai, the engineering lead, gets an **approval task**. He reads the comments, opens the drawing in Creo View and votes **Approve**.
        show: [asm, brk, drw, prom, rev, appr]
        highlight: [appr]
        flow: [rev>appr]
      - title: Everything moves together
        caption: Approved! Windchill sets **every** candidate to **Released** at once. If Kai had voted **Reject**, the objects would go back to In Work for fixes instead.
        highlight: [rel, asm, brk, drw]
        flow: [appr>rel]
        seconds: 7

  - type: callout
    variant: why-it-matters
    md: |
      Without a promotion request, "release" means one person flipping states by hand, with
      no proof anyone looked. Auditors hate that. With one, you get a record of **what** was
      released (exact versions), **who** reviewed it, **who** approved it and **when**. That's
      the evidence a quality audit or a customer complaint will ask for months later.

  - type: example
    variant: real-world
    title: The supplier who got the wrong drawing
    industry: Micromobility
    md: |
      Before Acme used promotion requests, an engineer released the SC-3510 bracket part by
      hand but forgot its drawing. The drawing stayed **In Work**. Purchasing sent the supplier
      the "latest" drawing anyway, which had an unfinished hole pattern on it. 500 brackets
      came back wrong.

      Now the rule is simple: **part, CAD model and drawing travel in the same promotion
      request.** Windchill can help you collect the related objects so nothing gets left
      behind.
    takeaway: Release things that belong together, together.

  - type: walkthrough
    title: Create a promotion request
    who: The person who owns the work (for example a design engineer)
    where: ["<object> information page", Actions menu, New Promotion Request]
    steps:
      - title: Start from your objects
        where: ["<folder or object> page", Actions menu, New Promotion Request]
        md: |
          Select the objects in a folder table (or open one object's information page) and
          choose **New Promotion Request** from the **Actions** menu. You can usually also
          start one from a workspace or a search result. The exact place depends on your
          release and setup.
      - title: Pick the target state
        where: [Promotion request wizard, Target state]
        md: |
          Choose where the objects should end up, for example **Released**. The list only
          offers states your company's life cycle allows the objects to be promoted to. If
          the state you want isn't there, that's a configuration question, not a bug.
      - title: Add and collect objects
        where: [Promotion request wizard, Promotion objects]
        md: |
          Check the list of candidates. Use the collect option to pull in related objects,
          such as the drawing and the CAD model that belong with your part. Windchill flags
          anything that can't be promoted, for example something still checked out or already
          in a different state. Fix it or remove it.
      - title: Describe it
        where: [Promotion request wizard, Details]
        md: |
          Give it a clear name and description: what this is, why it's ready and what reviewers
          should focus on. "Phone mount v1 for S2. Check the clamp torque note on sheet 2." beats
          "Please release."
      - title: Choose the process and people
        where: [Promotion request wizard, Process or participants step]
        md: |
          Depending on configuration you pick a process (for example review then approval) and
          the **reviewers** and **approvers**. Some companies fill these in automatically from
          team roles. Then click **Finish** to submit.
    result: |
      You get a new promotion request (for example PROM-0310). Reviewers and approvers see new
      tasks under **Home → Tasks / My Tasks**, and you can follow its progress from the
      promotion request's information page.

  - type: text
    md: |
      ### What reviewers actually see

      When Ana opens her task, she doesn't get a random email. She gets the **promotion request
      itself**:

      - the **name and description** you wrote (this is why a good description matters)
      - the **target state** - so she knows "this is about to be Released"
      - the **list of promotion objects** with their exact versions, like SC-3510 A.2
      - links to open each object, view it in Creo View and see its history
      - a **comments** box, and for approvers, the **vote** (Approve or Reject)
      - the process status, so she sees who else has already responded

  - type: callout
    variant: pitfall
    md: |
      **Checking in after you submit.** The request points at the exact versions you added.
      If you sneak in "one tiny fix" later (when your setup even allows it), reviewers may be
      approving a version that isn't the one you meant. Finish the work first. Then promote.

  - type: callout
    variant: pro-tip
    md: |
      Before you click **Finish**, open the drawing and the model yourself in Creo View and
      look at them like a reviewer would. Catching your own typo takes one minute. A rejection
      round trip takes a day.

  - type: callout
    variant: note
    md: |
      Promotion processes, available target states and who must approve are all **set by your
      company's configuration**. Some companies have a review step plus an approval step, some
      only approval, some different processes per target state.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: What does a promotion request change on its objects when it's approved?
        options: [Their revision letter, Their lifecycle state, Their number, Their folder]
        answer: 1
        explanation: Promotion moves objects to the target state, like In Work → Released. It does not create a new revision or renumber anything.
      - kind: multi
        prompt: Which of these does a reviewer see on the promotion request? (Choose all that apply.)
        options:
          - The target state
          - The exact versions being promoted
          - The description written by the requester
          - A private chat log between the approvers
        answers: [0, 1, 2]
        explanation: The request shows its target state, the list of promotion objects with versions and the description. There's no hidden approver chat - comments are on the tasks and request.
      - kind: order
        prompt: Put these promotion steps in order.
        items:
          - Finish the design work and check in
          - Create the promotion request and set the target state
          - Reviewers comment on their tasks
          - Approver votes
          - Objects move to the target state
        explanation: Work first, then bundle and submit, then review, then the vote. Only an approval moves the objects.
      - kind: truefalse
        prompt: If the approver rejects the request, the objects are Released anyway but flagged with a warning.
        answer: false
        explanation: A rejection stops the promotion. In typical setups the objects go back to their earlier state (like In Work) so the owner can fix them.

  - type: summary
    points:
      - A promotion request bundles objects and asks to move them to one target state.
      - Reviewers comment; approvers vote. Approval moves every candidate together.
      - Create it from the Actions menu with New Promotion Request; collect related objects.
      - Write a description that tells reviewers what to check.
      - Processes, target states and approvers depend on your company's configuration.
