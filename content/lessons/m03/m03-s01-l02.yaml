id: m03-s01-l02
subtitle: "Five steps, five decisions: from \"is this a real problem?\" to \"is it ready to release?\""
version: 1.1.0
updated: "2026-10-13"
tags: [change-management, problem-report, change-request, change-notice, change-task, change-review-board, audit]
sources:
  - id: te
    where: "Module 6: Value of the change management process; OOTB change management process: steps; Identify roles in the change management process; Change management process: Identify Need, Investigate Need, Change Planning, Change Implementation, Review and Audit Change; Activity: Create a problem report"
  - id: pf
    where: "Module 4: The change process (Basic, Fast and Full Track); Activity: Use the Basic Track change process to initially release a business object"
  - id: trn-cm-itc
    where: "Intro to the change process: closed loop change process overview and diagram (used only where the 13.x course manual agrees)"

blocks:
  - type: text
    md: |
      A good change process is like a relay race with **five legs**. Each runner makes **one
      decision**, then hands the baton on:

      1. **Is this a real problem?** Someone reports it and a change admin checks it.
      2. **Should we change it, and how exactly?** Experts investigate and propose a solution.
      3. **Who does what, by when?** Someone writes the plan.
      4. **Is the work done right?** People do the work and a reviewer checks each piece.
      5. **Is it ready to release?** An auditor checks everything, then the new versions go live.

      Windchill's out-of-the-box change process names these legs **Identify Need**, **Investigate
      Need**, **Change Planning**, **Change Implementation** and **Review and Audit Change**. Learn
      what each one decides and the whole process clicks.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "Is this a real problem?" → *Identify Need*, captured in a *[[problem-report|Problem Report]]* (PR)
      - "Should we change it?" → *Investigate Need*, captured in a *[[change-request|Change Request]]* (CR, often called ECR)
      - "The people who say yes or no to the request" → *[[change-review-board|Change Review Board]]* (CRB)
      - "Who does what, by when?" → *Change Planning*, captured in a *[[change-notice|Change Notice]]* (CN) and its *[[implementation-plan]]*
      - "Do the work" → *Change Implementation*, done in *[[change-task|Change Tasks]]*
      - "Check it all before release" → *Review and Audit Change*
      - "What the change touches" → *[[affected-object|affected objects]]*; "what it produces" → *[[resulting-object|resulting objects]]*

  - type: animation
    title: One change, five steps
    diagram:
      width: 820
      height: 360
      nodes:
        - { id: pr, label: "1 · Identify Need", sublabel: "PR-0105 · real problem?", x: 20, y: 40, w: 180, tone: danger }
        - { id: cr, label: "2 · Investigate Need", sublabel: "CR-0105 · should we?", x: 230, y: 40, w: 180, tone: warning }
        - { id: ccb, label: Change board, sublabel: "full track only", x: 230, y: 190, w: 180, tone: neutral, shape: pill }
        - { id: cn, label: "3 · Change Planning", sublabel: "CN-0105 · who, by when?", x: 440, y: 40, w: 180, tone: primary }
        - { id: t1, label: "4 · Implementation", sublabel: "Priya's tasks", x: 440, y: 190, w: 180, tone: info }
        - { id: audit, label: "5 · Review and Audit", sublabel: Leo audits CN-0105, x: 640, y: 190, w: 160, tone: accent }
        - { id: rel, label: Released, sublabel: "SC-1048 rev C", x: 640, y: 290, w: 160, tone: success, shape: pill }
      edges:
        - { from: pr, to: cr, label: accepted }
        - { from: cr, to: ccb, label: review }
        - { from: cr, to: cn, label: approved }
        - { from: ccb, to: cn, dashed: true }
        - { from: cn, to: t1, label: tasks }
        - { from: t1, to: audit }
        - { from: audit, to: rel, label: approve }
    chapters:
      - title: "1 · Identify Need"
        caption: Sam in field service hears that S2 fold-locks rattle. He raises **PR-0105** with photos and lists SC-1048 as an affected object. Maya, a change admin, checks it and decides it's **valid**. A PR describes the problem. It doesn't fix anything.
        show: [pr]
        highlight: [pr]
        flow: []
        seconds: 7
      - title: "2 · Investigate Need"
        caption: Kai's team works out scope, impact, cost and a precise fix (a thicker bracket) in **CR-0105**. By the end of this step, the **solution is confirmed**.
        show: [pr, cr]
        highlight: [cr]
        flow: [pr>cr]
      - title: The board (full track)
        caption: For a big, costly change the CR goes to the **change review board** - engineering, manufacturing and quality at one table. Small changes can take the fast track without it.
        show: [pr, cr, ccb]
        highlight: [ccb]
        flow: [cr>ccb]
        seconds: 7
      - title: "3 · Change Planning"
        caption: Approved. **CN-0105** is the plan - the work authorization that lists which objects change, who does each task and by when.
        show: [pr, cr, ccb, cn]
        highlight: [cn]
        flow: [cr>cn, ccb>cn]
      - title: "4 · Change Implementation"
        caption: Once the plan is approved, the change tasks land in people's task lists. Priya edits the CAD and drawing; a reviewer checks her work. The new versions stay **In Work** for now.
        show: [pr, cr, ccb, cn, t1]
        highlight: [t1]
        flow: [cn>t1]
        seconds: 7
      - title: "5 · Review and Audit Change"
        caption: When every task is done, Leo **audits** the whole change notice. He approves, so SC-1048 rev **C** is **Released** and PR-0105 and CR-0105 count as resolved.
        highlight: [audit, rel]
        flow: [t1>audit, audit>rel]
        seconds: 7

  - type: diagram
    title: What each step decides
    caption: Click each step to see the decision it makes, the object that carries it and who usually owns it.
    diagram:
      width: 800
      height: 360
      groups:
        - { label: Decide whether, x: 10, y: 10, w: 400, h: 160, tone: warning }
        - { label: Decide how and release, x: 10, y: 190, w: 780, h: 160, tone: primary }
      nodes:
        - id: identify
          label: Identify Need
          sublabel: Problem Report
          x: 30
          y: 70
          w: 170
          tone: danger
          detail: |
            **Decides:** is the reported problem or idea **valid**? Any user can create a problem
            report. In the out-of-the-box process a **Change Admin I** analyses it and can confirm it,
            reject it, or send it back to the author for clarification. Problem reports are
            **optional** - issues can also start straight in a change request or change notice.
          real: At Acme, Sam raises most PRs from field data and Maya screens them.
        - id: investigate
          label: Investigate Need
          sublabel: Change Request
          x: 220
          y: 70
          w: 170
          tone: warning
          detail: |
            **Decides:** *whether* to change and *what exactly* the solution is. The change request
            captures scope, feasibility, downstream impact, proposed solutions, cost and business
            justification. The solution should be confirmed by the end of this step, because the next
            steps implement it. The routing (fast or full track) is decided here too.
          real: At Acme, Maya's board reviews the full-track CRs.
        - id: plan
          label: Change Planning
          sublabel: Change Notice
          x: 30
          y: 250
          w: 170
          tone: primary
          detail: |
            **Decides:** *how and when* the approved change gets done. The change notice is a
            **work authorization** holding the implementation plan - the change tasks, their owners and
            need dates. It can reference one or more change requests, or exist without one if your
            administrator allows it. A **Change Admin II** owns the plan.
          real: At Acme, Kai's team owns the CNs for engineering changes.
        - id: implement
          label: Change Implementation
          sublabel: Change Tasks
          x: 220
          y: 250
          w: 170
          tone: info
          detail: |
            **Decides:** is each piece of work **acceptable**? When the plan is approved, the tasks are
            delivered to their assignees automatically. The assignee edits the data; the task's reviewer
            approves it or sends it back. The changed data stays **In Work** during this step.
          real: Priya gets her change tasks in her task list in Windchill.
        - id: audit
          label: Review and Audit
          sublabel: Change Notice audit
          x: 410
          y: 250
          w: 170
          tone: accent
          detail: |
            **Decides:** is the whole change **clear, concise and valid** - ready to release? A
            **Change Admin III** audits the change notice once all its tasks are complete, then
            approves or rejects it. Approval releases the objects and resolves the related problem
            reports and change requests.
          real: At Acme, Leo from quality does the audit.
        - id: result
          label: Released
          sublabel: new revisions
          x: 610
          y: 250
          w: 160
          tone: success
          shape: doc
          detail: The resulting objects, such as SC-1048 rev C and its drawing, move to Released. With the objects released, the change process is complete.
      edges:
        - { from: identify, to: investigate }
        - { from: investigate, to: plan, label: approved }
        - { from: plan, to: implement, label: plan approved }
        - { from: implement, to: audit, label: all tasks done }
        - { from: audit, to: result, label: approve }

  - type: callout
    variant: why-it-matters
    md: |
      Splitting **"should we?"** from **"how do we?"** is the whole trick. Engineers love jumping
      straight to the fix. The CR forces a pause where manufacturing, quality and service say what the
      change really costs *before* anyone touches released data. The audit at the end is the second
      safety net: nothing gets released until someone has checked the complete package. And because
      every object is linked, auditors and customers can follow any revision back to the reason it exists.

  - type: simulation
    title: Drive a change through the five steps
    intro: |
      Move the bracket problem from report to release. Try sending the CR back and asking for rework
      on a task, too. This sandbox shows the **concept**; your company's states, routing options and
      roles may differ.
    headline: "SC-1048 · rev {bracket} · step: {stage} · tasks done {tasks}/2"
    initial: { stage: Identify Need, tasks: 0, bracket: B }
    actions:
      - id: confirm-pr
        label: "Change admin: confirm the PR"
        when: { stage: Identify Need }
        do: [{ set: { stage: Investigate Need } }]
        log: Maya confirms PR-0105 is valid. Kai's team starts CR-0105 to investigate.
        blockedHint: There's no problem report waiting for a decision.
      - id: send-back
        label: "Board: send CR back"
        when: { stage: Investigate Need }
        do: [{ set: { stage: CR needs more info } }]
        log: The board wants supplier cost and stock numbers before deciding.
        blockedHint: Nothing is waiting for the board.
      - id: rework-cr
        label: Add info and resubmit CR
        when: { stage: CR needs more info }
        do: [{ set: { stage: Investigate Need } }]
        log: Cost and stock numbers added. The CR is back for a decision.
        blockedHint: The CR hasn't been sent back.
      - id: approve-cr
        label: "Approve CR with a confirmed fix"
        when: { stage: Investigate Need }
        do: [{ set: { stage: Change Planning } }]
        log: Approved - the fix is a thicker bracket. Now someone has to plan the work.
        blockedHint: The need has to be confirmed and investigated first.
      - id: approve-plan
        label: Create CN and approve the plan
        when: { stage: Change Planning }
        do: [{ set: { stage: Change Implementation, tasks: 0 } }]
        log: CN-0105 holds two tasks - update CAD and update drawing. They land in Priya's task list.
        blockedHint: A CN implements an approved change. Get the CR approved first.
      - id: do-task
        label: Complete and review a task
        when: { stage: Change Implementation, tasks: [0, 1] }
        do: [{ inc: tasks }]
        log: Task done and accepted by its reviewer. {tasks} of 2 complete. The data is still In Work.
        blockedHint: There are no open change tasks.
      - id: rework-task
        label: "Reviewer: ask for rework"
        when: { stage: Change Implementation }
        do: [{ set: { tasks: 0 } }]
        log: The reviewer spots a missing tolerance. The work goes back for fixes and the count restarts in this sandbox.
        blockedHint: Rework only happens while tasks are being implemented.
      - id: audit
        label: Audit the change notice
        when: { stage: Change Implementation, tasks: 2 }
        do: [{ nextLetter: bracket }, { set: { stage: Released } }]
        log: Leo audits CN-0105 and approves. SC-1048 rev {bracket} is Released and PR-0105 and CR-0105 are resolved.
        blockedHint: The audit comes after every change task is complete.
    goals:
      - label: Confirm the need
        when: { stage: Investigate Need }
        message: Step 1 decided the problem is real. Nothing has been fixed yet.
      - label: Approve the plan
        when: { stage: Change Implementation }
        message: Steps 2 and 3 decided what to do and who does it.
      - label: Release revision C
        when: { stage: Released, bracket: C }
        message: Identify → Investigate → Plan → Implement → Review and Audit. That's the whole process.

  - type: walkthrough
    title: Start step 1 - raise a Problem Report - and find your change tasks
    who: Any user (the course manual's out-of-the-box setup lets all users create problem reports)
    steps:
      - title: Open the thing that's wrong
        where: [Search, "<part> information page"]
        md: Search for the part by number (for example SC-1048) and open its information page.
      - title: Start a new Problem Report
        where: ["<part> information page", Actions, New, New Problem Report]
        md: |
          Click **Actions**, point to **New**, then choose **New Problem Report**. Because you started
          from the part, it is already selected as the affected object.
      - title: Describe it like a detective
        where: [New Problem Report, attributes]
        md: Give it a clear name, describe what happened, set the category, priority and need date. Add attachments such as photos or measurements on the attachments step.
      - title: Submit it
        where: [New Problem Report, Finish, Submit Now]
        md: Click **Finish**, then **Submit Now**. The report goes to the users in the Change Admin I role for analysis, and it appears on the part's **Changes** tab.
      - title: Pick up your change tasks later
        where: [Home, My Tasks]
        md: When a CN assigns you a change task in step 4, it appears in the **My Tasks** table on Home. Open it to see the affected and resulting objects.
    result: Step 1 has started, your report is linked to the part, and you know where your step 4 work will show up.

  - type: callout
    variant: note
    md: |
      The five steps are the **out-of-the-box** process in the Windchill 13.x course manual. Not
      every PR becomes a CR, several PRs can feed one CR, and a CN can sometimes be created without a
      CR at all (a later lesson shows how). Companies often add their own activities, roles and
      routes, so who approves what and which states each object passes through **depend on your
      configuration**. After step 5 there is still the physical rollout in production, which follows
      manufacturing schedules.

  - type: callout
    variant: pitfall
    md: |
      **Writing the solution into the Problem Report.** "Make the bracket 4 mm" isn't a problem, it's a
      guess at a fix. Describe the symptom and evidence in the PR (step 1). Let the CR propose and
      confirm the solution (step 2), so the board can compare options.

  - type: callout
    variant: pro-tip
    md: |
      Memorise the five decisions: **Valid? Should we? Who and when? Done right? Ready to release?**
      If you're ever unsure which object to open, ask which of those questions you're answering right now.

  - type: flashcards
    cards:
      - front: "Step 1 · Identify Need"
        back: "Is the problem real? Captured in a Problem Report (optional). Change Admin I confirms, rejects or sends it back."
      - front: "Step 2 · Investigate Need"
        back: "Should we change it, and how exactly? Captured in a Change Request. The solution is confirmed by the end of this step."
      - front: "Step 3 · Change Planning"
        back: "Who does what, by when? Captured in a Change Notice and its implementation plan, owned by Change Admin II."
      - front: "Step 4 · Change Implementation"
        back: "Is each piece of work right? Assignees edit data in change tasks; reviewers accept it or send it back. Data stays In Work."
      - front: "Step 5 · Review and Audit Change"
        back: "Ready to release? Change Admin III audits the CN. Approval releases the objects and resolves the PRs and CRs."
      - front: "Change board (CRB)"
        back: "The cross-functional group that approves, denies or asks for more investigation on a change request - in the full track."
      - front: "Affected vs resulting objects"
        back: "Affected = what the change touches today. Resulting = the new versions it produces and releases."
      - front: "Order of the five steps"
        back: "Identify Need → Investigate Need → Change Planning → Change Implementation → Review and Audit Change."

  - type: summary
    points:
      - "Five out-of-the-box steps: Identify Need, Investigate Need, Change Planning, Change Implementation, Review and Audit Change."
      - Identify decides if the need is valid; Investigate decides whether to change and confirms the solution.
      - Planning decides who does what by when; Implementation does and reviews the work while data stays In Work.
      - Review and Audit decides if the change is ready - approval releases the objects and resolves the PR and CR.
      - Activities, roles and routes are configurable, so your company's version may differ.
