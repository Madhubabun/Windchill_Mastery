id: m03-s01-l02
subtitle: "What's wrong? Should we change it? How do we do it? Who does what? Four questions, four objects."
version: 1.0.0
updated: "2026-10-05"
tags: [change-management, problem-report, change-request, change-notice, change-task, change-review-board]

blocks:
  - type: text
    md: |
      A good change process is like a relay race. Each runner answers **one question** and then hands
      the baton on:

      1. **What's wrong?** Someone reports a problem.
      2. **Should we change it?** The right people decide if it's worth it.
      3. **How and when do we do it?** Someone plans the work.
      4. **Who does which piece?** People do the work and the new versions get released.

      In Windchill each runner is a **change object**. Learn which question each one answers and the
      whole process clicks.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "Something's wrong" → *[[problem-report|Problem Report]]* (PR)
      - "Should we change it?" → *[[change-request|Change Request]]* (CR, often called ECR)
      - "The people who say yes or no" → *[[change-review-board|Change Review Board]]* (CRB, also CCB)
      - "Approved - here's the plan" → *[[change-notice|Change Notice]]* (CN, often called ECN)
      - "Your piece of the work" → *[[change-task|Change Task]]*
      - "What the change touches" → *[[affected-object|affected objects]]*; "what it produces" → *[[resulting-object|resulting objects]]*

  - type: animation
    title: One change, start to finish
    diagram:
      width: 820
      height: 360
      nodes:
        - { id: pr, label: Problem Report, sublabel: "PR-0105 · what's wrong?", x: 20, y: 40, w: 180, tone: danger }
        - { id: cr, label: Change Request, sublabel: "CR-0105 · should we?", x: 230, y: 40, w: 180, tone: warning }
        - { id: ccb, label: Change board, sublabel: "Maya chairs the CCB", x: 230, y: 190, w: 180, tone: neutral, shape: pill }
        - { id: cn, label: Change Notice, sublabel: "CN-0105 · how and when", x: 440, y: 40, w: 180, tone: primary }
        - { id: t1, label: "Task: update CAD", sublabel: Priya, x: 440, y: 190, w: 170, tone: info }
        - { id: t2, label: "Task: update drawing", sublabel: Priya, x: 440, y: 280, w: 170, tone: info }
        - { id: rel, label: Released, sublabel: "SC-1048 rev C", x: 650, y: 190, w: 150, tone: success, shape: pill }
      edges:
        - { from: pr, to: cr, label: escalate }
        - { from: cr, to: ccb, label: review }
        - { from: ccb, to: cn, label: approved }
        - { from: cn, to: t1 }
        - { from: cn, to: t2 }
        - { from: t1, to: rel }
        - { from: t2, to: rel }
    chapters:
      - title: "1 · What's wrong?"
        caption: Sam in field service hears that S2 fold-locks rattle. He raises **PR-0105** and lists the SC-1048 bracket as an **affected object**, with photos. A PR describes the problem. It doesn't fix anything.
        show: [pr]
        highlight: [pr]
        flow: []
      - title: "2 · Should we change it?"
        caption: Kai's team analyses the PR and agrees a change is needed. They create **CR-0105** with the proposed fix (thicker bracket), the cost, the stock impact and the urgency.
        show: [pr, cr]
        highlight: [cr]
        flow: [pr>cr]
      - title: "3 · The board decides"
        caption: The **change board** chaired by Maya reviews the CR - engineering, manufacturing, quality and service at one table. They can approve, reject or send it back for more info.
        show: [pr, cr, ccb]
        highlight: [ccb]
        flow: [cr>ccb]
        seconds: 7
      - title: "4 · Plan the work"
        caption: Approved. A **Change Notice**, CN-0105, is created to implement the CR. The CN is the plan - which objects change, who does what, by when.
        show: [pr, cr, ccb, cn]
        highlight: [cn]
        flow: [ccb>cn]
      - title: "5 · Do the work"
        caption: The CN holds **change tasks**. Priya gets one to update the CAD and one to update the drawing. Each task lists what it starts from and the new versions it produces - the **resulting objects**.
        show: [pr, cr, ccb, cn, t1, t2]
        highlight: [t1, t2]
        flow: [cn>t1, cn>t2]
        seconds: 7
      - title: "6 · Release"
        caption: When all tasks are done and approved, the resulting objects are released - SC-1048 revision **C**. Every step is linked, so anyone can trace rev C back to Sam's report.
        highlight: [rel]
        flow: [t1>rel, t2>rel]

  - type: diagram
    title: What each object decides
    caption: Click each object to see the question it answers, who usually owns it and what it links to.
    diagram:
      width: 800
      height: 330
      groups:
        - { label: Decide, x: 10, y: 10, w: 400, h: 150, tone: warning }
        - { label: Implement, x: 420, y: 10, w: 370, h: 310, tone: primary }
      nodes:
        - id: pr
          label: Problem Report
          sublabel: "What's wrong?"
          x: 30
          y: 60
          w: 170
          tone: danger
          detail: |
            **Decides:** nothing yet - it **captures** the problem. Who saw it, where, how often, with
            evidence and the affected objects. Anyone with access can usually raise one: engineers,
            service, quality, manufacturing.
          real: At Acme, Sam raises most PRs from field data.
        - id: cr
          label: Change Request
          sublabel: "Should we change it?"
          x: 220
          y: 60
          w: 170
          tone: warning
          detail: |
            **Decides:** *whether* to change, based on a business case - the proposed solution, cost,
            impact on stock and suppliers, urgency. The change board approves or rejects it. One CR can
            collect several related PRs.
          real: At Acme, Maya's CCB meets weekly to review CRs.
        - id: cn
          label: Change Notice
          sublabel: "How and when?"
          x: 440
          y: 60
          w: 170
          tone: primary
          detail: |
            **Decides:** *how* the approved change gets done - the implementation plan. It holds the
            change tasks, their owners and due dates. An approved CR can lead to one or more CNs.
          real: At Acme, Kai's team owns the CNs for engineering changes.
        - id: task
          label: Change Task
          sublabel: "Who does what?"
          x: 440
          y: 190
          w: 170
          tone: info
          detail: |
            **Decides:** nothing - it **does**. One task per piece of work, assigned to a person or role.
            It lists the affected objects it starts from and the **resulting objects** it produces.
          real: Priya gets her change tasks in her task list in Windchill.
        - id: result
          label: Resulting objects
          sublabel: new revisions
          x: 640
          y: 190
          w: 140
          tone: success
          shape: doc
          detail: The new versions the tasks create, such as SC-1048 rev C and SC-1048.drw rev C. They're typically released when the CN completes.
      edges:
        - { from: pr, to: cr }
        - { from: cr, to: cn, label: approved }
        - { from: cn, to: task, label: contains }
        - { from: task, to: result, label: produces }

  - type: callout
    variant: why-it-matters
    md: |
      Splitting **"should we?"** from **"how do we?"** is the whole trick. Engineers love jumping
      straight to the fix. The CR forces a pause where manufacturing, quality and service say what the
      change really costs *before* anyone touches released data. And because every object is linked,
      auditors and customers can follow any revision back to the reason it exists.

  - type: simulation
    title: Drive a change through the process
    intro: |
      Move the bracket problem from report to release. Try rejecting the CR, too - in real life the
      board often sends a request back for more information. This sandbox shows the **concept**; your
      company's states and steps may differ.
    headline: "SC-1048 · rev {bracket} · {stage} · tasks done {tasks}/2"
    initial: { stage: PR open, tasks: 0, bracket: B }
    actions:
      - id: analyze
        label: Analyse the PR
        when: { stage: PR open }
        do: [{ set: { stage: PR analysed } }]
        log: Kai's team confirms the problem and finds the cause - the bracket is too thin.
        blockedHint: There's no open Problem Report to analyse.
      - id: createcr
        label: Create Change Request
        when: { stage: PR analysed }
        do: [{ set: { stage: CR under review } }]
        log: CR-0105 created with the fix and its cost. It goes to Maya's change board.
        blockedHint: Analyse the problem first - a CR needs a proposed fix.
      - id: reject
        label: "Board: send back"
        when: { stage: CR under review }
        do: [{ set: { stage: CR needs more info } }]
        log: The board wants supplier cost and stock numbers before deciding.
        blockedHint: Nothing is in front of the board.
      - id: rework
        label: Add info and resubmit CR
        when: { stage: CR needs more info }
        do: [{ set: { stage: CR under review } }]
        log: Cost and stock numbers added. The CR is back with the board.
        blockedHint: The CR hasn't been sent back.
      - id: approve
        label: "Board: approve"
        when: { stage: CR under review }
        do: [{ set: { stage: CR approved } }]
        log: Approved. Now someone needs to plan the implementation.
        blockedHint: Nothing is in front of the board.
      - id: createcn
        label: Create Change Notice
        when: { stage: CR approved }
        do: [{ set: { stage: CN in work, tasks: 0 } }]
        log: CN-0105 created with two change tasks - update CAD and update drawing.
        blockedHint: A CN implements an approved CR. Get the CR approved first.
      - id: dotask
        label: Complete a change task
        when: { stage: CN in work, tasks: [0, 1] }
        do: [{ inc: tasks }]
        log: Task done. {tasks} of 2 complete.
        blockedHint: There are no open change tasks.
      - id: release
        label: Release the change
        when: { stage: CN in work, tasks: 2 }
        do: [{ nextLetter: bracket }, { set: { stage: Released } }]
        log: CN complete. SC-1048 rev {bracket} is Released and traceable back to PR-0105.
        blockedHint: All change tasks must be complete first.
    goals:
      - label: Get the CR approved
        when: { stage: CR approved }
        message: The board said yes. That's a decision, not the work.
      - label: Finish both change tasks
        when: { tasks: 2 }
        message: Tasks are where the real edits happen.
      - label: Release revision C
        when: { stage: Released, bracket: C }
        message: Report → decide → plan → do → release. That's the whole process.

  - type: walkthrough
    title: Raise a Problem Report and find your change tasks
    who: Any user allowed to create problem reports (depends on your company's permissions)
    steps:
      - title: Open the thing that's wrong
        where: [Search, "<part> information page"]
        md: Search for the part by number (for example SC-1048) and open its information page.
      - title: Start a new Problem Report
        where: ["<part> information page", Actions menu, New Problem Report]
        md: |
          From the **Actions** menu choose the action to create a new **Problem Report**. Starting from
          the part usually adds it as an affected object for you. You can also start from your product's
          change area; names and locations depend on your configuration.
      - title: Describe it like a detective
        where: [New Problem Report, attributes and attachments]
        md: Give it a clear name, describe what happened, where and how often, set the priority and attach evidence such as photos or measurements.
      - title: Pick up your change tasks later
        where: [Home, Tasks / My Tasks]
        md: When a CN assigns you a change task, it appears in your **task list** on Home. Open it to see the affected objects and record your resulting objects.
    result: Your report is in the system with evidence attached, and you know where your change work will show up.

  - type: callout
    variant: note
    md: |
      Not every PR becomes a CR - some are duplicates or not worth fixing. Several PRs can feed one CR,
      and one approved CR can lead to more than one CN. The exact workflow, who approves and which
      states each object passes through all **depend on your company's configuration**.

  - type: callout
    variant: pitfall
    md: |
      **Writing the solution into the Problem Report.** "Make the bracket 4 mm" isn't a problem, it's a
      guess at a fix. Describe the symptom and evidence in the PR. Let the CR propose and justify the
      solution, so the board can compare options.

  - type: callout
    variant: pro-tip
    md: |
      Remember the four questions: **What? Should we? How? Who?** If you're ever unsure which object to
      open, ask which question you're answering right now.

  - type: flashcards
    cards:
      - front: "Problem Report (PR)"
        back: "What's wrong? Captures the issue, evidence and affected objects. Decides nothing yet."
      - front: "Change Request (CR / ECR)"
        back: "Should we change it? The business case that the change board approves or rejects."
      - front: "Change board (CRB / CCB)"
        back: "The cross-functional group that decides on change requests."
      - front: "Change Notice (CN / ECN)"
        back: "How and when? The implementation plan for an approved change."
      - front: "Change Task"
        back: "Who does what? One piece of the work - turns affected objects into resulting objects."
      - front: "Affected vs resulting objects"
        back: "Affected = what the change touches today. Resulting = the new versions it produces."
      - front: "Order of the change objects"
        back: "Problem Report → Change Request → Change Notice → Change Tasks."
      - front: "Where do change tasks show up?"
        back: "In your task list on Home (Tasks / My Tasks)."

  - type: summary
    points:
      - "Four questions, four objects - What's wrong (PR), Should we (CR), How (CN), Who (change tasks)."
      - The change board decides on the CR before anyone touches released data.
      - The CN is the plan; change tasks do the work and produce the resulting objects.
      - Every object is linked, so any new revision traces back to the original problem.
      - Workflows, approvers and states depend on your company's configuration.
