id: m03-s02-l09
subtitle: Every task says "done". The audit asks the only question that matters - is this whole change actually ready to release?
version: 1.0.0
updated: "2026-10-13"
tags: [change, audit, change-notice, review, release, change-administrator]
sources:
  - id: te
    where: "Module 6: OOTB change management process: steps; Identify roles in the change management process (Change Admin III); Change management process: Change Implementation; Change management process: Review and Audit Change; Activity: Review and audit an implemented change; Activity: Complete a change notice to release product data; Explore some of the options on the Changes tab (Change Monitor, Reports)"
  - id: pf
    where: "Module 4: Change Effectiveness Required task variable and the Analyze Change Effectiveness task (Pacesetter Full Track activity)"

blocks:
  - type: text
    md: |
      All three tasks on **CN-0101** are green. Priya finished the bracket CAD and drawing, Kai the
      frame BOM, Ana the work instruction. Each one was reviewed. Time to release?

      Not yet. Each reviewer only saw **their** slice. Nobody has looked at the whole package:
      is everything that should change in there, is anything missing, will the right versions end up
      Released? That's the last step of the change process - **Review and Audit Change** - and at
      Acme it belongs to Leo, the **Change Admin III**.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the final check of the whole change" → *Review and Audit Change* (step 5)
      - "the person who does it" → *Change Admin III* (CA III), see [[change-administrator]]
      - "the task in Leo's list" → *Audit Change Notice*
      - "what the audit shows" → the *Audit Change Summary* on the task's **Impacts** tab
      - "what each object was meant to do" → the *Change Intent* view; "what will be released" → the *Release Content* view
      - "proving the result matches the documents" → general CM practice calls this a *[[configuration-audit]]*

  - type: diagram
    title: Two checks before release
    caption: Task reviews check each piece during implementation. The audit checks the whole change notice at the end. Click each box.
    diagram:
      width: 800
      height: 380
      groups:
        - { label: "4 · Change Implementation", x: 10, y: 10, w: 420, h: 360, tone: info }
        - { label: "5 · Review and Audit Change", x: 450, y: 10, w: 340, h: 360, tone: success }
      nodes:
        - id: assignee
          label: Assignee edits
          sublabel: data stays In Work
          x: 30
          y: 60
          w: 170
          tone: info
          detail: |
            The assignee changes the product data as the change notice instructs and completes the
            task with a comment. During implementation the modified data stays **In Work**.
        - id: reviewer
          label: Reviewer checks
          sublabel: one task at a time
          x: 240
          y: 60
          w: 170
          tone: info
          detail: |
            The task's reviewer checks that the changes are clear, concise and valid - for example by
            opening the resulting CAD in Creo View. Not acceptable? It goes back for more work.
            Acceptable? The reviewer approves and the task waits for the audit.
        - id: rework
          label: Rework
          sublabel: back for fixes
          x: 240
          y: 200
          w: 170
          tone: warning
          detail: Choosing **Rework** instead of **Complete** sends the work back so it can be fixed before anything is released.
        - id: audit
          label: Audit Change Notice
          sublabel: Change Admin III
          x: 470
          y: 60
          w: 300
          tone: accent
          detail: |
            When **all** tasks of the change notice are complete, the CA III audits the result to be
            sure it is clear, concise and valid, then approves or rejects the change notice.
          real: At Acme, Leo audits every engineering change notice.
        - id: release
          label: Objects Released
          sublabel: PR + CR resolved
          x: 470
          y: 200
          w: 140
          tone: success
          shape: pill
          detail: If the CA III approves, the objects are released and the related problem reports and change requests are considered resolved. The change process is complete.
        - id: reject
          label: Rejected
          sublabel: not released
          x: 630
          y: 200
          w: 140
          tone: danger
          detail: If the audit finds a problem, the CA III rejects the change notice instead. What happens next depends on how your company's change notice workflow is set up.
      edges:
        - { from: assignee, to: reviewer }
        - { from: reviewer, to: rework, label: not OK }
        - { from: rework, to: assignee, dashed: true }
        - { from: reviewer, to: audit, label: all tasks OK }
        - { from: audit, to: release, label: approve }
        - { from: audit, to: reject, label: reject }

  - type: callout
    variant: why-it-matters
    md: |
      Release is the moment suppliers and factories start building. A mistake caught in the audit
      costs a comment; the same mistake caught after release costs a new change, scrapped parts or
      worse. The audit is also what lets you say, with evidence, that a released revision was checked
      as a complete set - not just piece by piece.

  - type: walkthrough
    title: Audit a change notice
    who: A member of the Change Admin III role for the product
    where: [Home, My Tasks, Audit Change Notice]
    steps:
      - title: Open the audit task
        where: [Home, My Tasks]
        md: In the **My Tasks** table click **Audit Change Notice**. It only appears once every change task has been completed and reviewed.
      - title: Look at what each object was meant to do
        where: [Audit Change Notice, Impacts tab, Audit Change Summary, Change Intent]
        md: |
          Click the **Impacts** tab. In the list next to **Audit Change Summary**, choose **Change
          Intent**. This lists the objects in the change and what the plan intended for them.
      - title: Look at what will be released
        where: [Audit Change Summary, Release Content]
        md: |
          Switch the list to **Release Content**. This shows what will change if the audit succeeds -
          for CN-0101, the new B revisions moving from **In Work** to **Released**. Use **Search in
          table** to find a specific object quickly.
      - title: Check the plan and its history
        where: [Details tab, Subject link, Implementation Plan tab, Process tab]
        md: |
          On the **Details** tab click the change notice link next to **Subject**. Its
          **Implementation Plan** tab lists every task; the **Process** tab and **Tasks for Change
          Process** table show who completed and reviewed each one.
      - title: Record your decision
        where: [Audit Change Notice, Details tab, Task Completion]
        md: |
          Back on the audit task, open **Task Completion**, write a comment that says what you
          checked, and click **Complete Task** to approve.
    result: The resulting objects are Released, and the problem report and change request linked to the change notice are resolved.

  - type: walkthrough
    title: Check that the change did what it promised
    who: Anyone who can read the product - the CA III, quality or the change requester
    where: ["<part> information page", Changes tab]
    steps:
      - title: Open the changed part
        where: [Recently Accessed, "SC-1048 information page"]
        md: Open the part and check its state. If you landed on an older version, click **Go to Latest** to see the newest one.
      - title: Read its change history
        where: ["SC-1048 information page", Changes tab, Associated Changes]
        md: |
          On the **Changes** tab, the **Associated Changes** table lists the change objects linked to
          this version. On the old A version you'll see the problem report, change request and change
          notice; on the new released version, the resolved change notice.
      - title: Look across all changes
        where: [Navigator, Browse, Changes tab, Change Monitor]
        md: |
          Use **Change Monitor** to see open versus closed change objects and spot stalled ones, and
          **Reports** for standard change logs and summary reports.
    result: You can show, from the part itself, which change released it and that the change is closed.

  - type: scenario
    variant: troubleshooting
    title: "Leo's audit of CN-0101"
    start: s1
    nodes:
      - id: s1
        md: |
          Leo opens **Audit Change Notice** for CN-0101. In **Release Content** he sees SC-1048 B.1,
          its CAD model and drawing, and SC-2000 B.1. But Ana's updated work instruction SC-2540 isn't
          in the list, even though her task is marked complete. What does he do?
        choices:
          - label: Approve - Ana's task is complete, so it must be fine
            next: fail1
            feedback: A completed task doesn't prove its output is on the release list.
          - label: Check Ana's task before deciding
            next: s2
            good: true
            feedback: The audit exists for exactly this kind of mismatch.
          - label: Edit the work instruction himself and approve
            next: partial1
            feedback: The auditor's job is to check, not to quietly fix someone else's work.
      - id: s2
        md: |
          On the change notice's **Implementation Plan** tab Leo opens Task 3. SC-2540 rev B was
          created, but it was never added to the task's resulting objects. What now?
        choices:
          - label: Reject the change notice with a clear comment naming SC-2540
            next: win
            good: true
            feedback: Specific, actionable, and nothing gets released half-finished.
          - label: Approve now and ask Ana to raise a new change later
            next: partial2
            feedback: The bracket would release without the instruction the factory needs to build it.
      - id: fail1
        md: The bracket and frame release, but the line keeps building from the old work instruction. Two days of brackets go on with the wrong screws.
        outcome: fail
      - id: partial1
        md: The instruction gets fixed, but now nobody reviewed Leo's edit, and the record shows the auditor approving his own work.
        outcome: partial
      - id: partial2
        md: It works out eventually, but for a week the released design and the factory instruction disagree - exactly what the audit should prevent.
        outcome: partial
      - id: win
        md: Leo rejects with "SC-2540 rev B missing from Task 3 resulting objects". The gap is fixed, the audit passes, and everything releases together.
        outcome: success

  - type: callout
    variant: note
    md: |
      Some configurations add one more check **after** the audit. In the PLM Foundation Pacesetter,
      if a change request is marked *Change Effectiveness Required*, an **Analyze Change
      Effectiveness** task follows the audit. If the change worked, the change notice is closed; if
      not, a new change notice is needed. Without it, the change notice resolves and closes on its own.

  - type: callout
    variant: pitfall
    md: |
      **Rubber-stamp audits.** If the audit task is always completed in thirty seconds, it isn't an
      audit. Look at **Release Content** every time: it's the exact list of what will become Released.

  - type: callout
    variant: pro-tip
    md: |
      Write audit comments as evidence: *"Checked Release Content: 6 objects, all B revisions, drawing
      and model on matching revisions."* Months later, that comment answers the auditor's question
      before they ask it.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: When does the Audit Change Notice task appear?
        options:
          - As soon as the change notice is submitted
          - When all tasks of the change notice have been completed
          - When the change request is approved
          - Only if a reviewer chose Rework
        answer: 1
        explanation: Review and Audit is the final step. The CA III audits once every implementation task is done.
      - kind: single
        prompt: Which view of the Audit Change Summary shows what will become Released?
        options: [Change Intent, Release Content, Implementation Plan, Associated Changes]
        answer: 1
        explanation: Release Content shows what will change if the audit succeeds. Change Intent shows what the plan intended for each object.
      - kind: truefalse
        prompt: While change tasks are being implemented and reviewed, the modified data is already Released.
        answer: false
        explanation: During implementation the modified data stays In Work. It's released only when the change notice audit is approved.
      - kind: multi
        prompt: What happens when the Change Admin III approves the audit? (Choose all that apply.)
        options:
          - The resulting objects are released
          - The related problem reports and change requests are considered resolved
          - A new change request is created automatically
          - The change process is complete
        answers: [0, 1, 3]
        explanation: Approval releases the objects and resolves the related PRs and CRs, which completes the process. Nothing new is created.

  - type: summary
    points:
      - Task reviewers check each piece during implementation; the CA III audits the whole change notice at the end.
      - The audit runs only after every task is complete. Data stays In Work until then.
      - The Impacts tab's Audit Change Summary shows Change Intent and Release Content - check both.
      - Approval releases the objects and resolves the PR and CR; afterwards, the part's Changes tab proves it.
