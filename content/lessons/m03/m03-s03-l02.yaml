id: m03-s03-l02
subtitle: "Brand new? Promote it. Already released and changing? That's a change notice. Here's how to tell, fast."
version: 1.1.0
updated: "2026-10-14"
tags: [promotion-request, change-notice, change-management, decision]
sources:
  - id: te
    where: "Module 6: Windchill's change and promotion processes: overview (engineering data through change, non-engineering data typically through promotion); OOTB change management process: steps (change notice without a change request if configured); Identify roles in the change management process (CRB only in Full Track; 80% Fast Track); Activity: Create a change notice to release product data (Fast Track, Full Track and Basic complexity; first release of unreleased seat data); Activity: Create a problem report (Released parts change only through change management); Promotion process: overview"
  - id: ac
    where: "Module 5: Describe combined and change and promotion request workflows (change process for engineering data); Compare promotion requests to change management objects; Create a promotion scheme: example (In Work to Prototype); Manage promotion preferences (Automatic Revision Mode)"
  - id: pf
    where: "Module 4: The change process (Basic, Fast and Full Track); Identify the business rule that controls initial releases of business objects"

blocks:
  - type: text
    md: |
      Two requests land on Maya's desk on the same Monday:

      1. Priya's **brand-new phone mount** (SC-3500), never released, ready to go.
      2. Kai wants a **thicker wall on the SC-1048 fold-lock bracket**, which is already
         Released and sitting in 3,000 scooters.

      Both end with "and then it's Released". So why do they take totally different roads?

      Because one is **first release** and the other is **changing something people already
      trust**. Once something is Released, it only changes through the change process: a
      **[[change-request]]** and a **[[change-notice]]** with **[[change-task|change tasks]]**. A
      first release has a lighter road. At Acme that's a **[[promotion-request]]**; other companies
      use a light change notice (the Pacesetter's [[basic-track-change|Basic Track]]).

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "move these versions to a new state" → *promotion* (to a [[promotion-target-state]])
      - "make a new edition of something released" → *[[revise]]* inside a change
      - "the formal plan to change released stuff" → *[[change-notice]]* with *[[change-task|change tasks]]*
      - "what the change touches" → *[[affected-object|affected objects]]*; "what it produces" → *[[resulting-object|resulting objects]]*

  - type: comparison
    title: Promotion request vs change notice
    columns: [Promotion request, Change notice]
    rows:
      - label: Main job
        cells: [Formally request a state change for a set of objects, Plan and track a change to released data]
      - label: Typical data (course manual)
        cells: [Mostly non-engineering data, "Engineering data: parts, CAD and engineering documents"]
      - label: Objects involved
        cells: [One object - the promotion request, "Several - problem report, change request, change notice, change tasks"]
      - label: Creates new revisions?
        cells: ["No - unless an admin set Automatic Revision Mode", "Yes - the work in change tasks produces new revisions"]
      - label: Who decides
        cells: [The approvers the initiator picks on the request, "Change admins and, in Full Track, the Change Review Board"]
      - label: Tracking
        cells: [Status of the promoted objects, "Status indicators, Change Monitor and change reports"]
      - label: Acme example
        cells: [Releasing the new SC-3500 phone mount, Thickening the released SC-1048 bracket]
    takeaway: Released and changing? Always the change process. First release? Promotion or a light change, by company rule.

  - type: diagram
    title: The two-question test
    caption: Start at the top. Click each box to see why.
    diagram:
      width: 800
      height: 380
      nodes:
        - id: q1
          label: Ever been Released?
          sublabel: question 1
          x: 280
          y: 20
          w: 240
          tone: primary
          detail: |
            Look at the object's **History** tab. If **no version** was ever Released (or the state your
            company uses for "production"), nothing downstream depends on it yet.
        - id: prom
          label: Promotion or light change
          sublabel: first release
          x: 40
          y: 150
          w: 220
          tone: success
          shape: pill
          detail: |
            Acme bundles new objects into a **promotion request**: fast, reviewed and recorded. Example:
            the new SC-3500 phone mount going from In Work to Released. Many companies release new
            engineering data through a change notice instead - the PLM Foundation Pacesetter has a
            **Basic Track** change for initial releases, with a rule that only revision A objects go that way.
        - id: q2
          label: Complex or cross-department?
          sublabel: question 2
          x: 480
          y: 150
          w: 280
          tone: warning
          detail: |
            Released data changes through the change process either way. This question picks the
            track. In the Pacesetter, **Full Track** is for complex changes that need several
            departments; **Fast Track** is for simple ones that don't.
        - id: cn
          label: Full Track change
          sublabel: CR + CRB + CN
          x: 540
          y: 280
          w: 220
          tone: danger
          shape: pill
          detail: |
            Problem report (optional) → change request → [[change-review-board|Change Review Board]]
            decision → change notice with change tasks. Example: thicker wall on SC-1048.
        - id: fast
          label: Fast Track change
          sublabel: CR, no board reviews
          x: 260
          y: 280
          w: 240
          tone: info
          shape: pill
          detail: |
            A lighter route for low-impact, low-cost changes - the course manual says about 80% of
            changes go this way. There is still a **change request**: in its *Analyze Change Request*
            task, Change Admin I picks **Fast-Track Approval**, which skips the extra Change Review
            Board and Change Implementation Board approvals that Full Track adds. Corrective or
            administrative fixes, like a typo on a drawing note, can use a **Basic** change notice with
            no change request, if your administrator allows it. Either way it is still a change, not a
            promotion.
      edges:
        - { from: q1, to: prom, label: "no" }
        - { from: q1, to: q2, label: "yes" }
        - { from: q2, to: cn, label: "yes" }
        - { from: q2, to: fast, label: "no" }

  - type: callout
    variant: why-it-matters
    md: |
      The wrong tool can cost real money. Promote a change to released data and you skip the
      board, the stock check and the supplier heads-up: the factory builds a new design while
      3,000 old brackets sit on the shelf. Push every new part through a full change notice
      and your launch slips by weeks for paperwork that protects nothing.

  - type: example
    variant: case-study
    title: The quiet bracket swap
    industry: Micromobility
    md: |
      An engineer at another scooter maker (not Acme!) needed a slightly longer bolt slot on a
      released bracket. A change felt like overkill, so he revised the bracket outside any
      change, then used a promotion request to release the new revision. Two colleagues
      approved it in an hour.

      Nobody checked the **where-used**. The same bracket was in the cargo model, where the
      longer slot hit a cable clip. Nobody told the supplier either, who kept shipping the old
      version for six weeks. The recall review found no change request, no impact analysis
      and no reason recorded for the change.

      Acme's fix is a written rule: once something has been Released, every new revision goes
      through the change process. Promotion requests are for first releases and non-engineering
      documents. (The Pacesetter enforces a similar idea in software: its initial-release rule
      flags any object above revision A that someone tries to release through the Basic Track.)
    takeaway: Promotion records approval. Change management records the why and the impact.

  - type: scenario
    variant: what-if
    title: Maya's Monday triage
    start: s1
    nodes:
      - id: s1
        md: |
          Leo asks: "I need the new **SC-3520 charging cover** (never released) and its drawing
          moved to Released for the pilot build. What should I create?"
        choices:
          - label: A promotion request with the part and drawing
            next: s2
            good: true
            feedback: Right. It's first release, so promote it and include the drawing.
          - label: A change request first
            next: p1
            feedback: Nothing released is being changed. A full change process just adds delay here.
      - id: p1
        md: |
          The change board meets on Thursday, so the pilot build slips a week. It works in the end,
          but Kai asks why a brand-new part needed a board decision.
        outcome: partial
      - id: s2
        md: |
          Next up, Sam from field service reports that the **SC-1048 fold-lock bracket** (Released,
          in production) cracks in cold weather. Priya says: "I'll just bump it to B, fix it and
          promote B. Faster." What do you say?
        choices:
          - label: "Go for it, it's faster"
            next: f1
            feedback: Fast now, painful later. This changes released data that's in stock and on scooters.
          - label: "Raise a problem report and route it through a change request and change notice"
            next: s3
            good: true
            feedback: Yes. Released data plus a form-fit-function change means the full change process.
      - id: f1
        md: |
          B gets promoted in a day. Nobody checks stock, suppliers or other products using SC-1048.
          Three weeks later, two different brackets are mixed on the line and no record explains
          why B exists.
        outcome: fail
      - id: s3
        md: |
          The change board approves CR-0350. Kai, Acme's Change Admin II, creates CN-0351 with change tasks for Priya
          (model and drawing) and Ana (process sheet). Last one: Priya spots a **typo in a note**
          on the released drawing SC-1048.drw. Acme allows a light change notice for
          documentation-only fixes. What now?
        choices:
          - label: Use the light change route for documentation fixes
            next: ok
            good: true
            feedback: Still a change - just a lighter one. The fix gets a new revision with a recorded reason.
          - label: Promote the drawing again to fix it
            next: p2
            feedback: Promotion can't edit content, and re-releasing a revised drawing outside change control loses the why.
      - id: ok
        md: |
          All three requests used the right tool: promotion for the brand-new cover, the full
          process for the cracking bracket and the light change for the typo. Maya's board only
          spends time where it matters.
        outcome: success
      - id: p2
        md: |
          The typo is fixed, but there's no change record. At the next audit, nobody can show why
          SC-1048.drw has a new revision. Use the light change route your company defined instead.
        outcome: partial

  - type: callout
    variant: pitfall
    md: |
      **"It's a tiny change, so I'll just promote it."** Size doesn't decide the tool. If
      something was already released, people downstream depend on it, and released data changes
      only through the change process. Size only decides which track: Fast Track or a light change
      notice for small fixes, Full Track for big ones.

  - type: callout
    variant: pro-tip
    md: |
      Ask two questions: **"Was it ever released?"** and **"Is this complex or cross-department?"**
      No to the first means a first release - promotion or a light change, by your company's rule.
      Yes to the first means the change process; the second question picks Full or Fast Track.

  - type: callout
    variant: note
    md: |
      Promotion requests also work between earlier states, such as In Work → Prototype for a test
      build (the next lessons show a promotion scheme like that). Where the line sits between
      promotion and change depends on your company's configuration and process rules. The course
      manuals' rule of thumb: engineering data through change, non-engineering data through promotion.

  - type: quiz
    passMark: 0.7
    questions:
      - kind: single
        prompt: Acme's new supplier onboarding guide (a non-engineering document, never released) needs to reach Released. Which tool does the course manual recommend?
        options: [Change notice, Promotion request, Variance, Problem report]
        answer: 1
        explanation: Non-engineering data is typically released through a promotion request - simpler than the change process, but still a formal, recorded request.
      - kind: single
        prompt: What's the biggest risk of using a promotion request to release a new revision of an already-released part?
        options:
          - It takes too long
          - It skips impact analysis and the record of why it changed
          - Windchill deletes the old revision
          - The part number changes
        answer: 1
        explanation: The change process exists to check stock, suppliers and where-used and to record the reason. A promotion skips all of that.
      - kind: truefalse
        prompt: Out of the box, a promotion request is how you create the new revision of an object.
        answer: false
        explanation: Promotion moves existing versions to a new state. New revisions come from Revise, usually inside a change task. (An admin can set Automatic Revision Mode so candidates are revised after promotion, but that's an opt-in preference.)
      - kind: multi
        prompt: Which are good reasons to use the change process? (Choose all that apply.)
        options:
          - The part is Released and used in two products
          - The fix changes the hole pattern
          - The part has never been released
          - Suppliers already build the current version
        answers: [0, 1, 3]
        explanation: Released data and downstream users all call for change control. A never-released part can take a lighter first-release route.

  - type: summary
    points:
      - Released and changing? Always the change process - Full or Fast Track.
      - First release? A promotion request or a light change notice, by company rule.
      - The course manuals send engineering data through change and non-engineering data through promotion.
      - Promotion moves versions to a state. It doesn't create revisions or analyse impact.
      - The wrong choice either skips safety checks or adds needless delay.
