id: m03-s03-check
subtitle: Promote, review, approve or reject - and know when it's not a promotion at all.
version: 1.1.0
updated: "2026-10-14"
tags: [checkpoint, promotion-request, tasks]
sources:
  - id: te
    where: "Module 6: Windchill's change and promotion processes: overview; Promotion process: overview; Create a promotion request; Activity: Create and approve a promotion request"
  - id: ac
    where: "Module 5: Identify OOTB promotion request settings (No valid states for Promotion); Describe the Promotion Request Approval process; Manage promotion preferences (Automatic Revision Mode)"
  - id: hc-create-promotion-request
    label: PTC Help Center supplement
    title: "Create a Promotion Request"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/promotionrequest/ProdMatPromoReqCreate.html"
    covers: "Collect Objects action; at least one object set for promotion"

blocks:
  - type: text
    md: |
      Ten questions on **Promotion requests**: creating them, choosing promotion or change,
      and handling review and approval tasks. Score 80% to pass. The flashcards below go
      straight into your review deck.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: single
        prompt: Priya's new SC-3500 phone mount has never been released, and Acme's rules let engineers promote brand-new designs. She wants it Released. What does she create?
        options: [A change notice, A promotion request, A variance, A problem report]
        answer: 1
        explanation: At Acme, first release of a new design goes through a promotion request - nothing released is being changed. (Many companies use a light change notice for this instead; the course manual sends most engineering data through change.)
      - kind: single
        prompt: What does a promotion request change when it's approved?
        options:
          - The revision letter of each object
          - The lifecycle state of each promotion object
          - The part numbers
          - The folders the objects live in
        answer: 1
        explanation: Promotion moves the exact versions you added to the target state. It doesn't renumber or move them, and it only revises them if an admin turned on Automatic Revision Mode.
      - kind: multi
        prompt: Ana opens her review task on PROM-0310. What can she see? (Choose all that apply.)
        options:
          - The target state
          - The promotion objects and their exact versions
          - The requester's description
          - Links to open each object's information page
        answers: [0, 1, 2, 3]
        explanation: The task's Promotion Objects tab lists the objects, versions and states; the Details tab shows the request's description - and each object can be opened from there.
      - kind: single
        prompt: Kai wants a thicker wall on the released SC-1048 fold-lock bracket. Priya suggests revising it and promoting revision B. What's the main risk?
        options:
          - The promotion is too slow
          - It skips impact analysis and the recorded reason for the change
          - Windchill deletes revision A
          - Revision B gets a new part number
        answer: 1
        explanation: Changing released data needs the change process so stock, suppliers and where-used are checked and the why is recorded. A promotion only records who approved.
      - kind: order
        prompt: Put the promotion steps in order (Promotion Request Approval Process).
        items:
          - Finish the work and check in
          - Create the promotion request with a target state
          - Reviewers and approvers get their tasks in parallel
          - All approvers vote Approve
          - Objects move to the target state
        explanation: Work, bundle, then parallel review and approval. Only when every approver approves do the objects move.
      - kind: single
        prompt: Which is the most useful rejection comment?
        options:
          - "Not OK."
          - "Please check the drawing again."
          - "SC-3510 sheet 1: hole 3 mm from edge cracks in bend test. Move to 8 mm."
          - "Rejected - see me."
        answer: 2
        explanation: A useful rejection says what is wrong, where, why it matters and what to do. The others force a follow-up conversation.
      - kind: truefalse
        prompt: In the Promotion Request Approval Process, reviewers vote, and any single reviewer comment automatically rejects the request.
        answer: false
        explanation: Reviewers only give feedback; they don't control the outcome. Approvers vote, and any approver's Reject ends the process in a rejection.
      - kind: single
        prompt: Leo tries to promote a part and gets "No valid states for Promotion are available." What's a likely reason?
        options:
          - The part has a description
          - The part's life cycle has no Promote transition from its current state
          - The part has a drawing
          - The part is in a folder
        answer: 1
        explanation: The course manual names two causes - the part uses the wrong life cycle, or its life cycle has no Promote transition from the current state.
      - kind: multi
        prompt: Which statements about promotion requests are true? (Choose all that apply.)
        options:
          - The target states you can choose depend on the life cycle and configuration
          - Related objects like the drawing should travel in the same request
          - Approving always creates the next revision automatically
          - Approvals leave a record of who approved which versions and when
        answers: [0, 1, 3]
        explanation: Target states come from the life cycle's Promote transitions, related objects should be promoted together (Collect Objects helps) and approvals are recorded. Revisions are only created automatically if an admin set Automatic Revision Mode.
      - kind: single
        prompt: You find a task in the My Tasks table on Home, review the objects and write a comment. What finishes your part?
        options: [Closing the browser tab, Complete Task, Checking out the part, Emailing the requester]
        answer: 1
        explanation: Complete Task submits your comment (and vote, for approvers). Until then the task stays open in your list.

  - type: flashcards
    title: Promotion requests deck
    cards:
      - front: "Promotion request"
        back: "Formally requests a state change for a set of objects, to one target state. Mostly used for non-engineering data."
      - front: "Promotion target state"
        back: "Where the objects end up when approved, for example Released."
      - front: "Promotion candidate"
        back: "One object version in the bundle. All candidates move together."
      - front: "Promotion or change notice?"
        back: "Released and changing: always the change process. First release: promotion or a light change, by company rule."
      - front: "Does promotion create revisions?"
        back: "Not by default. Only if an admin set Automatic Revision Mode."
      - front: "Review task"
        back: "Look and comment. Informs the approvers."
      - front: "Approval task"
        back: "Vote Approve or Reject with a comment. Any Reject ends the promotion in a rejection."
      - front: "Useful rejection"
        back: "What is wrong, where, why it matters, what to do."
      - front: "Where are my tasks?"
        back: "In the My Tasks table on your Home page."
      - front: "On rejection, objects..."
        back: "Stay in, or return to, their original state, such as In Work."
