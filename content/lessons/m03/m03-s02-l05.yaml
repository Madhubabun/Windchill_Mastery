id: m03-s02-l05
subtitle: Mark up the BOM in red, read the ripple effects, and only then make it real.
version: 1.0.0
updated: "2026-10-05"
tags: [change, redline, bom, impact-analysis, where-used]

blocks:
  - type: text
    md: |
      Kai owns Task 2 of CN-0101: update the **SC-2000 frame assembly**. The new bracket is 1 mm
      thicker, so the two M5×12 screws that hold it are now too short. They need to become M5×16,
      plus a washer each.

      He could just open the structure and start editing. But reviewers would then see *"SC-2000
      B.1"* with no clue what moved. Instead Kai **redlines** it: he marks his edits on the
      structure like a teacher's red pen - *remove this, add that, change this quantity* - so
      everyone can see exactly what changes before it becomes real.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "marking proposed BOM edits in red" → *[[redline]]* (BOM redline, redlining)
      - "turning the markup into the real new version" → *applying* the redline
      - "the ripple effects, written down" → *[[change-impact-analysis]]*, often summarised in an impact report
      - "everywhere this part is used" → *[[where-used]]*

  - type: diagram
    title: Kai's redline on SC-2000
    caption: Red is removed, green is added, amber is changed. Click each line of the markup.
    diagram:
      width: 800
      height: 400
      nodes:
        - id: frame
          label: SC-2000 frame assy
          sublabel: redline in Task 2
          x: 300
          y: 20
          w: 200
          h: 64
          tone: primary
          detail: |
            The assembly being redlined. The redline is captured **in the context of the change
            task**, so it carries the who, why and when of every edit.
        - id: tube
          label: SC-2010 main tube
          sublabel: unchanged
          x: 20
          y: 160
          w: 170
          tone: neutral
          detail: Untouched lines stay neutral. Reviewers can ignore them.
        - id: bracket
          label: SC-1048 bracket
          sublabel: unchanged link
          x: 210
          y: 160
          w: 170
          tone: neutral
          detail: |
            The usage link to the bracket doesn't change - the bracket's own revision (B) is
            handled by Task 1. Which revision the structure shows depends on how you filter it.
        - id: oldscrew
          label: SC-2510 M5×12
          sublabel: "REMOVED · qty 2"
          x: 400
          y: 160
          w: 170
          tone: danger
          detail: Marked for removal. It stays in the real BOM until the redline is applied.
        - id: newscrew
          label: SC-2511 M5×16
          sublabel: "ADDED · qty 2"
          x: 590
          y: 160
          w: 190
          tone: success
          detail: The replacement. A new part number, because a 16 mm screw doesn't fit where a 12 mm one did - it isn't interchangeable.
        - id: washer
          label: SC-2520 washer
          sublabel: "ADDED · qty 2"
          x: 590
          y: 290
          w: 190
          tone: success
          detail: An extra line. Added in the redline so the reviewer sees it next to the screw swap that needs it.
        - id: hinge
          label: SC-1042 hinge
          sublabel: "CHANGED · find no."
          x: 400
          y: 290
          w: 170
          tone: warning
          detail: Shown here as an example only. Not every edit is add or remove - quantities, units and other usage attributes can be marked as changed too.
      edges:
        - { from: frame, to: tube }
        - { from: frame, to: bracket }
        - { from: frame, to: oldscrew, dashed: true }
        - { from: frame, to: newscrew }
        - { from: frame, to: washer }
        - { from: frame, to: hinge }

  - type: callout
    variant: why-it-matters
    md: |
      A BOM edit that nobody can see is a BOM edit nobody can review. Redlines turn "trust me" into
      "here are the four lines that change". Manufacturing can plan stock, purchasing can order
      the new screw, and the reviewer approves *exactly* what will be applied - nothing more.

  - type: walkthrough
    title: Redline a BOM in a change task
    who: The change task assignee - here Kai on Task 2
    where: [Home, My Tasks, Task 2 of CN-0101]
    steps:
      - title: Open the change task
        where: [Home, My Tasks]
        md: Open the work item and then the change task. Check that SC-2000 is in its affected objects.
      - title: Start a redline on the assembly
        where: [Change task, Affected Objects table, SC-2000, Actions]
        md: |
          Look for a **redline** action on the affected assembly (it may be called something
          like "Create Redline" or open a structure editor in redline mode). The exact name,
          location and availability **depend on your release and configuration**. If you don't
          see it, ask your change administrator how BOM edits are proposed in your company.
      - title: Mark your edits
        where: [Structure editor, redline mode]
        md: |
          Remove SC-2510, add SC-2511 with quantity 2, add SC-2520 with quantity 2. Each edit is
          shown as added, removed or changed instead of silently overwriting the structure.
      - title: Save and explain
        where: [Redline, Save, then task comments]
        md: Save the redline. In the task comment, say why ("bracket +1 mm, screws need +4 mm engagement").
      - title: Send it for review
        where: [Task page, Complete Task]
        md: Complete your task. The reviewer opens the redline and sees each marked line.
      - title: Apply after approval
        where: [Change task, redline, Apply]
        md: |
          Once approved, the redline is applied to create the new structure version (SC-2000 B.1),
          which becomes a resulting object. Who applies it and when is set by your process.
    result: Task 2 has a reviewable redline, and after approval a resulting SC-2000 B.1 that matches it exactly.

  - type: simulation
    title: Redline sandbox for SC-2000
    intro: |
      Mark up the frame assembly, send it for review and apply it. The real BOM only changes when
      you **apply** an approved redline. The reviewer (Ana) won't approve unless the screw swap is
      in the markup - try submitting without it.
    headline: "SC-2000 {structure} · redline: {redline} · screw: {screw} · washer: {washer}"
    initial: { structure: A.3 Released, redline: Draft, screw: SC-2510 M5x12, washer: none }
    actions:
      - id: swap
        label: Mark screw swap to SC-2511
        when: { redline: Draft, screw: SC-2510 M5x12 }
        do: [{ set: { screw: SC-2511 M5x16 (redlined) } }]
        log: SC-2510 marked removed, SC-2511 marked added. The real BOM hasn't changed.
        blockedHint: Only while the redline is a draft and the swap isn't marked yet.
      - id: unswap
        label: Undo screw swap
        when: { redline: Draft, screw: SC-2511 M5x16 (redlined) }
        do: [{ set: { screw: SC-2510 M5x12 } }]
        log: Screw swap removed from the markup.
        blockedHint: Nothing to undo.
      - id: washer
        label: Mark washer added
        when: { redline: Draft, washer: none }
        do: [{ set: { washer: SC-2520 x2 } }]
        log: SC-2520 washer, qty 2, marked as added.
        blockedHint: Only while the redline is a draft and the washer isn't marked yet.
      - id: unwasher
        label: Undo washer
        when: { redline: Draft, washer: SC-2520 x2 }
        do: [{ set: { washer: none } }]
        log: Washer removed from the markup.
        blockedHint: Nothing to undo.
      - id: submit
        label: Submit redline for review
        when: { redline: Draft }
        do: [{ set: { redline: In Review } }]
        log: Ana gets a review task showing every marked line.
        blockedHint: The redline is already submitted.
      - id: reject
        label: "Ana: reject"
        when: { redline: In Review }
        do: [{ set: { redline: Draft } }]
        log: "Ana: the 12 mm screws are too short for the 4 mm bracket. Back to draft."
        blockedHint: Nothing is in review.
      - id: approve
        label: "Ana: approve"
        when: { redline: In Review, screw: SC-2511 M5x16 (redlined) }
        do: [{ set: { redline: Approved } }]
        log: Approved. The markup is exactly what will change.
        blockedHint: Ana won't approve without the screw swap. Reject it and fix the markup.
      - id: apply
        label: Apply redline
        when: { redline: Approved }
        do: [{ set: { redline: Applied, structure: B.1 In Work, screw: SC-2511 M5x16 } }]
        log: Applied. SC-2000 B.1 now exists with the new screws - a resulting object of Task 2.
        blockedHint: Only an approved redline can be applied.
      - id: reset
        label: Start over
        when: { redline: Applied }
        do: [{ set: { structure: A.3 Released, redline: Draft, screw: SC-2510 M5x12, washer: none } }]
        log: Back to SC-2000 A.3 with an empty redline.
        blockedHint: Finish this run first.
    goals:
      - label: Get a redline approved
        when: { redline: Approved }
        message: The reviewer approved exactly what's marked.
      - label: Apply a redline with screw and washer
        when: { redline: Applied, washer: SC-2520 x2 }
        message: The real structure changed only now - and only as approved.

  - type: text
    md: |
      ### Reading a change impact report

      Before a CR is approved (and again before a task is applied), someone asks *"what else does
      this hit?"* The answer is a **change impact report**. Some companies use built-in tables
      on the change request, some run a report, some export to a spreadsheet. The *content* is
      what matters. Here is what the one for the screw swap boils down to (example data, not a
      Windchill screen):

      | Section | What it says for SC-2510 → SC-2511 | How to read it |
      | --- | --- | --- |
      | Where used | SC-2510 is used in **SC-2000** and **SC-4000 handlebar** | Your redline only touches SC-2000. The handlebar keeps SC-2510. |
      | End items | Scooter S2 (via both) | Every S2 is affected by the SC-2000 part of the change. |
      | Open changes | CN-0095 is revising SC-2000 | Coordinate, or the two changes collide. |
      | Stock + orders | 5,000 SC-2510 in stock · 0 SC-2511 | Don't scrap SC-2510 - the handlebar still needs it. Order SC-2511. |
      | Documents | Work instruction for frame assembly references the screw | Needs updating - that's Task 3. |

      Read it in that order: **where used → end items → open changes → stock → documents**. Each
      row should either be "no action" or map to a task on the change notice.

  - type: scenario
    variant: what-if
    title: '"Can''t we just make the old screw longer?"'
    start: s1
    nodes:
      - id: s1
        md: |
          Ana suggests a shortcut: instead of a new part number, **revise SC-2510** and change its
          length from 12 mm to 16 mm. No BOM redline needed! What does the impact report tell you?
        choices:
          - label: Fine - fewer part numbers is always better
            next: f1
            feedback: Look at where used first. SC-2510 isn't only in the frame.
          - label: SC-2510 is also used in the SC-4000 handlebar - a longer screw there could bottom out
            next: s2
            good: true
            feedback: Exactly. Revising a shared part changes it everywhere it's used.
      - id: s2
        md: |
          Right. And the stock report shows 5,000 M5×12 screws on the shelf, all labelled SC-2510.
          After a revision, which SC-2510 would a picker grab?
        choices:
          - label: Any of them - same number, so they're interchangeable
            next: p1
            feedback: That's the trap. Same number, different length, mixed in one bin.
          - label: "Nobody can tell - so a changed fit means a new number: keep the redline swap to SC-2511"
            next: win
            good: true
            feedback: Yes. If form, fit or function changes, it usually deserves a new part number. You'll go deeper in the configuration management section.
      - id: win
        md: |
          Kai keeps the redline: SC-2510 out, SC-2511 in, only on SC-2000. The handlebar is untouched,
          the stock stays usable and the impact report has no surprises left.
        outcome: success
      - id: f1
        md: |
          SC-2510 B is released at 16 mm. The next handlebar build uses the longer screw, which
          hits the brake lever mount. A new PR lands on Maya's desk on Monday.
        outcome: fail
      - id: p1
        md: |
          The factory mixes 12 mm and 16 mm screws under one number. Some frames get short screws.
          Quality has to sort the bins by hand.
        outcome: partial

  - type: callout
    variant: pitfall
    md: |
      **Editing the released structure directly "because it's quicker".** Even if your permissions
      allow it, you lose the review trail, the impact check and the link to the change. When
      someone asks why the screw changed, the answer is "no idea".

  - type: callout
    variant: pro-tip
    md: Run **Where Used** on every part you remove or replace in a redline - not just on the assembly you're editing. Shared parts are where surprises hide.

  - type: summary
    points:
      - A redline marks proposed BOM edits - added, removed, changed - in the context of a change task.
      - The real structure changes only when an approved redline is applied, producing a resulting object.
      - A change impact report covers where used, end items, open changes, stock and documents.
      - Revising a shared part changes it everywhere; a change in fit usually needs a new part number.
