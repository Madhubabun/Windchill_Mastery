id: m03-s02-l05
subtitle: Mark up the BOM in red, read the ripple effects, and only then make it real.
version: 1.1.0
updated: "2026-10-14"
tags: [change, redline, bom, impact-analysis, where-used]
sources:
  - id: te
    where: "Module 2: Activity: View information pages (Where Used and Changes tabs); Module 6: Plan concurrent changes to the same affected objects; Identify best practices when using redlines; Use a redline to manage concurrent change: example; Explore some of the options on the Changes tab (Change Monitor, Reports)"
  - id: pf
    where: "Module 4: Plan concurrent changes to the same affected objects; Activity: Plan concurrent changes using the BOM redline (Enable BOM Redline preference, Change Summary Redline column, BOM Redline tab, View Summary Report); Assess the impact of a change to a business object"
versionNotes:
  - versions: ["12.0.1+"]
    md: The course manuals say the redline feature arrived in Windchill 12.0.1.0 and was much improved in 12.0.2.0. It ships out of the box, but an administrator must switch it on.

blocks:
  - type: text
    md: |
      Kai is planning CN-0101, and Task 2 is his own: update the **SC-2000 frame assembly**. The new
      bracket is 1 mm thicker, so the two M5×12 screws that hold it are now too short. They need to
      become M5×16, plus a washer each.

      There's a catch. **CN-0095**, the frame paint change, is already open on SC-2000. If Kai creates
      SC-2000 B.1 now, the two changes trip over each other. So he **redlines** it instead: he marks
      his edits on the structure like a teacher's red pen - *remove this, add that, change this
      quantity* - on the latest released SC-2000, without creating the next revision yet. Everyone can
      see exactly what will change, and the paint change can keep going in parallel.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "marking proposed BOM edits in red" → *[[redline]]* (BOM redline)
      - "turning the markup into the real new version" → the redline is *merged* when the next revision is created with **Revise** inside the change
      - "the switch that turns it on" → the *Enable BOM Redline* preference
      - "the ripple effects, written down" → *[[change-impact-analysis]]* (general PLM practice)
      - "everywhere this part is used" → *[[where-used]]*

  - type: diagram
    title: Kai's redline on SC-2000
    caption: Red is removed, green is added, amber is changed. Click each line of the markup.
    diagram:
      width: 800
      height: 400
      nodes:
        - id: frame
          label: SC-2000 frame assy
          sublabel: redline on A.3
          x: 300
          y: 20
          w: 200
          h: 64
          tone: primary
          detail: |
            The redline is created from **CN-0101** while it's being planned, on the latest released
            version (A.3). No B.1 exists yet, so CN-0095 can plan its own changes to the same assembly.
        - id: tube
          label: SC-2010 main tube
          sublabel: unchanged
          x: 20
          y: 160
          w: 170
          tone: neutral
          detail: Untouched lines stay neutral. Reviewers can ignore them.
        - id: bracket
          label: SC-1048 bracket
          sublabel: unchanged link
          x: 210
          y: 160
          w: 170
          tone: neutral
          detail: |
            The usage link to the bracket doesn't change - the bracket's own revision (B) is
            handled by Task 1. Which revision the structure shows depends on how you filter it.
        - id: oldscrew
          label: SC-2510 M5×12
          sublabel: "REMOVED · qty 2"
          x: 400
          y: 160
          w: 170
          tone: danger
          detail: Old entries are shown struck through. It stays in the real BOM until the redline is merged into the next revision.
        - id: newscrew
          label: SC-2511 M5×16
          sublabel: "ADDED · qty 2"
          x: 590
          y: 160
          w: 190
          tone: success
          detail: The replacement. A new part number, because a 16 mm screw doesn't fit where a 12 mm one did - it isn't interchangeable.
        - id: washer
          label: SC-2520 washer
          sublabel: "ADDED · qty 2"
          x: 590
          y: 290
          w: 190
          tone: success
          detail: An extra line. Added in the redline so the reviewer sees it next to the screw swap that needs it.
        - id: hinge
          label: SC-1042 hinge
          sublabel: "CHANGED · qty"
          x: 400
          y: 290
          w: 170
          tone: warning
          detail: Shown here as an example only. Not every edit is add or remove - a redline can also change a quantity.
      edges:
        - { from: frame, to: tube }
        - { from: frame, to: bracket }
        - { from: frame, to: oldscrew, dashed: true }
        - { from: frame, to: newscrew }
        - { from: frame, to: washer }
        - { from: frame, to: hinge }

  - type: callout
    variant: why-it-matters
    md: |
      Without redlines, two changes on the same assembly have ugly choices: back out one change's
      edits so the other can pass, or release revisions out of order. A redline lets both teams plan
      at the same time. When one change releases, Windchill brings the other change's open redlines
      up to date - or marks them as **suspect** if the edits conflict and a person has to sort it out.
      And a visible markup turns "trust me" into "here are the four lines that change".

  - type: walkthrough
    title: Plan a BOM change with a redline
    who: The Change Admin II planning the change notice (here Kai); an administrator switches the feature on
    where: [CN-0101 information page, Change Summary, Redline, Create]
    steps:
      - title: Make sure redlines are switched on
        where: [Navigator, Browse, Organizations, "<your org>", Utilities, Preference Management]
        md: |
          An administrator searches the preference tree for **redline** and sets **Enable BOM
          Redline** to **Yes**.
      - title: Show the Redline column
        where: [CN-0101 information page, Change Summary, Customize]
        md: |
          On the change notice, open the **Change Summary** table. From its view list choose
          **Customize** and save a view that includes the **Change Intent** and **Redline** columns.
      - title: Create the redline
        where: [Change Summary, Redline column, Create]
        md: In the SC-2000 row, click **Create** in the **Redline** column. The **BOM Redline** tab opens on the latest released structure.
      - title: Mark your edits
        where: [BOM Redline tab, Uses tab]
        md: |
          Remove SC-2510 with **Remove selected**, insert the SC-2511 screw and SC-2520 washer lines
          and type quantity **2** for each. Each edit is tracked with visual markers instead of
          silently overwriting the structure. Then right-click SC-2000 and **Check In** the redline.
      - title: Revise inside the change to merge it
        where: [Edit change task, Affected Objects, Change Intent, Revise]
        md: |
          When it's time to implement, set the affected SC-2000's **Change Intent** to **Revise** and
          click **Revise** in the change task. The planned redline edits are merged into the new
          revision, SC-2000 B.1, which becomes a resulting object.
      - title: Look back at it any time
        where: [CN-0101 information page, Actions, View Summary Report]
        md: |
          The redline stays viewable during and after the change - use **View** in the Redline
          column, or **View Summary Report** on the change notice to see the redline changes listed.
    result: Task 2 has a visible, reviewable redline, and the resulting SC-2000 B.1 contains exactly the planned edits.

  - type: simulation
    title: Redline sandbox for SC-2000
    intro: |
      Mark up the frame assembly, get the plan reviewed and then revise. The real BOM only changes
      when the redline is **merged** into the next revision. In this sandbox the plan reviewer (Ana)
      won't approve unless the screw swap is in the markup - try sending it without. How redlines are
      reviewed in your company depends on its change process.
    headline: "SC-2000 {structure} · redline: {redline} · screw: {screw} · washer: {washer}"
    initial: { structure: A.3 Released, redline: Draft, screw: SC-2510 M5x12, washer: none }
    actions:
      - id: swap
        label: Mark screw swap to SC-2511
        when: { redline: Draft, screw: SC-2510 M5x12 }
        do: [{ set: { screw: SC-2511 M5x16 (redlined) } }]
        log: SC-2510 shown struck through, SC-2511 marked added. The real BOM hasn't changed.
        blockedHint: Only while the redline is a draft and the swap isn't marked yet.
      - id: unswap
        label: Undo screw swap
        when: { redline: Draft, screw: SC-2511 M5x16 (redlined) }
        do: [{ set: { screw: SC-2510 M5x12 } }]
        log: Screw swap removed from the markup.
        blockedHint: Nothing to undo.
      - id: washer
        label: Mark washer added
        when: { redline: Draft, washer: none }
        do: [{ set: { washer: SC-2520 x2 } }]
        log: SC-2520 washer, qty 2, marked as added.
        blockedHint: Only while the redline is a draft and the washer isn't marked yet.
      - id: unwasher
        label: Undo washer
        when: { redline: Draft, washer: SC-2520 x2 }
        do: [{ set: { washer: none } }]
        log: Washer removed from the markup.
        blockedHint: Nothing to undo.
      - id: submit
        label: Check in the redline for plan review
        when: { redline: Draft }
        do: [{ set: { redline: In Review } }]
        log: The redline is checked in. Ana looks at every marked line as part of the plan.
        blockedHint: The redline is already checked in.
      - id: reject
        label: "Ana: send back"
        when: { redline: In Review }
        do: [{ set: { redline: Draft } }]
        log: "Ana: the 12 mm screws are too short for the 4 mm bracket. Back to draft."
        blockedHint: Nothing is in review.
      - id: approve
        label: "Ana: approve"
        when: { redline: In Review, screw: SC-2511 M5x16 (redlined) }
        do: [{ set: { redline: Approved } }]
        log: Approved. The markup is exactly what will change.
        blockedHint: Ana won't approve without the screw swap. Send it back and fix the markup.
      - id: apply
        label: Revise SC-2000 in the change task
        when: { redline: Approved }
        do: [{ set: { redline: Merged, structure: B.1 In Work, screw: SC-2511 M5x16 } }]
        log: Revised inside CN-0101. The redline is merged, and SC-2000 B.1 is a resulting object of Task 2.
        blockedHint: Revise only after the planned redline is approved.
      - id: reset
        label: Start over
        when: { redline: Merged }
        do: [{ set: { structure: A.3 Released, redline: Draft, screw: SC-2510 M5x12, washer: none } }]
        log: Back to SC-2000 A.3 with an empty redline.
        blockedHint: Finish this run first.
    goals:
      - label: Get a redline approved
        when: { redline: Approved }
        message: The reviewer approved exactly what's marked.
      - label: Merge a redline with screw and washer
        when: { redline: Merged, washer: SC-2520 x2 }
        message: The real structure changed only now - and only as planned.

  - type: text
    md: |
      ### Reading a change impact report

      Before a CR is approved, someone asks *"what else does this hit?"* The written answer is often
      called a **change impact report**. That's general PLM practice, not one fixed Windchill screen:
      you collect the facts from the **Where Used** and **Changes** tabs, the change **Reports** under
      **Browse** > **Changes**, and the change notice's **View Summary Report**. (The PLM Foundation
      Pacesetter's full track even adds impact assessment tasks for areas like design,
      manufacturing, procurement, quality and service.) Stock and order numbers usually come from
      ERP. Here is what the one for the screw swap boils down to (example data, not a Windchill screen):

      | Section | What it says for SC-2510 → SC-2511 | How to read it |
      | --- | --- | --- |
      | Where used | SC-2510 is used in **SC-2000** and **SC-4000 handlebar** | Your redline only touches SC-2000. The handlebar keeps SC-2510. |
      | End items | Scooter S2 (via both) | Every S2 is affected by the SC-2000 part of the change. |
      | Open changes | CN-0095 is changing SC-2000 | Plan with redlines and coordinate, or the two changes collide. |
      | Stock + orders | 5,000 SC-2510 in stock · 0 SC-2511 | Don't scrap SC-2510 - the handlebar still needs it. Order SC-2511. |
      | Documents | Work instruction for frame assembly references the screw | Needs updating - that's Task 3. |

      Read it in that order: **where used → end items → open changes → stock → documents**. Each
      row should either be "no action" or map to a task on the change notice.

  - type: scenario
    variant: what-if
    title: '"Can''t we just make the old screw longer?"'
    start: s1
    nodes:
      - id: s1
        md: |
          Ana suggests a shortcut: instead of a new part number, **revise SC-2510** and change its
          length from 12 mm to 16 mm. No BOM redline needed! What does the impact report tell you?
        choices:
          - label: Fine - fewer part numbers is always better
            next: f1
            feedback: Look at where used first. SC-2510 isn't only in the frame.
          - label: SC-2510 is also used in the SC-4000 handlebar - a longer screw there could bottom out
            next: s2
            good: true
            feedback: Exactly. Revising a shared part changes it everywhere it's used.
      - id: s2
        md: |
          Right. And the stock report shows 5,000 M5×12 screws on the shelf, all labelled SC-2510.
          After a revision, which SC-2510 would a picker grab?
        choices:
          - label: Any of them - same number, so they're interchangeable
            next: p1
            feedback: That's the trap. Same number, different length, mixed in one bin.
          - label: "Nobody can tell - so a changed fit means a new number: keep the redline swap to SC-2511"
            next: win
            good: true
            feedback: Yes. As a general rule, if form, fit or function changes, it deserves a new part number. You'll go deeper in the configuration management section.
      - id: win
        md: |
          Kai keeps the redline: SC-2510 out, SC-2511 in, only on SC-2000. The handlebar is untouched,
          the stock stays usable and the impact report has no surprises left.
        outcome: success
      - id: f1
        md: |
          SC-2510 B is released at 16 mm. The next handlebar build uses the longer screw, which
          hits the brake lever mount. A new PR lands on Maya's desk on Monday.
        outcome: fail
      - id: p1
        md: |
          The factory mixes 12 mm and 16 mm screws under one number. Some frames get short screws.
          Quality has to sort the bins by hand.
        outcome: partial

  - type: callout
    variant: pitfall
    md: |
      **Creating the resulting revision too early.** Once a change task has a resulting object, no
      new redline can be created on it - and the next revision is already taken. Plan with the
      redline first and revise when implementation starts. By then, all redlines should be approved.

  - type: callout
    variant: pro-tip
    md: Run **Where Used** on every part you remove or replace in a redline - not just on the assembly you're editing. Shared parts are where surprises hide.

  - type: summary
    points:
      - A redline marks proposed BOM edits - added, removed, changed - on the latest released structure while a change notice is planned.
      - The real structure changes only when the next revision is created with Revise inside the change, which merges the redline.
      - Redlines let several change notices plan changes to the same object at once; an administrator must enable them.
      - A change impact report (general practice) covers where used, end items, open changes, stock and documents.
      - Revising a shared part changes it everywhere; a change in fit usually needs a new part number.
