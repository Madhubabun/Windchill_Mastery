id: m07-s07-l02
subtitle: A battery cell gets hot on the Lakeside line. To find out why, Acme needs the design, the plant and the machine data to talk to each other.
version: 1.0.0
updated: "2026-10-11"
tags: [integration, digital-thread, mes, thingworx, iot, architecture]
