id: m07-s10-l07
subtitle: Don't make users type part numbers from memory. Give them a search-and-pick button - mostly with configuration, not code.
version: 1.0.0
updated: "2026-10-11"
tags: [customization, developer, pickers, wizards, jsp, ui-framework]
sources:
  - id: cus-pick
    where: "Pickers theory (picker methodology, ready picker components, tag libraries); Exercise 7 Picker for Part (definition, steps 1 to 4); Pickers.pptx exercise slides (picker flow, custom-actions.xml, partPicker.jsp, pickerAttributes.xml)"
  - id: cus-ex
    where: "Customization All Exercises: Pickers (action, itemPicker tag, pickerAttributes.xml)"
