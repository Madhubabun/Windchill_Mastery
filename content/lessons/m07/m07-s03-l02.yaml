id: m07-s03-l02
subtitle: An assembly never travels alone. Learn what Windchill collects with it - and what it quietly leaves behind.
version: 1.0.0
updated: "2026-10-11"
tags: [cad, creo, check-in, dependents, collector, conflicts]
sources:
  - id: te
    where: "Module 4: Update CAD documents: check in; Activity: Update a CAD part and associated WTPart (Auto Check In and Custom Check In); Work with CAD assemblies; Activity: Modify a CAD assembly and its associated WTPart structure (Check In wizard, Set Options, Remove from Workspace, Auto Associate Parts to CAD Documents); Import and export CAD documents; Activity: Import and export CAD documents (incomplete CAD documents, Event Management, Conflict Management, Auto resolve incomplete objects)"
