id: m07-s11-l02
subtitle: Maya wants every E1 battery part and its approved alternates - from code, not a saved search. Theo writes his first real QuerySpec.
version: 1.0.0
updated: "2026-10-13"
tags: [customization, developer, architect, queryspec, persistence, server-side]
sources:
  - id: trn-advdev
    where: "Section 11: QueryResult (full objects vs single columns, appendSelect with int[]); QuerySpec constructors and method table (appendClassList, appendWhere with int[], appendAnd, appendOr, appendOpenParen, appendCloseParen, appendJoin, appendSelect, appendOrderBy, getResultIndex, setQueryLimit, toString, deprecated overloads); StatementSpec; SearchCondition and ColumnExpression classes (ClassAttribute, SQLFunction, SubSelectExpression, ConstantExpression, DateExpression, ArrayExpression); compound query with WTPartMaster and WTPartAlternateLink roles; Access control consideration (AdvancedQueryAccessException, setAdvancedQueryEnabled, find vs PersistenceServerHelper.manager.query); Sorting (OrderBy, column alias, reserved words); Join support (appendJoin with link roles); Table Builder example (PersistenceHelper.manager.find)"
