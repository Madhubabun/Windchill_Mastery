id: m07-s10-l04
subtitle: The user clicks Finish. What runs next, in what order, and inside which transaction? That's the form processor's job.
version: 1.0.0
updated: "2026-10-11"
tags: [customization, developer, form-processors, wizards, transactions, ui-framework]
sources:
  - id: cus-fp
    where: "Form Processor theory: solution elements (1/2, 2/2); wizard processing control flow; class diagrams; task flow of DefaultFormProcessorController; task flow of form processing; processor delegates (1/3 to 3/3); delegate registration; code example; Form Result"
  - id: cus-ex
    where: "Customization All Exercises: Form Processor exercise (action with class attribute, wizard JSP, Part_FP doOperation)"
  - id: trn-code
