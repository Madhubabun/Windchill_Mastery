id: m07-s13-l06
subtitle: One overloaded structure for every E1 - then a filter and a publication structure turn it into the exact manual for one bike.
version: 1.0.0
updated: "2026-10-11"
tags: [service, applicability, options-and-choices, publication-structure, filtering]
sources:
  - id: sis
    where: "Module 7: Define service applicability: overview; Manage service applicability; Options and choices; Option pool; Rules for options and choices: overview and types; Option sets; Activity: Use options, choices, and rules to manage applicability in an information structure; Module 8: Describe publication structures; Add a table of contents to a publication structure; Add an index to a publication structure; Add content to a publication structure; Activity: Create a publication structure"
  - id: te
    where: "Appendix A: Organize and manage service content in Windchill (publication structures)"
versionNotes:
  - versions: ["All releases"]
    md: |
      Options, choices, rules and option sets belong to Windchill's Options and Variants capability, covered
      in depth in its own section. This lesson uses them only for service applicability, as the service
      course does.

blocks:
  - type: text
    md: |
      Acme sells the E1 with three batteries (**400, 500 and 625 Wh**) and two frame colours. The 625 Wh pack
      has its own mounting procedure. Zoe could build six information structures. Instead she builds **one**
      that holds everything - and tags each piece of content with *which bikes it is for*.

      That tagging is [[service-applicability]]. A filter then shows a technician only the content for the bike
      in front of them, and a [[publication-structure]] turns the filtered content into a real manual.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "which bikes this content is for" → [[service-applicability]]
      - "by serial number or date" → **service effectivity** (see [[serial-effectivity]], [[date-effectivity]])
      - "a feature and its possible values" → **option** and **choice** (Battery = 625 Wh)
      - "the list of options a product may use" → **option pool**, narrowed into an **option set** assigned to the product
      - "one structure holding all variants" → **overloaded** service structure
      - "pick a configuration and hide the rest" → **option filter**

  - type: animation
