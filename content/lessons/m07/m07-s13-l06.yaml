          sublabel: group
          x: 40
          y: 150
          w: 140
          tone: accent
        - id: g-frame
          label: Frame
          sublabel: group
          x: 360
          y: 150
          w: 140
          tone: accent
        - id: e-400
          label: Mount 400/500
          sublabel: Battery = 400 or 500
          x: 30
          y: 280
          w: 150
