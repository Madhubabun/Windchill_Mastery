id: m07-s10-l03
subtitle: Change how one attribute looks or behaves - in a table, on an info page, in a wizard - without rebuilding the page.
version: 1.0.0
updated: "2026-10-11"
tags: [customization, developer, data-utilities, gui-components, ui-framework]
sources:
  - id: cus-du
    where: "DataUtility theory: introduction; basic concepts (GUI components, component descriptor, component model); registration of DataUtility; register DataUtility on the attribute; result; suggestion box. Exercise 5 Data Utility for Name(Number); Link for Related Part or Document exercise"
  - id: cus-mvc
    where: "MVC Builders theory: Specifying Datautility for columns (setDataUtilityId, service.properties entry)"
  - id: trn-framework
    where: "Windchill Framework Customization slides: Data Utility concept, registering a data utility, restart and test; Data Utility.txt sample (GUIComponentArray, UrlDisplayComponent, IconComponent)"
