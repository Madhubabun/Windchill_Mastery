id: m07-s13-l05
subtitle: Stop writing manuals. Write small topics once - and let structures assemble them into every manual you need.
version: 1.0.0
updated: "2026-10-11"
tags: [service, authoring, xml, dita, arbortext-editor]
sources:
  - id: sis
    where: "Module 6: Author service content: overview; Create content using PTC Arbortext Editor; Perform topic-based authoring with XML and DITA; Activity: Add technical content to an information structure using Arbortext Editor"
  - id: te
    where: "Module 1: Manage service part information and instruction (step-by-step work instructions and service content)"

blocks:
  - type: text
    md: |
      The E1 and the Scooter S2 share the same battery latch. Zoe's predecessor wrote the latch procedure
      **three times**: in the E1 owner's manual, the E1 workshop manual and the S2 workshop manual. When the
      latch changed, two of the three got fixed.

      Zoe writes it **once**, as a small self-contained topic, stores it in Windchill and links it into every
      structure that needs it. Change it once - every publication picks it up.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "text with tags that say what each part *is*" → **XML** (Extensible Markup Language)
      - "writing small reusable chunks instead of whole books" → **topic-based (structured) authoring**
      - "the XML standard for topics" → [[dita]]
      - "a topic that explains / a topic with steps / a lookup table" → **Concept / Task / Reference**
      - "the XML editor" → **PTC Arbortext Editor**
      - "the topic as stored in Windchill" → **dynamic document**

