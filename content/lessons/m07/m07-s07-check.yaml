sources:
  - id: esi
    where: "Module 1: ERP and PLM comparison (data ownership); Module 2: Windchill-ERP integration options; What is Windchill ESI?; Windchill ESI architecture; ERP Connector; Comparing integration options; Open API interface"
  - id: erp
    where: "Module 1: ERP Connector overview; ERP Connector in comparison to ESI; ERP integration software: decision flow; ERP Connector administration (ESI Administrators and ESI Authors). Module 2: Distribution targets; Distribution target assignment strategy; Publishing business objects (RTM workflow); ESI Transaction Administration (Enable Post Result, Pending)"
