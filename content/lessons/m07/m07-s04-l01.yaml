id: m07-s04-l01
subtitle: A rider's complaint about a rattling battery is the start of a loop - and the loop only closes when the design data changes and the rattle stops.
version: 1.0.0
updated: "2026-10-13"
tags: [quality, closed-loop-quality, capa, customer-experience, change-management]
