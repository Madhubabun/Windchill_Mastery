blocks:
  - type: text
    md: |
      Ten questions across the whole **CAD integration** section: connecting Creo and its workspace, check-in
      and collection rules, family tables, ECAD-MCAD exchange and Workgroup Manager for third-party CAD tools.
      Score 80% to pass. Every answer explains itself, so a miss is still a lesson.

  - type: quiz
    title: Section checkpoint
    passMark: 0.8
    questions:
      - kind: order
        prompt: Put the journey of one change to eb1_motor_mount.prt in order.
        items: [Edit in the Creo session, Save to the local workspace cache, Upload to the server-side workspace, Check in as a new iteration in the commonspace]
        explanation: Save keeps the change on your PC, Upload backs it up privately on the server, and only Check In creates a shared iteration others can see.
      - kind: single
        prompt: Priya's check-in failed and Creo shows an error in the lower panel. Where does she read the reason?
        options: [Server Management, Event Management, The Model Tree, The Folder Browser]
        answer: 1
        explanation: Event Management shows the messages from Windchill commands and offers View Conflicts for the details.
      - kind: single
        prompt: Priya checks in eb1_frame.asm with the default collection. Which object will be missing unless she adds it on purpose?
        options: [eb1_motor_mount.prt, The eb1_bolt_m6x20 instance used in the frame, The drawing eb1_frame.drw, A library part used in the frame]
        answer: 2
        explanation: A drawing references the assembly, so it is not a dependent. Add it with the advanced collection option Add drawings.
      - kind: multi
        prompt: Which Check In options should Priya think about for an assembly whose models already have Windchill parts? (Choose all that apply.)
        options: [Clear Auto Associate Parts to CAD Documents, Undo Checkout Unmodified Objects, Remove from Workspace when the task is done, Use Auto resolve incomplete objects on every check-in]
        answers: [0, 1, 2]
        explanation: Auto-associating would try to create parts that already exist. Undo Checkout Unmodified Objects and Remove from Workspace keep things tidy. Auto-resolve is a last resort, not a habit.
      - kind: truefalse
        prompt: The generic of a family table can be changed by typing new values into its row of the table.
        answer: false
        explanation: The generic is the first row, but its entries change only when you change the model itself (or suppress or resume features).
      - kind: single
        prompt: Leo sees an instance marked as not verified on the Family tab. What does that tell him?
        options: [The instance failed to upload, The row has not been regenerated and verified in Creo, The instance is checked out by someone, The generic is missing]
        answer: 1
        explanation: Windchill uploads instances even when they were never verified. Opening the generic and running Tools → Verify in the Family Table editor fixes the status.
      - kind: single
        prompt: Priya changes a generic-driven attribute of the bolt family in Windchill. What must be checked out?
        options: [Only the instance she selected, Only the generic, Every member of the family, Nothing - attributes don't need check-out]
        answer: 2
        explanation: A generic-driven attribute is shared by every member, so all members must be checked out. Table-driven changes need only the instance.
      - kind: single
        prompt: How does PTC recommend storing ECAD-MCAD IDX files in Windchill?
        options: [Every IDX file as a new document, Each baseline as its own document and the increments between baselines as iterations of one document, All IDX files as attachments on the board's CAD document, Only the final baseline]
        answer: 1
        explanation: Baselines are separate documents; the proposals and responses between two baselines are iterations of one document, which keeps the negotiation in one history.
      - kind: order
        prompt: Put Rosa's first-time Workgroup Manager setup for SOLIDWORKS in order.
        items: [Install Workgroup Manager on the CAD workstation, Register SOLIDWORKS with Tools → Application Management, Register the Windchill server, Set it as the primary server, Activate a workspace]
        explanation: The CAD application must be registered before its Windchill actions appear, and the primary server must be set before you can manage CAD objects.
      - kind: multi
        prompt: Which statements about third-party CAD tools are true? (Choose all that apply.)
        options: [Creo connects out of the box while SOLIDWORKS needs Workgroup Manager, The workspace and commonspace model is the same, Every CAD tool offers exactly the same PDM actions, Only one version of a CAD application can be registered at a time]
        answers: [0, 1, 3]
        explanation: Concepts carry over from Creo, but PDM actions vary by tool - for example Save Modified Instances exists for SOLIDWORKS.

  - type: flashcards
    cards:
      - front: Save vs Upload vs Check In
        back: Save → local cache. Upload → server-side workspace (private, backed up). Check In → new iteration in the commonspace.
      - front: Where do you register a Windchill server in Creo?
        back: File → Manage Session → Server Management, then Set as Primary Server.
      - front: Required dependents
        back: The files a CAD model can't open without, such as an assembly's components. Drawings are not dependents.
      - front: How do you get the drawing into a check-in?
        back: Use the advanced collection option Add drawings.
      - front: Incomplete CAD document
        back: A CAD document whose content is missing. Fix the model in the CAD tool; Auto resolve incomplete objects is a last resort.
      - front: Generic (family table)
        back: The first row and parent model. Change it by changing the model, and don't use it as an assembly component.
      - front: Family table instance in Windchill
        back: Its own CAD document - searchable, downloadable and usable on its own. Uploaded even if not verified.
      - front: Incompatible family table instance conflict
        back: Replace the family members in the workspace with compatible ones - for all members at once from 13.1.2.0.
      - front: Baseline vs incremental IDX
        back: Baseline = the agreed board state (own document). Incremental = proposed changes since then (iterations of one document).
      - front: Workgroup Manager
        back: PTC's common client that connects third-party CAD tools like SOLIDWORKS, NX or CATIA V5 to Windchill.
      - front: WGM utilities
        back: Server Management, Application Management (register the CAD tool) and Event Management (events and conflicts).
