id: m07-s03-l03
subtitle: One bolt file, twelve lengths. Family tables save hours - until an instance goes unverified or won't fit in your workspace.
version: 1.0.0
updated: "2026-10-13"
tags: [cad, creo, family-tables, generics, instances, conflicts]
