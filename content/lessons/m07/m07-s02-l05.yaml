          detail: The second group. Each group holds product models.
        - id: mod-eu-city
          label: E1 City - EU
          sublabel: Product Model
          x: 20
          y: 230
          w: 180
          tone: accent
          detail: A product model can be something sold (an SKU or a customer order) or a representative configuration used for planning and validation.
        - id: mod-eu-cargo
          label: E1 Cargo - EU
          sublabel: Product Model
          x: 220
