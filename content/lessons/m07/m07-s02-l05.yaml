id: m07-s02-l05
subtitle: Two markets, three trims, a growing pile of variant specifications. A product family puts them in order, and the Matrix Editor lines them up side by side.
version: 1.0.0
updated: "2026-10-11"
tags: [options-and-variants, product-family, matrix-editor, variant-baseline, variants]
sources:
  - id: ov
    where: "Module 1: Product Families; Module 5: Implementation process steps; Product Family Management; Create a Product Family; Manage a Product Family with the Matrix Editor; Create new Product Models in the Matrix Editor; Variant baselines; Viewing variant baselines in the Matrix Editor; Activity: Create Product Families; Activity: Create a new Product Model in the Matrix Editor; Activity: Create and manage a variant baseline in the Matrix Editor"
  - id: trn-options
    where: "Core concepts: product family; stand-alone, managed and organized variant specifications"

blocks:
  - type: text
    md: |
      Six weeks in, the E1 has 17 variant specifications in a *Variants* folder. Sales asks a simple
      question: *"What's the difference between the EU City bike and the US City bike?"* Nobody can answer
      quickly, because the specs are a flat list.

      **Product Families** is the optional part of Options and Variants that fixes this. It organises
      variant specifications into a tree of models and groups, and its **Matrix Editor** shows them as
      columns next to the configurable structure - one tick per included part.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the whole range of bikes built from one platform" → [[product-family]]
      - "a folder of models, e.g. per market" → **Product Model Group**
      - "a bike we sell, or a reference build for planning" → **Product Model**
      - "a variant spec that lives inside the family" → **managed** [[variant-specification]]
      - "the side-by-side grid" → [[matrix-editor]]
      - "a frozen record of which revisions a variant used" → **variant baseline** (a special [[baseline]])

  - type: diagram
