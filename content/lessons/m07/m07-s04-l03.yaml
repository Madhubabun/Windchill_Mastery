          detail: A risk that needs a design fix becomes a problem - and from there a Windchill change object.
      edges:
        - { from: bom, to: system, label: import }
        - { from: attrs, to: worksheet, label: link to DVP }
        - { from: system, to: worksheet }
        - { from: worksheet, to: problem }
        - { from: problem, to: change, label: create }
    chapters:
      - title: Start from the real BOM
        caption: The S2 BOM in Windchill becomes the system tree in Risk and Reliability. Needs the **BOM-based quality analysis** licence.
        show: [bom, system]
        highlight: [system]
        flow: [bom>system]
        seconds: 6
      - title: Analyse the parts
        caption: Leo's FMEA works on the imported parts, not a retyped list.
        show: [bom, system, worksheet]
        highlight: [worksheet]
        flow: [system>worksheet]
        seconds: 5
      - title: Tie checks to attributes
        caption: Global attributes link to DVPs and control plans - plus a **CTQ characteristic management** licence.
        show: [bom, system, worksheet, attrs]
        highlight: [attrs]
        flow: [attrs>worksheet]
        seconds: 6
      - title: Turn risk into change
        caption: A high-risk mode becomes a problem, and a Windchill change object is created from it - the **quality-driven change management** licence.
        highlight: [change]
        flow: [worksheet>problem, problem>change]
        seconds: 7

  - type: example
    variant: real-world
    title: From one latch to a family of scooters
    industry: Micromobility
    md: |
      Leo builds a **component FMEA** for the S2 battery pack from the imported BOM. The spring failure mode
      lands at RPN 240, so Priya redesigns the spring before release, not after. Ana asks for a **process
      FMEA** on Lakeside's latch assembly station too - it flags a missing torque check. Both failure modes
      get risk codes, so when a complaint does come in, it is coded against them in Customer Experience
      Management.
    takeaway: The FMEA is where the next closed loop starts - before the customer is involved.

  - type: callout
    variant: pitfall
    md: |
      **Assuming every Windchill site has FMEA.** Windchill Risk and Reliability is a separate product, and
      the Windchill integration (BOM import, attribute links, change objects) is **Enterprise Edition
      only** and needs extra integration licences. Check what your company owns before you design a
      process around it.

  - type: callout
    variant: pro-tip
    md: |
      RPN is not the only ranking. Risk and Reliability also supports **Mode Criticality** (MIL-STD-1629),
      **Criticality Rank** and a **Risk Level** matrix that plots severity against occurrence. A severity-10
      failure mode with a modest RPN deserves a second look - a risk matrix makes it visible.

  - type: quiz
    questions:
      - kind: single
        prompt: Severity 7, Occurrence 3, Detection 8. What is the RPN?
        options: ["18", "56", "168", "210"]
        answer: 2
        explanation: RPN = Severity × Occurrence × Detection = 7 × 3 × 8 = 168.
      - kind: single
        prompt: On the Detection scale used in the RPN, what does a high number mean?
        options: [The failure is easy to detect, The failure is hard to detect, The failure is very likely, The failure is very severe]
        answer: 1
        explanation: The highest RPN marks the most severe, most likely or least likely to be detected failure mode - so high Detection means hard to detect.
      - kind: truefalse
        prompt: FMEA is a standard feature of every Windchill PLM installation.
        answer: false
        explanation: FMEA is part of Windchill Risk and Reliability, a separate PTC product with its own licences.
      - kind: multi
        prompt: With the Enterprise Edition and the right licences, what can Risk and Reliability do with Windchill? (Choose all that apply.)
        options: [Create projects from Windchill BOMs, Link global attributes to DVPs and control plans, Create Windchill change objects from problems, Release parts directly in Windchill]
        answers: [0, 1, 2]
        explanation: Those three are the documented integration features. Releasing parts still happens through Windchill change management.
      - kind: single
        prompt: "What is an FMECA?"
        options: [An FMEA that adds a criticality analysis, A fault tree, A Weibull analysis of field data, A CAPA for FMEAs]
        answer: 0
        explanation: Analysing how harmful the end effects are is criticality analysis; FMEA plus criticality is an FMECA. PTC's help uses "FMEA" for both.
      - kind: order
        prompt: Put the FMEA steps in order.
        items: [Define the system and its elements, Draw functional and reliability block diagrams, Identify failure modes, Evaluate effects and assign severity, Find detection methods and corrective actions]
        explanation: Define, diagram, list failure modes, judge effects, then act - and repeat until every risk is acceptable.

  - type: summary
    points:
      - FMEA lives in Windchill Risk and Reliability - a separate PTC product. This lesson is a PTC Help Center supplement.
      - An FMEA lists failure modes, judges their effects and ranks their criticality; with a criticality analysis it is an FMECA.
      - RPN = Severity × Occurrence × Detection; high Detection means hard to detect; 10-point scales give 1 to 1,000.
      - Design changes lower occurrence or remove the failure mode; better checks lower detection; teams set their own cut-offs.
      - With the Enterprise Edition and licences, FMEAs are built from Windchill BOMs, linked to attributes, and can create Windchill change objects.
