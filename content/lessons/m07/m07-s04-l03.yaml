versionNotes:
  - versions: ["All releases"]
    md: |
      **FMEA lives in Windchill Risk and Reliability, a separate PTC product** with its own installation,
      licences, Help Center and release numbers (this lesson used its 13.1.0.0 Help Center). It is not part of
      core Windchill PLM. Everything in this lesson is a **PTC Help Center supplement** - none of it comes
      from the Windchill course guides. Whether it is available alongside [[windchill-plus|Windchill+]] is
      not confirmed by these sources.

blocks:
  - type: callout
    variant: version-note
    versions: ["Windchill Risk and Reliability"]
    title: Separate product - PTC Help Center supplement
    md: |
      [[windchill-risk-and-reliability]] is a **separate PTC product**, licensed on its own. Your Windchill
      PLM site may not have it at all. The facts in this lesson come from the Windchill Risk and Reliability
      13.1.0.0 Help Center, labelled **PTC Help Center supplement**.

  - type: text
    md: |
      The battery-latch CAPA is closed. Kai, now planning the **Scooter S2** refresh, asks Leo a sharper
      question: *"Could we have seen the latch problem coming?"*

      Yes - with an **FMEA**. Instead of waiting for riders to complain, the team lists every way a part or
      process could fail, what that failure would do, and how risky each one is. Then they fix the riskiest
      ones on paper, while a fix is still a CAD edit and not a recall.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "what could fail, what happens then, how bad is it" → [[fmea|FMEA]] (failure mode and effects analysis)
      - "the way something fails" → **failure mode**
      - "ranking how harmful the effects are" → **criticality analysis** - FMEA plus criticality is an **FMECA**
      - "how bad × how likely × how hard to spot" → [[risk-priority-number|RPN]]
      - "PTC's risk and reliability toolset" → [[windchill-risk-and-reliability]]

  - type: diagram
    title: What's inside Windchill Risk and Reliability
    caption: Three groups of tools. FMEA sits in Risk Assessment. Click a box.
    diagram:
      width: 820
      height: 330
      groups:
        - { label: Reliability evaluation, x: 20, y: 20, w: 250, h: 290, tone: info }
        - { label: Risk assessment, x: 290, y: 20, w: 250, h: 290, tone: danger }
        - { label: Specific use tools, x: 560, y: 20, w: 240, h: 290, tone: neutral }
      nodes:
        - id: prediction
          label: Prediction
          x: 50
          y: 70
          w: 190
          detail: Predicts component or system failure rates from statistical models using component and environment parameters.
        - id: rbd
          label: RBD
          sublabel: block diagrams
          x: 50
          y: 150
          w: 190
          detail: Evaluates block and phase diagrams for systems with redundancy, including maintenance, repair resources and spares.
        - id: markov
          label: Markov
          x: 50
          y: 230
          w: 190
          detail: Models complex systems whose behaviour depends on state and sequence.
        - id: fmea
          label: FMEA
          sublabel: failure modes + effects
          x: 320
          y: 70
          w: 190
          tone: danger
          detail: |
            Establishes the effects of failure modes on a system and how critical they are. Supports process,
            functional and component FMEAs, with control plans and design verification plans (DVPs) alongside.
          real: Leo's tool for the Scooter S2 latch review.
        - id: fta
          label: FTA
          sublabel: fault trees
          x: 320
          y: 150
          w: 190
          detail: Fault tree analysis - the other big risk-assessment tool. PTC's help compares FMEAs and fault trees on a page of its own.
        - id: eventtree
          label: Event Tree
          x: 320
          y: 230
          w: 190
          detail: Identifies possible causes of failure and events, and estimates how likely an event is from the events that lead up to it.
        - id: fracas
          label: FRACAS
          x: 590
          y: 70
          w: 180
          detail: Records and analyses significant incidents so corrective actions can be identified, implemented and verified.
        - id: weibull
          label: Weibull · ALT
          x: 590
          y: 150
          w: 180
          detail: Weibull forecasts failures from field data samples; ALT extrapolates accelerated life tests to normal stress.
        - id: lcc
          label: LCC · Maintainability
          x: 590
          y: 230
          w: 180
          detail: Life cycle cost (including failure and repair costs) and mean time to repair estimates.
      edges: []

  - type: text
    md: |
      ### How an FMEA is built

      PTC's help describes the process in five moves:

      1. **Define** the system or process and break it into elements, with their functions and what counts as a failure.
      2. **Diagram** how the elements work and depend on each other (functional and reliability block diagrams).
      3. **List failure modes** - every way each element can fail.
      4. **Evaluate effects and severity** - for each failure mode, the worst effect on the item itself, on the system and on the mission, then a severity rating.
      5. **Detect and act** - for critical failure modes, find detection methods and compensating provisions; see if a design change can remove the failure mode, or at least make it less likely or less harmful. Repeat until every failure mode is an acceptable risk.

      ### Reading the score

      The built-in **Risk Priority Number** is **Severity × Occurrence × Detection**. High means severe,
      likely, or *hard to detect* - so on the Detection scale a **lower** number is **better** detection.
      With 10-point scales the RPN runs from 1 to 1,000. Sort by RPN, then set your own cut-off values for
      high, medium and low risk.

  - type: comparison
    title: Leo's draft FMEA for the S2 battery latch
    columns: [Failure mode, End effect, S, O, D, RPN]
    rows:
      - label: Latch spring
        cells: ["Spring force too low", "Battery loosens or drops out while riding", "8", "5", "6", "240"]
      - label: Contacts
        cells: ["Contact corrosion", "Intermittent power loss", "6", "4", "7", "168"]
      - label: Latch housing
        cells: ["Housing cracks", "Latch can't lock; rider notices at once", "8", "2", "4", "64"]
    takeaway: "Acme's own cut-offs - high from 200, medium 100 to 199, low below 100 - put the spring on top. The cut-offs are a team decision, not a PTC default."

  - type: simulation
    title: Bring the spring's RPN down
    intro: |
      The latch spring scores **S 8 × O 5 × D 6 = 240**. Try the two actions in either order. Watch which
      factor each one moves - and which one never moves.
    headline: "Spring failure mode · S {severity} × O {occurrence} × D {detection} = RPN {rpn} · {risk}"
    initial: { severity: 8, occurrence: 5, detection: 6, rpn: 240, risk: High, spring: false, test: false }
    actions:
      - id: stronger-spring
        label: Redesign with a stronger spring
        when: { spring: false, test: false }
        do: [{ set: { spring: true, occurrence: 2, rpn: 96, risk: Low } }]
        log: Design change makes the failure much less likely. Occurrence 5 → 2. RPN 8 × 2 × 6 = 96.
        blockedHint: Already redesigned.
      - id: stronger-spring-after-test
        label: Redesign with a stronger spring
        when: { spring: false, test: true }
        do: [{ set: { spring: true, occurrence: 2, rpn: 48, risk: Low } }]
        log: Occurrence 5 → 2 on top of the test. RPN 8 × 2 × 3 = 48.
      - id: pull-test
        label: Add an end-of-line pull test
        when: { test: false, spring: false }
        do: [{ set: { test: true, detection: 3, rpn: 120, risk: Medium } }]
        log: Weak springs are now caught before shipping. Detection 6 → 3. RPN 8 × 5 × 3 = 120.
        blockedHint: Test already added.
      - id: pull-test-after-spring
        label: Add an end-of-line pull test
        when: { test: false, spring: true }
        do: [{ set: { test: true, detection: 3, rpn: 48, risk: Low } }]
        log: Detection 6 → 3 on top of the redesign. RPN 8 × 2 × 3 = 48.
      - id: start-over
        label: Start over
        when: { rpn: [96, 120, 48] }
        do: [{ set: { severity: 8, occurrence: 5, detection: 6, rpn: 240, risk: High, spring: false, test: false } }]
        log: Back to the draft - S 8 × O 5 × D 6 = 240.
    goals:
      - label: Get the spring out of the high band
        when: { risk: [Medium, Low] }
        message: Either action does it - the redesign removes more risk than the test alone.
      - label: Reach RPN 48 with both actions
        when: { rpn: 48 }
        message: Severity stayed at 8 the whole time. Actions change how likely and how detectable a failure is - the harm if it happens is the same unless the design removes the effect.

  - type: callout
    variant: why-it-matters
    md: |
      A field fix costs a recall; a design fix costs an afternoon. An FMEA forces the team to rank risks
      *before* there is a customer experience to log - and gives quality the failure modes and risk codes
      to classify complaints against when they do arrive.

