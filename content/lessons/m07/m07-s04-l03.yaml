      nodes:
        - id: bom
          label: S2 BOM
          sublabel: PDMLink or MPMLink
          x: 50
          y: 60
          w: 170
          tone: primary
          detail: The product structure in Windchill. A Risk and Reliability project or system file can be created from it.
        - id: attrs
          label: Global attributes
          sublabel: on BOM parts
          x: 50
          y: 150
          w: 170
          tone: primary
          detail: Windchill global attributes from the BOM can be linked to FMEA DVPs and control plans, many to many.
        - id: change
          label: Change objects
          x: 50
          y: 240
