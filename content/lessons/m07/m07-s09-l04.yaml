id: m07-s09-l04
subtitle: Theo's laptop isn't a Windchill dev box yet. One IDE setup, one debugger, four environments - and a repeatable way to ship.
version: 1.0.0
updated: "2026-10-11"
tags: [customization, developer, eclipse, environments, deployment, debugging]
sources:
  - id: cust
    where: "Module 1: Customization process (concept, plan, build, launch and tools); Deploying Windchill custom code (development, test/integration, QA/validation, production); Module 3: Eclipse overview; Activity: Install Eclipse; Activity: Configure Eclipse; Activity: Configure Eclipse for debugging"
  - id: cus-overview
    where: "Day 1 overview: Development environment (tools.xml targets eclipse_project, class, bundle, sql_script and .help); Some key commands (tools.xml class, xconfmanager -i and -p, MakeJar.xml, swmaint.xml createSafeArea); NmActionServiceHelper reload note"
  - id: trn-advdev
    where: "Section 12: register a service with xconfmanager -s ... -t codebase\\wt.properties -p and restart the method server"
  - id: ac
