id: m07-s10-l01
subtitle: Every button and menu entry in Windchill is an action, and every menu is an action model. Theo adds Acme's first one.
version: 1.0.0
updated: "2026-10-11"
tags: [customization, developer, actions, action-models, ui-framework]
sources:
  - id: trn-framework
    where: "Windchill Framework Customization slides: Custom Action; Action Framework Overview (StandardNmActionService, custom action files, jcaDebug, defining a new action model, defining a new action, localizing an action); directory structure"
  - id: cus-actions
