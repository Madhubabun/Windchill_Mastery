id: m07-s13-l01
subtitle: The E1 leaves the factory and the product story keeps going - in garages, repair shops and spare-parts bins.
version: 1.0.0
updated: "2026-10-11"
tags: [service, service-information, service-parts, sbom, lifecycle]
sources:
