id: m07-s10-l02
subtitle: A table in Windchill is two answers to two questions - what does it look like, and what's in it? Builders give both.
version: 1.0.0
updated: "2026-10-11"
tags: [customization, developer, mvc, builders, tables, trees, ui-framework]
sources:
  - id: cus-mvc
    where: "MVC Builders theory: MVC recap; request handling; servlet and URL mapping; DispatcherServlet application context; handlers and ComponentController; builder types; how to find a builder; internals of ComponentController; typical MVC components; specifying the component id; registering builders (scanning, explicit); MVC table example; MVCBuilder.java and MVCNonPersistableTableBuilder.java (checking only); Exercises 3 and 4; practice cases"
  - id: trn-framework
    where: "Windchill Framework Customization slides: MVC, MVC components, MVC builders, registering builders, samples, MVC builder search; MVC.pptx; Windchill Client Customization: two customization paths"
  - id: cus-ex
    where: "Customization All Exercises: MVC Table Builder (Persistable) and (Non-Persistable); custom.xml and custom-actions.xml entries"
  - id: cust
    where: "Introduction to Windchill Customization: Customization tab"
versionNotes:
  - versions: ["All releases"]
    md: |
      The MVC framework arrived with Windchill 10.0 according to the training's history slide, and the samples were
      built on 12.1. The builder pattern is the same idea in 13.x; check signatures against the Javadoc for your
      release.
  - versions: ["Windchill+"]
    md: Builders are custom Java code. On [[windchill-plus|Windchill+]] they are deployed with the [[windchill-plus-ccd|CCD utility]], not copied to the server.

blocks:
  - type: text
    md: |
      Kai's **E1 parts** page needs an actual table: name, number, type, last modified, created. Theo could
      hand-write HTML in a JSP, but Windchill has a better way. He writes a small Java class, a
      [[mvc-builder|builder]], that answers two questions: *what columns does the table have?* and *which rows go
      in it?* Windchill does the rest: selection checkboxes and the same look as every other Windchill table.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "the description of the table: label, columns, selectable or not" → **ComponentConfig** (here a `TableConfig`)
      - "the rows" → **ComponentData**
      - "both together, ready to draw" → **ComponentDefinition** (the *model* in MVC)
      - "the traffic cop that handles the request" → **ComponentController** (the *controller*)
      - "the unique name a page uses to ask for your table" → **component id**, set with `@ComponentBuilder`
      - "the Java class that supplies config and data" → [[mvc-builder|MVC builder]]

