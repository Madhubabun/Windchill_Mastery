    where: "Module 4: Manage CAD data in Windchill: overview (CAD tools whose data Windchill manages; CAD integration with Windchill; CAD and Windchill product structures); Describe the CAD-centric approach; Identify characteristics of CAD documents; Register a Windchill server with your CAD tool (Workgroup Manager for other CAD tools). Module 2: Access CAD documents using Creo View"
