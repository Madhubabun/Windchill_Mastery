id: m07-s03-l04
subtitle: The E1 frame comes from Creo, the motor controller board from an electronics tool. Windchill is where they meet.
version: 1.0.0
updated: "2026-10-13"
tags: [cad, multi-cad, ecad, mcad, idx, collaboration]
