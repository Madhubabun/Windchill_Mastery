    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/customization/WCCG_Serv_DevelopServerLogic_ServEventMgmt.html"
    covers: "Listeners subscribe through ManagerService.addEventListener; run synchronously in the emitter's transaction; veto by throwing an exception; pre- and post-events"

blocks:
  - type: text
    md: |
      Theo's approved backlog has three items:

      - a **"Send to Lakeside"** entry in the part's Actions menu,
      - Leo's rule: **no release** of a test report that isn't linked to a part,
      - a **number** for new E-Bike parts built from a classification value plus a sequence.

      All three are customization, but they plug into **different extension points**. Pick the wrong one and you
      fight the framework: a menu that tries to enforce a business rule can be bypassed by any other path into
      Windchill, and a server rule that tries to draw UI never shows up.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "a place where Windchill lets you plug in your own code" → **extension point**
      - "a menu entry or button" → **action**; "a set of actions shown together" → **action model**
      - "code that wakes up when an object is saved, checked in or changes state" → [[event-listener]]
      - "a long-running piece of server code Windchill starts for you" → [[windchill-service-class|service]]
      - "the announcement that something happened" → [[keyed-event|event]] (pre-event before, post-event after)

  - type: diagram
    title: Where custom code plugs in
    caption: Browser on the left, database on the right. Each socket is a different extension point. Click one.
    diagram:
      width: 840
      height: 460
      groups:
        - { label: Client (UI) layer, x: 20, y: 20, w: 260, h: 420, tone: primary }
        - { label: Server (method server), x: 300, y: 20, w: 320, h: 420, tone: accent }
        - { label: Outside Windchill, x: 640, y: 20, w: 180, h: 420, tone: neutral }
      nodes:
        - id: ui
          label: UI components
          sublabel: tables · trees · wizards
          x: 40
          y: 60
          w: 220
          tone: primary
          detail: |
            The **Windchill Client Architecture** gives standard, configurable components: table, tree, information
            page, wizard and dynamic menus. They're filled using **actions**, **action models** and GUI
            components. Section m07-s10 builds these hands-on.
        - id: uiservices
          label: UI services
          sublabel: actions · data · validation
          x: 40
          y: 190
          w: 220
          tone: primary
          detail: |
            Common Java services behind the components: **action services** read XML files of actions and action
            models (custom ones go in `custom-actions.xml` and `custom-actionModels.xml`); **data utilities**
            post-process data for display; **validation services** decide if an action or property is shown,
            disabled or hidden. Form processors, wizards and pickers complete the set - all covered in m07-s10.
        - id: workflow
          label: Workflow code
          sublabel: in the template
          x: 40
          y: 320
          w: 220
          tone: warning
          detail: Workflow customization usually means code entered directly in the [[workflow-template]] user interface - for example an expression in a workflow activity.
        - id: listener
          label: Event listeners
          sublabel: pre/post events
          x: 320
          y: 60
          w: 280
          tone: accent
          detail: |
            A listener subscribes to an event (for example `PRE_STORE`, `POST_MODIFY`, a check-in or a life cycle
            set-state event). It runs **synchronously, in the same transaction** as the operation, and can **veto**
            a pre-event by throwing an exception - so the rule holds no matter which UI, import or API caused it.
          real: Leo's release rule goes here.
        - id: service
          label: Custom service
          sublabel: StandardManager
          x: 320
          y: 190
          w: 280
          tone: accent
          detail: |
            A service class extends `StandardManager` and is listed in `wt.properties` so Windchill starts it with
            the server (in service-number order). Its startup method is where listeners get registered.
        - id: algo
          label: Rules and model tweaks
          sublabel: number algorithm · columns
          x: 320
          y: 320
          w: 280
          tone: warning
          detail: |
            Smaller server hooks: a custom class implementing `wt.rule.algorithm.RuleAlgorithm` to calculate object
            numbers, or a property change that widens a modeled column (for example the part master's name length)
            followed by schema scripts.
          real: The E-Bike numbering idea lands here.
        - id: integration
          label: Integrations
          sublabel: REST · ERP · web services
          x: 660
          y: 60
          w: 145
          h: 80
          tone: neutral
          detail: REST services customization, ERP Connector customization, and Info*Engine-based web services (which can use JAX-WS and configurable security).
        - id: rmi
          label: Stand-alone tools
          sublabel: RMI clients
          x: 660
          y: 260
          w: 145
          h: 80
          tone: neutral
          detail: A utility program can call a public method on the method server over RMI, as long as the class implements `wt.method.RemoteAccess`.
      edges:
        - { from: ui, to: uiservices }
        - { from: uiservices, to: listener, label: operations, dashed: true }
        - { from: service, to: listener, label: registers }
        - { from: integration, to: listener, dashed: true }
        - { from: rmi, to: service, dashed: true }

  - type: callout
    variant: why-it-matters
    md: |
      Rules belong where every path goes through them. A check in a menu or form only protects that one screen;
      an event listener sees the operation however it was started - browser, loader, integration or a script.
      UI code, on the other hand, is where you change *what people see*. Mixing them up is the most common design
      mistake in custom Windchill code.

  - type: comparison
    title: Choosing an extension point
    columns: [UI framework, Event listener, Custom service]
    rows:
      - label: Use it to
        cells: ["Add or change menus, tables, wizards and what they display", "React to or block an operation on an object", "Run server logic that Windchill starts and keeps alive"]
      - label: Runs
        cells: ["When a page or action is requested", "Synchronously inside the operation's transaction", "From server startup on"]
      - label: Can stop an operation?
        cells: ["Only on that screen (for example by hiding an action)", "Yes - veto a pre-event by throwing an exception", "Not by itself; it hosts listeners that can"]
      - label: Typical files
        cells: ["custom-actions.xml, custom-actionModels.xml, JSP, Java", "Adapter class + the service that registers it", "Service interface + StandardManager subclass + wt.properties entry"]
      - label: Acme example
        cells: ['"Send to Lakeside" action', "No release of an unlinked test report", "Acme's listener service itself"]
    takeaway: UI changes what people see. Listeners enforce what must always be true. Services host the listeners.

  - type: walkthrough
    title: Anatomy of a listener, end to end
    who: Theo (developer) with Rosa (system admin) for the restart
    where: ["<WT_HOME>", src, com/acme/windchill]
    steps:
      - title: Write a service interface
        where: [src, com/acme/windchill/listeners]
        md: An (often empty) Java interface that names the service, for example `AcmeReleaseRuleService`.
      - title: Write the service class
        where: [src, com/acme/windchill/listeners]
        md: A class that **extends `StandardManager`** and implements the interface, with a static `new...()` factory that calls `initialize()`. In `performStartupProcess` it adds the listener for the event key it cares about.
      - title: Write the listener logic
        where: [src, com/acme/windchill/listeners]
        md: A class that extends `ServiceEventListenerAdapter` and overrides `notifyVetoableEvent` - check the event type and target, run the rule, throw to veto.
      - title: Compile into the codebase
        where: [Windchill shell, ant -f bin/tools.xml class]
        md: Compile the interface and classes so the class files land in the codebase.
      - title: Register the service
        where: [Windchill shell, xconfmanager]
        md: Add a `wt.services.service.<number>` entry that pairs the interface with the class, written to `codebase/wt.properties` through xconfmanager.
      - title: Restart and watch
        where: [Windchill shell, windchill stop / windchill start]
        md: Restart the method server so the service starts and registers its listener, then try the operation and read the method server log.
    result: The full code for each file is built step by step in m07-s11 (services, then listeners).

  - type: example
    variant: real-world
    title: Theo's three sockets
    industry: Micromobility
    md: |
      - **"Send to Lakeside" menu entry** → UI framework: a custom action added to a copied action model. No
        business rule inside - it just opens a page.
      - **No release of unlinked test reports** → a listener on the life cycle set-state event, hosted by an
        Acme service. It follows the reference link from the document's master and vetoes if no part is found.
      - **E-Bike numbering** → first, Jordan checks whether an OIR numbering rule can do it as configuration. If
        it truly needs a calculation, a `RuleAlgorithm` class is the hook.
    takeaway: One backlog, three different extension points - chosen by what the code must do, not by habit.

  - type: scenario
    variant: challenge
    title: Pick the socket
    start: s1
    nodes:
      - id: s1
        md: Maya wants a warning **and** a hard stop when someone deletes a part that is used in a released E1 BOM. Where does the hard stop go?
        choices:
          - label: An event listener on the delete pre-event that vetoes
            next: s2
            good: true
            feedback: Right - a veto on the pre-event blocks the delete however it is started.
          - label: Hide the Delete action in the menu
            next: fail1
            feedback: Hiding an action only changes one screen. Other paths can still delete.
      - id: s2
        md: And the friendly warning *before* the user clicks?
        choices:
          - label: UI validation on the delete action
            next: win
            good: true
            feedback: Validation services decide whether an action is shown, disabled or hidden - perfect for the UX part.
          - label: Put a pop-up inside the listener
            next: partial1
            feedback: Listeners run on the server inside the transaction; they don't draw UI. Their exception message is all the user sees.
      - id: win
        md: Belt and braces - the UI guides people, the listener guarantees the rule.
        outcome: success
      - id: partial1
        md: The rule holds, but users only see an error after they try. Add the UI layer for a better experience.
        outcome: partial
      - id: fail1
        md: A bulk delete from another screen removes the part anyway. UI-only rules are not rules.
        outcome: fail

  - type: callout
    variant: pitfall
    md: |
      **Heavy work in a listener.** Listeners run synchronously in the same thread and transaction as the user's
      operation. Slow code there makes every save slow, and an unexpected exception rolls back the user's work.
      Keep listener logic short and deliberate.

  - type: callout
    variant: pro-tip
    md: |
      Before writing a listener, write down the **event**, the **object type** and the **contexts** it applies to.
      If you can't name all three, the listener will end up firing far more often than you planned.

  - type: quiz
    questions:
      - kind: single
        prompt: Which extension point guarantees a rule no matter how an object is changed?
        options: [An event listener on the pre-event, A hidden menu action, A data utility, A wizard step]
        answer: 0
        explanation: Listeners run inside the operation itself and can veto a pre-event, so every path is covered.
      - kind: single
        prompt: Where are listeners usually registered?
        options: [In the startup method of a custom service that extends StandardManager, In custom-actions.xml, In a JSP, In the workflow template]
        answer: 0
        explanation: The service's performStartupProcess adds the listener through the manager service when Windchill starts the service.
      - kind: truefalse
        prompt: A listener runs in the same database transaction as the operation that emitted the event.
        answer: true
        explanation: Listeners are synchronous - same thread, same transaction. A veto rolls the operation back.
      - kind: multi
        prompt: Which belong to the UI (client) side? (Choose all that apply.)
        options: [Actions and action models, Validation of whether an action is shown or hidden, A RuleAlgorithm for numbers, A delete pre-event listener]
        answers: [0, 1]
        explanation: Actions, action models and UI validation are client architecture services. The number algorithm and listeners are server-side.

  - type: summary
    points:
      - Customization plugs into extension points - UI framework, workflow code, event listeners, services, rule algorithms and integrations.
      - The UI framework (actions, models, data utilities, validators, form processors, wizards, pickers) changes what users see - details in m07-s10.
      - Event listeners react to pre- and post-events, run in the operation's transaction and can veto by throwing.
      - Custom services extend StandardManager, start from a wt.properties entry and register listeners at startup.
      - Choose by what the code must do - enforce a rule, change the UI or integrate - not by habit.
