id: m07-s09-l03
subtitle: A menu entry, a rule that fires on check-in, a nightly number generator - each one plugs into a different socket. Theo learns the sockets.
version: 1.0.0
updated: "2026-10-11"
tags: [customization, developer, architect, extension-points, listeners, services]
sources:
  - id: cust
    where: "Module 1: Types of Windchill customization (lightweight, user interface, server, workflow, third-party/integration); Module 2: codebase\\netmarkets JSP and action files"
  - id: cus-overview
    where: "Day 1 overview: Windchill Client Architecture (components: table, tree, information page, wizard, menus); common Java services (GUI services, action services, data utilities, validation services); action model and custom-actions.xml / custom-actionModels.xml"
  - id: trn-advdev
    where: "Section 11: About web service implementation (Info*Engine, JAX-WS); Introduction to Windchill events and services (PersistenceManagerEvent list); Section 12: Customization event listener and register a listener (service interface, StandardManager, xconfmanager registration, restart); listener for set state; DB column length; rule algorithm for object number; stand-alone utility using RMI"
  - id: hc-svc-mgmt
    label: PTC Help Center supplement
    title: "Service Management"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/customization/WCCG_Serv_DevelopServerLogic_ServMgmt.html"
    covers: "Services listed in wt.properties start automatically at server start; start order by service number; StandardManager, performStartupProcess, ManagerService"
  - id: hc-svc-event
