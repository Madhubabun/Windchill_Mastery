id: m07-s12-l01
subtitle: Acme has four "different" brake calipers that are secretly the same one. Component and supplier management is how you stop paying for that.
version: 1.0.0
updated: "2026-10-11"
tags: [supplier-management, suma, csm, sourcing, part-reuse]
sources:
  - id: suma
    where: "Course scenario; Implementation team strategy; Implementation strategy. Module 1: Manage suppliers in Windchill with SUMA: overview; Managing parts: the challenge; Windchill Component and Supplier Management (CSM): the solution; CSM process: overview; Business challenges addressed by CSM; Supplier management challenges; CSM: benefits; SUMA capabilities; SUMA architecture; Install SUMA"
  - id: te
    where: "Integrate and manage supply chain data: overview; Manage suppliers and components with Windchill Supplier Management; What is the Component and Supplier Management (CSM) process?"

blocks:
  - type: text
    md: |
      **Hana** has just joined Acme Mobility as sourcing lead. On day one she runs a report on brake
      parts for the **E-Bike E1** and **Scooter S2** and finds four separate Acme part numbers for
      hydraulic brake calipers. Three of them are the very same **Brakeworks GmbH** caliper, created by
      three engineers who each couldn't find the others' part.

      Every extra part number costs money: it gets stocked, priced, approved and maintained. Hana's job
      is to steer Acme towards a **short list of trusted parts and suppliers** - and Windchill has a
      name for that whole effort.

  - type: callout
    variant: terms
    md: |
      **Plain words → official term**
      - "using the parts and suppliers we already trust" → [[component-and-supplier-management]] (CSM)
      - "the Windchill add-on for suppliers and bought parts" → [[supplier-management]] (SUMA)
      - "sorting parts so people can find them" → [[classification]] with PartsLink
      - "our part number for something we buy" → [[oem-part]] (also called an internal part)
      - "the maker's and seller's version of it" → [[manufacturer-part]] and [[vendor-part]]
      - "the allowed sources for a part" → [[approved-manufacturer-list|AML]] and [[approved-vendor-list|AVL]]
      - "asking properly for a new bought part" → [[part-request]]

