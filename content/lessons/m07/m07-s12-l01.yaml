        - { label: CSM process (PartsLink + SUMA), x: 250, y: 10, w: 330, h: 410, tone: primary }
        - { label: Results, x: 600, y: 10, w: 230, h: 410, tone: success }
      nodes:
        - id: need
          label: Required parts
          sublabel: new and existing
          x: 30
          y: 50
          w: 180
          tone: neutral
          detail: What engineering needs, plus the parts already in Windchill that might do the job.
        - id: supdata
          label: Supplier data
          sublabel: contacts · AMLs · AVLs
          x: 30
          y: 160
          w: 180
          tone: neutral
          detail: Supplier contact details, existing approved manufacturer and vendor lists, compliance requirements and the quality criteria a supplier must meet to count as qualified.
        - id: erp-in
