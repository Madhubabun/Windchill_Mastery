          x: 280
          y: 250
          w: 270
          h: 50
          tone: info
          detail: Search the classification schema for the right node and classify new parts.
        - id: structure
          label: 5 Manage classification
          x: 280
          y: 320
          w: 270
          h: 50
          tone: info
