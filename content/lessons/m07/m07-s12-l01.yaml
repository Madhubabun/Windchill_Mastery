        - id: request
          label: 1 Request a new part
          x: 280
          y: 40
          w: 270
          h: 50
          tone: accent
          detail: Raise a part request, check it isn't a duplicate, update the classification structure or qualify a supplier if needed, find supplier parts that satisfy it, create the CAD library part if needed, release it.
        - id: supparts
          label: 2 Manage supplier parts
          x: 280
          y: 110
          w: 270
          h: 50
