id: m07-s06-l02
subtitle: A classification library rots quietly - one "Misc" node and one duplicate attribute at a time. Jordan sets the house rules and runs Acme's first clean-up.
version: 1.0.0
updated: "2026-10-13"
tags: [classification, partslink, governance, data-quality, business-admin]
sources:
  - id: pl
    where: "Implementation team strategy (classification administrator role); Implementation strategy (stage 3: maintain the classification structure, dedicated team, classify on create); Implementation considerations (structure evolves, new attributes, naming conventions, separate teams for parts and documents); Faceted search results (string facets need a legal value list); Module 3: Classification structure; Classification attributes (inheritance, add/remove, gather to parent, move child to parent); Module 4: Installation and configuration overview (wt.csm.defaultCSMAdminGroup); Preferences (Enable Classification Administrator to Create Reusable Attributes); Create and update classification structures; Create and update classification attributes (edit mode); Activity: Update a classification structure (Insert Node, Instantiable, Add attribute to class)"
  - id: hc-class-tree
    label: PTC Help Center supplement
    title: "Classification Structure"
    url: "https://support.ptc.com/help/windchill/r13.1.2.0/en/Windchill_Help_Center/wcclassreuse/WCClassReuseClassTree.html"
    covers: "Classification Tree actions Insert Node, Delete (child nodes selected with the parent), Copy Selected Object and Paste (not under a branch with the same internal name), Export, Import, Find in tree"
  - id: hc-node-info
