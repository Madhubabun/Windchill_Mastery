id: m07-s14-l03
subtitle: No tile shows Maya's open change requests next to their activity and priority. Theo builds one - from components, a connector and a little JSON.
version: 1.0.0
updated: "2026-10-13"
tags: [navigate, custom-tasks, thingworx, odata, mashups, developer]
sources:
  - id: nav-ct
    where: "Implementation team strategy; Module 1: Elements of a custom task; The user experience; Windchill Navigate components overview; Component architecture; Component communication (CCO, WCAdapter)"
  - id: nav-ct
    where: "Module 2: Task projects; Integration connectors; OData Connector; OData Connector authentication; Exposing domains and services; Troubleshoot connectivity; Activity: Configure the OData Connector; Component configuration properties; Activity: Construct the task mashup"
  - id: nav-ct
    where: "Module 3: Generic configurations; Ordinals configuration properties; Should I use Tiles or Attributes components?; Module 4: Add the custom task to the landing page; Tags; Common tailoring for custom tasks"
