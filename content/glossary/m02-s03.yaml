# Terms introduced in section m02-s03 (Product structure and the eBOM).

- id: multi-level-bom
  term: Multi-level BOM
  plain: The full family tree of a product, with parts inside sub-assemblies inside the top assembly.
  definition: A bill of materials shown across every level of the product structure, usually indented so each child sits under its parent. Level 0 is the top item, level 1 its direct children, and so on. A single-level BOM shows only one parent and its direct children.
  aka: [indented BOM, multi-level structure]
  related: [bom, ebom, uses-link]

- id: find-number
  term: Find number
  plain: The balloon number that matches a BOM line to the picture on the drawing.
  definition: A usage attribute on a uses link that cross-references a part in the product structure with the same part on the assembly drawing, typically the item balloon. Keeping find numbers unique within a parent avoids confusion.
  aka: [item number, balloon number]
  related: [line-number, uses-link, bom]

- id: line-number
  term: Line number
  plain: The row number of a child in its parent's BOM, often used by ERP.
  definition: A usage attribute on a uses link that identifies the position of the part within a manufacturing BOM in an ERP system, where one is used. Numbering in steps (10, 20, 30) is common practice rather than a Windchill rule.
  related: [find-number, uses-link, erp]

- id: reference-designator
  term: Reference designator
  plain: The label printed on a circuit board that says exactly which spot a component goes in, like R1 or C3.
  definition: An alphanumeric code that names one occurrence of a child in its parent, such as R1, R2 or C1. A usage can have up to as many occurrences as its quantity. They are common in electronic assemblies, where pick-and-place machines, test and repair rely on them, so there the count usually matches the quantity.
  aka: [ref des, refdes]
  related: [uses-link, find-number]

- id: owner-association
  term: Owner association
  plain: '"This CAD model is in charge of this part": CAD drives the part''s structure and chosen attributes.'
  definition: An active association between a CAD document and a part in which the CAD document builds the part's structure and mapped attributes when it is checked in. A part has at most one owner CAD document, and the two usually iterate together.
  related: [build-link, contributing-association, image-association, cad-document, part]

- id: contributing-association
  term: Contributing association
  plain: A CAD model that feeds attributes to a part without being in charge of its structure.
  definition: Either of two CAD-part association types that pass attributes but do not build the part's children. With Contributing Image the CAD document also represents the part, so the part appears in a parent's structure where the model is assembled; one is allowed per part, which suits flexible parts such as a cable routed differently in two places. With Contributing Content the CAD document passes attributes only, and the part does not appear in a structure through it.
  aka: [contributing content, contributing image]
  related: [owner-association, image-association, build-link]

- id: image-association
  term: Image association
  plain: '"This CAD model stands for the part" - nothing more: no children built, no attributes passed.'
  definition: A CAD-part association that provides representation only. The CAD document does not build the part's structure or pass attributes, but when the model is assembled into an Owner-driven assembly, the part appears in that assembly's product structure after the build. A part can have many Image CAD documents, while each CAD document images one part. Contributing Image is the variant that also passes attributes.
  related: [owner-association, contributing-association, representation]

- id: alternate-part
  term: Alternate part
  plain: A part that can replace another part anywhere it is used.
  definition: A replacement part that may be used in any assembly where the specified part is used. An alternate is one-way (it may replace the original, not the reverse) or two-way (each may replace the other). Alternates are added with Manage Replacements on the Structure tab.
  aka: [alternate, global alternate]
  related: [substitute-part, where-used]

- id: substitute-part
  term: Substitute part
  plain: A part that can replace another part, but only inside one specific assembly.
  definition: A replacement part that may be used in place of the specified part only in one specific assembly, where the relationship is created. Substitutes are added with Manage Replacements on the Structure tab, and Replace with Alternate/Substitute can swap one in.
  aka: [substitute, local substitute]
  related: [alternate-part, uses-link]

- id: structure-compare
  term: Structure compare
  plain: Spot-the-difference for two BOMs, done by Windchill.
  definition: Windchill's side-by-side comparison of two part structures (the Compare to Part Structure action). Each side can be another part, another version or a different filter, such as a baseline. It flags parts with no equivalent on the other side, usage attribute differences such as quantity, and attribute differences, and can show only the differences.
  aka: [BOM compare, compare structure]
  related: [bom, multi-level-bom, master]

- id: occurrence
  term: Occurrence
  plain: One named placement of a part inside its parent, like screw S3 of four.
  definition: Information about one named usage of a part within an assembly's part structure. A usage can have occurrences up to its quantity; each occurrence is named by a reference designator and can carry a location. Occurrences are edited on the Occurrences tab of the structure and matter for manufacturing process plans, which must account for every occurrence they consume.
  related: [reference-designator, uses-link, bom]

- id: calculated-association
  term: Calculated association
  plain: The drawing-to-part link Windchill works out by itself.
  definition: A CAD-to-part association created automatically when a drawing of an owner-associated CAD model is first uploaded. It is derived by Windchill rather than stored as a link users create or edit.
  related: [owner-association, cad-drawing, cad-document]
