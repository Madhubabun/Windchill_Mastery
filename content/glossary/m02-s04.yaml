# New glossary terms introduced in section m02-s04 (Visualization).
- id: thumbnail
  term: Thumbnail
  plain: The small preview picture of a model or drawing you see on its information page.
  definition: A small 2D or 3D image created during visualization publishing for a representation. Windchill shows it on information pages and, where the site allows mini-thumbnails, in tables such as Folder Contents and Search Results; selecting it launches Creo View. If nothing has been published for an iteration, it has no thumbnail.
  related: [representation, visualization-publishing, creo-view]

- id: visualization-publishing
  term: Visualization publishing
  plain: Windchill turning a heavy CAD file into a light copy anyone can view.
  definition: The process, managed by Windchill Visualization Services (WVS), that converts CAD and other data into representations and thumbnails. Publish jobs are triggered by check-in, a schedule or a manual request, wait in prioritized queues and are run by CAD workers; the WVS Job Monitor shows their status. Publish rules set by administrators control what is published.
  aka: [Publishing, Windchill Visualization Services, WVS]
  related: [representation, cad-worker, background-queue, thumbnail]

- id: markup
  term: Markup
  plain: A sticky note and sketch you put on a model or drawing during a review.
  definition: Review information added in Creo View on the Markup tab, such as measurements and notes (for example a Note with Leader) on a model or drawing. Markups are saved to Windchill as an annotation set.
  related: [creo-view, representation, annotation-set]

- id: annotation-set
  term: Annotation set
  plain: A named bundle of review notes saved as its own object in Windchill.
  definition: A named collection of annotations and measurements, together with the model view (filters and optionally a section), saved from Creo View to Windchill with File > Save Annotation Set. It appears in the Representations/Annotations table of the object it was saved on, and opening it from there takes Creo View straight to that view.
  related: [markup, creo-view, part]

- id: cross-section
  term: Cross-section
  plain: Slicing a model open with a virtual saw to see inside it.
  definition: A Creo View view that cuts a model along a plane so internal features such as wall thickness, ribs and clearances become visible. On the Sectioning tab you can apply preset sections along the X, Y or Z axis or a Quarter Cut, and an annotation set can save the section.
  aka: [Section, Section view]
  related: [creo-view, representation]
