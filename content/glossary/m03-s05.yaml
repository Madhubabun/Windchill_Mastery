# New glossary terms introduced in section m03-s05 (Configuration management best practices).
- id: configuration-management
  term: Configuration management (CM)
  plain: Keeping what you designed, what you changed and what you built telling the same story.
  definition: The discipline that keeps a product's definition, its changes and the physical product consistent across its whole life. Its core functions are configuration identification, change control, status accounting and audit, as described in standards such as EIA-649.
  aka: [CM]
  related: [configuration-identification, configuration-status-accounting, configuration-audit, change-request, change-notice]

- id: configuration-identification
  term: Configuration identification
  plain: Giving every item a clear name and number so nobody mixes them up.
  definition: The CM function that selects the items to be controlled, gives them unique identities (numbers and versions) and defines the structure and documents that describe them. In Windchill this is supported by part, document and CAD numbers, versions and product structures.
  related: [configuration-management, master, version, bom]

- id: configuration-status-accounting
  term: Configuration status accounting
  plain: Keeping the record of what changed, when, why and where it is used.
  definition: The CM function that records and reports the current status and history of configuration items and their changes, such as released versions, open changes and where items are used. In Windchill it draws on version history, links to change objects, where-used and reports.
  aka: [CSA]
  related: [configuration-management, where-used, change-notice]

- id: configuration-audit
  term: Configuration audit
  plain: Checking that the real product matches its approved data.
  definition: The CM function that verifies a product against its configuration records. A functional configuration audit (FCA) checks that it meets its requirements; a physical configuration audit (PCA) checks that the built item matches its released documentation. Windchill supplies evidence; people perform the audit.
  aka: [FCA, PCA, Configuration verification and audit]
  related: [configuration-management, configuration-status-accounting]

- id: as-designed
  term: As-designed configuration
  plain: What a unit should contain, according to engineering.
  definition: The configuration defined by released engineering data, such as the engineering BOM with its effectivity, for a given date, lot or serial number. It is the plan that manufacturing builds to.
  related: [as-built, ebom, serial-effectivity]

- id: as-built
  term: As-built configuration
  plain: What actually went into one specific unit.
  definition: The record of the parts and versions actually installed in a specific unit, including approved variances, substitutions and later repairs. It usually lives in manufacturing, ERP or service systems and can legitimately differ from the as-designed configuration.
  related: [as-designed, mes, erp]

- id: date-effectivity
  term: Date effectivity
  plain: '"This version applies from this date on."'
  definition: Effectivity expressed as a date range. A version is valid for products built or used within the range. Easy to set, but less precise than lot or serial effectivity because production rarely switches exactly on a date.
  related: [lot-effectivity, serial-effectivity, as-designed]

- id: lot-effectivity
  term: Lot effectivity
  plain: '"This version applies from this batch on."'
  definition: Effectivity expressed as a range of lot (batch) numbers of an end item. Used where products are made and tracked in batches.
  related: [date-effectivity, serial-effectivity]

- id: serial-effectivity
  term: Serial effectivity
  plain: '"This version applies from unit number 3000 on."'
  definition: Effectivity expressed as a range of serial numbers of an end item, such as a specific scooter. The most precise kind of effectivity, used where each unit is tracked and serviced individually.
  aka: [Unit effectivity, Serial number effectivity]
  related: [date-effectivity, lot-effectivity, as-built]

- id: interchangeability
  term: Interchangeability
  plain: Old and new can swap places with no other changes.
  definition: The property of two parts being able to replace each other in every use without changes to other items or to performance. Fully interchangeable changes are usually handled by a new revision; non-interchangeable changes usually need a new part number. One-way interchangeability (new replaces old but not the reverse) is handled by company policy.
  related: [form-fit-function, revise, where-used]

- id: form-fit-function
  term: Form, fit and function (FFF)
  plain: Its shape, how it connects and what it does - the three tests for swapping parts.
  definition: The three characteristics used to judge interchangeability. Form is the physical shape, size and properties; fit is the ability to connect to mating parts; function is what the part does and how well. A change that affects any of them so that old and new can no longer be swapped typically requires a new part number.
  aka: [FFF]
  related: [interchangeability, revise, part]
