# New glossary terms introduced in section m07-s03 (CAD integration: Creo Parametric deep dive).
- id: primary-active-workspace
  term: Primary active workspace
  plain: The workspace your CAD tool saves into right now, on your main Windchill server.
  definition: The workspace you have picked as the default on your primary Windchill server. When Creo is connected, a Save goes into this workspace (its local cache) instead of a plain folder on disk. You choose it when you register the server in Creo, and you can switch to another workspace later. Other workspaces stay inactive until you activate them.
  aka: [Active workspace]
  related: [workspace, local-cache, server-side-workspace, creo]

- id: auto-associate-parts
  term: Auto Associate Parts to CAD Documents
  plain: The check-in option that makes (or links) a Windchill part for each new CAD model.
  definition: A check-in option that creates owner-associated parts for CAD documents that are not yet associated with a part. It is how a CAD-centric team gets its part structure built from the CAD structure. Turn it off when the CAD document already has its part, so you don't create duplicates.
  related: [owner-association, check-in, cad-document, part]

- id: required-dependents
  term: Required dependents
  plain: The files a CAD model cannot open without.
  definition: The dependents that a CAD document must have to be complete, such as the components an assembly uses. Windchill's collector can gather only the required dependents or all dependents of the objects you select, and actions like Add to Workspace and Check In let you choose which. Drawings are not collected as dependents of a model; they are added with a separate "add drawings" collection option.
  aka: [All dependents]
  related: [cad-dependency, workspace, check-in]

- id: incomplete-cad-document
  term: Incomplete CAD document
  plain: A CAD file Windchill knows is referenced but doesn't have the real content for.
  definition: A CAD document in the workspace whose content is missing or could not be resolved, for example because a referenced file was not found during an import. Windchill flags it and the check-in of anything that depends on it fails with a conflict. The best fix is to repair the model in the CAD tool; the check-in option "Auto resolve incomplete objects" can instead update it from a server object with the same file name or ignore it.
  related: [cad-conflict, cad-dependency, check-in]

- id: generic-model
  term: Generic (family table)
  plain: The parent model that all the size variants of a part are made from.
  definition: The base model of a Creo family table. It is the first row of the table, and every instance inherits whatever the table does not override. You change the generic by changing the model itself, not by editing its table row, and changes to it flow to the instances. PTC recommends not using the generic itself as a component in assemblies.
  aka: [Generic model, Generic]
  related: [family-table-instance, cad-document, creo]

- id: family-table-instance
  term: Family table instance
  plain: One size or variant of a table-driven part, such as the 20 mm version of a bolt.
  definition: A member of a Creo family table, defined by one row of values that differ from the generic. In Windchill each instance is its own CAD document that can be searched for, downloaded and used in assemblies on its own. An instance that has not been regenerated in Creo is shown as not verified.
  aka: [Instance, Table-driven part]
  related: [generic-model, cad-document]

- id: ecad-mcad-collaboration
  term: ECAD-MCAD collaboration
  plain: Electronics designers and mechanical designers keeping one circuit board design in sync.
  definition: A way of working in which the electrical (ECAD) and mechanical (MCAD) designers of a printed circuit board propose, review and accept changes to the shared board design, such as the board outline or the position of components. PTC's tools exchange these proposals as IDX files, which can be stored and versioned in Windchill.
  aka: [ECAD-MCAD co-design]
  related: [idx-file, creo, cad-document]

- id: idx-file
  term: IDX file (EDMD IDX)
  plain: The file that carries a proposed board change between the electronics tool and Creo.
  definition: An Incremental Design Exchange file, an XML format based on the ProSTEP EDMD schema. It records changed board objects (outline, components, holes, keep-in and keep-out areas) with both their base and their current state, so either side can review and accept the change. A baseline IDX describes the whole board; incremental IDX files describe changes since then.
  aka: [EDMD IDX, Incremental Design Exchange]
  related: [ecad-mcad-collaboration]
