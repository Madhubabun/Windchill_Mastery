# New glossary terms introduced in section m02-s02 (Versioning, iteration and lifecycle).
- id: save-as
  term: Save As
  plain: Make a copy that becomes a brand-new object with its own number and its own history.
  definition: The action that copies an existing object - for example a part structure, typically together with its CAD structure - into new objects with new names and numbers, and so new masters. The copy starts its own version history; it is not a new version of the original, and the original's where-used, links and change history stay with the original.
  aka: [Save a copy]
  related: [revise, master, new-view-version]

- id: new-view-version
  term: New View Version
  plain: The same part, seen through another team's lens - for example the manufacturing version of a design part.
  definition: The action that creates a version of a part or end item in a different view (for example Manufacturing, derived from Design) on the same part master. The new version's revision is prefixed with the source revision (Design B gives Manufacturing B.A), and each view version follows its own life cycle. It needs the New View Version permission; the views available are set up by the site administrator.
  related: [part-view, revise, save-as, mbom]

- id: set-state
  term: Set State
  plain: Flip an object straight to another lifecycle state, with no review.
  definition: The action (Actions > Set State, then a Target State) that directly changes the lifecycle state of one or more object versions without a promotion request, workflow or approval. It does not create a new iteration. It is available only where the life cycle defines a Set State transition and to users granted the Set State permission, which many companies give to few people.
  related: [lifecycle-state, promotion-request, life-cycle]

- id: configuration-specification
  term: Configuration specification (config spec)
  plain: The rule that decides which version of each part you see when you open a structure.
  definition: A filter applied to a product structure that picks one version of each child for display, because uses links point to the child's master rather than a specific version. Types in the Edit Filter window include Latest (with a view and optionally a lifecycle state such as Released), As Matured, Baseline, Change, Unit Effectivity, Date Effectivity and Promotion Request; CAD structures can also be shown As Stored.
  aka: [Config spec, Structure filter]
  related: [uses-link, master, baseline, effectivity, latest-released]

- id: baseline
  term: Baseline (managed baseline)
  plain: A frozen snapshot listing exactly which version of each object belonged together at one moment.
  definition: A Windchill object that records a set of specific object versions - one per master - so that a configuration can be found and reproduced later, for example "what we sent to certification". A managed baseline has its own number, name, folder and life cycle state, and can be locked so that only the user who locked it or an administrator can change it. Baselines can be used as a configuration specification.
  aka: [Managed baseline]
  related: [configuration-specification, version, lifecycle-state]

- id: effectivity
  term: Effectivity
  plain: '"This version applies from this date, lot or serial number on."'
  definition: The planned date, lot or serial number at which old versions of a part are replaced by new versions in production. Unit Effectivity and Date Effectivity configuration specifications use it to show the structure for a given unit or date. Setting it through a change notice is the recommended practice; whether effectivity is used at all is a company decision.
  aka: [Date effectivity, Serial effectivity, Lot effectivity]
  related: [configuration-specification, baseline, change-notice]

- id: latest-released
  term: Latest released
  plain: The newest version that has passed approval - what the factory and suppliers should use.
  definition: The most recent version of an object that is in the Released state (or the state your company uses for approved data). It is selected with a Latest configuration specification limited to that lifecycle state (or with As Matured, which defaults to Released), and is often different from the latest version, which may still be work in progress.
  related: [lifecycle-state, configuration-specification, version]
