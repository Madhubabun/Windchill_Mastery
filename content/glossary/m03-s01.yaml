# New glossary terms introduced in section m03-s01 (Why change management matters).
- id: cost-of-change
  term: Cost of change (rule of ten)
  plain: The later you fix something, the more it costs - roughly ten times more each phase.
  definition: A general product-development rule of thumb (not a Windchill feature) that the cost of the same change rises by about an order of magnitude in each later phase of a product's life - concept, design, prototype and test, production and finally the field, where it can mean scrap, rework and recalls.
  aka: [Rule of ten]
  related: [change-control, plm]

- id: change-control
  term: Change control
  plain: An agreed, tracked way to change released data so everyone who depends on it knows.
  definition: The discipline of reporting, reviewing, approving, planning and tracing every change to released product data. In Windchill it is carried out with problem reports, change requests, change notices and change tasks, each driven by a workflow.
  aka: [Change management, Engineering change management]
  related: [problem-report, change-request, change-notice, change-task, cost-of-change]

- id: full-track-change
  term: Full track change
  plain: The route with board reviews - a board approves the request, and another board approves the plan.
  definition: In Windchill's out-of-the-box change process, the route a Change Admin I picks in the Analyze Change Request task (Full-Track Online or Offline Review) for high-impact, high-cost changes. The change review board reviews the change request and the change implementation board reviews the change notice's implementation plan before work starts. The course manual gives about 20% of changes as typical.
  aka: [Full-track change]
  related: [fast-track-change, change-request, change-review-board, change-implementation-board, change-notice]

- id: fast-track-change
  term: Fast track change
  plain: The route for low-impact changes - same change objects, but no board reviews.
  definition: In Windchill's out-of-the-box change process, the route a Change Admin I picks with Fast-Track Approval in the Analyze Change Request task. The change still has a change request, a change notice with tasks and a Change Admin III audit, but skips the change review board and change implementation board reviews. The course manual gives about 80% of changes as typical; which changes qualify is set by company policy.
  aka: [Fast-track change]
  related: [full-track-change, change-notice, change-task]
