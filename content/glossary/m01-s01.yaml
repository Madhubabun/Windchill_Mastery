- id: thingworx
  term: ThingWorx
  plain: PTC's platform for connecting machines and products to the internet and building apps on that data.
  definition: PTC's Industrial IoT (IIoT) platform. It connects machines, factory systems and products in the field, and is used to build industrial apps. PTC's role-based Navigate apps for viewing Windchill data were built on it.
  aka: [IIoT platform]
  related: [windchill, plm]

- id: workgroup-manager
  term: Workgroup Manager
  plain: The plug-in that connects a non-PTC CAD tool to Windchill.
  definition: A Windchill client add-on that integrates third-party CAD applications (for example SOLIDWORKS, NX, CATIA or AutoCAD) with Windchill, so their files can be checked in and out as CAD documents.
  related: [cad-document, workspace, creo]

- id: change-review-board
  term: Change Review Board (CRB)
  plain: The group of people who say yes or no to a proposed change.
  definition: The cross-functional group (typically engineering, manufacturing, quality and service) that reviews a change request's impact and cost and decides whether to approve it. In Windchill it is usually a role in the change request workflow.
  aka: [CRB, CCB, change board]
  related: [change-request, change-notice]
