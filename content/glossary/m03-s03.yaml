# New glossary terms introduced in section m03-s03 (Promotion requests).
- id: promotion-target-state
  term: Promotion target state
  plain: The state you want the objects to end up in, like Released.
  definition: The lifecycle state chosen on a promotion request that its objects move to when the request is approved. The states you can pick depend on the objects' life cycle and your company's configuration.
  aka: [Target state, Maturity state]
  related: [promotion-request, lifecycle-state, life-cycle]

- id: promotion-candidate
  term: Promotion candidate (promotion object)
  plain: One of the items in the bundle that's asking to level up.
  definition: An object version added to a promotion request to be moved to the target state. All candidates on an approved request are promoted together; items that cannot be promoted (for example checked-out objects) are flagged when the request is created.
  aka: [Promotion object, Promotable]
  related: [promotion-request, promotion-target-state, version]

- id: review-task
  term: Review task
  plain: Windchill asking you to look at something and leave comments.
  definition: A workflow task that asks a reviewer to inspect the objects of a request, such as a promotion request, and record comments. Reviewers inform the decision but usually do not vote.
  related: [task, workflow, approval-task]

- id: approval-task
  term: Approval task
  plain: Windchill asking you to decide yes or no.
  definition: A workflow task in which an approver votes, typically Approve or Reject, with a comment. A rejection on a promotion request stops the promotion; the exact vote options depend on the configured process.
  related: [task, workflow, review-task, promotion-request]

- id: promotion-preference
  term: Promotion preference
  plain: The setting that says which sign-off process runs for which target state.
  definition: A preference managed in the Promotion Preference Management utility (site, organization, product or library Utilities) that sets which promotion workflow can be selected for a given target state. Only site administrators can create new promotion preferences; other administrators can edit existing ones at their context level. Other promotion behaviour, such as Automatic Revision Mode, is set in the Promotion Process category of Preference Management.
  related: [promotion-request, promotion-target-state, preference, promotion-scheme]

- id: promotion-scheme
  term: Promotion scheme
  plain: A company's full set of rules for which promotions go through which sign-off.
  definition: A configuration in which different target states use different promotion procedures - for example one workflow for In Work to Prototype and another for In Work to Production. It combines the roles involved, life cycle templates with the right Promote transitions, the workflows (often copied from the out-of-the-box promotion workflows) and promotion preferences that tie each target state to its workflow.
  related: [promotion-preference, promotion-request, transition, life-cycle-template, workflow-template]
