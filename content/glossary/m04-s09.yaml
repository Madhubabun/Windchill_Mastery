# New glossary terms introduced in section m04-s09 (Part classification).
- id: classification
  term: Classification (part classification)
  plain: Sorting parts by what they physically are - screw, bearing, battery pack - so people can find and reuse them.
  definition: Assigning a part to a node in a classification structure. The node gives the part a set of describing attributes (for example thread size and length for a screw) and makes it findable by classification search.
  aka: [Part classification]
  related: [classification-structure, classification-node, classification-attribute, part]

- id: classification-structure
  term: Classification structure
  plain: The company's family tree of part kinds, from broad groups down to very specific ones.
  definition: A hierarchy of classification nodes, administered centrally by business administrators. Attributes defined on a node are inherited by every node below it, so the tree goes from general to specific.
  aka: [Classification tree, Classification hierarchy]
  related: [classification-node, classification-attribute, classification]

- id: classification-node
  term: Classification node
  plain: One branch or leaf of the classification tree, such as "Machine screws".
  definition: An element of a classification structure. A node has a name, a parent, its own attributes plus those it inherits, and a setting that says whether parts can be classified directly into it. Upper nodes often only group; leaf nodes usually carry the parts.
  aka: [Classification class]
  related: [classification-structure, classification-attribute]

- id: classification-attribute
  term: Classification attribute
  plain: A describing property that only makes sense for one kind of part, like "thread size" for screws.
  definition: An attribute attached to a classification node rather than to a part type. Parts classified into that node (or a node below it) get the attribute. Classification attributes are usually constrained, for example by an enumerated list or a unit of measure, so values stay searchable.
  related: [classification-node, classification-search]

- id: classification-search
  term: Classification search
  plain: Finding parts by walking the tree and filtering on their properties instead of guessing names.
  definition: A search that starts from a classification node and filters parts by that node's classification attributes, for example all machine screws with thread M6 and length 16 to 25 mm. It returns parts classified into the node and the nodes below it.
  related: [classification, classification-attribute, advanced-search, part-reuse]

- id: part-reuse
  term: Part reuse
  plain: Using a part that already exists instead of creating a near-identical new one.
  definition: The practice of selecting an existing, released part (often from a library) for a new design. Reuse avoids duplicate part numbers, extra supplier qualification and inventory, and is the main business reason for classification.
  related: [classification-search, library, where-used]
