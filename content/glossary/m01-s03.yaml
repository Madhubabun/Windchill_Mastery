# Terms introduced in section m01-s03 (Getting around Windchill).

- id: wildcard
  term: Wildcard
  plain: A star (*) in a search that means "anything can go here".
  definition: A character in search text that matches any sequence of characters. In Windchill searches `*` is the wildcard, so `1000-04*` finds every number starting with 1000-04 and `*hinge*` finds names containing "hinge". Without index search a keyword must match a whole name or number, so wildcards matter even more.
  aka: ["*", asterisk]
  related: [quick-search, advanced-search]

- id: where-used
  term: Where used
  plain: The list of assemblies (parents) that use a part.
  definition: A view of the parent objects that use an object - for a part, the assemblies whose structures contain it. Checked before changing a part to see what the change affects.
  aka: [where-used report]
  related: [bom, uses-link, information-page]

- id: favorite
  term: Favorite
  plain: A marker on a product or library you open often, so you find it fast.
  definition: A personal marker set with the Add to Favorites action on a product or library. The Favorites view of the Products or Libraries table then lists only the ones you marked. Favorites for single parts or documents are not confirmed in the sources used here.
  aka: [favorites, bookmark]
  related: [subscription, navigator]

- id: subscription
  term: Subscription
  plain: Asking Windchill to tell you when something happens to an object.
  definition: A request to be notified by email when chosen events happen to an object, folder or context - for example Life Cycle State, Check Out/Check In or Revise. You can add other users as subscribers and set an expiration date; subscribers only get notifications for objects they can access.
  related: [notification, favorite]

- id: notification
  term: Notification
  plain: A message from Windchill telling you something happened or something needs you.
  definition: An email sent by Windchill because of a subscription event or a process step (for example a task routed to you). It tells you something happened; you act on the object or task in Windchill.
  related: [subscription, task, workflow]
