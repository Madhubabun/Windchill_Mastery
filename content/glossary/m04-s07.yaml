# New glossary terms introduced in section m04-s07 (Templates, numbering and preferences).
- id: context-template
  term: Context template
  plain: A starter kit for a new product or library - folders, team roles and rules already set up.
  definition: An XML-based template that provides the initial business environment of a new product, library, project, program or organization. It can establish the folder structure, context roles and teams, access policies, data types and templates, object initialization rules, life cycle and workflow templates and default preferences. It does not carry the business data (parts, documents, CAD) of the context it was made from. Product and library templates can be made with Save as Template or Export as Template.
  aka: [Product template, Library template]
  related: [context, library, object-initialization-rule, organization-template]

- id: organization-template
  term: Organization template
  plain: A starter kit for a whole new organization in Windchill.
  definition: A context template picked from the Template list when a new organization context is created; it determines the organization's initial business rules, such as team roles, folder structure and access policies. Organization templates can only be created from a context template input file, not saved from a live context.
  aka: [Organization context template]
  related: [context-template, context]

- id: cad-document-template
  term: CAD document template
  plain: A ready-made start part, assembly or drawing that new CAD files are created from.
  definition: A template, created from a source CAD document authored in a CAD application such as Creo, that gives new CAD documents their initial settings. Templates created at site level are available everywhere, at organization level to all contexts in that organization, and in a product or library only to that context.
  aka: [Start part, CAD template]
  related: [cad-document, creo, context]

- id: numbering-scheme
  term: Numbering scheme
  plain: The company rule for what an object's number looks like and where the next one comes from.
  definition: The pattern and source of object numbers, such as a prefix plus a zero-padded value from a database sequence (EB-10021). In Windchill a numbering scheme is set in an object initialization rule using the number generator; out of the box parts, documents, CAD documents and end items use ten-digit sequential numbers and change objects five-digit ones.
  aka: [Auto-numbering, Number generator]
  related: [object-initialization-rule, smart-number, part]

- id: smart-number
  term: Smart number (significant number)
  plain: A part number that tries to describe the part, like "BAT-48V-13AH".
  definition: A number whose characters carry meaning (category, size, material, voltage). The opposite is a non-significant or "dumb" number, which is just a unique sequence value. Smart numbers are easy to read but break when the described property changes or the code space runs out; most PLM teams prefer dumb numbers plus attributes and classification.
  aka: [Significant number, Intelligent number]
  related: [numbering-scheme, part]

- id: preference
  term: Preference
  plain: A setting that changes how Windchill behaves - for everyone, one company, one product or one person.
  definition: A named configuration value managed in Preference Management, opened from the Utilities page of the site, an organization or a context. A value set at one level applies to all lower levels, which may override it unless it is locked. Some preferences are personal and set by each user under My Settings.
  aka: [Preference Management]
  related: [context, preference-lock]

- id: preference-lock
  term: Preference lock
  plain: A padlock that stops lower levels from changing a setting.
  definition: Set by ticking Locked in the Set Preference window. The lock icon then shows at all levels and the value can't be changed at lower levels until the preference is unlocked. PTC recommends deleting existing child instances (values set lower down) before locking at site or organization level.
  aka: [Locked preference]
  related: [preference, context]
