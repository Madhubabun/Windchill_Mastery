# New glossary terms introduced in section m04-s06 (Lifecycles, workflows and automation).
- id: phase
  term: Phase (life cycle phase)
  plain: One stop on an object's life cycle, plus the rules that apply while it sits there.
  definition: The building block of a life cycle template. Each phase stands for one life cycle state (for example In Work or Released) and can carry its own access settings per role, and in advanced life cycles a phase workflow and a gate workflow. When an object changes state, it moves into the matching phase and those rules apply.
  aka: [Life cycle phase]
  related: [life-cycle, lifecycle-state, transition]

- id: transition
  term: Transition (life cycle transition)
  plain: A signpost that says "from this state, this action leads to that state".
  definition: A named, allowed move between two states of a life cycle, such as Promote (In Work to Under Review), Demote or Revise (Released to In Work for the next revision). Windchill only offers the moves the template defines, so promotion requests and revise actions follow the transitions an administrator sets up.
  aka: [Promote transition, Revise transition]
  related: [life-cycle, lifecycle-state, phase, revise, promotion-request]

- id: workflow-robot
  term: Robot (workflow robot)
  plain: A step in a workflow that the system does on its own - no human task.
  definition: An automated node in a workflow template. Common robots set an object's life cycle state, send a notification, wait for a timer, synchronize on an event, launch another process or run a short expression. Robots run as the system the moment the workflow reaches them.
  aka: [Set State robot, Notification robot, Execute Expression robot, Timer robot]
  related: [workflow, task, workflow-expression]

- id: workflow-variable
  term: Workflow variable
  plain: A named box inside a running workflow that remembers a value, like the review comments or a yes/no decision.
  definition: A typed value (text, number, yes/no, a reference to an object and so on) defined on a workflow template and stored with each running process. Activities can show variables on the task form, make them required or read-only, and expressions and routing can read and change them. The object the workflow runs on is available as the primary business object.
  aka: [Process variable]
  related: [workflow, task, workflow-expression]

- id: workflow-expression
  term: Workflow expression
  plain: A few lines of Java-like code that let a workflow decide or calculate something.
  definition: Short Java code stored in a workflow template - in an Execute Expression robot, a conditional router or an activity's transition logic. Expressions typically read workflow variables and set the routing result. Keep them minimal, check their syntax in the editor, and move anything bigger into properly tested server-side code.
  aka: [Execute expression, Routing expression, Conditional expression]
  related: [workflow, workflow-variable, workflow-robot]

- id: object-initialization-rule
  term: Object initialization rule (OIR)
  plain: The "fill in these defaults automatically" rule for a type of object in a context.
  definition: An XML rule, stored per object type and per context, that sets starting values when someone creates an object - for example the number generator, the default folder, the life cycle template, the team template and whether a field may be edited. Rules are inherited down the context hierarchy and a rule in a lower context overrides one higher up.
  aka: [OIR, Initialization rule]
  related: [part, context, life-cycle, folder, numbering-scheme]
